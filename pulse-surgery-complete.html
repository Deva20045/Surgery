axis for nausea & vomiting must cover at least:","opts":["1 class of medications","2 classes of medications","4 classes of medications","No prophylaxis"],"ans":1,"exp":"ERAS: Prophylaxis for nausea & vomiting (At least 2 classes of medications). (Book p27)"},{"id":"SURG-C5-059","sec":"ERAS: Intraop","page":27,"q":"Which drug is listed 'if appropriate' intraoperatively in ERAS?","opts":["Morphine","Toradol","Ketamine","Steroid"],"ans":1,"exp":"ERAS Intraoperative: Toradol (if appropriate). (Book p27)"},{"id":"SURG-C5-060","sec":"ERAS: Postop","page":27,"q":"Postoperative ERAS analgesia uses:","opts":["Opioids first","NSAIDS, acetaminophen, gabapentin","Only IV morphine","No analgesia"],"ans":1,"exp":"ERAS Postoperative: NSAIDS, acetaminophen, gabapentin. (Book p27)"},{"id":"SURG-C5-061","sec":"ERAS: Postop","page":27,"q":"In postoperative ERAS, opioids are used:","opts":["As first line","Only for breakthrough pain","Continuously","Never"],"ans":1,"exp":"ERAS: Opioids only for breakthrough pain. (Book p27)"},{"id":"SURG-C5-062","sec":"ERAS: Postop","page":27,"q":"As per ERAS, regular diet is resumed:","opts":["Within 24 hours","After 1 week","After 1 month","Immediately on table"],"ans":0,"exp":"ERAS: Regular diet within 24 hours. (Book p27)"},{"id":"SURG-C5-063","sec":"ERAS: Postop","page":27,"q":"As per ERAS, IV fluids are discontinued:","opts":["Within 24 hours","After 1 week","After 1 month","Never"],"ans":0,"exp":"ERAS: Discontinue IV fluids within 24 hours. (Book p27)"},{"id":"SURG-C5-064","sec":"ERAS: Postop","page":27,"q":"As per ERAS, the patient must ambulate:","opts":["Within 24 hours","After 1 week","After 1 month","On day 7"],"ans":0,"exp":"ERAS: Ambulate within 24 hours. (Book p27)"}];
const UNITS = [{"id":"SURG-U1-1","ch":1,"n":1,"title":"Consents: Components & Signatures","sec":"Consents · p1","qs":["SURG-C1-001","SURG-C1-002","SURG-C1-003","SURG-C1-004","SURG-C1-005"],"guide":"A valid consent covers identification, diagnosis, the planned procedure, the surgeon, description, patient-specific and procedure-specific complications (any complication >1% incidence), benefits and the alternate procedure — signed by patient, surgeon and witness."},{"id":"SURG-U1-2","ch":1,"n":2,"title":"IV Lines: Color-Coding of Cannulas","sec":"IV Lines · p1","qs":["SURG-C1-006","SURG-C1-007","SURG-C1-008","SURG-C1-009","SURG-C1-010","SURG-C1-011","SURG-C1-012","SURG-C1-013","SURG-C1-014","SURG-C1-015","SURG-C1-016","SURG-C1-017","SURG-C1-018"],"guide":"From narrow to wide: yellow 24G (13/10 ml/min), blue 22G (31/30), pink 20G (67/60), green 18G (96), gray 16G (236/240) and orange 14G (270) — the orange 14G is the shock cannula. The 24G/22G/20G trio is bracketed for paediatric patients."},{"id":"SURG-U1-3","ch":1,"n":3,"title":"IV Lines: Superficial Thrombophlebitis","sec":"IV Lines: Complications · p1","qs":["SURG-C1-019","SURG-C1-020","SURG-C1-021"],"guide":"The m/c IV complication is superficial thrombophlebitis — a tender, cord-like swelling at the cannulation site, managed with a topical heparinoid."},{"id":"SURG-U1-4","ch":1,"n":4,"title":"Safety Checklist: Phases & Sign In","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-022","SURG-C1-023","SURG-C1-024","SURG-C1-025","SURG-C1-026","SURG-C1-027","SURG-C1-028"],"guide":"The checklist runs sign in (before induction of anaesthesia, ward to OT complex) → time out (before skin incision) → sign out (before the patient leaves the OT). Sign in confirms identity, marked site, procedure, written consent, known allergies and risk of >500 ml blood loss."},{"id":"SURG-U1-5","ch":1,"n":5,"title":"Safety Checklist: Time Out & Sign Out","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-029","SURG-C1-030","SURG-C1-031","SURG-C1-032","SURG-C1-033","SURG-C1-034","SURG-C1-035"],"guide":"Time out confirms patient site, procedure name and time, checks antibiotic prophylaxis within the last 30 min and the surgeon's anticipated blood loss. Sign out verifies instruments/sponge/needle count, specimen labelling with patient name and the anaesthetist's actual blood loss — and the book's note: there is no time in phase."},{"id":"SURG-U1-6","ch":1,"n":6,"title":"Estimating Blood Loss","sec":"Estimating Blood Loss · p2","qs":["SURG-C1-036","SURG-C1-037","SURG-C1-038","SURG-C1-039","SURG-C1-040"],"guide":"Actual blood loss = blood in suction − irrigation fluid, or wet mop weight − dry mop weight. A soaked mop holds 100 cc, a fist full of clots 500 cc, and mops carry a radio-opaque line so they are picked up on X-ray."},{"id":"SURG-U1-7","ch":1,"n":7,"title":"OT Zoning: The Four Zones","sec":"OT Zoning · p2","qs":["SURG-C1-041","SURG-C1-042","SURG-C1-043","SURG-C1-044","SURG-C1-045"],"guide":"The OT complex flows through four zones: protective (change rooms, transfer bay, pre & post op rooms, ICU/PACU), clean (equipment store room, maintenance workshop — connecting protective to aseptic), aseptic (the OT itself) and disposal."},{"id":"SURG-U1-8","ch":1,"n":8,"title":"OT Positions: Supine, Trendelenberg & Reverse Trendelenberg","sec":"OT Positions · p3","qs":["SURG-C1-046","SURG-C1-047","SURG-C1-048","SURG-C1-049","SURG-C1-050"],"guide":"Supine/neutral is the m/c position for abdominal and breast surgeries. Trendelenberg (head low, feet up) serves pelvic surgery; reverse Trendelenberg with right side up is used in laparoscopic cholecystectomy, where CO2 pools under the right diaphragm dome and causes right shoulder tip pain — its m/c complication."},{"id":"SURG-U1-9","ch":1,"n":9,"title":"OT Positions: Lithotomy & Lateral (Kidney)","sec":"OT Positions · p3","qs":["SURG-C1-051","SURG-C1-052","SURG-C1-053","SURG-C1-054","SURG-C1-055","SURG-C1-056"],"guide":"Lithotomy serves obstetric, gynecologic, urologic (TURP) and hemorrhoid procedures — with the common peroneal nerve at risk if legs are poorly supported. Lateral/kidney position covers thoracotomy, pyelo/nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap), risking brachial plexus injury from a hyperextended arm."},{"id":"SURG-U1-10","ch":1,"n":10,"title":"OT Positions: Prone, Fowler's, Jackknife & Lloyd-Davis","sec":"OT Positions · p4","qs":["SURG-C1-057","SURG-C1-058","SURG-C1-059","SURG-C1-060","SURG-C1-061","SURG-C1-062","SURG-C1-063","SURG-C1-064"],"guide":"Prone is for spinal and pilonidal sinus surgery. Sitting/Fowler's exposes the posterior cranial fossa in a bloodless field but invites air embolism. Jackknife — once used for hemorrhoid/fissure surgery — is obsolete, killing by positional asphyxia. Lloyd-Davis = Trendelenberg + lithotomy, the rectal cancer position."},{"id":"SURG-U1-11","ch":1,"n":11,"title":"Air Embolism: Features, Prevention & Management","sec":"Air Embolism · p4","qs":["SURG-C1-065","SURG-C1-066","SURG-C1-067","SURG-C1-068","SURG-C1-069","SURG-C1-070","SURG-C1-071","SURG-C1-072","SURG-C1-073","SURG-C1-074"],"guide":"50-100 cc of air sucked into a vein dysregulates cardiac function; watch for it in thyroid/head & neck surgery and in Fowler's position. Sudden desaturation, dyspnea and hypotension are the clues — prevent by ligating the vein before cutting and irrigating the field, and treat with the Durant position (right side up/left lateral + legs up) followed by aspiration via direct puncture/central line."},{"id":"SURG-U1-12","ch":1,"n":12,"title":"Events in Patient Safety","sec":"Events in Patient Safety · p5","qs":["SURG-C1-075","SURG-C1-076","SURG-C1-077","SURG-C1-078","SURG-C1-079"],"guide":"An adverse event harms the patient; a near miss could have but didn't (stopped by chance or timely intervention); a no-harm event reaches the patient without injury, harm dodged by chance or mitigating circumstances."},{"id":"SURG-U2-1","ch":2,"n":1,"title":"Types of Surgical Blades","sec":"Blades · p6","qs":["SURG-C2-001","SURG-C2-002","SURG-C2-003","SURG-C2-004","SURG-C2-005","SURG-C2-006","SURG-C2-007","SURG-C2-008"],"guide":"Blades exist to make incisions, and the belly is the sharpest part. The pointed No. 11 stab blade opens abscesses and arteries, while the curved No. 12 slips under sutures to remove them - with No. 10, 15, 22 and 23 completing the tray."},{"id":"SURG-U2-2","ch":2,"n":2,"title":"Blade Handling & the BP Handle","sec":"Blade Handling · p6","qs":["SURG-C2-009","SURG-C2-010","SURG-C2-011"],"guide":"Sharps travel safely in a kidney tray with the pointed end facing the passer, never the surgeon. Every blade clicks onto the familiar BP (Bard Parker) handle before it touches skin."},{"id":"SURG-U2-3","ch":2,"n":3,"title":"Incisions & Langer's Lines","sec":"Incisions · p6","qs":["SURG-C2-012","SURG-C2-013","SURG-C2-014","SURG-C2-015","SURG-C2-016","SURG-C2-017","SURG-C2-018","SURG-C2-019","SURG-C2-020"],"guide":"Cut perpendicular to skin, travelling far to near. Respect Langer's relaxed tension lines - the grain of dermal collagen - because parallel incisions heal into fine scars, hide in creases, spare anatomical structures and still give adequate access."},{"id":"SURG-U2-4","ch":2,"n":4,"title":"Monopolar Cautery: Circuit & Cautery Pad","sec":"Monopolar Cautery · p7","qs":["SURG-C2-021","SURG-C2-022","SURG-C2-023","SURG-C2-024","SURG-C2-025","SURG-C2-026","SURG-C2-027","SURG-C2-028"],"guide":"Current sprints from machine to Bovie tip, through tissue, body and pad, then home to the machine. That pad must sit broad on well-vascularized skin - shrink it and you burn the patient, skip it and monopolar simply will not work."},{"id":"SURG-U2-5","ch":2,"n":5,"title":"Monopolar Cautery: Hazards, Uses & Avoidance","sec":"Monopolar Cautery · p7","qs":["SURG-C2-029","SURG-C2-030","SURG-C2-031","SURG-C2-032","SURG-C2-033","SURG-C2-034","SURG-C2-035","SURG-C2-036","SURG-C2-037","SURG-C2-038"],"guide":"Monopolar cuts and coagulates, but its current wanders - scorching neighbours, confusing pacemakers and channelling down pedicles to their base. Keep it away from end arteries, the CNS, parotid and thyroid, the ear lobule, the penis and any paced heart."},{"id":"SURG-U2-6","ch":2,"n":6,"title":"Bipolar Cautery","sec":"Bipolar Cautery · p7","qs":["SURG-C2-039","SURG-C2-040","SURG-C2-041","SURG-C2-042","SURG-C2-043"],"guide":"Bipolar current hops between two prongs and finishes its circuit right there in the forceps tips. With no pad and no stray current, it coagulates safely beside vital structures and end arteries - but it only coagulates, never cuts."},{"id":"SURG-U2-7","ch":2,"n":7,"title":"Currents & Waveforms","sec":"Currents · p8","qs":["SURG-C2-044","SURG-C2-045","SURG-C2-046","SURG-C2-047","SURG-C2-048","SURG-C2-049","SURG-C2-050","SURG-C2-051"],"guide":"Low-voltage continuous waves slice by exploding cell water; high-voltage interrupted waves desiccate and denature protein until the cell dies. Blend mixes the two, while fulguration spikes the voltage peaks higher still."},{"id":"SURG-U2-8","ch":2,"n":8,"title":"Ligasure","sec":"Ligasure · p8","qs":["SURG-C2-052","SURG-C2-053","SURG-C2-054","SURG-C2-055","SURG-C2-056","SURG-C2-057"],"guide":"Ligasure squeezes vessels with heat plus pressure, melting the body's own collagen and elastin into a seal, then stops itself the instant the seal closes. A live feedback loop meters every joule - good till 7 mm, but keep it away from vital structures."},{"id":"SURG-U2-9","ch":2,"n":9,"title":"Harmonic Scalpel","sec":"Harmonic Scalpel · p8","qs":["SURG-C2-058","SURG-C2-059","SURG-C2-060","SURG-C2-061","SURG-C2-062","SURG-C2-063","SURG-C2-064"],"guide":"The harmonic blade shivers 2,000 to 50,000 times a second, denaturing protein and coagulating without heat. It carves precisely, even through scar and beside vital structures - at the price of patience, because it is slow."},{"id":"SURG-U2-10","ch":2,"n":10,"title":"CUSA & Thunderbeat S","sec":"CUSA · p9","qs":["SURG-C2-065","SURG-C2-066","SURG-C2-067","SURG-C2-068","SURG-C2-069","SURG-C2-070","SURG-C2-071"],"guide":"CUSA is a harmonic scalpel that crumbles watery hepatocytes for liver resection - happiest in a soft, non-cirrhotic liver - while sucking debris and even gases away. Thunderbeat S then marries Ligasure's sealing to the harmonic's cut in one jaw."},{"id":"SURG-U2-11","ch":2,"n":11,"title":"RFA & Microwave Ablation","sec":"RFA & Microwave · p9","qs":["SURG-C2-072","SURG-C2-073","SURG-C2-074","SURG-C2-075","SURG-C2-076","SURG-C2-077","SURG-C2-078","SURG-C2-079"],"guide":"RFA burns liver tumours up to 3 cm with high-frequency alternating current, grounding pad and all. Microwaves, humming between infra-red and radiowaves, need no pad, finish faster and leave a smooth homogenous kill zone."},{"id":"SURG-U3-1","ch":3,"n":1,"title":"Drains: Open, Closed, Romovac & Minivac","sec":"Drains · p10","qs":["SURG-C3-001","SURG-C3-002","SURG-C3-003","SURG-C3-004","SURG-C3-005","SURG-C3-006","SURG-C3-007","SURG-C3-008","SURG-C3-009"],"guide":"Open drains are obsolete museum pieces that stain a soak dressing, while closed drains empty into a container or bag. Romovac - a closed negative-pressure system for mastectomy, thyroidectomy and neck dissection - must never enter the abdomen, where its rounded tip risks perforation; the tiny minivac instead follows sentinel node biopsy."},{"id":"SURG-U3-2","ch":3,"n":2,"title":"Drains: Jackson Pratt, Abdominal & Underwater Seal","sec":"Drains · p10","qs":["SURG-C3-010","SURG-C3-011","SURG-C3-012","SURG-C3-013","SURG-C3-014","SURG-C3-015","SURG-C3-016","SURG-C3-017","SURG-C3-018"],"guide":"The Jackson Pratt pairs a squeezable bulb with flat tubes that slide safely into the abdomen, unlike the rounded Romovac. A plain abdominal drain is closed but pressure-free, while chest tubes bubble through an underwater seal whose submerged tip bars air from being sucked in."},{"id":"SURG-U3-3","ch":3,"n":3,"title":"Knot Types: Reef, Granny & Surgeon's","sec":"Knots · p11","qs":["SURG-C3-019","SURG-C3-020","SURG-C3-021","SURG-C3-022","SURG-C3-023","SURG-C3-024","SURG-C3-025","SURG-C3-026"],"guide":"The reef (square) knot - one square throw on another with matching crossings - is the most basic knot in surgery. Cross the throws oppositely and you get a granny or slip knot that opens up, while the surgeon's knot doubles the first throw for extra grip before a single locking throw."},{"id":"SURG-U3-4","ch":3,"n":4,"title":"Skin Suturing & Principles","sec":"Skin Suturing · p11","qs":["SURG-C3-027","SURG-C3-028","SURG-C3-029","SURG-C3-030"],"guide":"Skin heals kindest when its edges are everted and the needle bites at a full 90 degrees. The geometry is simple arithmetic: take a bite of x on each side and space the sutures 2x apart."},{"id":"SURG-U3-5","ch":3,"n":5,"title":"Suture Types: Simple, Mattress & Subcuticular","sec":"Suture Types · p12","qs":["SURG-C3-031","SURG-C3-032","SURG-C3-033","SURG-C3-034","SURG-C3-035","SURG-C3-036","SURG-C3-037","SURG-C3-038"],"guide":"Simple sutures fail to evert, but mattress sutures evert and staunch bleeding - vertical at two depths, horizontal at one depth with the least cut-through. When scars must vanish, a 3-0 monocryl on a cutting needle runs hidden beneath the skin in a mark-free subcuticular line."},{"id":"SURG-U3-6","ch":3,"n":6,"title":"Other Sutures: Lock & Purse String","sec":"Other Sutures · p12","qs":["SURG-C3-039","SURG-C3-040","SURG-C3-041","SURG-C3-042","SURG-C3-043","SURG-C3-044"],"guide":"A continuous suture closes with an Aberdeen's or Cobbler's knot, and locking each loop spreads tension evenly along the wound. The purse string instead cinches like a drawstring - burying the appendicular stump or encircling the cervix."},{"id":"SURG-U3-7","ch":3,"n":7,"title":"Far-Near-Near-Far & Shoe String","sec":"Special Sutures · p13","qs":["SURG-C3-045","SURG-C3-046","SURG-C3-047","SURG-C3-048","SURG-C3-049"],"guide":"The far-near-near-far stitch collapses and obliterates a large dead cavity in one pass. Fasciotomy wounds instead close slowly with the shoe string technique - gradual tightening that heals by tertiary intention, a delayed primary closure."},{"id":"SURG-U3-8","ch":3,"n":8,"title":"Needles: Round Body vs Cutting","sec":"Needles · p13","qs":["SURG-C3-050","SURG-C3-051","SURG-C3-052","SURG-C3-053","SURG-C3-054","SURG-C3-055","SURG-C3-056","SURG-C3-057","SURG-C3-058","SURG-C3-059"],"guide":"Round-bodied needles split tissue atraumatically, gliding through the delicate B's - bowel, bladder, blood vessels and CBD. Cutting and reverse-cutting needles slice through the tough S's - sheath, skin and fascia - at the price of greater trauma."},{"id":"SURG-U3-9","ch":3,"n":9,"title":"Needle Parts, Color Codes & Numbering","sec":"Suture Coding · p13","qs":["SURG-C3-060","SURG-C3-061","SURG-C3-062","SURG-C3-063","SURG-C3-064","SURG-C3-065","SURG-C3-066","SURG-C3-067","SURG-C3-068","SURG-C3-069","SURG-C3-070","SURG-C3-071","SURG-C3-072"],"guide":"Every needle runs from point through a two-thirds shaft to a one-third swaged end that carries the suture, gripped by a needle holder. Colors speak instantly - brown catgut, violet vicryl, blue prolene, black silk - while numbers whisper finesse: No. 1 is thickest and 11-0 the finest."},{"id":"SURG-U3-10","ch":3,"n":10,"title":"Suture Classification","sec":"Classification · p14","qs":["SURG-C3-073","SURG-C3-074","SURG-C3-075","SURG-C3-076","SURG-C3-077","SURG-C3-078","SURG-C3-079","SURG-C3-080","SURG-C3-081","SURG-C3-082","SURG-C3-083","SURG-C3-084","SURG-C3-085","SURG-C3-086","SURG-C3-087"],"guide":"Natural sutures like silk and catgut are antigenic, provoke strong inflammation and dissolve by proteolysis. Synthetic sutures - prolene, PDS, vicryl - stay inert and dissolve by hydrolysis, with synthetic non-absorbables the most inert of all; monofilaments handle stiffly with strong memory while braids handle sweetly but invite infection."},{"id":"SURG-U3-11","ch":3,"n":11,"title":"Natural Absorbable: Catgut","sec":"Natural Absorbable · p15","qs":["SURG-C3-088","SURG-C3-089","SURG-C3-090","SURG-C3-091"],"guide":"Plain catgut - sheep gut submucosa - vanishes by phagocytosis within 7 to 10 days. Chromic tanning stretches its tensile strength to 21-28 days and full absorption to 90 days."},{"id":"SURG-U3-12","ch":3,"n":12,"title":"Synthetic Absorbable: Monocryl, Vicryl & PDS","sec":"Synthetic Absorbable · p15","qs":["SURG-C3-092","SURG-C3-093","SURG-C3-094","SURG-C3-095","SURG-C3-096","SURG-C3-097","SURG-C3-098","SURG-C3-099","SURG-C3-100","SURG-C3-101","SURG-C3-102","SURG-C3-103","SURG-C3-104","SURG-C3-105","SURG-C3-106","SURG-C3-107","SURG-C3-108","SURG-C3-109"],"guide":"Monofilament monocryl runs subcuticular lines on cutting needles, while braided vicryl holds CBD, bowel and bladder on round-bodied needles for 60-90 days - with triclosan-coated, barbed and rapide avatars. PDS outlasts them all at 180 days and even repairs the tracheobronchial tree."},{"id":"SURG-U3-13","ch":3,"n":13,"title":"Silk: Natural Non-absorbable","sec":"Silk · p16","qs":["SURG-C3-110","SURG-C3-111","SURG-C3-112","SURG-C3-113","SURG-C3-114"],"guide":"Silk - black, braided, spun by silkworms - closes skin with 2-0 or 3-0 on cutting needles, anchors drains with stout No. 1 to 2-0, and lays the second layer of bowel anastomosis with 3-0 on a round body."},{"id":"SURG-U3-14","ch":3,"n":14,"title":"Synthetic Non-absorbable: Prolene to Polybutester","sec":"Synthetic Non-absorbable · p16","qs":["SURG-C3-115","SURG-C3-116","SURG-C3-117","SURG-C3-118","SURG-C3-119","SURG-C3-120","SURG-C3-121","SURG-C3-122","SURG-C3-123","SURG-C3-124","SURG-C3-125","SURG-C3-126","SURG-C3-127","SURG-C3-128"],"guide":"Blue monofilament prolene weaves hernia mesh, closes sheaths by Jenkin's four-to-one rule, and steps down vessels from 2-0 aorta to 6-0 popliteal. Nylon serves skin, cataract and nerve-tendon repairs, steel wires post-CABG sternums, polyester holds rectus and tendon, and polybutester lingers rarely in plastic surgery."},{"id":"SURG-U3-15","ch":3,"n":15,"title":"Suture Removal Timings","sec":"Suture Removal · p17","qs":["SURG-C3-129","SURG-C3-130","SURG-C3-131","SURG-C3-132","SURG-C3-133","SURG-C3-134","SURG-C3-135","SURG-C3-136"],"guide":"Only non-absorbable sutures come out: face first at 3-5 days, scalp and neck at 5-7, thorax and perineum at 10-12, and abdomen last at 12-14 days."},{"id":"SURG-U3-16","ch":3,"n":16,"title":"Bowel Anastomosis & Staplers","sec":"Bowel Anastomosis · p17","qs":["SURG-C3-137","SURG-C3-138","SURG-C3-139","SURG-C3-140","SURG-C3-141","SURG-C3-142","SURG-C3-143","SURG-C3-144","SURG-C3-145","SURG-C3-146","SURG-C3-147","SURG-C3-148","SURG-C3-149","SURG-C3-150","SURG-C3-151"],"guide":"Bowel demands inverted edges, trusting the submucosa as its strongest layer - whether joined by single extramucosal, two-layer Albert-plus-Lembert, or stapler. Linear staplers fire side-to-side joins, sleeves and Zenker's pouches; circular staplers fix haemorrhoids and low anterior resections; Cheatle's slit widens narrow ends and the Connel loop guarantees inversion."},{"id":"SURG-U4-1","ch":4,"n":1,"title":"Post-op Fever: Causes by Day","sec":"Fever Causes · p18","qs":["SURG-C4-001","SURG-C4-002","SURG-C4-003","SURG-C4-004","SURG-C4-005","SURG-C4-006","SURG-C4-007","SURG-C4-008"],"guide":"Fever tells time after surgery: atelectasis on day 1, pneumonia, thrombophlebitis and UTI on days 2-3, wound infection and DVT on days 4-5, burst abdomen on day 6, and deep intra-abdominal collections from day 7 onward."},{"id":"SURG-U4-2","ch":4,"n":2,"title":"Pneumonia, Thrombophlebitis & Atelectasis","sec":"Atelectasis · p18","qs":["SURG-C4-009","SURG-C4-010","SURG-C4-011","SURG-C4-012","SURG-C4-013","SURG-C4-014","SURG-C4-015","SURG-C4-016","SURG-C4-017","SURG-C4-018","SURG-C4-019"],"guide":"Post-operative pneumonia brings fever cured by antibiotics, while superficial thrombophlebitis adds pain soothed by topical heparinoids. Atelectasis - collapsed alveoli, the commonest day-1 fever - is prevented by incentive spirometry, pain control, treating CHF and COPD, steam, and quitting smoking 4-6 weeks ahead."},{"id":"SURG-U4-3","ch":4,"n":3,"title":"Deep Vein Thrombosis","sec":"DVT · p19","qs":["SURG-C4-020","SURG-C4-021","SURG-C4-022","SURG-C4-023","SURG-C4-024","SURG-C4-025","SURG-C4-026","SURG-C4-027","SURG-C4-028"],"guide":"DVT swells one leg - lower limbs far more than upper - and is confirmed on duplex scan. Early ambulation defeats stasis, pneumatic stockings squeeze the calves, and low molecular weight heparin is the drug of choice for prophylaxis."},{"id":"SURG-U4-4","ch":4,"n":4,"title":"Burst Abdomen","sec":"Burst Abdomen · p19","qs":["SURG-C4-029","SURG-C4-030","SURG-C4-031","SURG-C4-032","SURG-C4-033","SURG-C4-034","SURG-C4-035","SURG-C4-036","SURG-C4-037"],"guide":"On day 6 a cough can split the rectus sheath open, baring bowel beneath a dressing soaked in reddish salmon fluid. The emergency answer is repositing bowel under a Bogota bag, with definitive resuturing in theatre - while chronic cough, constipation, infection, obesity, immunosuppression and malnutrition set the stage."},{"id":"SURG-U4-5","ch":4,"n":5,"title":"Surgeon Factors & Rectus Closure","sec":"Sx Factors · p20","qs":["SURG-C4-038","SURG-C4-039","SURG-C4-040","SURG-C4-041","SURG-C4-042","SURG-C4-043","SURG-C4-044"],"guide":"Midline, emergency, continuous, long-bite, short-thread closures burst most - Jenkins demands thread four times the wound length. Non-absorbable suture closes adult rectus, while children get delayed-absorbable PDS."},{"id":"SURG-U4-6","ch":4,"n":6,"title":"Intra-abdominal Abscesses","sec":"Abscess · p20","qs":["SURG-C4-045","SURG-C4-046","SURG-C4-047","SURG-C4-048","SURG-C4-049","SURG-C4-050","SURG-C4-051","SURG-C4-052","SURG-C4-053","SURG-C4-054","SURG-C4-055"],"guide":"Pus seeks the pelvis in walkers and Morrison's pouch in the bedridden, announcing itself with fever, chills and rigor. Subdiaphragmatic pus triggers hiccups and referred shoulder pain; pelvic pus brings mucous diarrhoea and frequent micturition - diagnosed by CECT and drained by USG-guided pigtail."},{"id":"SURG-U4-7","ch":4,"n":7,"title":"SSI: Definition & Types","sec":"SSI · p21","qs":["SURG-C4-056","SURG-C4-057","SURG-C4-058","SURG-C4-059","SURG-C4-060"],"guide":"A surgical site infection strikes within 30 days - or within a year if an implant was placed. Superficial infection stays above fascia, deep goes below it, and organ-space infection pools inside an organ or cavity."},{"id":"SURG-U4-8","ch":4,"n":8,"title":"ASEPSIS Wound Score","sec":"ASEPSIS · p21","qs":["SURG-C4-061","SURG-C4-062","SURG-C4-063","SURG-C4-064","SURG-C4-065","SURG-C4-066","SURG-C4-067","SURG-C4-068"],"guide":"ASEPSIS grades wounds by Additional treatment, Serous discharge, Erythema, Purulent exudate, Separation of deep tissues, Isolation of bacteria, and inpatient Stay beyond 14 days - with pus drained under local but debridement under general anaesthesia."},{"id":"SURG-U4-9","ch":4,"n":9,"title":"Southampton Wound Score","sec":"Southampton · p21","qs":["SURG-C4-069","SURG-C4-070","SURG-C4-071","SURG-C4-072","SURG-C4-073","SURG-C4-074"],"guide":"Southampton climbs from 0 - normal healing - through bruising, erythema and clear discharge to frank pus at grade IV and deep severe infection with or without breakdown at grade V."},{"id":"SURG-U4-10","ch":4,"n":10,"title":"SSI Risk Factors","sec":"Risk Factors · p21","qs":["SURG-C4-075","SURG-C4-076","SURG-C4-077","SURG-C4-078","SURG-C4-079","SURG-C4-080","SURG-C4-081"],"guide":"Neonates and the elderly, recent chest or abdominal surgery, distant coexisting infection, diabetes, steroids, low cholesterol, obesity, malnutrition, chronic inflammation, prior irradiation, hypothermia and hypoxemia - twelve flags that mark a wound for infection."},{"id":"SURG-U4-11","ch":4,"n":11,"title":"Wound Classes I-IV","sec":"Wound Types · p22","qs":["SURG-C4-082","SURG-C4-083","SURG-C4-084","SURG-C4-085","SURG-C4-086","SURG-C4-087","SURG-C4-088","SURG-C4-089","SURG-C4-090","SURG-C4-091","SURG-C4-092","SURG-C4-093","SURG-C4-094","SURG-C4-095","SURG-C4-096","SURG-C4-097","SURG-C4-098","SURG-C4-099"],"guide":"Clean wounds infect at 1-2% with or without antibiotics; clean-contaminated at 3% versus 6-9%; contaminated at 6% versus 20% with antibiotics continued; and dirty pus-filled wounds at 7-8% versus 20-40% - from thyroid and hernia surgery at one end to abscesses and peritonitis at the other."},{"id":"SURG-U4-12","ch":4,"n":12,"title":"Golden & Decisive Periods","sec":"Periods · p22","qs":["SURG-C4-100","SURG-C4-101","SURG-C4-102","SURG-C4-103"],"guide":"The golden period gives traumatic wounds 6 hours - just 1 hour after major trauma - while the decisive 4 hours span skin incision to bacterial colonisation. On elective lists, clean cases always go first."},{"id":"SURG-U4-13","ch":4,"n":13,"title":"Hand Hygiene & Part Preparation","sec":"Hand Hygiene · p23","qs":["SURG-C4-104","SURG-C4-105","SURG-C4-106","SURG-C4-107","SURG-C4-108","SURG-C4-109","SURG-C4-110","SURG-C4-111"],"guide":"The surgeon's hands matter most: 3-minute scrubs with soap or alcohol rub - soap alone after toilets or visible soil - across the five WHO moments. Hair falls to clippers, never razors, whose microabrasions seed infection."},{"id":"SURG-U4-14","ch":4,"n":14,"title":"Cleaning the Operative Part","sec":"Cleaning · p23","qs":["SURG-C4-112","SURG-C4-113","SURG-C4-114","SURG-C4-115","SURG-C4-116","SURG-C4-117","SURG-C4-118","SURG-C4-119","SURG-C4-120","SURG-C4-121","SURG-C4-122"],"guide":"Chlorhexidine plus alcohol beats betadine for skin prep - inframammary crease to mid-thigh in women, nipple to mid-thigh in men, abdomen medial-to-lateral, thigh lateral-to-medial, limbs a joint beyond, always incision-first and outward, twice over, then left to dry."},{"id":"SURG-U4-15","ch":4,"n":15,"title":"Prophylactic Antibiotics & OT Parameters","sec":"OT Parameters · p24","qs":["SURG-C4-123","SURG-C4-124","SURG-C4-125","SURG-C4-126","SURG-C4-127","SURG-C4-128","SURG-C4-129","SURG-C4-130","SURG-C4-131"],"guide":"Antibiotics peak 30-60 minutes before incision and repeat at 4 hours in long cases. The theatre breathes HEPA-filtered laminar flow at 4 changes an hour under positive pressure, 18-22 degrees, 50-60% humidity - with the Bair hugger, euglycemia, hemostasis and post-operative oxygen completing the shield."},{"id":"SURG-U5-1","ch":5,"n":1,"title":"Definition & Day-Care Examples","sec":"Definition · p25","qs":["SURG-C5-001","SURG-C5-002","SURG-C5-003","SURG-C5-004","SURG-C5-005","SURG-C5-006","SURG-C5-007","SURG-C5-008","SURG-C5-009","SURG-C5-010"],"guide":"Day care means in and out within 12 hours - from haemorrhoids, hernias and lap cholecystectomy to breast biopsy, TURP, carpal tunnel release and varicose vein procedures."},{"id":"SURG-U5-2","ch":5,"n":2,"title":"Selection: Medical Criteria","sec":"Selection · p25","qs":["SURG-C5-011","SURG-C5-012","SURG-C5-013","SURG-C5-014","SURG-C5-015"],"guide":"Physiological age trumps chronological age: ASA I-II patients suit stand-alone centres while ASA III needs a hospital unit, with BMI capped at 38 for laparoscopic and 40 for surface procedures."},{"id":"SURG-U5-3","ch":5,"n":3,"title":"Selection: Diabetes, Social & Surgical","sec":"Selection · p26","qs":["SURG-C5-016","SURG-C5-017","SURG-C5-018","SURG-C5-019","SURG-C5-020","SURG-C5-021","SURG-C5-022"],"guide":"Diabetics under HbA1C 8.5 skip the morning OHA, blood pressure stays below 180/100, and epilepsy must be well controlled. Behind every day-care patient stands a responsible adult for 24 hours, a suitable home, operations under 2 hours, and a quick return to eating and drinking."},{"id":"SURG-U5-4","ch":5,"n":4,"title":"Scheduling & Anaesthesia","sec":"Scheduling · p26","qs":["SURG-C5-023","SURG-C5-024","SURG-C5-025","SURG-C5-026","SURG-C5-027"],"guide":"Comorbid patients get priority in stand-alone units, and day cases lead mixed lists. Propofol TIVA keeps nausea away while bupivacaine infiltration handles the pain."},{"id":"SURG-U5-5","ch":5,"n":5,"title":"Post-op Complications","sec":"Complications · p26","qs":["SURG-C5-028","SURG-C5-029","SURG-C5-030","SURG-C5-031","SURG-C5-032","SURG-C5-033","SURG-C5-034"],"guide":"Haemorrhage - primary during surgery, reactionary within 4-24 hours, secondary days later from infection - is the commonest cause of re-admission. PONV, predicted by the Apfel score, is the commonest complication overall, followed by pain."},{"id":"SURG-U5-6","ch":5,"n":6,"title":"Discharge Criteria","sec":"Discharge · p27","qs":["SURG-C5-035","SURG-C5-036","SURG-C5-037","SURG-C5-038","SURG-C5-039","SURG-C5-040","SURG-C5-041","SURG-C5-042","SURG-C5-043","SURG-C5-044","SURG-C5-045","SURG-C5-046","SURG-C5-047"],"guide":"Discharge demands an hour of stable vitals, full orientation, controlled pain with oral analgesia in hand, the ability to dress and walk, minimal nausea or bleeding, sips of fluid, passed urine, a responsible escort, clear written and verbal instructions, a follow-up plan and an emergency number."},{"id":"SURG-U5-7","ch":5,"n":7,"title":"ERAS Protocol","sec":"ERAS · p27","qs":["SURG-C5-048","SURG-C5-049","SURG-C5-050","SURG-C5-051","SURG-C5-052","SURG-C5-053","SURG-C5-054","SURG-C5-055","SURG-C5-056","SURG-C5-057","SURG-C5-058","SURG-C5-059","SURG-C5-060","SURG-C5-061","SURG-C5-062","SURG-C5-063","SURG-C5-064"],"guide":"ERAS fast-tracks recovery: counselled patients skip bowel prep, take solids till 6 hours and carb drinks till 2-3 hours, glide through minimally invasive surgery kept warm with multimodal antiemetics, then eat, walk and leave IV fluids behind - all within 24 hours on non-opioid analgesia."}];

function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_surgery_xp')||0;}, set xp(v){store('pulse_surgery_xp',v);},
  get done(){return store('pulse_surgery_done')||[];}, set done(v){store('pulse_surgery_done',v);},
  get unlock(){return !!store('pulse_surgery_unlock');}, set unlock(v){store('pulse_surgery_unlock',v);},
  streak(){const t=store('pulse_surgery_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_surgery_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){

}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
