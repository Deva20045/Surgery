 & Rx · p76","qs":["SURG-C13-030","SURG-C13-031","SURG-C13-032","SURG-C13-033","SURG-C13-034"],"guide":"Excise when growing fast, family history, painful, giant >4-5 cm or the patient wishes; open surgery uses a periareolar incision closed subcuticularly with 3-0 monocryl, while the latest vacuum-assisted scarless breast surgery leaves no mark."},{"id":"SURG-U13-5","ch":13,"n":5,"title":"Phyllodes Tumor","sec":"Phyllodes Tumor · p77","qs":["SURG-C13-035","SURG-C13-036","SURG-C13-037","SURG-C13-038","SURG-C13-039","SURG-C13-040","SURG-C13-041","SURG-C13-042","SURG-C13-043","SURG-C13-044"],"guide":"Cystosarcoma phyllodes is a stromal tumor of the 4th/5th decade growing rapidly into a firm variegated mass; nodes <10% but malignant forms fly to lungs. Core biopsy grades benign/borderline/malignant by mitotic figures; wide local excision first, simple mastectomy for large/malignant (post-op RT)/recurrent, and chemo has no role."},{"id":"SURG-U13-6","ch":13,"n":6,"title":"Fibroadenosis & Cysts","sec":"Fibroadenosis & Cysts · p77","qs":["SURG-C13-045","SURG-C13-046","SURG-C13-047","SURG-C13-048","SURG-C13-049","SURG-C13-050","SURG-C13-051","SURG-C13-052"],"guide":"From 25 to menopause, fibroadenosis is the m/c cause of cyclical mastalgia (worst pre-menstrually, easing with the cycle) with nodularity scored by the Cardiff Lucknow score. USG cysts: simple (smooth, no solid part, BIRADS 2, observe), complex (mural solid parts, BIRADS 4, core biopsy), complicated (floating infective debris shifting with posture, antibiotics if infected)."},{"id":"SURG-U13-7","ch":13,"n":7,"title":"Mastalgia Rx","sec":"Mastalgia Rx · p78","qs":["SURG-C13-053","SURG-C13-054","SURG-C13-055","SURG-C13-056","SURG-C13-057","SURG-C13-058","SURG-C13-059","SURG-C13-060"],"guide":"Start with reassurance via a VAS pain chart, cutting caffeine/stress/sugar and a tight sports bra; add flax seed (omega-3) or evening primrose oil (γ-linolenic) and topical NSAIDs 4×/day. At VAS ≥3 go systemic: tamoxifen 10 mg daily, danazol (not preferred) or ormeloxifene 30 mg twice weekly which also settles nodularity."},{"id":"SURG-U13-8","ch":13,"n":8,"title":"Mondor's & Tietze's","sec":"Mondor's & Tietze's · p78","qs":["SURG-C13-061","SURG-C13-062","SURG-C13-063","SURG-C13-064","SURG-C13-065","SURG-C13-066","SURG-C13-067","SURG-C13-068","SURG-C13-069"],"guide":"Mondor's is thrombophlebitis of chest wall veins (lateral thoracic m/c) in smokers - non-cyclical pain, no cancer risk, painkillers. Tietze's (costochondritis) triggers at the costochondral junction, treated with anti-inflammatories and intralesional steroid. Neither belongs to ANDI."},{"id":"SURG-U13-9","ch":13,"n":9,"title":"Nipple Discharge","sec":"Nipple Discharge · p79","qs":["SURG-C13-070","SURG-C13-071","SURG-C13-072","SURG-C13-073","SURG-C13-074","SURG-C13-075","SURG-C13-076"],"guide":"Spontaneous unexpressed discharge is suspicious; USG is IOC because mammography and discharge cytology are not sensitive. Serous: puberty/pregnancy vs cancer/ectasia; milky: lactation vs prolactinoma/hypothyroid (cabergoline/bromocriptine); green-bluish: ectasia; bloody: papilloma, cracked nipple, baby bites - or cancer."},{"id":"SURG-U13-10","ch":13,"n":10,"title":"Duct Papilloma & Duct Ectasia","sec":"Duct Papilloma & Duct Ectasia · p80","qs":["SURG-C13-077","SURG-C13-078","SURG-C13-079","SURG-C13-080","SURG-C13-081","SURG-C13-082","SURG-C13-083","SURG-C13-084","SURG-C13-085","SURG-C13-086","SURG-C13-087","SURG-C13-088","SURG-C13-089","SURG-C13-090"],"guide":"Papilloma = m/c bloody single-duct discharge from a pressable periareolar nodule (10% a/w papillary DCIS; USG papillomatous growth, MRI if unsure; microdochectomy). Ectasia hits >45 smokers: stasis → Zuska periductal mastitis, green-bluish multi-duct discharge or periareolar abscess/sinuses; antibiotics, then Hadfield major duct excision. Solitary RR 1.5-2×, papillomatosis (≥5, B/L) 3×, juvenile = Swiss cheese disease."},{"id":"SURG-U13-11","ch":13,"n":11,"title":"Paget's vs Eczema","sec":"Paget's vs Eczema · p80","qs":["SURG-C13-091","SURG-C13-092","SURG-C13-093","SURG-C13-094","SURG-C13-095","SURG-C13-096","SURG-C13-097","SURG-C13-098","SURG-C13-099"],"guide":"Both itch, but Paget's is unilateral with nipple-areolar destruction and >70% hide an underlying lump (DCIS > invasive ductal); its Paget cells - large, clear cytoplasm, prominent nuclei in epidermis, ER/PR -ve, CEA +ve - demand treatment of the lump, while bilateral non-destructive eczema takes topical steroids."},{"id":"SURG-U13-12","ch":13,"n":12,"title":"Gynecomastia","sec":"Gynecomastia · p81","qs":["SURG-C13-100","SURG-C13-101","SURG-C13-102","SURG-C13-103","SURG-C13-104","SURG-C13-105","SURG-C13-106","SURG-C13-107","SURG-C13-108","SURG-C13-109","SURG-C13-110"],"guide":"Male breast enlargement, U/L or B/L: physiological at newborn, puberty, senile; pathological via DISCKO drugs (digoxin, isoniazid, steroids/spironolactone, cimetidine, ketoconazole, oestrogen), idiopathic, Klinefelter (raises male cancer risk), liver disease, paraneoplastic HCC/RCC/testicular and lepromatous/mumps orchitis. USG shows the breast disc; liposuction + gland excision cures."},{"id":"SURG-U13-13","ch":13,"n":13,"title":"Polymastia, Amastia & Polythelia","sec":"Polymastia, Amastia & Polythelia · p81","qs":["SURG-C13-111","SURG-C13-112","SURG-C13-113","SURG-C13-114","SURG-C13-115","SURG-C13-116","SURG-C13-117"],"guide":"Polymastia is accessory breast tissue, axilla m/c, swelling at puberty/pregnancy, excised for pain or cosmetics; amastia (absent breast with missing pectoralis major) marks Poland syndrome; polythelia is simply an accessory nipple."},{"id":"SURG-U14-1","ch":14,"n":1,"title":"Surgical Anatomy: Arteries & Veins","sec":"Surgical Anatomy: Arteries & Veins · p82","qs":["SURG-C14-001","SURG-C14-002","SURG-C14-003","SURG-C14-004","SURG-C14-005","SURG-C14-006","SURG-C14-007","SURG-C14-008"],"guide":"Butterfly gland: superior thyroid artery (external carotid) ligated close to the gland; inferior thyroid artery (thyrocervical trunk) feeds parathyroids too, so only capsular branches are tied to dodge hypocalcemia; arteria thyroidea ima sprouts from the aortic arch. Veins: superior → IJV, middle (30%, first ligated) → IJV, inferior → left brachiocephalic."},{"id":"SURG-U14-2","ch":14,"n":2,"title":"Nerves & Berry's Ligament","sec":"Nerves & Berry's Ligament · p82","qs":["SURG-C14-009","SURG-C14-010","SURG-C14-011","SURG-C14-012","SURG-C14-013","SURG-C14-014","SURG-C14-015","SURG-C14-016","SURG-C14-017","SURG-C14-018"],"guide":"Right RLN loops the subclavian vessels, left the aortic arch (longer course); both run between inferior thyroid artery branches, and 2% of people have non-recurrent nerves. The external laryngeal nerve hugs the superior pole. Berry's ligament - pre-tracheal fascia condensing onto trachea - makes the gland move on swallowing and is the m/c site of RLN injury; Beahr's triangle locates the RLN."},{"id":"SURG-U14-3","ch":14,"n":3,"title":"Thyroid Examination & TFT","sec":"Thyroid Examination & TFT · p83","qs":["SURG-C14-019","SURG-C14-020","SURG-C14-021","SURG-C14-022","SURG-C14-023","SURG-C14-024","SURG-C14-025"],"guide":"Normal thyroid is neither visible nor palpable; examine by Pizillo's, Lahey's or Crile's (best for nodularity). TFT is the first test - T3 the active hormone - with TSH down in hyper- and up in hypothyroidism."},{"id":"SURG-U14-4","ch":14,"n":4,"title":"USG Neck & TIRADS","sec":"USG Neck & TIRADS · p83","qs":["SURG-C14-026","SURG-C14-027","SURG-C14-028","SURG-C14-029","SURG-C14-030","SURG-C14-031","SURG-C14-032"],"guide":"Benign nodules are iso/hyperechoic, macrocalcified, regular, wider-than-taller with peripheral flow and kidney-shaped nodes; malignancy flips every feature (hypoechoic, microcalcifications, taller-than-wide, infiltrative, round nodes losing fatty hilum, intranodular flow). TIRADS scores composition, margin, shape, echogenicity, echogenic foci: TR1-2 need no FNAC, TR3-5 do."},{"id":"SURG-U14-5","ch":14,"n":5,"title":"FNAC & Royal College Classification","sec":"FNAC & Royal College Classification · p84","qs":["SURG-C14-033","SURG-C14-034","SURG-C14-035","SURG-C14-036","SURG-C14-037","SURG-C14-038","SURG-C14-039","SURG-C14-040","SURG-C14-041"],"guide":"FNAC is IOC with a 23-30G needle and needs 6 groups of ≥10 follicular cells, yet cannot split follicular adenoma from carcinoma. Royal College: Thy1/1c repeat USG-FNAC, Thy2 follow up, Thy3 hemithyroidectomy, Thy4/5 surgery; FNNAC serves superficial swellings and Bethesda also reports thyroid FNAC."},{"id":"SURG-U14-6","ch":14,"n":6,"title":"Thyroid Scan & Imaging","sec":"Thyroid Scan & Imaging · p84","qs":["SURG-C14-042","SURG-C14-043","SURG-C14-044","SURG-C14-045","SURG-C14-046","SURG-C14-047","SURG-C14-048","SURG-C14-049","SURG-C14-050","SURG-C14-051"],"guide":"Scan when TSH is low with thyrotoxic features or for ectopic tissue: Tc99 reads uptake, I123 uptake plus organification. Cold nodules are 30% malignant vs 4% hot; Graves' lights up diffusely, thyroiditis stays dark, Plummer's shows toxic nodular goitre. CECT for retrosternal/large malignant goitre; whole-body iodine scan hunts residual DTC after total thyroidectomy."},{"id":"SURG-U14-7","ch":14,"n":7,"title":"Thyroidectomy Indications","sec":"Thyroidectomy Indications · p85","qs":["SURG-C14-052","SURG-C14-053","SURG-C14-054"],"guide":"Operate for neoplasia, FNAC Thy3-5, clinical suspicion (age, male, hard fixed nodule, RLN palsy, lymphadenopathy, recurrent cyst), toxic adenoma, pressure symptoms or cosmetics."},{"id":"SURG-U14-8","ch":14,"n":8,"title":"Types of Thyroidectomy","sec":"Types of Thyroidectomy · p86","qs":["SURG-C14-055","SURG-C14-056","SURG-C14-057","SURG-C14-058","SURG-C14-059","SURG-C14-060","SURG-C14-061"],"guide":"Hemi = lobe + isthmus; total = both lobes + isthmus; subtotal leaves 4-8 g each side and near-total (Hartley Dunhill) does lobectomy + isthmus one side with subtotal lobectomy opposite - the last two are retired. Hypothyroidism, RLN injury and hypoparathyroidism rates are equal across all types."},{"id":"SURG-U14-9","ch":14,"n":9,"title":"Procedure & Position","sec":"Procedure & Position · p86","qs":["SURG-C14-062","SURG-C14-063","SURG-C14-064","SURG-C14-065","SURG-C14-066","SURG-C14-067","SURG-C14-068","SURG-C14-069","SURG-C14-070","SURG-C14-071"],"guide":"Rose/barking-dog position: 30° head-up for a bloodless field at the price of air embolism risk, neck extended on a towel roll. Collar incision two finger-breadths above the sternal notch, subplatysmal tunnel, strap muscles cut high to spare ansa cervicalis; ligate middle vein, superior pole vessels then capsular inferior artery branches; parathyroids glow yellowish via sentinel fat; finish with a Romovac drain. Joll's retractor is history."},{"id":"SURG-U14-10","ch":14,"n":10,"title":"MIVAT","sec":"MIVAT · p87","qs":["SURG-C14-072","SURG-C14-073","SURG-C14-074","SURG-C14-075","SURG-C14-076"],"guide":"Minimally Invasive Video Assisted Thyroid Sx suits <3 cm nodules, T1 papillary cancers and parathyroid adenomas but not large tumors or thyroiditis; remote access routes: trans-axillary (m/c), TORS, retroauricular, nipple."},{"id":"SURG-U14-11","ch":14,"n":11,"title":"Complications: Hemorrhage & Nerves","sec":"Complications: Hemorrhage & Nerves · p88","qs":["SURG-C14-077","SURG-C14-078","SURG-C14-079","SURG-C14-080","SURG-C14-081","SURG-C14-082","SURG-C14-083","SURG-C14-084","SURG-C14-085","SURG-C14-086"],"guide":"Primary bleeding is intra-op, reactionary hours later. Nerve injury 2-10%, prevented by monitoring: external laryngeal (cricothyroid) is m/c but silent - U/L hoarseness, B/L aspiration, never fatal; RLN U/L hoarseness with preserved speech, B/L aphonia-stridor-aspiration and life threatening."},{"id":"SURG-U14-12","ch":14,"n":12,"title":"Respiratory Distress & Hypoparathyroidism","sec":"Respiratory Distress & Hypoparathyroidism · p88","qs":["SURG-C14-087","SURG-C14-088","SURG-C14-089","SURG-C14-090","SURG-C14-091","SURG-C14-092","SURG-C14-093"],"guide":"Post-op distress: laryngeal edema m/c, tension haematoma (open sutures, evacuate, ligate in OT), laryngomalacia from collapsed tracheal rings after long goitres (pre-op laryngoscopy prevents), B/L RLN injury; hypoparathyroidism is the late 48-72 h cause, plus keloid and recurrence."},{"id":"SURG-U14-13","ch":14,"n":13,"title":"Hypoparathyroidism","sec":"Hypoparathyroidism · p89","qs":["SURG-C14-094","SURG-C14-095","SURG-C14-096","SURG-C14-097","SURG-C14-098","SURG-C14-099","SURG-C14-100","SURG-C14-101","SURG-C14-102","SURG-C14-103","SURG-C14-104"],"guide":"Vascular insult via the inferior thyroid artery starves parathyroids; perioral numbness at 48-72 h escalates to tingling, tetany and fatal respiratory distress. Chvostek = facial tap twitching; Trousseau = carpopedal/obstetric hand with cuff above systolic. Watch ionized Ca and PTH (t½ 7 min): <8 mg/dl or major symptoms → IV calcium gluconate plus oral Ca/D3, otherwise oral; permanent form (glands removed) hits 1% and lasts >1 year."},{"id":"SURG-U15-1","ch":15,"n":1,"title":"Thyroid Cancers: IOC & Syndromes","sec":"Thyroid Cancers: IOC & Syndromes · p90","qs":["SURG-C15-001","SURG-C15-002","SURG-C15-003","SURG-C15-004","SURG-C15-005","SURG-C15-006","SURG-C15-007"],"guide":"IOC for thyroid cancers is FNAC. Syndrome links: medullary → MEN2/RET; follicular → Cowden (PTEN Ch10, ↑ breast & thyroid cancer, benign GI polyps) & Werner (WRN); papillary → FAP (AP Ch5, ≥100 polyps, 100% colorectal risk), Cowden, Carney/Batman's, PRKAR1A."},{"id":"SURG-U15-2","ch":15,"n":2,"title":"TNM Staging","sec":"TNM Staging · p90","qs":["SURG-C15-008","SURG-C15-009","SURG-C15-010","SURG-C15-011","SURG-C15-012","SURG-C15-013","SURG-C15-014","SURG-C15-015"],"guide":"T1 ≤2cm (1a ≤1cm, 1b >1-≤2cm); T2 >2-≤4cm; T3a >4cm limited to thyroid; T3b any size invading ONLY strap muscles (recent update); T4 gross extension into major neck structures. N1 regional nodes; M1 distant mets."},{"id":"SURG-U15-3","ch":15,"n":3,"title":"DTC & Updates","sec":"DTC & Updates · p91","qs":["SURG-C15-016","SURG-C15-017","SURG-C15-018"],"guide":"DTC = papillary + follicular + Hurthle cell: arise from epithelial cells and take up iodine. New rule: age cutoff 55 - younger good prognosis, older bad; anaplastic (previously T4) now staged like DTC."},{"id":"SURG-U15-4","ch":15,"n":4,"title":"PTC: Risk Factors & Genetics","sec":"PTC: Risk Factors & Genetics · p91","qs":["SURG-C15-019","SURG-C15-020","SURG-C15-021","SURG-C15-022","SURG-C15-023","SURG-C15-024","SURG-C15-025"],"guide":"PTC = m/c thyroid cancer with best prognosis. Risks: radiation (fallout, head-neck RT, RAI at young age - more aggressive tumors), family history, obesity. Genetics BRAF (m/c), GDNF, RET/PTC. F:M 3:1, 3rd-5th decade."},{"id":"SURG-U15-5","ch":15,"n":5,"title":"PTC: Clinical Features & Spread","sec":"PTC: Clinical Features & Spread · p91","qs":["SURG-C15-026","SURG-C15-027","SURG-C15-028","SURG-C15-029","SURG-C15-030"],"guide":"Presents as thyroid swelling, B/L multicentric → total thyroidectomy. Lymphatic first to level 6 (central/delphian), haematogenous to lungs. Lateral aberrant thyroid = level 6 LN mets with non-palpable gland; incidentaloma <1cm."},{"id":"SURG-U15-6","ch":15,"n":6,"title":"PTC: Diagnosis & Histology","sec":"PTC: Diagnosis & Histology · p92","qs":["SURG-C15-031","SURG-C15-032","SURG-C15-033","SURG-C15-034","SURG-C15-035"],"guide":"FNAC is IOC. Histology: Orphan Annie eyed/coffee bean nuclei, pseudo intranuclear inclusions, psammoma bodies (dystrophic calcification - also in serous cystadenoma ovary, papillary RCC, meningioma)."},{"id":"SURG-U15-7","ch":15,"n":7,"title":"PTC: Surgical Options","sec":"PTC: Surgical Options · p93","qs":["SURG-C15-036","SURG-C15-037","SURG-C15-038","SURG-C15-039"],"guide":"Hemithyroidectomy when ALL: low risk, U/L, 1-4 cm, no extrathyroidal spread. Minimum total for radiation-induced, familial non-medullary, multifocal B/L, extrathyroid extension. Add CND for T3/T4 or level 6 (+); add MRND when level 6 + other neck nodes."},{"id":"SURG-U15-8","ch":15,"n":8,"title":"Whole Body Iodine Scan & RIA","sec":"Whole Body Iodine Scan & RIA · p93","qs":["SURG-C15-040","SURG-C15-041","SURG-C15-042","SURG-C15-043","SURG-C15-044","SURG-C15-045","SURG-C15-046","SURG-C15-047","SURG-C15-048","SURG-C15-049"],"guide":"Post-Sx scan needs TSH >30 (withdraw thyroxine 4-6 wks - patient hypothyroid - or recombinant TSH). (+) scan → RIA with I131 (β rays, t½ 7-8 d) for residual/mets/+ve nodes/high Tg; (-) → thyroxine TSH suppression + life-long 6-monthly USG & thyroglobulin (unreliable if anti-Tg Ab +)."},{"id":"SURG-U15-9","ch":15,"n":9,"title":"Radioiodine Resistant DTC & Lindsey Tumor","sec":"Radioiodine Resistant DTC & Lindsey Tumor · p94","qs":["SURG-C15-050","SURG-C15-051","SURG-C15-052"],"guide":"RAI-resistant DTC: sorafenib/lenvatinib, EBRT, doxorubicin. Lindsey tumor = follicular variety of papillary, prognosis like PTC."},{"id":"SURG-U15-10","ch":15,"n":10,"title":"FTC: Basics, Features & Spread","sec":"FTC: Basics, Features & Spread · p94","qs":["SURG-C15-053","SURG-C15-054","SURG-C15-055","SURG-C15-056","SURG-C15-057","SURG-C15-058"],"guide":"2nd m/c; m/c in iodine deficiency; risk long-standing MNG; females > males. miRNA 197/346, PTEN & BAX. Rapid neck swelling, pressure symptoms; pulsatile vascular osteolytic bony mets; lymphatic to level 6."},{"id":"SURG-U15-11","ch":15,"n":11,"title":"FTC: Dx, Mx & Hurthle Cell Carcinoma","sec":"FTC: Dx, Mx & Hurthle Cell Carcinoma · p95","qs":["SURG-C15-059","SURG-C15-060","SURG-C15-061","SURG-C15-062","SURG-C15-063","SURG-C15-064","SURG-C15-065"],"guide":"FNAC gives follicular neoplasm (Thy 3) but can't split adenoma vs carcinoma - hemithyroidectomy + frozen section decides. Prognosis slightly poorer than PTC. Hurthle cell: 6th-7th decade, mitochondria-rich oxyphilic cells, less RAI-avid, more aggressive, poorer than FTC; Hurthle cells also in Hashimoto's & thyroid lymphoma."},{"id":"SURG-U15-12","ch":15,"n":12,"title":"Prognostic Scores (AGES/AMES/MACIS)","sec":"Prognostic Scores (AGES/AMES/MACIS) · p96","qs":["SURG-C15-066","SURG-C15-067","SURG-C15-068"],"guide":"Well-differentiated TC scores: AGES = age, grade, extrathyroidal invasion, size; AMES = age, metastases, extrathyroidal spread, size; MACIS = metastases, age, completeness of original resection (post-op criteria), invasion, size."},{"id":"SURG-U15-13","ch":15,"n":13,"title":"Anaplastic Carcinoma","sec":"Anaplastic Carcinoma · p96","qs":["SURG-C15-069","SURG-C15-070","SURG-C15-071","SURG-C15-072","SURG-C15-073","SURG-C15-074","SURG-C15-075","SURG-C15-076","SURG-C15-077","SURG-C15-078","SURG-C15-079"],"guide":"Least common, worst prognosis; 5th-7th decade; miRNA 17-92, p53 & B-catenin. Rapid hard neck swelling on MNG background, pressure symptoms; D/D Riedel thyroiditis; spreads to lungs; FNAC inconclusive → core biopsy. Localised: total + CND + MRND; advanced: debulking, isthmusectomy for tracheal pressure, dabrafenib, chemo."},{"id":"SURG-U15-14","ch":15,"n":14,"title":"Thyroid Lymphoma","sec":"Thyroid Lymphoma · p97","qs":["SURG-C15-080","SURG-C15-081","SURG-C15-082","SURG-C15-083","SURG-C15-084","SURG-C15-085","SURG-C15-086","SURG-C15-087"],"guide":"Rare, 5th-7th decade, on long-standing Hashimoto's. DLBCL m/c; thyroid swelling + B symptoms (weight loss, fever, night sweats, itching). Core/trucut biopsy (FNAC can't characterize). Chemo R-CHOP 1st line (rituximab anti-CD20, cyclophosphamide, hydroxydaunorubicin, oncovin/vincristine, prednisolone); surgery only for residual/recurrent."},{"id":"SURG-U15-15","ch":15,"n":15,"title":"MTC: Origin, Secretions & Types","sec":"MTC: Origin, Secretions & Types · p98","qs":["SURG-C15-088","SURG-C15-089","SURG-C15-090","SURG-C15-091","SURG-C15-092","SURG-C15-093","SURG-C15-094","SURG-C15-095","SURG-C15-096"],"guide":"From parafollicular/C cells (neural crest → ultimobranchial bodies). Secretes calcitonin, CEA (dedifferentiation marker), chromogranin A. Sporadic m/c (4th-6th decade); familial = MEN2 (2B most aggressive, multifocal). Atypical symptoms: diarrhoea (serotonin), Cushing (ACTH), flushing (histamine)."},{"id":"SURG-U15-16","ch":15,"n":16,"title":"MTC: Dx, Spread & Mx","sec":"MTC: Dx, Spread & Mx · p98","qs":["SURG-C15-097","SURG-C15-098","SURG-C15-099","SURG-C15-100","SURG-C15-101","SURG-C15-102","SURG-C15-103","SURG-C15-104","SURG-C15-105"],"guide":"FNAC + amyloid-rich stroma; lymphatic level 6, haematogenous liver. Sx 1st line: total + CND (add MRND as nodal spread widens). No RIA role. Rule out pheochromocytoma FIRST & treat hyperparathyroidism together. Advanced: debulking, RT, vandetinib/carbozantinib; follow-up calcitonin + CEA."},{"id":"SURG-U15-17","ch":15,"n":17,"title":"Summary of Thyroid Cancers","sec":"Summary of Thyroid Cancers · p99","qs":["SURG-C15-106","SURG-C15-107","SURG-C15-108","SURG-C15-109","SURG-C15-110"],"guide":"Papillary: m/c, best, BRAF/RET-PTC, lymphatic, Orphan Annie + psammoma. Follicular: iodine deficiency/MNG, K-RAS/PI3K, bony mets, follicles. Medullary: parafollicular, RET/MEN2, both routes, amyloid. Anaplastic: L/C, worst, P53, both routes."},{"id":"SURG-U15-18","ch":15,"n":18,"title":"MEN 1 Syndrome","sec":"MEN 1 Syndrome · p100","qs":["SURG-C15-111","SURG-C15-112","SURG-C15-113","SURG-C15-114","SURG-C15-115","SURG-C15-116"],"guide":"Wermer syndrome, menin on Ch 11. 3 Ps: pituitary (prolactinoma m/c), parathyroid (95%, adenoma >> hyperplasia), pancreatic (overall insulinoma, in MEN1 gastrinoma, non-functional PPoma); plus collagenomas, adrenocortical & thymic tumors."},{"id":"SURG-U15-19","ch":15,"n":19,"title":"MEN 2 Syndrome","sec":"MEN 2 Syndrome · p100","qs":["SURG-C15-117","SURG-C15-118","SURG-C15-119","SURG-C15-120","SURG-C15-121"],"guide":"RET on Ch 10. MTC-only exon 618; 2A (Sipple) exon 634: MTC, parathyroid, pheochromocytoma, megacolon/Hirschsprung (2A > 2B); 2B (MEN3) exon 918: 5 Ms - MTC most aggressive, marfanoid, mucosal neuromas, medullated corneal fibres, megacolon."},{"id":"SURG-U15-20","ch":15,"n":20,"title":"RET Testing & MEN 4","sec":"RET Testing & MEN 4 · p101","qs":["SURG-C15-122","SURG-C15-123","SURG-C15-124","SURG-C15-125","SURG-C15-126","SURG-C15-127","SURG-C15-128"],"guide":"1st-degree relatives get RET testing: low (768/790) prophylactic thyroidectomy upto 20 yrs; medium (618/634) upto 5-6 yrs; high (918) before 1 yr. Tumor +ve → pentagastrin stimulation → ↑↑ calcitonin. MEN4 = CDKN1B on Ch 12: pituitary, parathyroid, renal, adrenocortical, reproductive organ tumors."},{"id":"SURG-U16-1","ch":16,"n":1,"title":"Thyroid Embryology & Lingual Thyroid","sec":"Thyroid Embryology & Lingual Thyroid · p102","qs":["SURG-C16-001","SURG-C16-002","SURG-C16-003","SURG-C16-004","SURG-C16-005","SURG-C16-006"],"guide":"Thyroid descends from foramen caecum (junction anterior 2/3-posterior 1/3 tongue) via thyroglossal tract which obliterates. Lingual thyroid = undescended tissue below tongue (tongue lifted up); FNAC + USG neck to confirm normal gland before excision; thyroxine if it was the only tissue."},{"id":"SURG-U16-2","ch":16,"n":2,"title":"Thyroglossal Cyst: Dx, Mx & Complications","sec":"Thyroglossal Cyst: Dx, Mx & Complications · p102","qs":["SURG-C16-007","SURG-C16-008","SURG-C16-009","SURG-C16-010","SURG-C16-011","SURG-C16-012","SURG-C16-013","SURG-C16-014"],"guide":"Persistent tract → subhyoid (m/c) midline swelling moving with deglutition AND tongue protrusion. Sistrunk = cyst + part of hyoid + tract to tongue base; I&D never (fistula). Complications: fistula & PTC in long-standing cases. Vs branchial fistula: lower 1/3 along SCM, congenital/acquired."},{"id":"SURG-U16-3","ch":16,"n":3,"title":"Hyperthyroidism: Features & Causes","sec":"Hyperthyroidism: Features & Causes · p103","qs":["SURG-C16-015","SURG-C16-016","SURG-C16-017","SURG-C16-018","SURG-C16-019","SURG-C16-020","SURG-C16-021","SURG-C16-022"],"guide":"Thin irritable, weight loss despite appetite, tachycardia, diarrhoea, tremors, heat intolerance, oligomenorrhea. Scan patterns: Graves diffuse ↑ (m/c); Plummer's single hot; toxic nodular goitre multiple hot; factitious & struma ovarii ↓; Jod-Basedow (iodine-induced) ↑; TSH adenoma ↑TSH ↑."},{"id":"SURG-U16-4","ch":16,"n":4,"title":"Antithyroid Drugs & Pre-op Preparation","sec":"Antithyroid Drugs & Pre-op Preparation · p103","qs":["SURG-C16-023","SURG-C16-024","SURG-C16-025","SURG-C16-026","SURG-C16-027","SURG-C16-028","SURG-C16-029","SURG-C16-030","SURG-C16-031","SURG-C16-032"],"guide":"PTU/carbimazole block peroxidase & T4→T3; PTU safe in 1st trimester/lactation; agranulocytosis - sore throat 1st sign. RIA I131 β-rays t½ 7-8 d. Pre-Sx: drugs 6-8 wks to euthyroid, nadolol (long acting) till 7 days post-op (T3 t½), last dose evening before."},{"id":"SURG-U16-5","ch":16,"n":5,"title":"Thyroid Storm","sec":"Thyroid Storm · p104","qs":["SURG-C16-033","SURG-C16-034","SURG-C16-035","SURG-C16-036","SURG-C16-037","SURG-C16-038","SURG-C16-039"],"guide":"Uncontrolled thyrotoxicosis from inadequately prepared patient (m/c), URTI, FNAC, Sx trauma, anaesthetics. Dehydration, hyperthermia, HTN crisis; arrhythmia kills. Mx: aggressive IV fluids (prevent ATN), cold packs, IV steroids + antibiotics, high-dose propranolol, PTU; avoid aspirin."},{"id":"SURG-U16-6","ch":16,"n":6,"title":"Graves: Basics & Eye Signs","sec":"Graves: Basics & Eye Signs · p104","qs":["SURG-C16-040","SURG-C16-041","SURG-C16-042","SURG-C16-043","SURG-C16-044","SURG-C16-045","SURG-C16-046","SURG-C16-047","SURG-C16-048","SURG-C16-049","SURG-C16-050"],"guide":"Autoimmune F>M, m/c hyperthyroid cause; stimulating TRAb (LATS); pretibial myxedema; a/w pernicious anemia & myasthenia. Acropachy = subperiosteal bone. Eye: exophthalmos; von Graefe lid lag + Dalrymple retraction (Muller spasm), Joffroy no forehead wrinkle, Moebius loss of accommodation (severe), Stellwag infrequent blink (mild)."},{"id":"SURG-U16-7","ch":16,"n":7,"title":"Graves: Dx & Mx","sec":"Graves: Dx & Mx · p105","qs":["SURG-C16-051","SURG-C16-052","SURG-C16-053","SURG-C16-054","SURG-C16-055","SURG-C16-056","SURG-C16-057","SURG-C16-058"],"guide":"Dx: C/F + autoantibodies; HPE scalloped colloid + tall columnar cells. Mx by status: child drugs; pregnant PTU; adult no goitre drugs→RIA; with goitre drugs→Sx; elderly comorbid drugs→RIA; extensive eye signs drugs→Sx (RIA worsens eyes). Sx: total > subtotal."},{"id":"SURG-U16-8","ch":16,"n":8,"title":"Plummer's & Solitary Toxic Nodule","sec":"Plummer's & Solitary Toxic Nodule · p106","qs":["SURG-C16-059","SURG-C16-060","SURG-C16-061","SURG-C16-062"],"guide":"Plummer's/toxic nodular goitre: F:M 5:1, 2nd m/c cause, multiple hot & cold nodules, drugs → total thyroidectomy. Solitary toxic nodule: 5th decade F>M, single hot nodule, drugs → RIA."},{"id":"SURG-U16-9","ch":16,"n":9,"title":"Hypothyroidism: Causes & Features","sec":"Hypothyroidism: Causes & Features · p106","qs":["SURG-C16-063","SURG-C16-064","SURG-C16-065","SURG-C16-066","SURG-C16-067","SURG-C16-068","SURG-C16-069","SURG-C16-070"],"guide":"Causes: iodine deficiency (overall m/c), Hashimoto (west m/c), Wolff-Chaikoff (iodine-induced), non-functioning pituitary adenoma ↓TSH (exception), Sheehan (post-partum apoplexy), dyshormonogenesis (TPO deficiency), euthyroid sick syndrome, Refetoff (end-organ T4 resistance). Dull, alopecia, bradycardia, constipation, weight gain, cold intolerance, menorrhagia."},{"id":"SURG-U16-10","ch":16,"n":10,"title":"Hashimoto's Thyroiditis","sec":"Hashimoto's Thyroiditis · p106","qs":["SURG-C16-071","SURG-C16-072","SURG-C16-073","SURG-C16-074","SURG-C16-075","SURG-C16-076","SURG-C16-077","SURG-C16-078"],"guide":"Autoimmune F>M, hereditary, HLA DR3/B8, Down's/Turner's. Blocking receptor + anti-TPO + anti-thyroglobulin antibodies; lymphocytes destroy follicles → hashitoxicosis spike → prolonged hypothyroidism. Long-standing: lymphoma (m/c), FTC, PTC. FNAC lymphocytes + Hurthle; titrate low-dose thyroxine to TSH; total thyroidectomy if goitre."},{"id":"SURG-U16-11","ch":16,"n":11,"title":"Subacute & Post-partum Thyroiditis","sec":"Subacute & Post-partum Thyroiditis · p108","qs":["SURG-C16-079","SURG-C16-080","SURG-C16-081","SURG-C16-082","SURG-C16-083","SURG-C16-084","SURG-C16-085","SURG-C16-086"],"guide":"De Quervain (viral/granulomatous, HLA B35): post-URTI 4-6 wks; painful neck + ↑ESR; hyper→hypo→euthyroid self-limiting (follicles regenerate 2-3 mo); symptomatic + steroids. Post-partum: 2-12 mo (10%), autoimmune 2nd m/c, anti-TPO +, 10-fold Hashimoto risk; correct hypothyroidism."},{"id":"SURG-U16-12","ch":16,"n":12,"title":"Riedel's Thyroiditis & Summary","sec":"Riedel's Thyroiditis & Summary · p108","qs":["SURG-C16-087","SURG-C16-088","SURG-C16-089","SURG-C16-090","SURG-C16-091","SURG-C16-092"],"guide":"IgG4 fibrosing disease (Peyronie's, Dupuytren's): woody hard painless gland, pressure symptoms; D/D anaplastic; core biopsy; steroids + tamoxifen. Summary table: Hashimoto painless prolonged hypo; De Quervain painful post-URTI spontaneous recovery; Riedel hard gland."},{"id":"SURG-U16-13","ch":16,"n":13,"title":"Goitre: Types & Malignancy Risk","sec":"Goitre: Types & Malignancy Risk · p109","qs":["SURG-C16-093","SURG-C16-094","SURG-C16-095","SURG-C16-096","SURG-C16-097","SURG-C16-098"],"guide":"Diffuse: iodine deficiency, demand states (pregnancy/puberty), Hashimoto/Graves; untreated → MNG (variable TSH). MNG: long-standing iodine deficiency. Dominant nodule = single palpable + rest palpable. Malignancy risk: solid 2× cystic; males 4× females."},{"id":"SURG-U16-14","ch":16,"n":14,"title":"Retrosternal Goitre","sec":"Retrosternal Goitre · p110","qs":["SURG-C16-099","SURG-C16-100","SURG-C16-101","SURG-C16-102","SURG-C16-103","SURG-C16-104","SURG-C16-105","SURG-C16-106","SURG-C16-107"],"guide":"Behind sternum; 2° plunging m/c (90%, neck vessels) vs 1° mediastinal (10%, ectopic, mediastinal vessels). Lower limit not palpable; Pemberton sign (arms up → inlet obstruction → facial congestion). CECT neck + thorax IOC; neck incision m/c; sternotomy for recurrent, 1°, larger than inlet, malignant."},{"id":"SURG-U17-1","ch":17,"n":1,"title":"Surgical Anatomy & Physiology","sec":"Surgical Anatomy & Physiology · p111","qs":["SURG-C17-001","SURG-C17-002","SURG-C17-003","SURG-C17-004","SURG-C17-005","SURG-C17-006","SURG-C17-007","SURG-C17-008"],"guide":"Superior parathyroid from 4th pouch (constant, posterior thyroid), inferior from 3rd pouch (variable) like the thymus - so thymus goes with the inferior gland to ↑ yield; 5% have 5 glands. Identify by the golden-yellow sentinel fat pad (turns dusky on touch); PTH (t½ 5-7 mins) raises plasma Ca2+."},{"id":"SURG-U17-2","ch":17,"n":2,"title":"Clinical Features of Hyperparathyroidism","sec":"Clinical Features of Hyperparathyroidism · p111","qs":["SURG-C17-009","SURG-C17-010","SURG-C17-011","SURG-C17-012","SURG-C17-013","SURG-C17-014","SURG-C17-015","SURG-C17-016"],"guide":"Bones, stones, abdominal groans, psychiatric overtones: pathological fractures, subperiosteal resorption m/c radial side, salt & pepper skull, brown tumor = osteitis fibrosa cystica (von Recklinghausen bone disease); recurrent multiple radiopaque calcium-oxalate renal stones; colic & pancreatitis."},{"id":"SURG-U17-3","ch":17,"n":3,"title":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation · p112","qs":["SURG-C17-017","SURG-C17-018","SURG-C17-019","SURG-C17-020","SURG-C17-021","SURG-C17-022","SURG-C17-023","SURG-C17-024","SURG-C17-025"],"guide":"Adenoma (1 gland) >> hyperplasia (4 glands); risks radiation & MEN1/2A (familial, multiglandular). Biochem: ↑PTH, ↑S.Ca, ↑U.Ca/phosphate, ↓S.phosphate, ↑calcitriol. Sestamibi = IOC (Tc99 sticks to mitochondria-rich adenoma; Warthin tumor false +); SPECT = Single Photon Emission CT m/c."},{"id":"SURG-U17-4","ch":17,"n":4,"title":"Localisation of Adenoma & Mx of Adenoma","sec":"Localisation of Adenoma & Mx of Adenoma · p113","qs":["SURG-C17-026","SURG-C17-027","SURG-C17-028","SURG-C17-029","SURG-C17-030"],"guide":"Concordant sestamibi+USG → USG-marked MIP; discordant → 4D CT → 4-gland exploration or USG-marked MIP. Adenoma mx = remove the gland (MIP/open); correct gland ensured by USG marking + Miami protocol (PTH ↓ >50% at 10-15 min post-removal)."},{"id":"SURG-U17-5","ch":17,"n":5,"title":"Management of Hyperplasia & Thymectomy","sec":"Management of Hyperplasia & Thymectomy · p113","qs":["SURG-C17-031","SURG-C17-032","SURG-C17-033","SURG-C17-034","SURG-C17-035"],"guide":"Hyperplasia MIS for multigland/familial/lithium: subtotal 3½ removed (½ in neck, but recurrence Sx hard d/t fibrosis) or total + ½ autotransplant in non-dominant brachioradialis (easy re-excision). Thymectomy for lower-gland involvement, 2° hyperPTH, familial; never implant into sternocleidomastoid - thyroidectomy would injure it."},{"id":"SURG-U17-6","ch":17,"n":6,"title":"Sx in Asymptomatic Hyperparathyroidism & Complications","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications · p114","qs":["SURG-C17-036","SURG-C17-037","SURG-C17-038","SURG-C17-039","SURG-C17-040","SURG-C17-041","SURG-C17-042","SURG-C17-043"],"guide":"Asymptomatic Sx if S.Ca >1 above reference, nephrolithiasis/life-threatening episode, hypercalciuria >400mg/24h, osteoporosis, age <50. Residual = ↑PTH within 6 wks; recurrent = ↑PTH 6 months after normal (Casanova neck/arm vein test, +ve → remove gland). Hungry bone: Ca2+ floods into bones → hypocalcemia."},{"id":"SURG-U17-7","ch":17,"n":7,"title":"Hypercalcemic Crisis","sec":"Hypercalcemic Crisis · p114","qs":["SURG-C17-044","SURG-C17-045","SURG-C17-046","SURG-C17-047","SURG-C17-048","SURG-C17-049","SURG-C17-050","SURG-C17-051","SURG-C17-052","SURG-C17-053"],"guide":"Emergency at Ca >14 (arrest >16) in 1° hyperPTH or malignancy (squamous lung, breast, prostate). Confusion, vomiting, anuria, dehydration, abdominal pain; ECG ↑PR ↓QT arrhythmia. Rx: aggressive IV fluids first, furosemide, bisphosphonates (osteoclast) + calcitonin, dialysis if all fail."},{"id":"SURG-U17-8","ch":17,"n":8,"title":"Secondary Hyperparathyroidism","sec":"Secondary Hyperparathyroidism · p115","qs":["SURG-C17-054","SURG-C17-055","SURG-C17-056","SURG-C17-057","SURG-C17-058","SURG-C17-059","SURG-C17-060","SURG-C17-061"],"guide":"2° = PTH hyperplasia from chronic renal failure (m/c: failed vit D hydroxylation → ↓D3/↓Ca), malabsorption, lithium, D3 deficiency. N/↓ Ca, ↑ phosphate, ↓ calcitriol, ↑ PTH. Rx: fix CRF (renal transplant mainstay), D3, low-phosphate diet, cinacalcet (calcimimetic on Ca-sensing receptor); no localisation needed, surgery treats hyperplasia."},{"id":"SURG-U17-9","ch":17,"n":9,"title":"Tertiary Hyperparathyroidism","sec":"Tertiary Hyperparathyroidism · p115","qs":["SURG-C17-062","SURG-C17-063","SURG-C17-064"],"guide":"Tertiary = persistent autonomous hypercalcemic hyperPTH after kidney transplant: ↑PTH, ↑Ca, ↓ phosphate, nodular glands on USG. Rx subtotal parathyroidectomy (mainstay) or gland embolisation."},{"id":"SURG-U17-10","ch":17,"n":10,"title":"Miscellaneous: Calciphylaxis","sec":"Miscellaneous: Calciphylaxis · p115","qs":["SURG-C17-065","SURG-C17-066"],"guide":"Calciphylaxis in chronic dialysis: hypercalcemic uremic arteriopathy - Ca2+ deposits in skin/vessels/soft tissue → gangrene, painful purpura, breast calcification."},{"id":"SURG-U17-11","ch":17,"n":11,"title":"Pseudohyperparathyroidism","sec":"Pseudohyperparathyroidism · p116","qs":["SURG-C17-067","SURG-C17-068","SURG-C17-069","SURG-C17-070"],"guide":"Pseudohyperparathyroidism = hypercalcemia of malignancy, PTHrp-mediated paraneoplastic (squamous lung m/c, breast, prostate): ↑Ca, normal phosphate, N/↓ PTH & calcitriol, ↑PTHrp; treat like hypercalcemic crisis."},{"id":"SURG-U17-12","ch":17,"n":12,"title":"Parathyroid Cancer","sec":"Parathyroid Cancer · p116","qs":["SURG-C17-071","SURG-C17-072","SURG-C17-073","SURG-C17-074"],"guide":"Rare cancer: radiation & HRPT2 risks; HPE fibrous bands + vascular invasion, IHC parafibromin inactivation. Death m/c from hypercalcemic crisis arrhythmia; Rx R0 resection, octreotide/cinacalcet for symptoms."},{"id":"SURG-U17-13","ch":17,"n":13,"title":"Hypoparathyroidism & DiGeorge Syndrome","sec":"Hypoparathyroidism & DiGeorge Syndrome · p116","qs":["SURG-C17-075","SURG-C17-076","SURG-C17-077"],"guide":"Hypoparathyroidism: iatrogenic m/c then DiGeorge (CATCH 22 = 22q11 deletion: Cardiac anomalies, Atypical facies, Thymic hypoplasia, Cleft lip/palate, Hypocalcemia)."}];

const QBYID = {}; QUESTIONS.forEach(q=>QBYID[q.id]=q);
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_surgery_xp')||0;}, set xp(v){store('pulse_surgery_xp',v);},
  get done(){return store('pulse_surgery_done')||[];}, set done(v){store('pulse_surgery_done',v);},
  get unlock(){return !!store('pulse_surgery_unlock');}, set unlock(v){store('pulse_surgery_unlock',v);},
  streak(){const t=store('pulse_surgery_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_surgery_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}
let order=[],idx=0,xpGain=0,streak=0,correct=0,wrongList=[],locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function beginUnit(){
  // FIXED book order — only options shuffle (anti-bias)
  order=curUnit.qs.map(id=>{const q=QBYID[id];return {q,opts:shuffle(q.opts.map((t,i)=>({t,ok:i===q.ans})))};});
  idx=0;xpGain=0;streak=0;correct=0;wrongList=[];
  show('quiz');renderQ();
}
function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
