ook p38)"},{"id":"SURG-C7-039","sec":"Pathophysiology & Response","page":38,"q":"Blood loss activates the sympathetic system releasing:","opts":["Noradrenaline, adrenaline","Insulin","Histamine","Acetylcholine"],"ans":0,"exp":"Blood loss -> Activation of sympathetic system -> Noradrenaline, Adrenaline. (Book p38)"},{"id":"SURG-C7-040","sec":"Pathophysiology & Response","page":38,"q":"The earliest sign of Class II (compensated) shock is:","opts":["Tachycardia (↑ HR)","Hypotension","Anuria","Coma"],"ans":0,"exp":"Tachycardia: ↑ HR (Earliest sign). (Book p38)"},{"id":"SURG-C7-041","sec":"Pathophysiology & Response","page":38,"q":"Peripheral vasoconstriction in compensated shock serves to:","opts":["Shunt blood to vital organs","Increase skin temperature","Cause bleeding","Lower peripheral vascular resistance"],"ans":0,"exp":"Peripheral vasoconstriction (Shunts blood to vital organs). (Book p38)"},{"id":"SURG-C7-042","sec":"Pathophysiology & Response","page":38,"q":"Clinical features of the compensated phase include cold extremities and:","opts":["↑ peripheral vascular resistance","↓ peripheral vascular resistance","Warm flushed skin","Bradycardia"],"ans":0,"exp":"Cold extremities; ↑ peripheral vascular resistance. (Book p38)"},{"id":"SURG-C7-043","sec":"Pathophysiology & Response","page":38,"q":"To check the response in shock, one gives:","opts":["500 mL-1 L crystalloid and checks response","2 L colloid bolus","Oral fluids only","Blood immediately always"],"ans":0,"exp":"Response and management of shock: 500 mL-1 L crystalloid given -> Response checked. (Book p38)"},{"id":"SURG-C7-044","sec":"Dynamic Fluid Response","page":39,"q":"In a responder, pulse rate, SBP and JVP show:","opts":["PR ↓↓, SBP ↑↑, JVP ↑↑ with persistent changes","PR ↑, SBP ↓, JVP ↓","No change at all","Changes that reverse within 5 minutes"],"ans":0,"exp":"Responder: PR ↓↓, SBP ↑↑, JVP ↑↑; the above changes are persistent. (Book p39)"},{"id":"SURG-C7-045","sec":"Dynamic Fluid Response","page":39,"q":"A transient responder shows improvement but after 15-20 minutes:","opts":["Parameters worsen (ongoing losses)","Parameters stay normal forever","PR falls to zero","JVP becomes non-recordable"],"ans":0,"exp":"Transient responder: After 15-20 mins parameters worsen (Ongoing losses). (Book p39)"},{"id":"SURG-C7-046","sec":"Dynamic Fluid Response","page":39,"q":"In a non responder, PR, SBP and JVP respectively:","opts":["↑, ↓, ↓","↓↓, ↑↑, ↑↑","Normal, normal, normal","↓, ↑, ↑"],"ans":0,"exp":"Non responder: PR ↑, SBP ↓, JVP ↓. (Book p39)"},{"id":"SURG-C7-047","sec":"Dynamic Fluid Response","page":39,"q":"A non responder implies:","opts":["Ongoing losses","Complete hemostasis","Over-transfusion","Compensated shock"],"ans":0,"exp":"Non responder: Implication = Ongoing losses. (Book p39)"},{"id":"SURG-C7-048","sec":"Management: Resuscitation","page":39,"q":"Active bleeding is recognised by:","opts":["Hypotension and transient/non-responder status","Normal BP and responder status","Fever","Bradycardia"],"ans":0,"exp":"Recognise active bleeding: Hypotension, transient/non-responder. (Book p39)"},{"id":"SURG-C7-049","sec":"Management: Resuscitation","page":39,"q":"Before hemostasis, resuscitation prioritises:","opts":["Coagulation","Perfusion","Diuresis","Sedation"],"ans":0,"exp":"Before hemostasis: Prioritise coagulation. (Book p39)"},{"id":"SURG-C7-050","sec":"Management: Resuscitation","page":39,"q":"After hemostasis, resuscitation prioritises:","opts":["Perfusion","Coagulation","Hypothermia","Hemoconcentration"],"ans":0,"exp":"After hemostasis: Prioritise perfusion. (Book p39)"},{"id":"SURG-C7-051","sec":"Management: Resuscitation","page":39,"q":"Damage control resuscitation is used in:","opts":["Active bleeding (hypotension, transient/non-responder)","Stable responders","Elective surgery","Anaemia only"],"ans":0,"exp":"Recognise active bleeding -> Damage control resuscitation. (Book p39)"},{"id":"SURG-C7-052","sec":"Management: Resuscitation","page":39,"q":"The goal of damage control resuscitation is:","opts":["Coagulation function and coronary perfusion","End-organ perfusion","Normalisation of Hb","Full blood pressure immediately"],"ans":0,"exp":"Damage control resuscitation goal: Coagulation function, coronary perfusion. (Book p39)"},{"id":"SURG-C7-053","sec":"Management: Resuscitation","page":39,"q":"Damage control resuscitation includes all of the following EXCEPT:","opts":["Permissive hypertension","Damage control surgery","Balanced transfusion (1:1 RBC and FFP)","Treating coagulopathy with tranexamic acid, platelets, fibrinogen"],"ans":0,"exp":"DCR: Damage control surgery; Permissive hypotension (keep BP at lower limit of normal); Balanced transfusion (1:1 RBC and FFP); Treat coagulopathy (Tranexamic acid, platelets, fibrinogen). (Book p39)"},{"id":"SURG-C7-054","sec":"Management: Resuscitation","page":39,"q":"Permissive hypotension means keeping the BP at:","opts":["The lower limit of normal","The upper limit of normal","Above 140 mmHg","Zero"],"ans":0,"exp":"Permissive hypotension (keep BP at lower limit of normal). (Book p39)"},{"id":"SURG-C7-055","sec":"Management: Resuscitation","page":39,"q":"Balanced transfusion in damage control resuscitation uses RBC and FFP in the ratio:","opts":["1:1","2:1","4:1","1:4"],"ans":0,"exp":"Balanced transfusion (1:1 RBC and FFP). (Book p39)"},{"id":"SURG-C7-056","sec":"Management: Resuscitation","page":39,"q":"Coagulopathy in damage control resuscitation is treated with:","opts":["Tranexamic acid, platelets, fibrinogen","Heparin","Warfarin","Vitamin K only"],"ans":0,"exp":"Treat coagulopathy (Tranexamic acid, platelets, fibrinogen). (Book p39)"},{"id":"SURG-C7-057","sec":"Management: Resuscitation","page":39,"q":"Monitoring in damage control resuscitation includes coagulation parameters:","opts":["PT, fibrinogen, ROTEM/TEG","Only Hb","Only platelet count","Bleeding time only"],"ans":0,"exp":"DCR monitor: Coagulation: PT, fibrinogen, ROTEM/TEG. (Book p39)"},{"id":"SURG-C7-058","sec":"Management: Resuscitation","page":39,"q":"Monitoring in damage control resuscitation includes electrolytes:","opts":["Ca2+, K+","Na+ only","Mg2+ only","Phosphate only"],"ans":0,"exp":"DCR monitor: Electrolytes: Ca2+, K+. (Book p39)"},{"id":"SURG-C7-059","sec":"Management: Resuscitation","page":39,"q":"Perfusion monitoring in damage control resuscitation uses:","opts":["pH, base excess, lactate, temperature","Urine culture","CXR","GCS only"],"ans":0,"exp":"DCR monitor: Perfusion: pH, base excess, lactate, temperature. (Book p39)"},{"id":"SURG-C7-060","sec":"Management: Resuscitation","page":39,"q":"A responder after hemostasis receives:","opts":["Perfusion-targeted resuscitation","Damage control resuscitation","No fluids ever","Only colloids"],"ans":0,"exp":"Responder -> Perfusion-targeted resuscitation. (Book p39)"},{"id":"SURG-C7-061","sec":"Management: Resuscitation","page":39,"q":"The goal of perfusion-targeted resuscitation is:","opts":["End-organ perfusion","Coagulation function","Hypothermia","Hemoconcentration"],"ans":0,"exp":"Perfusion-targeted resuscitation goal: End-organ perfusion. (Book p39)"},{"id":"SURG-C7-062","sec":"Management: Resuscitation","page":39,"q":"Perfusion-targeted resuscitation ensures adequate preload and afterload using:","opts":["Fluids and pressors","Diuretics","Beta blockers","Sedatives"],"ans":0,"exp":"Adequate preload and afterload (Fluids and pressors). (Book p39)"},{"id":"SURG-C7-063","sec":"Management: Resuscitation","page":39,"q":"Perfusion-targeted resuscitation also includes:","opts":["Thromboprophylaxis","Anticoagulation avoidance always","Routine FFP","Permissive hypotension"],"ans":0,"exp":"Perfusion-targeted resuscitation: Thromboprophylaxis. (Book p39)"},{"id":"SURG-C7-064","sec":"Management: Resuscitation","page":39,"q":"Cardiovascular monitoring in perfusion-targeted resuscitation includes:","opts":["BP, HR, CO, SVR","BP and HR only","JVP only","ECG only"],"ans":0,"exp":"PTR monitor: Cardiovascular: BP, HR, CO, SVR. (Book p39)"},{"id":"SURG-C7-065","sec":"Management: Resuscitation","page":39,"q":"Perfusion monitoring in perfusion-targeted resuscitation includes:","opts":["Base excess, lactate, SvO2","Only temperature","Only pH","Hb only"],"ans":0,"exp":"PTR monitor: Perfusion: Base excess, lactate, SvO2. (Book p39)"},{"id":"SURG-C7-066","sec":"Management: Resuscitation","page":39,"q":"Organ function monitoring in perfusion-targeted resuscitation includes:","opts":["PaO2/FiO2, UO, GCS","Only GCS","Only urine output","Liver biopsy"],"ans":0,"exp":"PTR monitor: Organ function: PaO2/FiO2, UO, GCS. (Book p39)"},{"id":"SURG-C7-067","sec":"Management: Resuscitation","page":39,"q":"The abdominal compartment is monitored in perfusion-targeted resuscitation by:","opts":["IAP (intra abdominal pressure)","UO","SvO2","CO"],"ans":0,"exp":"PTR monitor: Abdominal compartment: IAP. (Book p39)"},{"id":"SURG-C7-068","sec":"Management: Resuscitation","page":39,"q":"ROTEM and TEG stand for:","opts":["Rotational thromboelastometry and thromboelastography","Rotational thromboembolism test and tissue elastography","Routine thrombin estimation and tissue coagulography","Rotational temperature estimation and thrombin elasticity graph"],"ans":0,"exp":"ROTEM: Rotational thromboelastometry; TEG: Thromboelastography. (Book p39)"},{"id":"SURG-C7-069","sec":"Occult Hypoperfusion","page":40,"q":"Occult hypoperfusion shows CVS parameters (HR, SBP) that are:","opts":["Normal","Grossly deranged","Non-recordable","High"],"ans":0,"exp":"Occult hypoperfusion: Normal CVS parameters: HR, SBP normal. (Book p40)"},{"id":"SURG-C7-070","sec":"Occult Hypoperfusion","page":40,"q":"Urine output in occult hypoperfusion is:","opts":["Normal","Absent","Decreased","Increased"],"ans":0,"exp":"Occult hypoperfusion: Normal urine output. (Book p40)"},{"id":"SURG-C7-071","sec":"Occult Hypoperfusion","page":40,"q":"Occult hypoperfusion is revealed by:","opts":["Low MVOS (mixed venous oxygen saturation) and acidosis","High MVOS and alkalosis","Normal lactate","Normal base excess"],"ans":0,"exp":"Occult hypoperfusion: Low MVOS (mixed venous oxygen saturation); Acidosis. (Book p40)"},{"id":"SURG-C7-072","sec":"Monitoring Indicators","page":40,"q":"The best indicator of initial fluid requirement is:","opts":["PCWP > CVP","CVP > PCWP","Urine output","Shock index"],"ans":0,"exp":"Initial fluid requirement: Best indicator: PCWP > CVP. (Book p40)"},{"id":"SURG-C7-073","sec":"Monitoring Indicators","page":40,"q":"PCWP stands for and reflects:","opts":["Pulmonary capillary wedge pressure; left-sided heart pressure (more accurate)","Peripheral central wedge pressure; right heart","Pulmonary circulatory wedge pressure; RV pressure","Peak capillary wedge pressure; skin perfusion"],"ans":0,"exp":"PCWP: (Pulmonary capillary wedge pressure); Left-sided heart pressure (more accurate). (Book p40)"},{"id":"SURG-C7-074","sec":"Monitoring Indicators","page":40,"q":"PCWP is measured using a:","opts":["Swan-Ganz catheter","Foley catheter","PICC line","Arterial line only"],"ans":0,"exp":"PCWP: Swan-Ganz catheter used. (Book p40)"},{"id":"SURG-C7-075","sec":"Monitoring Indicators","page":40,"q":"The drawback of PCWP monitoring is that it is:","opts":["Difficult to monitor","Inaccurate for left heart","Non-invasive","Cheapest"],"ans":0,"exp":"PCWP: Difficult to monitor. (Book p40)"},{"id":"SURG-C7-076","sec":"Monitoring Indicators","page":40,"q":"CVP reflects:","opts":["Right-sided heart pressure and is m/c used","Left-sided heart pressure","Pulmonary artery pressure only","Portal pressure"],"ans":0,"exp":"CVP: (Central venous pressure); Right-sided heart pressure; m/c used. (Book p40)"},{"id":"SURG-C7-077","sec":"Monitoring Indicators","page":40,"q":"The best indicator of fluid resuscitation is:","opts":["Urine output","CVP","PCWP","Heart rate"],"ans":0,"exp":"Fluid resuscitation: Best indicator: Urine output. (Book p40)"},{"id":"SURG-C7-078","sec":"Monitoring Indicators","page":40,"q":"Urine output target in adults during resuscitation is:","opts":[">0.5 mL/kg/hour",">1 mL/kg/hour",">2 mL/kg/hour",">0.1 mL/kg/hour"],"ans":0,"exp":"Urine output: Adults: >0.5 mL/kg/hour. (Book p40)"},{"id":"SURG-C7-079","sec":"Monitoring Indicators","page":40,"q":"Urine output target in children during resuscitation is:","opts":[">1 mL/kg/hour",">0.5 mL/kg/hour",">0.25 mL/kg/hour",">3 mL/kg/hour"],"ans":0,"exp":"Urine output: Children: >1 mL/kg/hour. (Book p40)"},{"id":"SURG-C7-080","sec":"Indices","page":40,"q":"Shock index is calculated as:","opts":["Heart rate (HR) / Systolic BP (SBP)","SBP / HR","HR / DBP","MAP / HR"],"ans":0,"exp":"Shock Index: Heart rate (HR)/Systolic BP (SBP). (Book p40)"},{"id":"SURG-C7-081","sec":"Indices","page":40,"q":"A shock index >0.9 indicates:","opts":["Higher mortality rate","Stable patient","Compensated shock","Normal perfusion"],"ans":0,"exp":"Shock index >0.9: Higher mortality rate. (Book p40)"},{"id":"SURG-C7-082","sec":"Indices","page":40,"q":"Modified shock index is calculated as:","opts":["HR / MAP (mean arterial pressure)","HR / SBP","HR / PP","MAP / HR"],"ans":0,"exp":"Modified shock index: HR/MAP (mean arterial pressure). (Book p40)"},{"id":"SURG-C7-083","sec":"Indices","page":40,"q":"The most sensitive shock index is the:","opts":["Modified shock index","Shock index","ROPE","CVP"],"ans":0,"exp":"Modified shock index: most sensitive. (Book p40)"},{"id":"SURG-C7-084","sec":"Indices","page":41,"q":"Rate over pressure evaluation (ROPE) is calculated as:","opts":["HR / PP (pulse pressure)","HR / SBP","HR / MAP","PP / HR"],"ans":0,"exp":"ROPE: HR/PP (Pulse pressure). (Book p41)"},{"id":"SURG-C7-085","sec":"Indices","page":41,"q":"A ROPE value <3 indicates:","opts":["Stable patient","Decompensated shock","High mortality","Ongoing bleeding"],"ans":0,"exp":"ROPE <3: Stable patient. (Book p41)"},{"id":"SURG-C7-086","sec":"Indices","page":41,"q":"A ROPE value >3 indicates the patient:","opts":["May develop decompensated shock","Is stable","Needs no monitoring","Is a responder"],"ans":0,"exp":"ROPE >3: May develop decompensated shock. (Book p41)"},{"id":"SURG-C7-087","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Systemic perfusion is investigated by base deficit and lactate, which are:","opts":["Signs of acidosis","Signs of alkalosis","Signs of infection","Signs of anemia"],"ans":0,"exp":"Systemic perfusion investigations: Base deficit, Lactate = Signs of acidosis. (Book p41)"},{"id":"SURG-C7-088","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"The best end point of resuscitation is:","opts":["Mixed venous oxygen saturation (MVOS)","Urine output","Heart rate","CVP"],"ans":0,"exp":"Mixed venous oxygen saturation (MVOS): Best end point of resuscitation. (Book p41)"},{"id":"SURG-C7-089","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Muscle perfusion is monitored by:","opts":["Near-infrared spectroscopy and tissue oxygen electrode","Urine output","Consciousness level","Sublingual capnometry"],"ans":0,"exp":"Muscle: Near-infrared spectroscopy; Tissue oxygen electrode. (Book p41)"},{"id":"SURG-C7-090","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"The tissue most sensitive to hypovolemic insult is the:","opts":["Gut mucosa","Muscle","Brain","Kidney"],"ans":0,"exp":"Gut mucosa: Most sensitive to hypovolemic insult. (Book p41)"},{"id":"SURG-C7-091","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Hypovolemic insult to gut mucosa leads to formation of:","opts":["Stress ulcers","Polyps","Diverticula","Villous atrophy"],"ans":0,"exp":"Gut mucosa: Forms stress ulcers. (Book p41)"},{"id":"SURG-C7-092","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Gut perfusion is monitored by:","opts":["Sublingual capnometry, gut mucosal pH, laser doppler flowmetry","Urine output","NIRS only","Consciousness level"],"ans":0,"exp":"Gut: Sublingual capnometry; Gut mucosal pH; Laser doppler flowmetry. (Book p41)"},{"id":"SURG-C7-093","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Kidney perfusion is monitored clinically by:","opts":["Urine output","Consciousness level","Base deficit","Laser doppler"],"ans":0,"exp":"Kidney: Clinical = Urine output. (Book p41)"},{"id":"SURG-C7-094","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Brain perfusion is monitored clinically by and investigated with:","opts":["Consciousness level; tissue oxygen electrode and NIRS","Urine output; capnometry","HR; lactate","BP; MVOS"],"ans":0,"exp":"Brain: Clinical = Consciousness level; Investigations = Tissue oxygen electrode, Near-infrared spectroscopy (NIRS). (Book p41)"},{"id":"SURG-C7-095","sec":"Massive Blood Transfusion","page":41,"q":"Massive blood transfusion includes any of the following EXCEPT:","opts":[">4 units in 24 hours","Replace entire circulating volume in 24 hrs",">10 units of blood in 24 hrs",">4 units in one hour"],"ans":0,"exp":"Massive blood transfusion: Replace entire circulating volume in 24 hrs; >10 units of blood in 24 hrs; >4 units in one hour. (Book p41)"},{"id":"SURG-C7-096","sec":"Massive Blood Transfusion","page":41,"q":"The first listed complication of massive transfusion is:","opts":["Hypothermia","Hyperthermia","Hypoglycemia","Hypertension"],"ans":0,"exp":"Complications: 1. Hypothermia. (Book p41)"},{"id":"SURG-C7-097","sec":"Massive Blood Transfusion","page":41,"q":"Hypocalcemia/hypomagnesemia in massive transfusion occurs because:","opts":["Citrate (anticoagulant) chelates Ca2+ and Mg2+","Heparin binds calcium","Blood is acidic","Kidneys excrete calcium"],"ans":0,"exp":"Reason: Citrate (Anticoagulant) -> Chelates Ca2+ and Mg2+. (Book p41)"},{"id":"SURG-C7-098","sec":"Massive Blood Transfusion","page":41,"q":"Metabolic alkalosis in massive transfusion is due to:","opts":["Citrate toxicity","Lactic acidosis","Hypothermia","Hyperkalemia"],"ans":0,"exp":"Metabolic alkalosis: Reason: Citrate toxicity. (Book p41)"},{"id":"SURG-C7-099","sec":"Massive Blood Transfusion","page":41,"q":"The potassium disturbance seen in massive transfusion is:","opts":["Hyperkalemia >> hypokalemia","Hypokalemia >> hyperkalemia","Only hypokalemia","No change"],"ans":0,"exp":"Hyperkalemia >> hypokalemia. (Book p41)"},{"id":"SURG-C7-100","sec":"Massive Blood Transfusion","page":41,"q":"Hyperkalemia in massive transfusion occurs because:","opts":["Stored blood -> RBC lysed -> K+ released -> ↑ serum K+","Citrate releases potassium","Renal failure always","Platelet lysis"],"ans":0,"exp":"Reason: Stored blood -> RBC lysed -> K+ released -> ↑ serum K+. (Book p41)"},{"id":"SURG-C7-101","sec":"Massive Blood Transfusion","page":42,"q":"The m/c cause of death in massive transfusion is:","opts":["Coagulopathy","Hypothermia","Hyperkalemia","TRALI"],"ans":0,"exp":"5. Coagulopathy (m/c cause of death). (Book p42)"},{"id":"SURG-C7-102","sec":"Massive Blood Transfusion","page":42,"q":"Reasons for coagulopathy in massive transfusion include all of the following EXCEPT:","opts":["Hyperthermia","Dilutional coagulopathy","Acidosis","Hypothermia"],"ans":0,"exp":"Coagulopathy reasons: a. Dilutional coagulopathy; b. Acidosis; c. Hypothermia. (Book p42)"},{"id":"SURG-C7-103","sec":"Massive Blood Transfusion","page":42,"q":"Prevention of coagulopathy in massive transfusion includes limiting crystalloids and giving PRBC : Platelet : FFP in the ratio:","opts":["1:1:1","2:1:1","1:2:4","4:1:1"],"ans":0,"exp":"Prevention: Limit crystalloids; PRBC : Platelet : FFP -> 1:1:1 ratio. (Book p42)"},{"id":"SURG-C7-104","sec":"Massive Blood Transfusion","page":42,"q":"Haemolytic reaction during transfusion is due to:","opts":["Mismatched transfusion","Citrate toxicity","Leukocytes","Iron overload"],"ans":0,"exp":"Haemolytic reaction: Reason: Mismatched transfusion. (Book p42)"},{"id":"SURG-C7-105","sec":"Massive Blood Transfusion","page":42,"q":"The m/c transfusion reaction is:","opts":["Febrile reactions","Haemolytic reaction","TRALI","TACO"],"ans":0,"exp":"Febrile reactions (m/c reaction). (Book p42)"},{"id":"SURG-C7-106","sec":"Massive Blood Transfusion","page":42,"q":"Febrile transfusion reactions are prevented by using:","opts":["A leukoreduction filter","Warming blood","Citrate","Diuretics"],"ans":0,"exp":"Prevention: use of a leukoreduction filter. (Book p42)"},{"id":"SURG-C7-107","sec":"Massive Blood Transfusion","page":42,"q":"TRALI stands for:","opts":["Transfusion related acute lung injury","Transfusion related acute liver injury","Transfusion related acute limb ischemia","Total respiratory and lung insufficiency"],"ans":0,"exp":"Transfusion related acute lung injury (TRALI). (Book p42)"},{"id":"SURG-C7-108","sec":"Massive Blood Transfusion","page":42,"q":"TACO stands for:","opts":["Transfusion associated cardiac overload","Transfusion associated cerebral oedema","Total acute cardiac occlusion","Transfusion acidosis and cardiac output fall"],"ans":0,"exp":"Transfusion associated cardiac overload (TACO). (Book p42)"},{"id":"SURG-C7-109","sec":"TACO vs TRALI","page":42,"q":"The mechanism of TACO is:","opts":["Cardiac overload","Antibody against HLA antigen","Sepsis","Citrate toxicity"],"ans":0,"exp":"TACO mechanism: D/t cardiac overload. (Book p42)"},{"id":"SURG-C7-110","sec":"TACO vs TRALI","page":42,"q":"The mechanism of TRALI is:","opts":["Antibody against HLA antigen causing non-cardiogenic pulmonary edema within 6 hours","Cardiac overload","Fluid overload of kidneys","Bacterial contamination"],"ans":0,"exp":"TRALI mechanism: Antibody against HLA antigen -> Non-cardiogenic pulmonary edema (within 6 hours). (Book p42)"},{"id":"SURG-C7-111","sec":"TACO vs TRALI","page":42,"q":"TRALI pulmonary edema appears within:","opts":["6 hours","24 hours","48 hours","1 week"],"ans":0,"exp":"Non-cardiogenic pulmonary edema (within 6 hours). (Book p42)"},{"id":"SURG-C7-112","sec":"TACO vs TRALI","page":42,"q":"Implicated donors in TRALI include:","opts":["Multiparous women and patients receiving FFP","Young male donors","First-time donors only","O-negative donors"],"ans":0,"exp":"TRALI implicated donors: Multiparous women; Patient receiving FFP. (Book p42)"},{"id":"SURG-C7-113","sec":"TACO vs TRALI","page":42,"q":"Clinical features of TACO include all of the following EXCEPT:","opts":["Patchy infiltrates on X-ray","Facial puffiness","Pedal edema","Breathlessness"],"ans":0,"exp":"TACO clinical features: Facial puffiness, Pedal edema, Breathlessness, X-ray: Normal. (Book p42)"},{"id":"SURG-C7-114","sec":"TACO vs TRALI","page":42,"q":"The chest X-ray in TACO is:","opts":["Normal","ARDS with patchy infiltrates","Pneumothorax","Cardiomegaly always"],"ans":0,"exp":"TACO: X-ray: Normal. (Book p42)"},{"id":"SURG-C7-115","sec":"TACO vs TRALI","page":42,"q":"TRALI clinically shows breathlessness and on CXR:","opts":["ARDS with pulmonary edema and patchy infiltrates","Normal film","Pleural effusion only","Cardiomegaly"],"ans":0,"exp":"TRALI: CXR: ARDS (Acute respiratory distress syndrome); Pulmonary edema; Patchy infiltrates. (Book p42)"},{"id":"SURG-C7-116","sec":"TACO vs TRALI","page":42,"q":"Management of TACO is:","opts":["Lasix/diuretics","No specific management listed","Antibiotics","Intubation always"],"ans":0,"exp":"TACO management: Lasix/diuretics. (Book p42)"},{"id":"SURG-C7-117","sec":"TACO vs TRALI","page":42,"q":"Management of TRALI as per the book is:","opts":["- (none listed)","Lasix/diuretics","Steroids","FFP infusion"],"ans":0,"exp":"TRALI management: - (none listed in table). (Book p42)"},{"id":"SURG-C7-118","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin <6 g/dL:","opts":["Probably will benefit from transfusion","Benefits only if ongoing losses","Not indicated if risk factors absent","Needs no transfusion"],"ans":0,"exp":"Hb <6: Probably will benefit from transfusion. (Book p43)"},{"id":"SURG-C7-119","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin of 6-8 g/dL benefits from transfusion only if:","opts":["Ongoing losses (+)/impending surgery","Patient is young","Surgery is minor","Risk factors absent"],"ans":0,"exp":"Hb 6-8: Benefit only if ongoing losses (+)/impending surgery. (Book p43)"},{"id":"SURG-C7-120","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin >8 g/dL:","opts":["Not indicated if risk factors absent","Always transfuse","Probably will benefit","Transfuse only before surgery"],"ans":0,"exp":"Hb >8: Not indicated if risk factors absent. (Book p43)"},{"id":"SURG-C7-121","sec":"Blood Substitutes","page":43,"q":"First generation blood substitute is:","opts":["Perfluorocarbon","Stroma free hemoglobin","Hemospan","PHP"],"ans":0,"exp":"First generation: Perfluorocarbon. (Book p43)"},{"id":"SURG-C7-122","sec":"Blood Substitutes","page":43,"q":"Second generation blood substitute is:","opts":["Stroma free hemoglobin","Perfluorocarbon","PEG hemoglobin","MP4OX"],"ans":0,"exp":"Second generation: Stroma free hemoglobin. (Book p43)"},{"id":"SURG-C7-123","sec":"Blood Substitutes","page":43,"q":"Next generation blood substitutes include all of the following EXCEPT:","opts":["Perfluorocarbon","Polyethylene glycol (PEG) hemoglobin","Hemospan (AKA MP4OX)","Pyridoxylated hemoglobin polyoxyethylene conjugate (PHP)"],"ans":0,"exp":"Next generation: PEG hemoglobin; Hemospan (AKA MP4OX); Pyridoxylated hemoglobin polyoxyethylene conjugate (PHP). (Book p43)"},{"id":"SURG-C7-124","sec":"Blood Substitutes","page":43,"q":"Hemospan is also known as:","opts":["MP4OX","PHP","PEG-Hb","TRALI"],"ans":0,"exp":"Hemospan (AKA MP4OX). (Book p43)"},{"id":"SURG-C7-125","sec":"Anti-shock Garment","page":43,"q":"The anti-shock garment is used for:","opts":["Hypovolemic shock in peripheral locations (Eg: Women with PPH in rural areas)","Cardiogenic shock in ICU","Septic shock in OT","Neurogenic shock only"],"ans":0,"exp":"Anti-shock garment: used for hypovolemic shock in peripheral locations (Eg: Women with PPH in rural areas). (Book p43)"},{"id":"SURG-C7-126","sec":"Anti-shock Garment","page":43,"q":"The anti-shock garment applies:","opts":["Maximum compression over the legs and least over the upper body","Equal compression everywhere","Maximum compression over the chest","Least compression over the legs"],"ans":0,"exp":"Anti-shock garment: Maximum compression (lower body), Least compression (upper body). (Book p43)"},{"id":"SURG-C8-001","sec":"MVOS","page":44,"q":"Mixed venous oxygen saturation (MVOS) represents:","opts":["The unutilised O2 returning back to the heart","The O2 consumed by tissues","Arterial O2 content","Alveolar O2"],"ans":0,"exp":"MVOS: Represents the unutilised O2 returning back to the heart. (Book p44)"},{"id":"SURG-C8-002","sec":"MVOS","page":44,"q":"The normal value of MVOS is:","opts":["50-70%","20-40%","70-90%","95-100%"],"ans":0,"exp":"MVOS: Normal value: 50 - 70%. (Book p44)"},{"id":"SURG-C8-003","sec":"MVOS","page":44,"q":"MVOS is measured via a catheter placed in the:","opts":["Right atrium","Left atrium","Aorta","Pulmonary vein"],"ans":0,"exp":"MVOS: Measured via a catheter in the Right Atrium. (Book p44)"},{"id":"SURG-C8-004","sec":"MVOS","page":44,"q":"Low MVOS is seen in:","opts":["Low cardiac output and reduced O2 pump (hypovolemic shock)","Distributive shock","Warm septic shock","Arteriovenous fistula"],"ans":0,"exp":"Low MVOS: Low cardiac output; Reduced O2 pump (Hypovolemic shock). (Book p44)"},{"id":"SURG-C8-005","sec":"MVOS","page":44,"q":"High MVOS is characteristic of:","opts":["Distributive shock","Hypovolemic shock","Cardiogenic shock","Haemorrhagic shock"],"ans":0,"exp":"High MVOS: Distributive shock. (Book p44)"},{"id":"SURG-C8-006","sec":"Cardiogenic Shock","page":44,"q":"Examples of cardiogenic shock include all of the following EXCEPT:","opts":["Massive pulmonary embolism","Myocardial infarction","Cardiac tamponade","Arrhythmias"],"ans":0,"exp":"Cardiogenic shock examples: Myocardial Infarction, Cardiac Tamponade, Arrhythmias (massive PE is obstructive). (Book p44)"},{"id":"SURG-C8-007","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock the primary defect is that the:","opts":["Heart does not function properly","Vessels dilate","Blood volume falls","Lungs fail"],"ans":0,"exp":"Pathophysiology: Heart does not function properly. (Book p44)"},{"id":"SURG-C8-008","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock, decreased cardiac output leads to:","opts":["O2 not pumped and ↓ MVOS","↑ MVOS","↑ SBP","↓ PVR"],"ans":0,"exp":"↓ CO -> O2 not pumped -> ↓ MVOS. (Book p44)"},{"id":"SURG-C8-009","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock the SBP and PVR changes are:","opts":["↓ SBP and ↑ PVR with cold extremities","↑ SBP and ↓ PVR with warm extremities","↓ SBP and ↓ PVR","Normal SBP and PVR"],"ans":0,"exp":"↓ SBP -> ↑ PVR (Cold extremities). (Book p44)"},{"id":"SURG-C8-010","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock, accumulating preload causes:","opts":["↑ JVP","↓ JVP","Normal JVP","↑ urine output"],"ans":0,"exp":"Preload accumulates -> ↑ JVP. (Book p44)"},{"id":"SURG-C8-011","sec":"Cardiogenic Shock","page":44,"q":"Extremities in cardiogenic shock are:","opts":["Cold","Warm","Flushed","Sweaty and warm"],"ans":0,"exp":"Cardiogenic shock: ↑ PVR (Cold extremities). (Book p44)"},{"id":"SURG-C8-012","sec":"Neurogenic Shock","page":44,"q":"The classic example of neurogenic shock is:","opts":["Spinal cord injury above T6 level","Spinal cord injury below L1","Isolated head injury","Femoral nerve injury"],"ans":0,"exp":"Neurogenic shock example: Spinal cord injury above T6 level. (Book p44)"},{"id":"SURG-C8-013","sec":"Neurogenic Shock","page":44,"q":"The pathophysiology of neurogenic shock begins with:","opts":["Loss of sympathetic drive","Histamine release","Cardiac pump failure","Hypovolemia"],"ans":0,"exp":"Pathophysiology: Loss of sympathetic drive. (Book p44)"},{"id":"SURG-C8-014","sec":"Neurogenic Shock","page":44,"q":"Loss of sympathetic drive causes vasodilation with:","opts":["PVR ↓↓ and warm extremities","PVR ↑↑ and cold extremities","PVR normal","↑ CO"],"ans":0,"exp":"Vasodilation -> PVR ↓↓ (Warm extremities). (Book p44)"},{"id":"SURG-C8-015","sec":"Neurogenic Shock","page":44,"q":"The heart rate change in neurogenic shock is:","opts":["Bradycardia (↓ HR)","Tachycardia","Normal","Variable ↑/↓"],"ans":0,"exp":"Loss of sympathetic drive -> Bradycardia (↓ HR). (Book p44)"},{"id":"SURG-C8-016","sec":"Neurogenic Shock","page":45,"q":"In neurogenic shock, peripheral pooling of blood causes:","opts":["↓ JVP, ↓ CO, ↓ SBP","↑ JVP, ↑ CO, ↑ SBP","↑ JVP with ↓ CO","Normal JVP and CO"],"ans":0,"exp":"D/t peripheral pooling of blood -> ↓ JVP, ↓ CO, ↓ SBP. (Book p45)"},{"id":"SURG-C8-017","sec":"Neurogenic Shock","page":45,"q":"The combination characteristic of neurogenic shock is:","opts":["Bradycardia + hypotension","Tachycardia + hypotension","Bradycardia + hypertension","Tachycardia + hypertension"],"ans":0,"exp":"Neurogenic shock: Bradycardia + Hypotension. (Book p45)"},{"id":"SURG-C8-018","sec":"Anaphylactic Shock","page":45,"q":"The example of anaphylactic shock given is:","opts":["Mismatched blood transfusion","Spinal anaesthesia","MI","Pulmonary embolism"],"ans":0,"exp":"Anaphylactic shock example: Mismatched blood transfusion. (Book p45)"},{"id":"SURG-C8-019","sec":"Anaphylactic Shock","page":45,"q":"In anaphylactic shock, the potent vasodilator released is:","opts":["Histamine","Noradrenaline","Angiotensin","Endothelin"],"ans":0,"exp":"Histamine release (Potent vasodilator). (Book p45)"},{"id":"SURG-C8-020","sec":"Anaphylactic Shock","page":45,"q":"Histamine release causes vasodilation and pooling of blood leading to:","opts":["↓ PVR with warm extremities","↑ PVR with cold extremities","↑ JVP","↑ SBP"],"ans":0,"exp":"Vasodilation -> Pooling of blood -> ↓ PVR (Warm extremities). (Book p45)"},{"id":"SURG-C8-021","sec":"Anaphylactic Shock","page":45,"q":"In anaphylactic shock, JVP, SBP and CO all:","opts":["Decrease","Increase","Stay normal","Become non-recordable only"],"ans":0,"exp":"Pooling of blood -> ↓ JVP, ↓ SBP, ↓ CO. (Book p45)"},{"id":"SURG-C8-022","sec":"Anaphylactic Shock","page":45,"q":"Because the sympathetic system is normal in anaphylactic shock, ↓ CO equals:","opts":["↑ HR x ↓ SV","↓ HR x ↑ SV","↑ HR x ↑ SV","↓ HR x ↓ SV"],"ans":0,"exp":"But, d/t normal sympathetic system: ↓ CO = ↑ HR x ↓ SV. (Book p45)"},{"id":"SURG-C8-023","sec":"Septic Shock: Warm & Cold","page":45,"q":"Warm septic shock shows a hyperdynamic circulation with:","opts":["↑ CO, ↑ HR, ↑ SBP","↓ CO, ↓ HR, ↓ SBP","↑ CO with ↓ SBP","↓ CO with ↑ SBP"],"ans":0,"exp":"Warm septic shock: Hyperdynamic circulation -> ↑ CO, ↑ HR, ↑ SBP. (Book p45)"},{"id":"SURG-C8-024","sec":"Septic Shock: Warm & Cold","page":45,"q":"MVOS is raised in warm septic shock because of:","opts":["Inability of tissues to utilize O2","Low cardiac output","Hypovolemia","Increased O2 pump"],"ans":0,"exp":"Raised MVOS d/t inability of tissues to utilize O2. (Book p45)"},{"id":"SURG-C8-025","sec":"Septic Shock: Warm & Cold","page":45,"q":"Cold septic shock occurs in the:","opts":["Late phase of sepsis","Early phase of sepsis","Recovery phase","Incubation phase"],"ans":0,"exp":"Cold septic shock: Late phase of sepsis. (Book p45)"},{"id":"SURG-C8-026","sec":"Septic Shock: Warm & Cold","page":45,"q":"In cold septic shock, toxins inhibit the myocardium making it similar to:","opts":["Cardiogenic shock","Hypovolemic shock","Neurogenic shock","Anaphylactic shock"],"ans":0,"exp":"Toxins inhibit myocardium -> similar to cardiogenic shock. (Book p45)"},{"id":"SURG-C8-027","sec":"Shock Comparison Table","page":45,"q":"In the shock comparison table, pulse rate is ↑↑ (maximum) in:","opts":["Anaphylactic shock","Hypovolemic (Class III)","Neurogenic shock","Warm septic shock"],"ans":0,"exp":"Table: PR: Anaphylactic = ↑↑. (Book p45)"},{"id":"SURG-C8-028","sec":"Shock Comparison Table","page":45,"q":"Pulse rate is ↓ in which shock?","opts":["Neurogenic shock","Hypovolemic (Class III)","Anaphylactic shock","Warm septic shock"],"ans":0,"exp":"Table: PR: Neurogenic = ↓. (Book p45)"},{"id":"SURG-C8-029","sec":"Shock Comparison Table","page":45,"q":"Pulse rate is ↑/↓ (variable) in:","opts":["Cardiogenic and cold septic shock","Hypovolemic and warm septic","Neurogenic and anaphylactic","Only anaphylactic"],"ans":0,"exp":"Table: PR: Cardiogenic = ↑/↓; Septic cold = ↑/↓. (Book p45)"},{"id":"SURG-C8-030","sec":"Shock Comparison Table","page":45,"q":"Cardiac output is ↑ only in:","opts":["Warm septic shock","Cold septic shock","Cardiogenic shock","Anaphylactic shock"],"ans":0,"exp":"Table: CO: Septic warm = ↑ (all others ↓). (Book p45)"},{"id":"SURG-C8-031","sec":"Shock Comparison Table","page":45,"q":"SBP is ↑ only in:","opts":["Warm septic shock","Hypovolemic shock","Cardiogenic shock","Neurogenic shock"],"ans":0,"exp":"Table: SBP: Septic warm = ↑ (others ↓). (Book p45)"},{"id":"SURG-C8-032","sec":"Shock Comparison Table","page":45,"q":"PVR is ↑↑ (maximum) in:","opts":["Hypovolemic (Class III)","Cardiogenic shock","Cold septic shock","Warm septic shock"],"ans":0,"exp":"Table: PVR: Hypovolemic (Class III) = ↑↑. (Book p45)"},{"id":"SURG-C8-033","sec":"Shock Comparison Table","page":45,"q":"PVR is ↑ (single up) in which shocks?","opts":["Cardiogenic and cold septic","Warm septic and anaphylactic","Neurogenic and warm septic","Hypovolemic and neurogenic"],"ans":0,"exp":"Table: PVR: Cardiogenic = ↑; Septic cold = ↑. (Book p45)"},{"id":"SURG-C8-034","sec":"Shock Comparison Table","page":45,"q":"JVP is ↑ in:","opts":["Cardiogenic and cold septic shock","Hypovolemic and anaphylactic","Neurogenic and warm septic","All shocks"],"ans":0,"exp":"Table: JVP: Cardiogenic = ↑; Septic cold = ↑; others ↓ or normal. (Book p45)"},{"id":"SURG-C8-035","sec":"Shock Comparison Table","page":45,"q":"JVP is normal in:","opts":["Warm septic shock","Cardiogenic shock","Cold septic shock","Hypovolemic shock"],"ans":0,"exp":"Table: JVP: Septic warm = Normal. (Book p45)"},{"id":"SURG-C8-036","sec":"Shock Comparison Table","page":45,"q":"MVOS is ↑ ADS","page":51,"q":"The initial investigation for a breast lump in a woman <40 years (glands > fat) is:","opts":["USG","Mammogram","MRI","PET"],"ans":0,"exp":"Initial investigation: <40 years (Glands > Fat) -> USG. (Book p51)"},{"id":"SURG-C9-030","sec":"Radiological: Initial & BIRADS","page":51,"q":"The initial investigation for a breast lump in a woman >40 years (fat > glands) is:","opts":["Mammogram","USG","MRI","FNAC"],"ans":0,"exp":"Initial investigation: >40 years (Fat > Glands) -> Mammogram. (Book p51)"},{"id":"SURG-C9-031","sec":"Radiological: Initial & BIRADS","page":51,"q":"Mammography is not sensitive in ages < 40 years because:","opts":["Both lesions and normal glandular tissue are hyperintense","Fat replaces glands","Radiation is too high","Breasts are too small"],"ans":0,"exp":"Mammography not sensitive in ages < 40 yrs: Both lesions and normal glandular tissue are hyperintense. (Book p51)"},{"id":"SURG-C9-032","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS stands for:","opts":["Breast Imaging Reporting and Data Systems","Breast Infection Risk and Data Scores","Biopsy Imaging Rating and Diagnosis System","Breast Index of Radiological Abnormality Degrees"],"ans":0,"exp":"BIRADS: Breast Imaging Reporting and Data Systems. (Book p51)"},{"id":"SURG-C9-033","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 0 category means:","opts":["Needs additional imaging - recall for additional imaging","Negative","Benign","Suspicious"],"ans":0,"exp":"BIRADS 0: Needs additional imaging; Recall for additional imaging; n/a. (Book p51)"},{"id":"SURG-C9-034","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 1 (negative) and 2 (benign) are managed by:","opts":["Routine screening in 1 year; likelihood essentially 0%","Biopsy","6 month follow up","Surgical excision"],"ans":0,"exp":"BIRADS 1 & 2: Routine screening in 1 year; Essentially 0%. (Book p51)"},{"id":"SURG-C9-035","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 3 (probably benign) is managed by:","opts":["Short term follow up (6 months); likelihood 0-3%","Routine screening in 5 years","Immediate biopsy","Surgical excision"],"ans":0,"exp":"BIRADS 3: Probably benign; Short term follow up (6 months); 0 - 3%. (Book p51)"},{"id":"SURG-C9-036","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 4 (suspicious) is managed by:","opts":["Tissue diagnosis (biopsy)","6 month follow up","Routine screening","Surgical excision"],"ans":0,"exp":"BIRADS 4: Suspicious; Tissue Diagnosis (Biopsy). (Book p51)"},{"id":"SURG-C9-037","sec":"Radiological: Initial & BIRADS","page":51,"q":"The likelihood of cancer for BIRADS 4a, 4b and 4c respectively is:","opts":["2-10%, 10-50%, 50-95%","0-3%, 3-10%, 10-50%","10-20%, 20-40%, 40-60%","5%, 15%, 25%"],"ans":0,"exp":"BIRADS 4: 4a 2-10%; 4b 10-50%; 4c 50-95%. (Book p51)"},{"id":"SURG-C9-038","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 5 (highly s/o malignancy) carries a likelihood of cancer of:","opts":["95%","50%","75%","100%"],"ans":0,"exp":"BIRADS 5: Highly s/o malignancy; Tissue Diagnosis (Biopsy); 95%. (Book p51)"},{"id":"SURG-C9-039","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 6 (known biopsy proven) is managed by:","opts":["Surgical excision","Repeat biopsy","6 month follow up","Routine screening"],"ans":0,"exp":"BIRADS 6: Known biopsy proven; Surgical excision; n/a. (Book p51)"},{"id":"SURG-C9-040","sec":"ASBRS Screening Guidelines","page":51,"q":"As per ASBRS, formal risk assessment for breast cancer (Eg: Gail Index) begins at age:","opts":["≥25 yrs","≥20 yrs","≥30 yrs","≥40 yrs"],"ans":0,"exp":"ASBRS: 1. >25yrs -> Formal risk assessment for breast cancer (Eg: Gail Index). (Book p51)"},{"id":"SURG-C9-041","sec":"ASBRS Screening Guidelines","page":51,"q":"For average risk women, yearly screening mammography begins at:","opts":["40 yrs","30 yrs","45 yrs","50 yrs"],"ans":0,"exp":"ASBRS: 2. Average risk -> Begin yearly screening mammography at 40yrs. (Book p51)"},{" a: Involvement of chest wall -> Serratus anterior, ribs, intercostal muscles. (Book p59)"},{"id":"SURG-C10-080","sec":"8th AJCC: T","page":59,"q":"T4b breast cancer involves the skin with:","opts":["Ulceration, direct infiltration, peau d'orange, satellite nodules","Dimpling only","Nipple retraction only","Erythema only"],"ans":0,"exp":"T4b: Involvement of skin -> Ulceration, direct infiltration, peau d'orange, satellite nodules. (Book p59)"},{"id":"SURG-C10-081","sec":"8th AJCC: T","page":59,"q":"T4c and T4d respectively are:","opts":["T4a + T4b; inflammatory cancer","T4a only; Paget's","T4b only; DCIS","Tis + T1; lobular"],"ans":0,"exp":"T4c: T4a + T4b; T4d: Inflammatory cancer. (Book p59)"},{"id":"SURG-C10-082","sec":"8th AJCC: N","page":59,"q":"N1 breast cancer denotes:","opts":["Palpable mobile ipsilateral axillary nodes","Fixed ipsilateral axillary nodes","No regional node metastasis","Supraclavicular nodes"],"ans":0,"exp":"N1: Palpable mobile ipsilateral axillary nodes. (Book p59)"},{"id":"SURG-C10-083","sec":"8th AJCC: N","page":59,"q":"N2a and N2b respectively denote:","opts":["Fixed ipsilateral axillary nodes; internal mammary LN in absence of axillary LN","Mobile axillary nodes; supraclavicular nodes","Infraclavicular nodes; internal mammary nodes","No nodes; single node"],"ans":0,"exp":"N2a: Fixed ipsilateral axillary nodes; N2b: Presence of internal mammary lymph node in absence of axillary lymph node (LN). (Book p59)"},{"id":"SURG-C10-084","sec":"8th AJCC: N","page":59,"q":"N3a, N3b and N3c respectively denote:","opts":["Ipsilateral infraclavicular LN; internal mammary + axillary LN; ipsilateral supraclavicular LN","Axillary levels I-III","Fixed axillary; mobile axillary; internal mammary","Supraclavicular; infraclavicular; axillary"],"ans":0,"exp":"N3a: Ipsilateral infraclavicular LN; N3b: Internal mammary + Axillary LN; N3c: Ipsilateral supraclavicular LN. (Book p59)"},{"id":"SURG-C10-085","sec":"8th AJCC: M","page":59,"q":"M0 and M1 denote:","opts": 75","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"SLNB is used in all the following cancers EXCEPT:","opts":["Glioblastoma","Malignant melanoma","Penile cancer","Vulvar carcinoma"],"ans":0,"exp":"Cancers where SLNB is used: Malignant melanoma; Breast cancer; Penile cancer; Vulvar carcinoma; Head & neck cancer. (Book p66)"},{"id":"SURG-C11-076","sec":"Blue Dye Technique","page":66,"q":"In the blue dye technique, the dye is injected where and in what volume?","opts":["1-1.5 cc methylene blue/isosulfan blue, subcutaneous periareolar","10 cc methylene blue intravenous","5 cc isosulfan blue intramuscular","1-1.5 cc indigo carmine subdermal over the tumor"],"ans":0,"exp":"1-1.5 cc methylene blue/isosulfan blue injected in subcutaneous plane in periareolar region. (Book p66)"},{"id":"SURG-C11-077","sec":"Blue Dye Technique","page":66,"q":"After localising the blue lymph nodes, the next step is:","opts":["Frozen section in normal container","Direct mastectomy","Core biopsy of breast","Gamma camera scan"],"ans":0,"exp":"Localise blue lymph nodes → Frozen section in normal container. (Book p66)"},{"id":"SURG-C11-078","sec":"Blue Dye Technique","page":66,"q":"If frozen section of the sentinel node is cancer −ve:","opts":["Axillary clearance not needed (hence ↓ incidence of lymphedema)","Axillary clearance is mandatory","RT to axilla is mandatory","Repeat SLNB"],"ans":0,"exp":"Cancer −ve → Axillary clearance not needed (Hence ↓ incidence of lymphedema). (Book p66)"},{"id":"SURG-C11-079","sec":"Blue Dye Technique","page":66,"q":"If frozen section of the sentinel node is cancer +ve, the management is:","opts":["Axillary clearance","Observation","Pressure dressing","Repeat frozen section"],"ans":0,"exp":"Cancer +ve → Mx: Axillary clearance. (Book p66)"},{"id":"SURG-C11-080","sec":"Blue Dye Technique","page":66,"q":"The m/c complication of the blue dye technique is:","opts":["Skin tattooing","Anaphylaxis","Skin necrosis","Bluish discolouration of urine"],"ans":0,"exp":"Complications: Skin tattooing (m/c). (Book p66)"},{"id":"SURG-C11-081","sec":"Blue Dye Technique","page":66,"q":"Which of the following is a listed complication of the blue dye technique?","opts":["Anaphylaxis","Winging of scapula","Seroma","Phantom breast"],"ans":0,"exp":"Complications: Skin tattooing (m/c), Anaphylaxis, Bluish discolouration of urine, Skin necrosis. (Book p66)"},{"id":"SURG-C11-082","sec":"Blue Dye Technique","page":66,"q":"A harmless listed complication of methylene/isosulfan blue seen in the urine is:","opts":["Bluish discolouration of urine","Hematuria","Proteinuria","Chyluria"],"ans":0,"exp":"Bluish discolouration of urine is a listed complication. (Book p66)"},{"id":"SURG-C11-083","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the radionucleotide technique, what is injected in the periareolar region?","opts":["Tc99 tagged sulphur colloid","Methylene blue","Ferric oxide","Indocyanine green"],"ans":0,"exp":"Tc99 tagged sulphur colloid injected in periareolar region. (Book p67)"},{"id":"SURG-C11-084","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"Hot nodes (radioactive) in the radionucleotide technique are identified on:","opts":["Gamma camera","MRI","PET-CT","USG"],"ans":0,"exp":"Hot nodes (Radioactive) identified on gamma camera. (Book p67)"},{"id":"SURG-C11-085","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The best technique for SLNB is:","opts":["Combination of blue dye + radionucleotide","Blue dye alone","Palpation alone","ICG alone"],"ans":0,"exp":"Best technique: Combination of blue dye + radionucleotide. (Book p67)"},{"id":"SURG-C11-086","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the indocyanine green (ICG) technique, what is injected?","opts":["ICG + blue dye","ICG + ferric oxide","Tc99 + blue dye","Methylene blue + ferric oxide"],"ans":0,"exp":"ICG + Blue dye injected → Green lymph nodes under filter. (Book p67)"},{"id":"SURG-C11-087","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The advantage of the ICG technique is:","opts":["No radiation exposure","Zero cost","No injection needed","Nodes seen with naked eye without filter"],"ans":0,"exp":"Advantages: No radiation exposure. (Book p67)"},{"id":"SURG-C11-088","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The Sentimag technique uses which compound?","opts":["Ferric oxide compound","Tc99 colloid","Isosulfan blue","Gadolinium"],"ans":0,"exp":"Sentimag technique: Ferric oxide compound used. (Book p67)"},{"id":"SURG-C11-089","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the Sentimag technique the lymph node is detected on:","opts":["Magnetic scanner","Gamma camera","X-ray","Thermal camera"],"ans":0,"exp":"LN detected on magnetic scanner. (Book p67)"},{"id":"SURG-C11-090","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The advantage of the Sentimag technique is:","opts":["Zero radiation exposure","No equipment needed","It stains nodes blue","It is painful"],"ans":0,"exp":"Advantages: Zero radiation exposure. (Book p67)"},{"id":"SURG-C12-001","sec":"Chemotherapy Indications & NACT","page":68,"q":"Which of the following is NOT a listed indication for chemotherapy in breast cancer?","opts":["T1 tumor with ER, PR +ve and low recurrence risk","+ve lymph nodes","Locally advanced breast cancers","Her 2 neu +ve tumors"],"ans":0,"exp":"Indications for chemotherapy: 1. +ve lymph nodes; 2. Locally advanced breast cancers; 3. ER, PR -ve tumors; 4. Her 2 neu +ve tumors; 5. metastasis. (Book p68)"},{"id":"SURG-C12-002","sec":"Chemotherapy Indications & NACT","page":68,"q":"Chemotherapy is indicated for breast tumors that are:","opts":["ER, PR -ve","ER, PR +ve","ER +ve only","PR +ve only"],"ans":0,"exp":"Indication #3 for chemotherapy: ER, PR -ve tumors. (Book p68)"},{"id":"SURG-C12-003","sec":"Chemotherapy Indications & NACT","page":68,"q":"Which is NOT an indication for neoadjuvant chemotherapy (NACT)?","opts":["Small tumor with no desire for breast conservation","Locally advanced breast canc ations: Hemorrhage & Nerves","page":88,"q":"Nerve injury during thyroid surgery is prevented by:","opts":["Nerve monitoring","Big incisions","Routine strap muscle cut","Drains"],"ans":0,"exp":"Prevention: Nerve monitoring. (Book p88)"},{"id":"SURG-C14-080","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"The MOST common nerve injury (often unnoticed) is to the:","opts":["External laryngeal nerve","Recurrent laryngeal nerve","Vagus","Ansa cervicalis"],"ans":0,"exp":"External laryngeal nerve: m/c, but goes unnoticed. (Book p88)"},{"id":"SURG-C14-081","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"The external laryngeal nerve supplies:","opts":["Cricothyroid","All larynx muscles","Sensory supply of larynx","Strap muscles"],"ans":0,"exp":"External laryngeal nerve muscles supplied: Cricothyroid. (Book p88)"},{"id":"SURG-C14-082","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"Unilateral external laryngeal nerve injury causes:","opts":["Hoarseness","Aspiration","Stridor","Aphonia"],"ans":0,"exp":"ELN U/L: Hoarseness; B/L: Aspiration; Not life threatening (NLT). (Book p88)"},{"id":"SURG-C14-083","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"Bilateral external laryngeal nerve injury causes:","opts":["Aspiration","Hoarseness only","Stridor","Aphonia"],"ans":0,"exp":"ELN B/L: Aspiration (NLT). (Book p88)"},{"id":"SURG-C14-084","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"The RLN supplies:","opts":["All muscles of larynx except cricothyroid + sensory supply of larynx","Only cricothyroid","Only sensory","Strap muscles"],"ans":0,"exp":"RLN: All muscles of larynx except cricothyroid; Sensory supply of larynx. (Book p88)"},{"id":"SURG-C14-085","sec":"Complications: Hemorrhage & Nerves","page":88,"q":"Unilateral RLN injury causes hoarseness; the patient:","opts":["Can speak (not life threatening)","Cannot speak at all","Develops stridor","Aspirates always"],"ans":0,"exp":"RLN U/L: Hoarseness: Patient can speak (NLT). (Book p88)  & vocal cords before sx. (Book p88)"},{"id":"SURG-C14-092","sec":"Respiratory Distress & Hypoparathyroidism","page":89,"q":"Hypoparathyroidism as a complication appears as a LATE cause at:","opts":["48-72 hrs after Sx","6 hrs","1 week","1 month"],"ans":0,"exp":"Hypoparathyroidism: Late cause: 48-72 hrs after sx. (Book p89)"},{"id":"SURG-C14-093","sec":"Respiratory Distress & Hypoparathyroidism","page":89,"q":"The other late complications listed are:","opts":["Keloid and recurrence","Hemorrhage","Air embolism","Ansa cervicalis injury"],"ans":0,"exp":"4. Keloid; 5. Recurrence. (Book p89)"},{"id":"SURG-C14-094","sec":"Hypoparathyroidism","page":89,"q":"The most common cause of hypoparathyroidism after thyroid surgery is vascular insult via:","opts":["Inferior thyroid artery","Superior thyroid artery","Middle thyroid vein","Arteria thyroidea ima"],"ans":0,"exp":"Cause: Vascular insult to parathyroid glands: inferior thyroid artery: m/c. (Book p89)"},{"id":"SURG-C14-095","sec":"Hypoparathyroidism","page":89,"q":"Symptoms of hypoparathyroidism start at:","opts":["48-72 hrs after Sx","Immediately in OT","1 week","6 hours"],"ans":0,"exp":"Start 48-72 hrs after Sx. (Book p89)"},{"id":"SURG-C14-096","sec":"Hypoparathyroidism","page":89,"q":"The EARLIEST symptom of hypoparathyroidism is:","opts":["Perioral numbness","Tetany","Respiratory distress","Carpopedal spasm"],"ans":0,"exp":"Earliest: Perioral numbness → tingling/paresthesia → Tetany → Respiratory distress (Cause of death). (Book p89)"},{"id":"SURG-C14-097","sec":"Hypoparathyroidism","page":89,"q":"The cause of death in untreated hypoparathyroidism is:","opts":["Respiratory distress","Cardiac arrest from hypercalcemia","Hemorrhage","Sepsis"],"ans":0,"exp":"Tetany → Respiratory distress (Cause of death). (Book p89)"},{"id":"SURG-C14-098","sec":"Hypoparathyroidism","page":89,"q":"Chvostek sign is:","opts":["Twitching of facial muscles on tapping over facial nerve","Carpopedal spasm","Hand spasm with BP cuff","Numbness of ue","Vallate papillae","Root of tongue lateral margin"],"ans":0,"exp":"Embryology: foramen caecum (posterior 1/3rd tongue) → thyroglossal tract → thyroid gland; tract obliterates. (Book p102)"},{"id":"SURG-C16-002","sec":"Thyroid Embryology & Lingual Thyroid","page":102,"q":"The foramen caecum lies at the junction of:","opts":["Anterior 2/3rd and posterior 1/3rd of tongue","Anterior 1/3rd and posterior 2/3rd","Two halves of tongue","Tongue and floor of mouth"],"ans":0,"exp":"Foramen caecum between anterior 2/3rd and posterior 1/3rd of tongue. (Book p102)"},{"id":"SURG-C16-003","sec":"Thyroid Embryology & Lingual Thyroid","page":102,"q":"Lingual thyroid is:","opts":["Undescended thyroid tissue just below the tongue","A persistent thyroglossal tract","Ectopic ovarian thyroid","A lateral neck swelling"],"ans":0,"exp":"Lingual thyroid: undescended thyroid tissue; site just below the tongue. (Book p102)"},{"id":"SURG-C16-004","sec":"Thyroid Embryology & Lingual Thyroid","page":102,"q":"On clinical examination of lingual thyroid, the swelling causes:","opts":["Tongue lifted up","Tongue deviated laterally","Tracheal deviation","Dysphagia lusoria"],"ans":0,"exp":"C/F: swelling → tongue lifted up. (Book p102)"},{"id":"SURG-C16-005","sec":"Thyroid Embryology & Lingual Thyroid","page":102,"q":"Before excising a lingual thyroid, USG neck is done to:","opts":["Check for normal thyroid tissue in the neck","Stage a cancer","Measure the swelling","Guide FNAC"],"ans":0,"exp":"Ix: FNAC shows thyroid tissue; USG neck before Sx to check for normal thyroid tissue. (Book p102)"},{"id":"SURG-C16-006","sec":"Thyroid Embryology & Lingual Thyroid","page":102,"q":"After excision of a lingual thyroid that was the only thyroid tissue, the patient needs:","opts":["Thyroxine supplementation","Radioiodine","Steroids","Nothing"],"ans":0,"exp":"Mx: excision + thyroxine supplementation if it is the only thyroid tissue. (Book p102)"},{"id":"SURG-C16-007","sec":"Thyroglossal Cyst: Dx, Mx & Complication ion & Hurthle cells","Orphan Annie nuclei","Amyloid","Giant cells"],"ans":0,"exp":"Ix: autoantibody levels; FNAC lymphocyte infiltration + Hurthle cells. (Book p107)"},{"id":"SURG-C16-078","sec":"Hashimoto's Thyroiditis","page":107,"q":"Mx of Hashimoto's is:","opts":["Low dose thyroxine gradually titrated till TSH becomes normal; total thyroidectomy if goitre (+)","Antithyroid drugs","RIA","Steroids"],"ans":0,"exp":"Low dose thyroxine gradually titrated till TSH normal; if goitre (+) → total thyroidectomy. (Book p107)"},{"id":"SURG-C16-079","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"Subacute thyroiditis is also called:","opts":["De Quervain/viral/granulomatous thyroiditis","Riedel's thyroiditis","Hashimoto's","Suppurative thyroiditis"],"ans":0,"exp":"De Quervain/viral/granulomatous thyroiditis; associated with HLA B35. (Book p108)"},{"id":"SURG-C16-080","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"The sentinel event for subacute thyroiditis is:","opts":["URTI (viral), 4-6 weeks before","Surgery","Trauma","Iodine load"],"ans":0,"exp":"Sentinel event: URTI (viral); after 4-6 weeks lymphocytic infiltration. (Book p108)"},{"id":"SURG-C16-081","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"The clinical course of subacute thyroiditis is:","opts":["Hyperthyroidism → hypothyroidism → euthyroid (self limiting)","Hypothyroidism only","Hyperthyroidism only","Permanent hypothyroidism"],"ans":0,"exp":"Spike of hyperthyroidism → hypothyroidism → euthyroid (self limiting); follicles regenerate in 2-3 months. (Book p108)"},{"id":"SURG-C16-082","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"Subacute thyroiditis classically presents with painful neck enlargement and:","opts":["↑ ESR","↓ ESR","Painless goitre","Exophthalmos"],"ans":0,"exp":"Painful neck enlargement; ↑ ESR. (Book p108)"},{"id":"SURG-C16-083","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"Mx of subacute thyroiditis is:","opts":["Symptomatic + steroids","Antithyroid drugs","Surgery","RIA"],"ans":0,"exp":"Mx: symptomatic; steroids. (Book p108)"},{"id":"SURG-C16-084","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"Post-partum thyroiditis is seen in what timeframe and frequency?","opts":["2-12 months post partum (in 10%)","Immediately post partum (50%)","After 2 years (5%)","During pregnancy"],"ans":0,"exp":"Seen in 2-12 months post partum (in 10%). (Book p108)"},{"id":"SURG-C16-085","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"The etiology of post-partum thyroiditis is:","opts":["Autoimmune thyroiditis (2nd m/c cause)","Viral infection","Iodine deficiency","Bacterial"],"ans":0,"exp":"Etiology: autoimmune thyroiditis (2nd m/c cause); anti TPO antibodies (+); 10 fold risk of Hashimoto's. (Book p108)"},{"id":"SURG-C16-086","sec":"Subacute & Post-partum Thyroiditis","page":108,"q":"Mx of post-partum thyroiditis is:","opts":["Correction of hypothyroidism","Steroids","Surgery","Antithyroid drugs"],"ans":0,"exp":"Mx: correction of hypothyroidism; features same as Hashimoto. (Book p108)"},{"id":"SURG-C16-087","sec":"Riedel's Thyroiditis & Summary","page":108,"q":"Riedel's/fibrosing thyroiditis associations include:","opts":["IgG4, Peyronie's disease, Dupuytren's contracture","HLA B35","Down's syndrome","Pernicious anemia"],"ans":0,"exp":"Associations: IgG4; Peyronie's disease; Dupuytren's contracture. (Book p108)"},{"id":"SURG-C16-088","sec":"Riedel's Thyroiditis & Summary","page":108,"q":"Fibrosis within the gland in Riedel's causes:","opts":["Painless enlargement - woody hard gland","Painful swelling","Toxic symptoms","Ophthalmopathy"],"ans":0,"exp":"Within gland → painless enlargement → woody hard. (Book p108)"},{"id":"SURG-C16-089","sec":"Riedel's Thyroiditis & Summary","page":108,"q":"Fibrosis in the vicinity of the gland causes pressure symptoms:","opts":["RLN hoarseness & tracheal stridor","Dysphagia only","Horner's syndrome","Venous congestion"],"ans":0,"exp":"In vicinity → pressure symptoms: R ,"q":"Brown tumors of hyperparathyroidism are also known as:","opts":["Osteitis fibrosa cystica / von Recklinghausen disease of bone","Osteitis deformans / Paget disease","Osteogenesis imperfecta","Fibrous dysplasia"],"ans":0,"exp":"Brown tumors: osteitis fibrosa cystica / von Recklinghausen disease of bone. (Book p111)"},{"id":"SURG-C17-014","sec":"Clinical Features of Hyperparathyroidism","page":112,"q":"Renal stones in hyperparathyroidism are typically:","opts":["Recurrent & multiple","Single & asymptomatic","Always radiolucent","Uric acid type only"],"ans":0,"exp":"Stones: recurrent & multiple renal stones (m/c). (Book p112)"},{"id":"SURG-C17-015","sec":"Clinical Features of Hyperparathyroidism","page":112,"q":"The m/c renal stone in hyperparathyroidism, which is radiopaque, is:","opts":["Calcium oxalate","Uric acid","Cystine","Struvite"],"ans":0,"exp":"Calcium oxalate stone: renal stones (m/c) → radiopaque. (Book p112)"},{"id":"SURG-C17-016","sec":"Clinical Features of Hyperparathyroidism","page":112,"q":"The 'abdominal groans' of hyperparathyroidism include abdominal colic and:","opts":["Pancreatitis","Appendicitis","Cholecystitis","Intussusception"],"ans":0,"exp":"Abdominal groans: abdominal colic, pancreatitis. (Book p112)"},{"id":"SURG-C17-017","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"The m/c cause of primary hyperparathyroidism is:","opts":["Adenoma","Hyperplasia","Carcinoma","Ectopic PTH secretion"],"ans":0,"exp":"Adenoma >> hyperplasia. (Book p112)"},{"id":"SURG-C17-018","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"In primary hyperparathyroidism, adenoma versus hyperplasia means:","opts":["Enlargement of 1 gland vs all 4 glands","Enlargement of 2 vs 3 glands","Cystic vs solid gland","Toxic vs non-toxic gland"],"ans":0,"exp":"Adenoma: enlargement of 1 gland; hyperplasia: enlargement of all 4 glands. (Book p112)"},{"id":"SURG-C17-019","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"Risk factors for primary hyperparathyroidism are radiation exposure and:","opts":["MEN syndrome (MEN1, 2A)","MEN2B only","Turner syndrome","Down syndrome"],"ans":0,"exp":"Risk factors: 1. Radiation exposure 2. MEN syndrome (MEN1, 2A). (Book p112)"},{"id":"SURG-C17-020","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"MEN-syndrome-associated hyperparathyroidism is a familial syndrome showing:","opts":["Multiglandular disease (adenoma > hyperplasia)","Single-gland atrophy","Parathyroid cancer only","Ectopic glands only"],"ans":0,"exp":"Familial syndrome; multiglandular disease (adenoma > hyperplasia). (Book p112)"},{"id":"SURG-C17-021","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"The biochemical profile of primary hyperparathyroidism is:","opts":["↑ PTH, ↑ S. Ca2+, ↓ S. phosphorous, ↑ calcitriol","↓ PTH, ↑ S. Ca2+, ↑ S. phosphorous","↑ PTH, ↓ S. Ca2+, ↑ S. phosphorous","↓ PTH, ↓ S. Ca2+, ↓ calcitriol"],"ans":0,"exp":"↑ PTH; ↑ S. Ca2+ (total & ionised); ↑ U. Ca2+ & phosphate; ↓ S. phosphorous; ↑ calcitriol. (Book p112)"},{"id":"SURG-C17-022","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"The IOC investigation for a parathyroid adenoma is:","opts":["Tc99m sestamibi scan","USG neck alone","4D CT","MRI neck"],"ans":0,"exp":"Tc99m sestamibi scan: IOC (USG neck also part of workup). (Book p112)"},{"id":"SURG-C17-023","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"Tc99 localises in a PTH adenoma because the adenoma is rich in:","opts":["Mitochondria","Lysosomes","Glycogen","Melanin"],"ans":0,"exp":"Tc99 localises in PTH adenoma (rich in mitochondria). (Book p112)"},{"id":"SURG-C17-024","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"A false positive on sestamibi scan is:","opts":["Warthin tumour","Pleomorphic adenoma","Branchial cyst","Thyroglossal cyst"],"ans":0,"exp":"False positive: Warthin tumour (rich in mitochondria). (Book p112)"},{"id":"SURG-C17-025","sec":"Primary Hyperparathyroidism: Causes, Risk Factors & Investigation","page":112,"q":"SPECT, the m/c type of sestamibi imaging, stands for:","opts":["Single Photon Emission CT","Single Proton Emission Count","Sequential Photon Energy CT","Single Photon Energy Tomography"],"ans":0,"exp":"Types: single isotope dual phase; dual isotope subtraction imaging; SPECT: Single Photon Emission CT (m/c). (Book p112)"},{"id":"SURG-C17-026","sec":"Localisation of Adenoma & Mx of Adenoma","page":113,"q":"Concordant imaging on sestamibi scan & USG leads to:","opts":["Pre-op marking with USG → minimally invasive parathyroidectomy (MIP)","4D CT → 4 gland exploration","Open bilateral exploration directly","Repeat sestamibi after 6 months"],"ans":0,"exp":"Concordant imaging → pre-op marking with USG → minimally invasive parathyroidectomy (MIP). (Book p113)"},{"id":"SURG-C17-027","sec":"Localisation of Adenoma & Mx of Adenoma","page":113,"q":"Discordant imaging on sestamibi scan & USG is followed by:","opts":["4D CT","MRI neck","PET scan","No further imaging"],"ans":0,"exp":"Discordant imaging → 4D CT → 4 gland exploration or pre-op marking with USG and MIP. (Book p113)"},{"id":"SURG-C17-028","sec":"Localisation of Adenoma & Mx of Adenoma","page":113,"q":"Management of a parathyroid adenoma is:","opts":["Removal of adenomatous gland (MIP or open removal)","Total thyroidectomy","Calcium supplementation alone","Radioiodine ablation"],"ans":0,"exp":"Mx of adenoma: removal of adenomatous gland - minimally invasive parathyroidectomy (MIP) or open removal. (Book p113)"},{"id":"SURG-C17-029","sec":"Localisation of Adenoma & Mx of Adenoma","page":113,"q":"Steps to ensure correct gland removal in MIP are pre-op marking with USG and the:","opts":["Miami protocol","Rome protocol","Tokyo protocol","Paris protocol"],"ans":0,"exp":"Steps: 1. Pre-op marking with USG 2. Miami protocol. (Book p113)"},{"id":"SURG-C17-030","sec":"Localisation of Adenoma & Mx of Adenoma","page":113,"q":"In the Miami protocol, success is confirmed when the PTH level 10-15 mins after gland removal falls by:","opts":["> 50%","> 5%","> 90%","No fall required"],"ans":0,"exp":"Miami protocol: pre-op PTH level → 10-15 mins after gland removal → ↓ PTH by > 50%. (Book p113)"},{"id":"SURG-C17-031","sec":"Management of Hyperplasia & Thymectomy","page":113,"q":"Minimally invasive surgery (MIS) for parathyroid hyperplasia is indicated in:","opts":["Multigland disease, familial syndromes, lithium induced","Single sporadic adenoma only","Parathyroid carcinoma","Ectopic mediastinal adenoma"],"ans":0,"exp":"MIS for hyperplasia: C/I - multigland disease, familial syndromes, lithium induced. (Book p113)"},{"id":"SURG-C17-032","sec":"Management of Hyperplasia & Thymectomy","page":113,"q":"In subtotal parathyroidectomy for hyperplasia:","opts":["3½ glands removed, ½ gland retained in neck","All 4 glands removed with autotransplant","2 glands removed","1 gland removed"],"ans":0,"exp":"3½ glands removed, ½ gland retained in neck; disadvantage: Sx difficult in recurrence d/t fibrosis. (Book p113)"},{"id":"SURG-C17-033","sec":"Management of Hyperplasia & Thymectomy","page":113,"q":"In total parathyroidectomy with autotransplantation, ½ gland is placed in the:","opts":["Brachioradialis of the non-dominant hand","Sternocleidomastoid","Rectus abdominis","Quadriceps of the dominant leg"],"ans":0,"exp":"4 glands removed; ½ gland autotransplanted in brachioradialis (of non-dominant hand); advantage: easy removal in recurrence. (Book p113)"},{"id":"SURG-C17-034","sec":"Management of Hyperplasia & Thymectomy","page":113,"q":"Thymectomy during parathyroid surgery is indicated for:","opts":["Involvement of lower PTH glands, 2° hyperparathyroidism, familial syndromes","Superior gland adenoma only","Hypercalcemic crisis","Hungry bone syndrome"],"ans":0,"exp":"Thymectomy indication: involvement of lower PTH gland, 2° hyperparathyroidism, familial syndromes. (Book p113)"},{"id":"SURG-C17-035","sec":"Management of Hyperplasia & Thymectomy","page":114,"q":"Why is the PTH gland NOT transplanted into the sternocleidomastoid?","opts":["Injury to gland during thyroidectomy","Poor cosmetic result","Risk of airway obstruction","Inadequate blood supply"],"ans":0,"exp":"Note: transplantation of PTH gland in sternocleidomastoid → injury to gland during thyroidectomy. (Book p114)"},{"id":"SURG-C17-036","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Indications for Sx in asymptomatic hyperparathyroidism include serum calcium:","opts":["> 1 mg/dl above reference range","> 4 mg/dl above reference","Equal to reference","Below reference"],"ans":0,"exp":"S. calcium > 1 mg/dl above reference range. (Book p114)"},{"id":"SURG-C17-037","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Which complication lists as an indication for Sx in asymptomatic hyperparathyroidism?","opts":["Nephrolithiasis","Cholelithiasis","Appendicitis","Pancreatic cancer"],"ans":0,"exp":"Complications: e.g. nephrolithiasis; life threatening hypercalcemic episode. (Book p114)"},{"id":"SURG-C17-038","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Severe hypercalciuria indicating surgery in asymptomatic disease is:","opts":["> 400 mg/24 hrs","> 100 mg/24 hrs","> 50 mg/24 hrs","> 1000 mg/24 hrs"],"ans":0,"exp":"Severe hypercalciuria (> 400 mg/24 hrs). (Book p114)"},{"id":"SURG-C17-039","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Other indications for Sx in asymptomatic hyperparathyroidism are:","opts":["↓ bone mass (osteoporosis) and age < 50 yrs","↑ bone mass and age > 70 yrs","Osteopetrosis at any age","Age > 60 yrs only"],"ans":0,"exp":"↓ bone mass: osteoporosis; age < 50 yrs. (Book p114)"},{"id":"SURG-C17-040","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Residual hyperparathyroidism is defined as ↑ PTH:","opts":["Within 6 weeks","6 months after normalisation","1 year after surgery","Immediately within 24 hrs"],"ans":0,"exp":"Residual hyperPTH: ↑ PTH within 6 weeks. (Book p114)"},{"id":"SURG-C17-041","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Recurrent hyperparathyroidism is defined as ↑ PTH:","opts":["6 months after normalisation","Within 6 weeks","Within 48 hours","Without ever normalising"],"ans":0,"exp":"Recurrent hyperPTH: ↑ PTH 6 months after normalisation. (Book p114)"},{"id":"SURG-C17-042","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"The Casanova test measures PTH in neck & arm veins; recurrence is positive when:","opts":["Arm vein PTH = 20 × neck vein PTH","Neck vein PTH equals arm vein PTH","PTH is undetectable in both","Arm vein PTH = half of neck vein PTH"],"ans":0,"exp":"Casanova test: measures PTH in neck & arm veins; arm vein PTH = 20 × neck vein PTH → recurrence +ve → removal of gland. (Book p114)"},{"id":"SURG-C17-043","sec":"Sx in Asymptomatic Hyperparathyroidism & Complications","page":114,"q":"Hungry bone syndrome after PTH gland removal is:","opts":["Ca2+ influx into bones → hypocalcemia","Ca2+ efflux from bones → hypercalcemia","Phosphate influx into brain","Marrow suppression"],"ans":0,"exp":"Hungry bone syndrome: post PTH gland removal → Ca2+ influx into bones → hypocalcemia. (Book p114)"},{"id":"SURG-C17-044","sec":"Hypercalcemic Crisis","page":114,"q":"Hypercalcemic crisis is seen in:","opts":["1° hyperparathyroidism & hypercalcemia of malignancy","Hypoparathyroidism","Hungry bone syndrome","Vit D deficiency"],"ans":0,"exp":"Seen in 1° hyperparathyroidism & hypercalcemia of malignancy (paraneoplastic). (Book p114)"},{"id":"SURG-C17-045","sec":"Hypercalcemic Crisis","page":114,"q":"Hypercalcemia of malignancy (paraneoplastic) in hypercalcemic crisis is classically seen with:","opts":["Squamous cell cancer, breast cancer, prostate cancer","Colon cancer only","Thyroid cancer","GIST"],"ans":0,"exp":"Hypercalcemia of malignancy (paraneoplastic syndrome): squamous cell cancer, breast cancer, prostate cancer. (Book p114)"},{"id":"SURG-C17-046","sec":"Hypercalcemic Crisis","page":114,"q":"Hypercalcemic crisis is a medical emergency defined by Ca2+:","opts":["> 14 mg/dl","> 10 mg/dl","> 8 mg/dl","> 20 mg/dl"],"ans":0,"exp":"Ca2+ > 14 mg/dl. (Book p114)"},{"id":"SURG-C17-047","sec":"Hypercalcemic Crisis","page":114,"q":"Symptoms of hypercalcemic crisis include all EXCEPT:","opts":["Hyperactivity","Confusion","Nausea & vomiting","Abdominal pain"],"ans":0,"exp":"Symptoms: confusion, nausea & vomiting, anuria, dehydration, abdominal pain. (Book p114)"},{"id":"SURG-C17-048","sec":"Hypercalcemic Crisis","page":114,"q":"ECG changes in hypercalcemic crisis are:","opts":["↑ PR interval, ↓ QT interval, arrhythmia","↓ PR interval, ↑ QT interval","Peaked T waves only","Widened QRS only"],"ans":0,"exp":"ECG changes: ↑ PR interval, ↓ QT interval, arrhythmia. (Book p114)"},{"id":"SURG-C17-049","sec":"Hypercalcemic Crisis","page":114,"q":"Ca2+ above what level causes cardiac arrest in hypercalcemic crisis?","opts":["> 16 mg/dl","> 14 mg/dl","> 12 mg/dl","> 20 mg/dl"],"ans":0,"exp":"Ca2+ > 16 mg/dl → cardiac arrest. (Book p114)"},{"id":"SURG-C17-050","sec":"Hypercalcemic Crisis","page":114,"q":"The first step in management of hypercalcemic crisis is:","opts":["Aggressive IV fluid therapy","IV calcium gluconate","Calcitonin","Dialysis"],"ans":0,"exp":"Aggressive IV fluid therapy: first step. (Book p114)"},{"id":"SURG-C17-051","sec":"Hypercalcemic Crisis","page":114,"q":"The diuretic used in hypercalcemic crisis management is:","opts":["Furosemide","Thiazide","Spironolactone","Acetazolamide"],"ans":0,"exp":"Diuretics: furosemide. (Book p114)"},{"id":"SURG-C17-052","sec":"Hypercalcemic Crisis","page":114,"q":"Bisphosphonates in hypercalcemic crisis (if RFT & urine output normal) act on the:","opts":["Osteoclast","Osteoblast","Chondrocyte","Fibroblast"],"ans":0,"exp":"Bisphosphonates if RFT & urine output are normal; acts on osteoclast; calcitonin added if zoledronic acid/denosumab is given. (Book p114)"},{"id":"SURG-C17-053","sec":"Hypercalcemic Crisis","page":114,"q":"Dialysis in hypercalcemic crisis is reserved for:","opts":["Failure of other methods","First-line use","Hypocalcemia","Routine use"],"ans":0,"exp":"Dialysis: if failure of other methods. (Book p114)"},{"id":"SURG-C17-054","sec":"Secondary Hyperparathyroidism","page":115,"q":"Secondary hyperparathyroidism is associated with:","opts":["PTH hyperplasia","PTH atrophy","Parathyroid carcinoma","Single adenoma"],"ans":0,"exp":"Associated with PTH hyperplasia. (Book p115)"},{"id":"SURG-C17-055","sec":"Secondary Hyperparathyroidism","page":115,"q":"The m/c cause of secondary hyperparathyroidism is:","opts":["Chronic renal failure","Vit D excess","Primary adenoma","Lithium withdrawal"],"ans":0,"exp":"Chronic renal failure (m/c). (Book p115)"},{"id":"SURG-C17-056","sec":"Secondary Hyperparathyroidism","page":115,"q":"In chronic renal failure, secondary hyperparathyroidism develops because of:","opts":["Failure of hydroxylation of vit D → ↓ vit D3 / ↓ S. Ca2+ → PTH hyperplasia","Excess calcitriol","↑ S. Ca2+","↑ phosphate excretion"],"ans":0,"exp":"Failure of hydroxylation of vit D → ↓ vit D3 / ↓ S. Ca2+ → PTH hyperplasia; reversible cause of 2° hyperPTH. (Book p115)"},{"id":"SURG-C17-057","sec":"Secondary Hyperparathyroidism","page":115,"q":"Other causes of secondary hyperparathyroidism include defective intestinal absorption, vit D3 deficiency and:","opts":["Lithium intake","Calcium excess","Thiazides","Radiation"],"ans":0,"exp":"Causes: defective intestinal absorption, lithium intake, vit D3 deficiency. (Book p115)"},{"id":"SURG-C17-058","sec":"Secondary Hyperparathyroidism","page":115,"q":"Investigations in secondary hyperparathyroidism show:","opts":["N/↓ S. Ca, ↑ S. phosphorous, ↓ calcitriol, ↑ PTH","↑ S. Ca, ↓ S. phosphorous","Normal PTH","↑ calcitriol"],"ans":0,"exp":"N/↓ S. Ca (total & ionized); ↑ S. phosphorous; ↓ calcitriol; ↑ PTH. (Book p115)"},{"id":"SURG-C17-059","sec":"Secondary Hyperparathyroidism","page":115,"q":"The mainstay of treatment of secondary hyperparathyroidism is:","opts":["Renal transplantation","Parathyroidectomy first-line","Calcium restriction","Thyroidectomy"],"ans":0,"exp":"Correction of chronic renal failure; renal transplantation: mainstay of Rx. (Book p115)"},{"id":"SURG-C17-060","sec":"Secondary Hyperparathyroidism","page":115,"q":"The calcimimetic used in secondary hyperparathyroidism is:","opts":["Cinacalcet","Calcitriol","Calcium carbonate","Furosemide"],"ans":0,"exp":"Cinacalcet: calcimimetics - acts on Ca2+ sensing receptors; ↓ requirement of Sx. (Book p115)"},{"id":"SURG-C17-061","sec":"Secondary Hyperparathyroidism","page":115,"q":"Which is TRUE for secondary hyperparathyroidism?","opts":["No localisation of gland is required; surgery = mx of hyperplasia","Sestamibi localisation is mandatory","Surgery removes only an adenoma","Vit D3 is contraindicated"],"ans":0,"exp":"No localisation of gland required; surgery: mx of hyperplasia; also vit D3 supplementation & low phosphate diet. (Book p115)"},{"id":"SURG-C17-062","sec":"Tertiary Hyperparathyroidism","page":115,"q":"Tertiary hyperparathyroidism is:","opts":["Persistent autonomous hypercalcemic hyperPTH post kidney transplant","HyperPTH before dialysis","HypoPTH post transplant","Ectopic PTH from the thymus"],"ans":0,"exp":"Causes: persistent autonomous hypercalcemic hyperPTH post kidney transplant. (Book p115)"},{"id":"SURG-C17-063","sec":"Tertiary Hyperparathyroidism","page":115,"q":"Investigations in tertiary hyperparathyroidism show:","opts":["↑ PTH, ↑ S. Ca2+, ↓ S. phosphate; USG neck confirms nodular enlargement","↓ PTH, ↓ S. Ca2+","Normal USG neck","↑ S. phosphate"],"ans":0,"exp":"↑ PTH; ↑ S. Ca2+; ↓ S. phosphate; USG neck: confirms nodular enlargement. (Book p115)"},{"id":"SURG-C17-064","sec":"Tertiary Hyperparathyroidism","page":115,"q":"Treatment of tertiary hyperparathyroidism is:","opts":["Subtotal parathyroidectomy (mainstay) or embolisation of gland","Total thyroidectomy","Calcitonin only","Observation only"],"ans":0,"exp":"Subtotal parathyroidectomy (mainstay); embolisation of gland. (Book p115)"},{"id":"SURG-C17-065","sec":"Miscellaneous: Calciphylaxis","page":115,"q":"Calciphylaxis (hypercalcemic uremic arteriopathy) is seen in:","opts":["Chronic dialysis","Acute asthma","Primary hyperparathyroidism","Pregnancy"],"ans":0,"exp":"Seen in chronic dialysis; hypercalcemic uremic arteriopathy. (Book p115)"},{"id":"SURG-C17-066","sec":"Miscellaneous: Calciphylaxis","page":115,"q":"Calciphylaxis causes Ca2+ deposition in skin, blood vessels & soft tissues leading to:","opts":["Gangrene, painful purpura, calcification in breast","Osteoporosis","Nephrolithiasis","Pancreatitis"],"ans":0,"exp":"Ca2+ deposition → a. gangrene b. painful purpura c. calcification in breast. (Book p115)"},{"id":"SURG-C17-067","sec":"Pseudohyperparathyroidism","page":116,"q":"Pseudohyperparathyroidism (AKA hypercalcemia of malignancy) is a:","opts":["PTHrp mediated paraneoplastic syndrome","PTH mediated endocrine state","Calcitonin mediated syndrome","Vit D mediated syndrome"],"ans":0,"exp":"AKA hypercalcemia of malignancy; paraneoplastic syndrome; PTH related peptide (PTHrp) mediated. (Book p116)"},{"id":"SURG-C17-068","sec":"Pseudohyperparathyroidism","page":116,"q":"Pseudohyperparathyroidism is m/c seen in:","opts":["Squamous cell carcinoma of lung","Renal cell carcinoma only","Colon cancer","Thyroid cancer"],"ans":0,"exp":"Seen in squamous cell carcinoma of lung (m/c), breast cancer, prostate cancer. (Book p116)"},{"id":"SURG-C17-069","sec":"Pseudohyperparathyroidism","page":116,"q":"Investigations in pseudohyperparathyroidism show:","opts":["↑ S. Ca, normal S. phosphorous, N/↓ calcitriol & PTH, ↑ PTHrp","↑ PTH","↓ S. Ca","↑ calcitriol"],"ans":0,"exp":"↑ S. Ca; normal S. phosphorous; N/↓ calcitriol, PTH; ↑ PTHrp. (Book p116)"},{"id":"SURG-C17-070","sec":"Pseudohyperparathyroidism","page":116,"q":"Management of pseudohyperparathyroidism is:","opts":["Same as hypercalcemic crisis","Subtotal parathyroidectomy","Cinacalcet only","Neck exploration"],"ans":0,"exp":"Same as hypercalcemic crisis. (Book p116)"},{"id":"SURG-C17-071","sec":"Parathyroid Cancer","page":116,"q":"Risk factors for parathyroid cancer are:","opts":["Radiation exposure & HRPT2 gene","Lithium intake","Vit D deficiency","MEN2B"],"ans":0,"exp":"Risk factors: radiation exposure; HRPT2 gene. (Book p116)"},{"id":"SURG-C17-072","sec":"Parathyroid Cancer","page":116,"q":"HPE of parathyroid cancer shows fibrous bands & vascular invasion; IHC shows inactivation of:","opts":["Parafibromin","Thyroglobulin","Calcitonin","Menin"],"ans":0,"exp":"HPE: fibrous bands & vascular invasion; IHC: inactivation of parafibromin. (Book p116)"},{"id":"SURG-C17-073","sec":"Parathyroid Cancer","page":116,"q":"The m/c cause of death in parathyroid cancer is:","opts":["Hypercalcemic crisis (arrhythmia)","Airway obstruction","Haemorrhage","Hypocalcemia"],"ans":0,"exp":"Features of hypercalcemia; hypercalcemic crisis (arrhythmia): m/c cause of death. (Book p116)"},{"id":"SURG-C17-074","sec":"Parathyroid Cancer","page":116,"q":"Management of parathyroid cancer is:","opts":["Surgery: R0 resection (microscopic clearance); octreotide & cinacalcet ↓ symptoms","Radioiodine ablation","FNAC ablation","Observation"],"ans":0,"exp":"Surgery: R0 resection (microscopic clearance); octreotide, cinacalcet → ↓ symptoms. (Book p116)"},{"id":"SURG-C17-075","sec":"Hypoparathyroidism & DiGeorge Syndrome","page":116,"q":"The m/c cause of hypoparathyroidism is:","opts":["Iatrogenic","DiGeorge syndrome","Autoimmune","Magnesium excess"],"ans":0,"exp":"1. Iatrogenic (m/c) 2. DiGeorge syndrome. (Book p116)"},{"id":"SURG-C17-076","sec":"Hypoparathyroidism & DiGeorge Syndrome"
