<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Surgery — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Surgery</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Surgery · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"SURG-C1-001","sec":"Consents","page":1,"q":"As per the book, consent before a procedure must contain all of the following components EXCEPT:","opts":["Identification and diagnosis","Description of the procedure","Patient-specific and procedure-specific complications","Blood group and routine labs"],"ans":3,"exp":"Components of consent = identification, diagnosis, planned procedure, surgeon, description, patient-specific complications, procedure-specific complications, benefits, alternate procedure and sign of patient, surgeon and witness. (Book p1)"},{"id":"SURG-C1-002","sec":"Consents","page":1,"q":"Which of the following is an explicit component of consent?","opts":["The surgeon performing the procedure","Hospital bed number","Anaesthetic equipment list","Insurance details"],"ans":0,"exp":"The planned procedure and the surgeon are explicit components of consent. (Book p1)"},{"id":"SURG-C1-003","sec":"Consents","page":1,"q":"A procedure-specific complication must be explained to the patient when its incidence is:","opts":["Greater than 1%","Greater than 5%","Greater than 10%","Greater than 20%"],"ans":0,"exp":"Procedure specific complications = any complication > 1% incidence. (Book p1)"},{"id":"SURG-C1-004","sec":"Consents","page":1,"q":"In addition to the planned procedure, consent must also discuss:","opts":["Benefits and alternate procedure","Hospital charges only","Ward amenities","Visiting timings"],"ans":0,"exp":"Consent includes benefits and the alternate procedure. (Book p1)"},{"id":"SURG-C1-005","sec":"Consents","page":1,"q":"The consent form is signed by:","opts":["Patient, surgeon and witness","Only the patient","Only the surgeon","Nurse and anaesthetist"],"ans":0,"exp":"Consent requires the sign of patient, surgeon and witness. (Book p1)"},{"id":"SURG-C1-006","sec":"IV Lines","page":1,"q":"In the color-coding of IV cannulas, the YELLOW cannula corresponds to gauge:","opts":["24G","22G","20G","18G"],"ans":0,"exp":"Yellow = 24G (max flow 13 (10) ml/min), the narrowest cannula in the chart. (Book p1)"},{"id":"SURG-C1-007","sec":"IV Lines","page":1,"q":"The BLUE IV cannula corresponds to gauge:","opts":["24G","22G","20G","14G"],"ans":1,"exp":"Blue = 22G with a maximal flow of 31 (30) ml/min. (Book p1)"},{"id":"SURG-C1-008","sec":"IV Lines","page":1,"q":"The PINK IV cannula corresponds to gauge:","opts":["20G","24G","16G","14G"],"ans":0,"exp":"Pink = 20G with a maximal flow of 67 (60) ml/min. (Book p1)"},{"id":"SURG-C1-009","sec":"IV Lines","page":1,"q":"The GREEN IV cannula corresponds to gauge:","opts":["18G","16G","14G","20G"],"ans":0,"exp":"Green = 18G with a maximal flow of 96 ml/min. (Book p1)"},{"id":"SURG-C1-010","sec":"IV Lines","page":1,"q":"The GRAY IV cannula corresponds to gauge:","opts":["16G","18G","14G","24G"],"ans":0,"exp":"Gray = 16G with a maximal flow of 236 (240 ml/min). (Book p1)"},{"id":"SURG-C1-011","sec":"IV Lines","page":1,"q":"The ORANGE IV cannula, which is used in shock, corresponds to gauge:","opts":["14G","16G","18G","22G"],"ans":0,"exp":"Orange (used in shock) = 14G, the widest cannula, with a maximal flow of 270 ml/min. (Book p1)"},{"id":"SURG-C1-012","sec":"IV Lines","page":1,"q":"The narrowest cannula in the color chart is:","opts":["24G yellow","16G gray","18G green","14G orange"],"ans":0,"exp":"The chart runs from narrow 24G (yellow) to wide 14G (orange). (Book p1)"},{"id":"SURG-C1-013","sec":"IV Lines","page":1,"q":"The widest cannula in the color chart is:","opts":["14G orange","16G gray","20G pink","22G blue"],"ans":0,"exp":"14G orange is the widest cannula and is the one used in shock. (Book p1)"},{"id":"SURG-C1-014","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 16G gray cannula is:","opts":["236 (240 ml/min)","96 ml/min","67 (60) ml/min","270 ml/min"],"ans":0,"exp":"Gray 16G maximal flow = 236 (240 ml/min). (Book p1)"},{"id":"SURG-C1-015","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 20G pink cannula is:","opts":["67 (60) ml/min","31 (30) ml/min","13 (10) ml/min","236 (240) ml/min"],"ans":0,"exp":"Pink 20G maximal flow = 67 (60) ml/min. (Book p1)"},{"id":"SURG-C1-016","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 14G orange cannula is:","opts":["270 ml/min","236 (240) ml/min","96 ml/min","67 (60) ml/min"],"ans":0,"exp":"Orange 14G (used in shock) has the highest maximal flow of 270 ml/min. (Book p1)"},{"id":"SURG-C1-017","sec":"IV Lines","page":1,"q":"In the color chart, which group of cannulas is bracketed for paediatric patients?","opts":["Yellow, blue and pink (24G, 22G, 20G)","Green, gray and orange","16G and 14G only","All gauges"],"ans":0,"exp":"Yellow (24G), blue (22G) and pink (20G) are grouped together for paediatric patients. (Book p1)"},{"id":"SURG-C1-018","sec":"IV Lines","page":1,"q":"A cannula with a maximal flow of 96 ml/min is color-coded:","opts":["Green (18G)","Blue (22G)","Yellow (24G)","Gray (16G)"],"ans":0,"exp":"Green = 18G with maximal flow 96 ml/min. (Book p1)"},{"id":"SURG-C1-019","sec":"IV Lines: Complications","page":1,"q":"The most common complication of an IV line is:","opts":["Superficial thrombophlebitis","Infiltration","Nerve injury","Arterial puncture"],"ans":0,"exp":"Superficial thrombophlebitis is the m/c complication of IV lines. (Book p1)"},{"id":"SURG-C1-020","sec":"IV Lines: Complications","page":1,"q":"Superficial thrombophlebitis at a cannulation site presents with:","opts":["Tender, cord-like swelling","Painless soft swelling","Bruising only","Systemic fever only"],"ans":0,"exp":"Features of superficial thrombophlebitis: tender, cord-like swelling. (Book p1)"},{"id":"SURG-C1-021","sec":"IV Lines: Complications","page":1,"q":"The management of superficial thrombophlebitis at a cannula site is:","opts":["Topical heparinoid","Systemic antibiotics","Emergent thrombectomy","Compression bandage only"],"ans":0,"exp":"Management of superficial thrombophlebitis = topical heparinoid. (Book p1)"},{"id":"SURG-C1-022","sec":"Surgical Safety Checklist","page":2,"q":"The three phases of the surgical safety checklist, in order, are:","opts":["Sign in → Time out → Sign out","Time out → Sign in → Sign out","Sign out → Sign in → Time out","Sign in → Sign out → Time out"],"ans":0,"exp":"The checklist flows Before induction of anaesthesia (sign in) → Before skin incision (time out) → Before patient leaves the operating room (sign out). (Book p2)"},{"id":"SURG-C1-023","sec":"Surgical Safety Checklist","page":2,"q":"'Before induction of anaesthesia' (ward to OT complex) corresponds to which phase?","opts":["Sign in","Time out","Sign out","Handover"],"ans":0,"exp":"Sign in happens before induction of anaesthesia, in the ward to OT complex. (Book p2)"},{"id":"SURG-C1-024","sec":"Surgical Safety Checklist","page":2,"q":"'Before skin incision' corresponds to which phase?","opts":["Time out","Sign in","Sign out","Check back"],"ans":0,"exp":"Time out is performed before skin incision. (Book p2)"},{"id":"SURG-C1-025","sec":"Surgical Safety Checklist","page":2,"q":"'Before patient leaves the operating room' corresponds to which phase?","opts":["Sign out","Sign in","Time out","Handover"],"ans":0,"exp":"Sign out is completed before the patient leaves the operating room. (Book p2)"},{"id":"SURG-C1-026","sec":"Surgical Safety Checklist","page":2,"q":"During sign in, the patient has confirmed all of the following EXCEPT:","opts":["Identity","Marked site","Procedure and written consent","Fasting status"],"ans":3,"exp":"At sign in the patient has confirmed identity, site (marked), procedure and written consent. (Book p2)"},{"id":"SURG-C1-027","sec":"Surgical Safety Checklist","page":2,"q":"Which of the following is checked during sign in?","opts":["Known allergies","Specimen labelling","Actual blood loss","Antibiotic prophylaxis"],"ans":0,"exp":"Sign in includes known allergies and the risk of >500 ml blood loss. (Book p2)"},{"id":"SURG-C1-028","sec":"Surgical Safety Checklist","page":2,"q":"During sign in, the risk of blood loss greater than how much is assessed?","opts":[">500 ml",">200 ml",">1000 ml",">100 ml"],"ans":0,"exp":"Sign in assesses the risk of >500 ml blood loss. (Book p2)"},{"id":"SURG-C1-029","sec":"Surgical Safety Checklist","page":2,"q":"During time out, the team confirms:","opts":["Patient site, procedure name and time","Allergies and consent","Specimen label","Sponge count"],"ans":0,"exp":"Time out confirms patient site, procedure name and time. (Book p2)"},{"id":"SURG-C1-030","sec":"Surgical Safety Checklist","page":2,"q":"At time out, antibiotic prophylaxis must have been given within the last:","opts":["30 minutes","10 minutes","60 minutes","2 hours"],"ans":0,"exp":"Time out checks that antibiotic prophylaxis was given within the last 30 min. (Book p2)"},{"id":"SURG-C1-031","sec":"Surgical Safety Checklist","page":2,"q":"During time out, the anticipated blood loss is estimated by the:","opts":["Surgeon","Anaesthetist","Nurse","Scrub technician"],"ans":0,"exp":"Anticipated blood loss at time out is given by the surgeon (actual loss at sign out is by the anaesthetist). (Book p2)"},{"id":"SURG-C1-032","sec":"Surgical Safety Checklist","page":2,"q":"During sign out, which of the following is verified?","opts":["Instruments, sponge and needle count","Written consent","Patient identity","Fasting status"],"ans":0,"exp":"Sign out verifies instruments, sponge and needle count. (Book p2)"},{"id":"SURG-C1-033","sec":"Surgical Safety Checklist","page":2,"q":"Specimen labelling during sign out must include:","opts":["Patient name","Only the specimen number","Hospital code","Ward number"],"ans":0,"exp":"Sign out includes specimen labelling (including patient name). (Book p2)"},{"id":"SURG-C1-034","sec":"Surgical Safety Checklist","page":2,"q":"During sign out, the actual blood loss is documented by the:","opts":["Anaesthetist","Surgeon","Nurse","Lab technician"],"ans":0,"exp":"Actual blood loss at sign out is recorded by the anaesthetist. (Book p2)"},{"id":"SURG-C1-035","sec":"Surgical Safety Checklist","page":2,"q":"The note on the surgical safety checklist states that:","opts":["There is no time in phase","Time out lasts exactly 5 minutes","Sign in takes 30 minutes","Sign out is optional"],"ans":0,"exp":"The book's note: 'There is no time in phase' — time out is a pause in workflow, not a timed interval. (Book p2)"},{"id":"SURG-C1-036","sec":"Estimating Blood Loss","page":2,"q":"The actual amount of blood loss is estimated as:","opts":["Blood in suction − irrigation fluid","Blood in suction + irrigation fluid","Dry mop weight − wet mop weight","Sponge count × 50 cc"],"ans":0,"exp":"Actual amount = blood in suction − irrigation fluid. (Book p2)"},{"id":"SURG-C1-037","sec":"Estimating Blood Loss","page":2,"q":"Alternatively, blood loss is estimated as:","opts":["Wet mop weight − dry mop weight","Wet mop weight + dry mop weight","Dry mop weight − wet mop weight","Irrigation fluid − suction"],"ans":0,"exp":"Blood loss can also be estimated as wet mop weight − dry mop weight. (Book p2)"},{"id":"SURG-C1-038","sec":"Estimating Blood Loss","page":2,"q":"A soaked mop represents a blood loss of:","opts":["100 cc","500 cc","200 cc","1000 cc"],"ans":0,"exp":"Soaked mop = 100 cc of blood. (Book p2)"},{"id":"SURG-C1-039","sec":"Estimating Blood Loss","page":2,"q":"A fist full of clots represents a blood loss of:","opts":["500 cc","100 cc","250 cc","1000 cc"],"ans":0,"exp":"Fist full of clots = 500 cc of blood. (Book p2)"},{"id":"SURG-C1-040","sec":"Estimating Blood Loss","page":2,"q":"Surgical mops carry a radio-opaque line so that they can be:","opts":["Picked up on X-ray","Weighed more easily","Sterilized faster","Identified by color"],"ans":0,"exp":"Mops have a radio-opaque line that is picked up on X-ray. (Book p2)"},{"id":"SURG-C1-041","sec":"OT Zoning","page":2,"q":"The four OT zones are:","opts":["Protective, clean, aseptic and disposal","Sterile, semi-sterile, dirty and waste","Core, buffer, outer and exit","OT, ICU, wards and entry"],"ans":0,"exp":"OT zoning = 1. Protective zone, 2. Clean zone, 3. Aseptic zone, 4. Disposal zone. (Book p2)"},{"id":"SURG-C1-042","sec":"OT Zoning","page":2,"q":"Which of the following belongs to the protective zone?","opts":["Change rooms, transfer bay, pre & post op rooms, ICU/PACU","Equipment store room","The operating theatre itself","Maintenance workshop"],"ans":0,"exp":"Protective zone = change rooms, transfer bay, pre & post op rooms and ICU/PACU. (Book p2)"},{"id":"SURG-C1-043","sec":"OT Zoning","page":2,"q":"The clean zone connects the protective zone to the:","opts":["Aseptic zone","Protective zone","Disposal zone","Ward"],"ans":0,"exp":"The clean zone connects the protective zone to the aseptic zone. (Book p2)"},{"id":"SURG-C1-044","sec":"OT Zoning","page":2,"q":"The equipment store room and maintenance workshop are in the:","opts":["Clean zone","Protective zone","Aseptic zone","Disposal zone"],"ans":0,"exp":"Clean zone = equipment store room and maintenance workshop. (Book p2)"},{"id":"SURG-C1-045","sec":"OT Zoning","page":2,"q":"The aseptic zone of the OT complex is the:","opts":["Operating theatre (OT)","Change room","ICU","Entry lobby"],"ans":0,"exp":"Aseptic zone = OT itself. (Book p2)"},{"id":"SURG-C1-046","sec":"OT Positions","page":3,"q":"The m/c position used for abdominal and breast surgeries is the:","opts":["Supine (neutral) position","Lithotomy position","Prone position","Fowler's position"],"ans":0,"exp":"Supine/neutral position is the m/c position used for abdominal and breast surgeries. (Book p3)"},{"id":"SURG-C1-047","sec":"OT Positions","page":3,"q":"The Trendelenberg position (head end low, foot end up) is used in:","opts":["Pelvic surgeries","Upper abdominal surgeries","Posterior cranial fossa surgery","Rectal cancer surgery"],"ans":0,"exp":"Trendelenberg position is used in pelvic surgeries. (Book p3)"},{"id":"SURG-C1-048","sec":"OT Positions","page":3,"q":"The reverse Trendelenberg position is used in:","opts":["Upper abdominal surgeries","Pelvic surgeries","Spinal surgery","Posterior cranial fossa surgery"],"ans":0,"exp":"Reverse Trendelenberg is used in upper abdominal surgeries and in laparoscopic cholecystometry with right side up. (Book p3)"},{"id":"SURG-C1-049","sec":"OT Positions","page":3,"q":"In laparoscopic cholecystectomy, reverse Trendelenberg is taken with the:","opts":["Right side up","Left side up","Head end down","Table level"],"ans":0,"exp":"Laparoscopic cholecystectomy uses reverse Trendelenberg with right side up. (Book p3)"},{"id":"SURG-C1-050","sec":"OT Positions","page":3,"q":"In laparoscopic cholecystectomy, CO2 collects below the right dome of the diaphragm, producing the m/c complication of:","opts":["Right shoulder tip pain","Left shoulder tip pain","Right leg pain","Neck pain"],"ans":0,"exp":"CO2 collects below the right dome of diaphragm → right shoulder tip pain, the m/c complication. (Book p3)"},{"id":"SURG-C1-051","sec":"OT Positions","page":3,"q":"Lithotomy position is used in all of the following EXCEPT:","opts":["Posterior cranial fossa surgery","Obstetric procedures","Gynecologic procedures","Hemorrhoid surgeries"],"ans":0,"exp":"Lithotomy is used for obstetric, gynecologic, urologic (TURP) and hemorrhoid surgeries — not posterior cranial fossa surgery. (Book p3)"},{"id":"SURG-C1-052","sec":"OT Positions","page":3,"q":"The urologic procedure performed in lithotomy position mentioned in the book is:","opts":["TURP","Nephrectomy","Pyelolithotomy","Laparoscopic cholecystectomy"],"ans":0,"exp":"Urologic procedures (TURP) are listed under the uses of lithotomy position. (Book p3)"},{"id":"SURG-C1-053","sec":"OT Positions","page":3,"q":"In lithotomy position, if the legs are not supported properly, the nerve commonly injured is the:","opts":["Common peroneal nerve","Femoral nerve","Obturator nerve","Sciatic nerve"],"ans":0,"exp":"Nerve injured if legs are not supported properly: common peroneal nerve. (Book p3)"},{"id":"SURG-C1-054","sec":"OT Positions","page":3,"q":"The lateral (kidney) position is NOT used for:","opts":["Hemorrhoid surgery","Nephrectomy","Thoracotomy","Pyelolithotomy"],"ans":0,"exp":"Lateral/kidney position uses: thoracotomy, pyelolithotomy, nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap). (Book p3)"},{"id":"SURG-C1-055","sec":"OT Positions","page":3,"q":"A breast reconstruction operation performed in the lateral (kidney) position uses the:","opts":["Latissimus dorsi flap","Rectus abdominis flap","DIEP flap","Omentum only"],"ans":0,"exp":"Breast reconstruction in the lateral position uses the latissimus dorsi flap. (Book p3)"},{"id":"SURG-C1-056","sec":"OT Positions","page":3,"q":"In the lateral (kidney) position, the increased risk of brachial plexus injury is due to:","opts":["Hyperextended arm","Compressed neck","Tight waist belt","Unsupported legs"],"ans":0,"exp":"Lateral position carries increased risk for brachial plexus injury d/t hyperextended arm. (Book p3)"},{"id":"SURG-C1-057","sec":"OT Positions","page":4,"q":"The prone position is used for:","opts":["Spinal surgery and pilonidal sinus surgery","Pelvic surgeries","Laparoscopic cholecystectomy","Rectal cancer surgery"],"ans":0,"exp":"Prone position uses: spinal surgery and pilonidal sinus surgery. (Book p4)"},{"id":"SURG-C1-058","sec":"OT Positions","page":4,"q":"The sitting / Fowler's position is used for:","opts":["Posterior cranial fossa surgery","Upper abdominal surgery","Spinal surgery","Hemorrhoid surgery"],"ans":0,"exp":"Sitting/Fowler's position is used for posterior cranial fossa surgery. (Book p4)"},{"id":"SURG-C1-059","sec":"OT Positions","page":4,"q":"An advantage of the sitting / Fowler's position is:","opts":["Bloodless field with reduced blood loss","No risk of air embolism","Better venous return","Easier ventilation"],"ans":0,"exp":"Advantages of Fowler's: ↓ blood loss (blood less field) and ↑ exposure. (Book p4)"},{"id":"SURG-C1-060","sec":"OT Positions","page":4,"q":"A disadvantage of the sitting / Fowler's position is:","opts":["Increased risk of air embolism","Increased blood loss","Worsened exposure","Loss of muscle relaxation"],"ans":0,"exp":"Disadvantage of sitting/Fowler's position: ↑ risk of air embolism. (Book p4)"},{"id":"SURG-C1-061","sec":"OT Positions","page":4,"q":"The jackknife position is:","opts":["Obsolete, previously used for hemorrhoid/fissure surgeries","The m/c position for abdominal surgery","Used for posterior cranial fossa surgery","Synonymous with lithotomy"],"ans":0,"exp":"Jackknife position = obsolete position, previously used for hemorrhoid fissure surgeries. (Book p4)"},{"id":"SURG-C1-062","sec":"OT Positions","page":4,"q":"A complication of the jackknife position is:","opts":["Positional asphyxia","Air embolism","Brachial plexus injury","Common peroneal nerve injury"],"ans":0,"exp":"Complication of the jackknife position = positional asphyxia. (Book p4)"},{"id":"SURG-C1-063","sec":"OT Positions","page":4,"q":"The Lloyd-Davis position is a combination of:","opts":["Trendelenberg + lithotomy","Prone + lithotomy","Fowler's + Trendelenberg","Lateral + prone"],"ans":0,"exp":"Lloyd-Davis position = Trendelenberg + lithotomy position. (Book p4)"},{"id":"SURG-C1-064","sec":"OT Positions","page":4,"q":"The Lloyd-Davis position is used in:","opts":["Rectal cancer surgery","Nephrectomy","Posterior cranial fossa surgery","Breast surgery"],"ans":0,"exp":"Lloyd-Davis position is used in rectal cancer surgery. (Book p4)"},{"id":"SURG-C1-065","sec":"Air Embolism","page":4,"q":"As per the book, how much air sucked into a vein enters circulation and dysregulates cardiac functioning?","opts":["50–100 cc","5–10 cc","500 cc","5000 cc"],"ans":0,"exp":"Air (50-100cc) sucked into vein → enters circulation → dysregulates cardiac functioning. (Book p4)"},{"id":"SURG-C1-066","sec":"Air Embolism","page":4,"q":"Air embolism is a risk in which of the following?","opts":["Thyroid/head and neck surgeries","Appendicectomies","Hernia repairs","Hemorrhoidectomies"],"ans":0,"exp":"Risk factors for air embolism: thyroid/head & neck surgeries and sitting/Fowler's position. (Book p4)"},{"id":"SURG-C1-067","sec":"Air Embolism","page":4,"q":"The m/c presenting feature of an air embolism is:","opts":["Sudden desaturation","Gradual cyanosis","High-grade fever","Bradycardia"],"ans":0,"exp":"Clinical features: sudden desaturation, dyspnea and hypotension. (Book p4)"},{"id":"SURG-C1-068","sec":"Air Embolism","page":4,"q":"Clinical features of air embolism include all of the following EXCEPT:","opts":["High-grade fever","Sudden desaturation","Dyspnea","Hypotension"],"ans":0,"exp":"Features = sudden desaturation, dyspnea, hypotension — fever is not listed. (Book p4)"},{"id":"SURG-C1-069","sec":"Air Embolism","page":5,"q":"To prevent air embolism in the Fowler's position, the vein should be:","opts":["Ligated before cutting","Cut first, then ligated","Dilated","Infiltrated with adrenaline"],"ans":0,"exp":"Prevention: 1. Ligate vein before cutting. (Book p5)"},{"id":"SURG-C1-070","sec":"Air Embolism","page":5,"q":"Air entry into the field is further prevented by:","opts":["Irrigating the field","Drying the field","Elevating the head","Covering the field"],"ans":0,"exp":"Prevention of air embolism in Fowler's position: ligate vein before cutting and irrigate field. (Book p5)"},{"id":"SURG-C1-071","sec":"Air Embolism","page":5,"q":"Management of an air embolism begins with placing the patient in the:","opts":["Durant position","Trendelenberg position","Fowler's position","Lithotomy position"],"ans":0,"exp":"Management starts with the Durant position, followed by aspiration of air. (Book p5)"},{"id":"SURG-C1-072","sec":"Air Embolism","page":5,"q":"The Durant position consists of:","opts":["Right side up (left lateral) + legs up","Left side up + legs down","Prone + Trendelenberg","Supine + Trendelenberg"],"ans":0,"exp":"Durant position = right side up (left lateral) + legs up. (Book p5)"},{"id":"SURG-C1-073","sec":"Air Embolism","page":5,"q":"After the Durant position, air is removed by:","opts":["Aspiration using direct puncture / central line","Pericardiocentesis","Emergent thoracotomy","Chest tube alone"],"ans":0,"exp":"Durant position is followed by aspirating air using direct puncture/central line. (Book p5)"},{"id":"SURG-C1-074","sec":"Air Embolism","page":5,"q":"The Durant position is used when:","opts":["Suspicion of air embolism is positive","The patient is bleeding into shock","The patient has a pneumothorax","The patient is post-extubation"],"ans":0,"exp":"The Durant position is used if suspicion of air embolism is (+). (Book p5)"},{"id":"SURG-C1-075","sec":"Events in Patient Safety","page":5,"q":"An adverse event is defined as:","opts":["An incident that results in harm to the patient","An incident that could have harmed the patient","An incident that never reaches the patient","A medication error only"],"ans":0,"exp":"Adverse event = an incident that results in harm to the patient. (Book p5)"},{"id":"SURG-C1-076","sec":"Events in Patient Safety","page":5,"q":"A near miss is an incident that:","opts":["Could have caused unwanted consequences but did not","Always causes harm","Reaches the patient and causes injury","Is intentional"],"ans":0,"exp":"Near miss = an incident that could have resulted in unwanted consequences but did not. (Book p5)"},{"id":"SURG-C1-077","sec":"Events in Patient Safety","page":5,"q":"A near miss is prevented from reaching the patient by:","opts":["Chance or timely intervention","Patient refusal","Hospital policy only","Depth of anaesthesia"],"ans":0,"exp":"A near miss does not reach the patient either by chance or through timely intervention. (Book p5)"},{"id":"SURG-C1-078","sec":"Events in Patient Safety","page":5,"q":"A no-harm event:","opts":["Reaches the patient but results in no injury","Never reaches the patient","Always causes permanent harm","Is by definition an adverse event"],"ans":0,"exp":"No-harm event = an incident that occurs and reaches the patient but results in no injury. (Book p5)"},{"id":"SURG-C1-079","sec":"Events in Patient Safety","page":5,"q":"In a no-harm event, harm is avoided by:","opts":["Chance or mitigating circumstances","Early surgery","Blood transfusion","Interventional radiology"],"ans":0,"exp":"In a no-harm event, harm is avoided by chance or due to mitigating circumstances. (Book p5)"},{"id":"SURG-C2-001","sec":"Blades","page":6,"q":"The use of surgical blades, as stated in the book, is to:","opts":["Make incisions","Control bleeding","Close wounds","Retract tissues"],"ans":0,"exp":"Uses: make Incisions. (Book p6)"},{"id":"SURG-C2-002","sec":"Blades","page":6,"q":"The sharpest part of a surgical blade is its:","opts":["Back edge","Slot","Belly","Shank"],"ans":2,"exp":"Belly of the blade: Sharpest. (Book p6)"},{"id":"SURG-C2-003","sec":"Blades","page":6,"q":"The No. 11 blade is described as a:","opts":["Curved blade","Pointed / stab blade","Broad spade blade","Hooked blade"],"ans":1,"exp":"No 11 Blade: Pointed/Stab blade. (Book p6)"},{"id":"SURG-C2-004","sec":"Blades","page":6,"q":"Incision and drainage (I & D) of an abscess is a listed use of the:","opts":["No. 12 blade","No. 10 blade","No. 11 blade","No. 22 blade"],"ans":2,"exp":"No 11 Blade uses: Incision & drainage (I & D) of abscess. (Book p6)"},{"id":"SURG-C2-005","sec":"Blades","page":6,"q":"Arteriotomy is a listed use of the:","opts":["No. 12 blade","No. 11 blade","No. 15 blade","No. 23 blade"],"ans":1,"exp":"No 11 Blade uses: I & D of abscess and Arteriotomy. (Book p6)"},{"id":"SURG-C2-006","sec":"Blades","page":6,"q":"The No. 12 blade is:","opts":["Straight","Pointed","Serrated","Curved"],"ans":3,"exp":"No 12 Blade: Curved. (Book p6)"},{"id":"SURG-C2-007","sec":"Blades","page":6,"q":"Suture removal is the listed use of the:","opts":["No. 12 blade","No. 11 blade","No. 10 blade","No. 15 blade"],"ans":0,"exp":"No 12 Blade uses: Suture removal. (Book p6)"},{"id":"SURG-C2-008","sec":"Blades","page":6,"q":"The book's Types of Blades diagram includes all of the following EXCEPT:","opts":["No. 10","No. 15","No. 20","No. 22"],"ans":2,"exp":"The diagram shows No. 10, 11, 15, 22, 23 and the curved No. 12 - there is no No. 20. (Book p6)"},{"id":"SURG-C2-009","sec":"Blade Handling","page":6,"q":"While passing, a blade is passed:","opts":["Hand to hand","On a sponge","In a kidney tray","In a gallipot"],"ans":2,"exp":"Passed in kidney tray / pointed end facing towards self. (Book p6)"},{"id":"SURG-C2-010","sec":"Blade Handling","page":6,"q":"While passing a blade, its pointed end faces:","opts":["Towards the surgeon","Upwards","Downwards","Towards self (the passer)"],"ans":3,"exp":"Passed in kidney tray / pointed end facing towards self. (Book p6)"},{"id":"SURG-C2-011","sec":"Blade Handling","page":6,"q":"Blades are mounted on the:","opts":["Mayo handle","BP (Bard Parker) handle","Kocher handle","Allis handle"],"ans":1,"exp":"Mounted on BP (Bard Parker) handle. (Book p6)"},{"id":"SURG-C2-012","sec":"Incisions","page":6,"q":"Skin incisions are made:","opts":["Parallel to skin","Perpendicular to skin","At 45 degrees to skin","Tangential to skin"],"ans":1,"exp":"Incisions: Perpendicular to skin. (Book p6)"},{"id":"SURG-C2-013","sec":"Incisions","page":6,"q":"An incision proceeds:","opts":["Far to near","Near to far","Left to right","Deep to superficial"],"ans":0,"exp":"Go far to Near. (Book p6)"},{"id":"SURG-C2-014","sec":"Incisions","page":6,"q":"Langer's lines are also called:","opts":["Relaxed pressure lines","Dermal grid lines","Relaxed tension lines","Collagen cleft lines"],"ans":2,"exp":"Langer's lines (Relaxed tension lines). (Book p6)"},{"id":"SURG-C2-015","sec":"Incisions","page":6,"q":"Langer's lines represent the orientation of:","opts":["Muscle fibres","Dermal collagen fibres","Cutaneous nerves","Subdermal vessels"],"ans":1,"exp":"Langer's lines: orientation of dermal collagen fibers. (Book p6)"},{"id":"SURG-C2-016","sec":"Incisions","page":6,"q":"An incision placed parallel to Langer's lines gives a:","opts":["Wide scar","Good scar","Hypertrophic scar","Contracted scar"],"ans":1,"exp":"Incision placed parallel: Good scar. (Book p6)"},{"id":"SURG-C2-017","sec":"Incisions","page":6,"q":"Muscle fibre action runs _____ to Langer's lines:","opts":["Parallel","Perpendicular","Oblique","Spiral"],"ans":1,"exp":"Muscle fibre action is perpendicular. (Book p6)"},{"id":"SURG-C2-018","sec":"Incisions","page":6,"q":"While planning an incision, one must avoid injury to:","opts":["Skin creases","Langer's lines","Anatomical structures","Scar tissue"],"ans":2,"exp":"Avoid injury to anatomical structures. (Book p6)"},{"id":"SURG-C2-019","sec":"Incisions","page":6,"q":"For a good cosmetic result, incisions are placed parallel to Langer's lines or:","opts":["Across skin creases","Over bony points","Through hair-bearing skin","Hidden in skin creases"],"ans":3,"exp":"Cosmetic factor: Parallel to Langer's lines / hidden in skin creases. (Book p6)"},{"id":"SURG-C2-020","sec":"Incisions","page":6,"q":"Which of the following is a factor while planning an incision?","opts":["Adequate access","Maximum length","Maximum depth","Avoiding Langer's lines"],"ans":0,"exp":"Factors while planning an incision include adequate access. (Book p6)"},{"id":"SURG-C2-021","sec":"Monopolar Cautery","page":7,"q":"In monopolar cautery, current flows from the machine to the:","opts":["Pad","Tip (Bovie tip)","Earth wire","Patient skin directly"],"ans":1,"exp":"Machine Current -> Tip (Bovie tip). (Book p7)"},{"id":"SURG-C2-022","sec":"Monopolar Cautery","page":7,"q":"The tip used in monopolar cautery is called the:","opts":["Bovie tip","Mayo tip","Ligasure tip","CUSA tip"],"ans":0,"exp":"Tip (Bovie tip). (Book p7)"},{"id":"SURG-C2-023","sec":"Monopolar Cautery","page":7,"q":"The correct order of the monopolar circuit is:","opts":["Machine -> Tip -> Cut/Coagulate -> Body -> Pad -> Machine","Machine -> Pad -> Body -> Tip -> Cut/Coagulate -> Machine","Tip -> Machine -> Pad -> Body -> Cut/Coagulate -> Tip","Machine -> Body -> Tip -> Pad -> Cut/Coagulate -> Machine"],"ans":0,"exp":"Circuit: machine -> Tip -> Cut/Coagulate -> to body -> Pad -> machine. (Book p7)"},{"id":"SURG-C2-024","sec":"Monopolar Cautery","page":7,"q":"The cautery handpiece carries buttons for:","opts":["Irrigation and suction","Cutting and coagulation","Cutting only","Coagulation only"],"ans":1,"exp":"The handpiece is labelled Coagulation and Cutting. (Book p7)"},{"id":"SURG-C2-025","sec":"Cautery Pad","page":7,"q":"The cautery pad is placed over a:","opts":["Bony prominence","Scarred area","Poorly perfused area","Well-vascularized area"],"ans":3,"exp":"Cautery pad: Placed over well-vascularized area. (Book p7)"},{"id":"SURG-C2-026","sec":"Cautery Pad","page":7,"q":"The cautery pad must have:","opts":["Point contact","Wide area of contact","Minimal contact","No direct skin contact"],"ans":1,"exp":"Have wide area of contact. (Book p7)"},{"id":"SURG-C2-027","sec":"Cautery Pad","page":7,"q":"A small cautery pad causes:","opts":["Faster cutting","Better coagulation","Burns at site","No effect"],"ans":2,"exp":"Small cautery pad: Burns at site. (Book p7)"},{"id":"SURG-C2-028","sec":"Cautery Pad","page":7,"q":"With no cautery pad, the circuit is incomplete and:","opts":["Only cutting works","Only coagulation works","Bipolar takes over","Monopolar will not work"],"ans":3,"exp":"No cautery pad: Circuit incomplete -> monopolar will not work. (Book p7)"},{"id":"SURG-C2-029","sec":"Monopolar Cautery","page":7,"q":"Lateral spread of current in monopolar cautery causes:","opts":["Thermal damage to nearby structures","Faster healing","Reduced bleeding elsewhere","Cooling of the field"],"ans":0,"exp":"Disadvantage: Lateral spread of current -> Thermal damage to nearby structures. (Book p7)"},{"id":"SURG-C2-030","sec":"Monopolar Cautery","page":7,"q":"Monopolar current interferes with:","opts":["Renal function","Hepatic blood flow","Cardiac conduction","Gut motility"],"ans":2,"exp":"Current interferes with cardiac conduction. (Book p7)"},{"id":"SURG-C2-031","sec":"Monopolar Cautery","page":7,"q":"Because it interferes with cardiac conduction, monopolar cautery is avoided in patients with:","opts":["Diabetes","Hypertension","Cardiac pacemakers","Asthma"],"ans":2,"exp":"Avoid in patients with cardiac pacemakers. (Book p7)"},{"id":"SURG-C2-032","sec":"Monopolar Cautery","page":7,"q":"Current applied over a pedicle undergoes:","opts":["Dissipation","Channelisation of current","Reflection","Absorption"],"ans":1,"exp":"Pedicle -> Channelisation of current. (Book p7)"},{"id":"SURG-C2-033","sec":"Monopolar Cautery","page":7,"q":"In a pedicle, the channelled current:","opts":["Stays at the tip","Returns directly to the machine","Spreads to the skin","Runs to base"],"ans":3,"exp":"Current runs to base. (Book p7)"},{"id":"SURG-C2-034","sec":"Monopolar Cautery","page":7,"q":"Monopolar cautery is avoided close to:","opts":["Large veins","End arteries","Skin surface","Fat planes"],"ans":1,"exp":"Avoid close to end arteries. (Book p7)"},{"id":"SURG-C2-035","sec":"Monopolar Cautery","page":7,"q":"The uses of monopolar cautery are:","opts":["Cutting and coagulation","Coagulation only","Cutting only","Vessel sealing only"],"ans":0,"exp":"Uses: Cutting and Coagulation. (Book p7)"},{"id":"SURG-C2-036","sec":"Monopolar Cautery","page":7,"q":"Monopolar cautery is avoided in all of the following EXCEPT:","opts":["CNS surgery","Parotid / Thyroid surgery","Ear lobule","Subcutaneous lipoma excision"],"ans":3,"exp":"Avoided in: CNS Sx, Parotid/Thyroid Sx, Ear lobule, Penile region, Patient with Pacemakers. (Book p7)"},{"id":"SURG-C2-037","sec":"Monopolar Cautery","page":7,"q":"Which of the following regions is listed for avoidance of monopolar cautery?","opts":["Abdominal wall","Thigh","Back","Penile region"],"ans":3,"exp":"Avoided in: CNS Sx, Parotid/Thyroid Sx, Ear lobule, Penile region, Patient with Pacemakers. (Book p7)"},{"id":"SURG-C2-038","sec":"Monopolar Cautery","page":7,"q":"Parotid / Thyroid surgery appears i y"],"ans":2,"exp":"Blend mode: Combination of cutting & coagulation mode. (Book p8)"},{"id":"SURG-C2-046","sec":"Currents","page":8,"q":"The coagulation mode is a:","opts":["Low voltage, continuous current","High voltage, alternating current","Low voltage, direct current","High voltage, direct current"],"ans":1,"exp":"Coagulation mode: High voltage, alternating current. (Book p8)"},{"id":"SURG-C2-047","sec":"Currents","page":8,"q":"Fulguration mode is:","opts":["A cutting mode","A type of coagulation with higher voltage peaks","A blend of two cutting modes","An ultrasonic mode"],"ans":1,"exp":"Fulguration mode: Type of coagulation with higher voltage peaks. (Book p8)"},{"id":"SURG-C2-048","sec":"Currents","page":8,"q":"The fulguration waveform is labelled with:","opts":["Peak voltage and average voltage","Current and resistance","Frequency and wavelength","Power and energy"],"ans":0,"exp":"Fulguration waveform labels Peak voltage and Average voltage. (Book p8)"},{"id":"SURG-C2-049","sec":"Currents","page":8,"q":"Cutting current acts by heat causing:","opts":["Dehydration + protein denaturation","Slow desiccation","Cell water explosion","Protein cross-linking only"],"ans":2,"exp":"Cutting current: Heat -> Cell water explosion. (Book p8)"},{"id":"SURG-C2-050","sec":"Currents","page":8,"q":"Coagulation current causes:","opts":["Cell water explosion","Dehydration + protein denaturation","Slow vaporization","Tissue freezing"],"ans":1,"exp":"Coagulation current: Dehydration + Protein Denaturation. (Book p8)"},{"id":"SURG-C2-051","sec":"Currents","page":8,"q":"Dehydration + protein denaturation by coagulation current leads to:","opts":["Cell swelling","Cell division","Cell repair","Cell death"],"ans":3,"exp":"Dehydration + Protein Denaturation -> Cell death. (Book p8)"},{"id":"SURG-C2-052","sec":"Ligasure","page":8,"q":"Ligasure works by:","opts":["Ultrasound alone","Cold + pressure","Heat + pressure","Microwaves"],"ans":2,"exp":"Ligasure: Heat + pressure. (Book p8)"},{"id p":"Nylon/Ethilon: monofilament suture. (Book p16)"},{"id":"SURG-C3-122","sec":"Synthetic Non-absorbable","page":16,"q":"Nylon is used as a:","opts":["Bowel suture","Skin suture","CBD suture","Bladder suture"],"ans":1,"exp":"Nylon uses: Skin suture; Cataract Sx: 10-0; Nerve & tendon repair. (Book p16)"},{"id":"SURG-C3-123","sec":"Synthetic Non-absorbable","page":16,"q":"Cataract surgery uses nylon as:","opts":["2-0","6-0","10-0","No 1"],"ans":2,"exp":"Nylon uses: Cataract Sx: 10-0. (Book p16)"},{"id":"SURG-C3-124","sec":"Synthetic Non-absorbable","page":16,"q":"Nerve and tendon repair is a listed use of:","opts":["Catgut","Nylon/Ethilon","Vicryl rapide","Steel"],"ans":1,"exp":"Nylon uses: Nerve & tendon repair. (Book p16)"},{"id":"SURG-C3-125","sec":"Synthetic Non-absorbable","page":16,"q":"Steel suture is used for:","opts":["Sternotomy incision following CABG","Skin closure","Bowel anastomosis","Cataract Sx"],"ans":0,"exp":"Steel suture uses: Sternotomy incision following CABG. (Book p16)"},{"id":"SURG-C3-126","sec":"Synthetic Non-absorbable","page":16,"q":"Polyester/Ethibond is used for the:","opts":["Skin","CBD","Rectus sheath","Cornea"],"ans":2,"exp":"Polyester/Ethibond uses: Rectus sheath; Tendon repair. (Book p16)"},{"id":"SURG-C3-127","sec":"Synthetic Non-absorbable","page":16,"q":"Tendon repair is a listed use of:","opts":["Polyester/Ethibond","Catgut","Vicryl rapide","Steel suture"],"ans":0,"exp":"Polyester/Ethibond uses: Rectus sheath; Tendon repair. (Book p16)"},{"id":"SURG-C3-128","sec":"Synthetic Non-absorbable","page":16,"q":"Polybutester is used for:","opts":["Plastic Sx (Rarely used)","Hernia mesh","Sternotomy closure","Bowel anastomosis"],"ans":0,"exp":"Polybutester uses: Plastic Sx (Rarely used). (Book p16)"},{"id":"SURG-C3-129","sec":"Suture Removal","page":17,"q":"Suture removal timings apply to:","opts":["Absorbable sutures","Non-absorbable sutures","All sutures","Staples only"],"ans":1,"exp":"Suture removal: For non-absorbable sutures. (Book p17)"},{"id":"SURG-C3-130","sec":"Suture Removal","page":17,"q":"Scalp sutures are removed in:","opts":["3-5 days","5-7 days","10-12 days","12-14 days"],"ans":1,"exp":"Suture removal: Scalp: 5-7 days. (Book p17)"},{"id":"SURG-C3-131","sec":"Suture Removal","page":17,"q":"Face sutures are removed in:","opts":["3-5 days (Earliest)","5-7 days","10-12 days","12-14 days"],"ans":0,"exp":"Suture removal: Face: 3-5 days (Earliest). (Book p17)"},{"id":"SURG-C3-132","sec":"Suture Removal","page":17,"q":"Neck sutures are removed in:","opts":["3-5 days","5-7 days","10-12 days","12-14 days"],"ans":1,"exp":"Suture removal: Neck: 5-7 days. (Book p17)"},{"id":"SURG-C3-133","sec":"Suture Removal","page":17,"q":"Thorax sutures are removed in:","opts":["3-5 days","5-7 days","10-12 days","12-14 days"],"ans":2,"exp":"Suture removal: Thorax: 10-12 days. (Book p17)"},{"id":"SURG-C3-134","sec":"Suture Removal","page":17,"q":"Abdominal sutures are removed in:","opts":["3-5 days","5-7 days","10-12 days","12-14 days"],"ans":3,"exp":"Suture removal: Abdomen: 12-14 days. (Book p17)"},{"id":"SURG-C3-135","sec":"Suture Removal","page":17,"q":"Perineal sutures are removed in:","opts":["3-5 days","5-7 days","10-12 days","12-14 days"],"ans":2,"exp":"Suture removal: Perineum: 10-12 days. (Book p17)"},{"id":"SURG-C3-136","sec":"Suture Removal","page":17,"q":"The earliest suture removal is from the:","opts":["Scalp","Face (3-5 days)","Abdomen","Thorax"],"ans":1,"exp":"Suture removal: Face: 3-5 days (Earliest). (Book p17)"},{"id":"SURG-C3-137","sec":"Bowel Anastomosis","page":17,"q":"Bowel anastomosis requires:","opts":["Everted edges","Inverted edges","Gaped edges","Overlapping edges"],"ans":1,"exp":"Bowel anastomosis: Inverted Edges; Strongest layer: Submucosa. (Book p17)"},{"id":"SURG-C3-138","sec":"Bowel Anastomosis","page":17,"q":"The strongest layer of the bowel wall is the:","opts":["Serosa","Mucosa","Submucosa","Muscle"],"ans":2,"exp":"Bowel anastomosis: Strongest layer: Submucosa. (Book p17)"},{"id":"SURG-C3-139","sec":"Bowel Anastomosis","page":17,"q":"The book states that the result is ___ despite the technique used:","opts":["Different","Same","Better with staplers","Worse with sutures"],"ans":1,"exp":"Techniques: Same result despite technique used. (Book p17)"},{"id":"SURG-C3-140","sec":"Bowel Anastomosis","page":17,"q":"Single layer bowel repair is:","opts":["Seromuscular repair","Extramucosal repair","Full thickness repair","Stapled repair"],"ans":1,"exp":"Single layer: Extramucosal repair. (Book p17)"},{"id":"SURG-C3-141","sec":"Bowel Anastomosis","page":17,"q":"In the anastomosis diagrams, 'S/m' denotes the:","opts":["Serosa","Mucosa","Submucosa","Muscle"],"ans":2,"exp":"Diagram key: S: Serosa; m: mucosa; S/m: Submucosa; muscle. (Book p17)"},{"id":"SURG-C3-142","sec":"Bowel Anastomosis","page":17,"q":"The Albert layer is:","opts":["Outer seromuscular interrupted nonabsorbable suture","Inner continuous absorbable suture with stitching of all layers","Single extramucosal layer","Stapled layer"],"ans":1,"exp":"2 layer: inner continuous absorbable suture with stitching of all layers: Albert layer. (Book p17)"},{"id":"SURG-C3-143","sec":"Bowel Anastomosis","page":17,"q":"The Lembert layer is:","opts":["Inner continuous absorbable suture of all layers","Outer seromuscular interrupted nonabsorbable suture","Single extramucosal layer","Stapled layer"],"ans":1,"exp":"2 layer: outer seromuscular interrupted nonabsorbable suture: Lembert layer. (Book p17)"},{"id":"SURG-C3-144","sec":"Bowel Anastomosis","page":17,"q":"Side-to-side anastomosis is a listed use of the:","opts":["Circular stapler","Linear stapler","Purse string suture","Lock suture"],"ans":1,"exp":"Linear stapler uses: Side-to-side anastomosis; Sleeve gastrectomy; Zenker's diverticulum. (Book p17)"},{"id":"SURG-C3-145","sec":"Bowel Anastomosis","page":17,"q":"Sleeve gastrectomy (bariatric Sx) uses a:","opts":["Circular stapler","Linear stapler","Purse string suture","Barbed suture"],"ans":1,"exp":"Linear stapler uses: Sleeve gastrectomy (Bariatric Sx). (Book p17)"},{"id":"SURG-C3-146","sec":"Bowel Anastomosis","page":17,"q":"Zenker's diverticulum surgery uses a:","opts":["Circular stapler","Linear stapler","Purse string suture","Far-near-near-far suture"],"ans":1,"exp":"Linear stapler uses: Zenker's diverticulum. (Book p17)"},{"id":"SURG-C3-147","sec":"Bowel Anastomosis","page":17,"q":"Stapler hemorrhoidopexy (hemorrhoid repair) uses a:","opts":["Linear stapler","Circular stapler","Purse string suture","Lock suture"],"ans":1,"exp":"Circular stapler uses: Stapler hemorrhoidopexy: Hemorrhoid repair. (Book p17)"},{"id":"SURG-C3-148","sec":"Bowel Anastomosis","page":17,"q":"LAR (low anterior resection) for sigmoid colon cancer surgery uses a:","opts":["Linear stapler","Circular stapler","Purse string suture","Subcuticular suture"],"ans":1,"exp":"Circular stapler uses: LAR (Low anterior resection): Sigmoid colon cancer Sx. (Book p17)"},{"id":"SURG-C3-149","sec":"Bowel Anastomosis","page":17,"q":"Cheatle's slit is a:","opts":["Transverse cut on mesenteric border","Longitudinal split along anti mesenteric border","Circular stapler line","Seromuscular bite"],"ans":1,"exp":"Cheatle's slit: Longitudinal split along anti mesenteric border -> Enlarges lumen. (Book p17)"},{"id":"SURG-C3-150","sec":"Bowel Anastomosis","page":17,"q":"Cheatle's slit enlarges the lumen for:","opts":["Side-to-side anastomosis","End-to-end anastomosis","Stapler firing","Stoma creation"],"ans":1,"exp":"Cheatle's slit: Enlarges lumen for end-to-end anastomosis. (Book p17)"},{"id":"SURG-C3-151","sec":"Bowel Anastomosis","page":17,"q":"The Connel loop is taken at the edge of the anastomosis and ensures:","opts":["Hemostasis","Bowel inversion","Eversion","Lumen enlargement"],"ans":1,"exp":"Connel loop: Taken at edge of anastomosis -> Ensures bowel inversion. (Book p17)"}];
const UNITS = [{"id":"SURG-U1-1","ch":1,"n":1,"title":"Consents: Components & Signatures","sec":"Consents · p1","qs":["SURG-C1-001","SURG-C1-002","SURG-C1-003","SURG-C1-004","SURG-C1-005"],"guide":"A valid consent covers identification, diagnosis, the planned procedure, the surgeon, description, patient-specific and procedure-specific complications (any complication >1% incidence), benefits and the alternate procedure — signed by patient, surgeon and witness."},{"id":"SURG-U1-2","ch":1,"n":2,"title":"IV Lines: Color-Coding of Cannulas","sec":"IV Lines · p1","qs":["SURG-C1-006","SURG-C1-007","SURG-C1-008","SURG-C1-009","SURG-C1-010","SURG-C1-011","SURG-C1-012","SURG-C1-013","SURG-C1-014","SURG-C1-015","SURG-C1-016","SURG-C1-017","SURG-C1-018"],"guide":"From narrow to wide: yellow 24G (13/10 ml/min), blue 22G (31/30), pink 20G (67/60), green 18G (96), gray 16G (236/240) and orange 14G (270) — the orange 14G is the shock cannula. The 24G/22G/20G trio is bracketed for paediatric patients."},{"id":"SURG-U1-3","ch":1,"n":3,"title":"IV Lines: Superficial Thrombophlebitis","sec":"IV Lines: Complications · p1","qs":["SURG-C1-019","SURG-C1-020","SURG-C1-021"],"guide":"The m/c IV complication is superficial thrombophlebitis — a tender, cord-like swelling at the cannulation site, managed with a topical heparinoid."},{"id":"SURG-U1-4","ch":1,"n":4,"title":"Safety Checklist: Phases & Sign In","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-022","SURG-C1-023","SURG-C1-024","SURG-C1-025","SURG-C1-026","SURG-C1-027","SURG-C1-028"],"guide":"The checklist runs sign in (before induction of anaesthesia, ward to OT complex) → time out (before skin incision) → sign out (before the patient leaves the OT). Sign in confirms identity, marked site, procedure, written consent, known allergies and risk of >500 ml blood loss."},{"id":"SURG-U1-5","ch":1,"n":5,"title":"Safety Checklist: Time Out & Sign Out","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-029","SURG-C1-030","SURG-C1-031","SURG-C1-032","SURG-C1-033","SURG-C1-034","SURG-C1-035"],"guide":"Time out confirms patient site, procedure name and time, checks antibiotic prophylaxis within the last 30 min and the surgeon's anticipated blood loss. Sign out verifies instruments/sponge/needle count, specimen labelling with patient name and the anaesthetist's actual blood loss — and the book's note: there is no time in phase."},{"id":"SURG-U1-6","ch":1,"n":6,"title":"Estimating Blood Loss","sec":"Estimating Blood Loss · p2","qs":["SURG-C1-036","SURG-C1-037","SURG-C1-038","SURG-C1-039","SURG-C1-040"],"guide":"Actual blood loss = blood in suction − irrigation fluid, or wet mop weight − dry mop weight. A soaked mop holds 100 cc, a fist full of clots 500 cc, and mops carry a radio-opaque line so they are picked up on X-ray."},{"id":"SURG-U1-7","ch":1,"n":7,"title":"OT Zoning: The Four Zones","sec":"OT Zoning · p2","qs":["SURG-C1-041","SURG-C1-042","SURG-C1-043","SURG-C1-044","SURG-C1-045"],"guide":"The OT complex flows through four zones: protective (change rooms, transfer bay, pre & post op rooms, ICU/PACU), clean (equipment store room, maintenance workshop — connecting protective to aseptic), aseptic (the OT itself) and disposal."},{"id":"SURG-U1-8","ch":1,"n":8,"title":"OT Positions: Supine, Trendelenberg & Reverse Trendelenberg","sec":"OT Positions · p3","qs":["SURG-C1-046","SURG-C1-047","SURG-C1-048","SURG-C1-049","SURG-C1-050"],"guide":"Supine/neutral is the m/c position for abdominal and breast surgeries. Trendelenberg (head low, feet up) serves pelvic surgery; reverse Trendelenberg with right side up is used in laparoscopic cholecystectomy, where CO2 pools under the right diaphragm dome and causes right shoulder tip pain — its m/c complication."},{"id":"SURG-U1-9","ch":1,"n":9,"title":"OT Positions: Lithotomy & Lateral (Kidney)","sec":"OT Positions · p3","qs":["SURG-C1-051","SURG-C1-052","SURG-C1-053","SURG-C1-054","SURG-C1-055","SURG-C1-056"],"guide":"Lithotomy serves obstetric, gynecologic, urologic (TURP) and hemorrhoid procedures — with the common peroneal nerve at risk if legs are poorly supported. Lateral/kidney position covers thoracotomy, pyelo/nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap), risking brachial plexus injury from a hyperextended arm."},{"id":"SURG-U1-10","ch":1,"n":10,"title":"OT Positions: Prone, Fowler's, Jackknife & Lloyd-Davis","sec":"OT Positions · p4","qs":["SURG-C1-057","SURG-C1-058","SURG-C1-059","SURG-C1-060","SURG-C1-061","SURG-C1-062","SURG-C1-063","SURG-C1-064"],"guide":"Prone is for spinal and pilonidal sinus surgery. Sitting/Fowler's exposes the posterior cranial fossa in a bloodless field but invites air embolism. Jackknife — once used for hemorrhoid/fissure surgery — is obsolete, killing by positional asphyxia. Lloyd-Davis = Trendelenberg + lithotomy, the rectal cancer position."},{"id":"SURG-U1-11","ch":1,"n":11,"title":"Air Embolism: Features, Prevention & Management","sec":"Air Embolism · p4","qs":["SURG-C1-065","SURG-C1-066","SURG-C1-067","SURG-C1-068","SURG-C1-069","SURG-C1-070","SURG-C1-071","SURG-C1-072","SURG-C1-073","SURG-C1-074"],"guide":"50-100 cc of air sucked into a vein dysregulates cardiac function; watch for it in thyroid/head & neck surgery and in Fowler's position. Sudden desaturation, dyspnea and hypotension are the clues — prevent by ligating the vein before cutting and irrigating the field, and treat with the Durant position (right side up/left lateral + legs up) followed by aspiration via direct puncture/central line."},{"id":"SURG-U1-12","ch":1,"n":12,"title":"Events in Patient Safety","sec":"Events in Patient Safety · p5","qs":["SURG-C1-075","SURG-C1-076","SURG-C1-077","SURG-C1-078","SURG-C1-079"],"guide":"An adverse event harms the patient; a near miss could have but didn't (stopped by chance or timely intervention); a no-harm event reaches the patient without injury, harm dodged by chance or mitigating circumstances."},{"id":"SURG-U2-1","ch":2,"n":1,"title":"Types of Surgical Blades","sec":"Blades · p6","qs":["SURG-C2-001","SURG-C2-002","SURG-C2-003","SURG-C2-004","SURG-C2-005","SURG-C2-006","SURG-C2-007","SURG-C2-008"],"guide":"Blades exist to make incisions, and the belly is the sharpest part. The pointed No. 11 stab blade opens abscesses and arteries, while the curved No. 12 slips under sutures to remove them - with No. 10, 15, 22 and 23 completing the tray."},{"id":"SURG-U2-2","ch":2,"n":2,"title":"Blade Handling & the BP Handle","sec":"Blade Handling · p6","qs":["SURG-C2-009","SURG-C2-010","SURG-C2-011"],"guide":"Sharps travel safely in a kidney tray with the pointed end facing the passer, never the surgeon. Every blade clicks onto the familiar BP (Bard Parker) handle before it touches skin."},{"id":"SURG-U2-3","ch":2,"n":3,"title":"Incisions & Langer's Lines","sec":"Incisions · p6","qs":["SURG-C2-012","SURG-C2-013","SURG-C2-014","SURG-C2-015","SURG-C2-016","SURG-C2-017","SURG-C2-018","SURG-C2-019","SURG-C2-020"],"guide":"Cut perpendicular to skin, travelling far to near. Respect Langer's relaxed tension lines - the grain of dermal collagen - because parallel incisions heal into fine scars, hide in creases, spare anatomical structures and still give adequate access."},{"id":"SURG-U2-4","ch":2,"n":4,"title":"Monopolar Cautery: Circuit & Cautery Pad","sec":"Monopolar Cautery · p7","qs":["SURG-C2-021","SURG-C2-022","SURG-C2-023","SURG-C2-024","SURG-C2-025","SURG-C2-026","SURG-C2-027","SURG-C2-028"],"guide":"Current sprints from machine to Bovie tip, through tissue, body and pad, then home to the machine. That pad must sit broad on well-vascularized skin - shrink it and you burn the patient, skip it and monopolar simply will not work."},{"id":"SURG-U2-5","ch":2,"n":5,"title":"Monopolar Cautery: Hazards, Uses & Avoidance","sec":"Monopolar Cautery · p7","qs":["SURG-C2-029","SURG-C2-030","SURG-C2-031","SURG-C2-032","SURG-C2-033","SURG-C2-034","SURG-C2-035","SURG-C2-036","SURG-C2-037","SURG-C2-038"],"guide":"Monopolar cuts and coagulates, but its current wanders - scorching neighbours, confusing pacemakers and channelling down pedicles to their base. Keep it away from end arteries, the CNS, parotid and thyroid, the ear lobule, the penis and any paced heart."},{"id":"SURG-U2-6","ch":2,"n":6,"title":"Bipolar Cautery","sec":"Bipolar Cautery · p7","qs":["SURG-C2-039","SURG-C2-040","SURG-C2-041","SURG-C2-042","SURG-C2-043"],"guide":"Bipolar current hops between two prongs and finishes its circuit right there in the forceps tips. With no pad and no stray current, it coagulates safely beside vital structures and end arteries - but it only coagulates, never cuts."},{"id":"SURG-U2-7","ch":2,"n":7,"title":"Currents & Waveforms","sec":"Currents · p8","qs":["SURG-C2-044","SURG-C2-045","SURG-C2-046","SURG-C2-047","SURG-C2-048","SURG-C2-049","SURG-C2-050","SURG-C2-051"],"guide":"Low-voltage continuous waves slice by exploding cell water; high-voltage interrupted waves desiccate and denature protein until the cell dies. Blend mixes the two, while fulguration spikes the voltage peaks higher still."},{"id":"SURG-U2-8","ch":2,"n":8,"title":"Ligasure","sec":"Ligasure · p8","qs":["SURG-C2-052","SURG-C2-053","SURG-C2-054","SURG-C2-055","SURG-C2-056","SURG-C2-057"],"guide":"Ligasure squeezes vessels with heat plus pressure, melting the body's own collagen and elastin into a seal, then stops itself the instant the seal closes. A live feedback loop meters every joule - good till 7 mm, but keep it away from vital structures."},{"id":"SURG-U2-9","ch":2,"n":9,"title":"Harmonic Scalpel","sec":"Harmonic Scalpel · p8","qs":["SURG-C2-058","SURG-C2-059","SURG-C2-060","SURG-C2-061","SURG-C2-062","SURG-C2-063","SURG-C2-064"],"guide":"The harmonic blade shivers 2,000 to 50,000 times a second, denaturing protein and coagulating without heat. It carves precisely, even through scar and beside vital structures - at the price of patience, because it is slow."},{"id":"SURG-U2-10","ch":2,"n":10,"title":"CUSA & Thunderbeat S","sec":"CUSA · p9","qs":["SURG-C2-065","SURG-C2-066","SURG-C2-067","SURG-C2-068","SURG-C2-069","SURG-C2-070","SURG-C2-071"],"guide":"CUSA is a harmonic scalpel that crumbles watery hepatocytes for liver resection - happiest in a soft, non-cirrhotic liver - while sucking debris and even gases away. Thunderbeat S then marries Ligasure's sealing to the harmonic's cut in one jaw."},{"id":"SURG-U2-11","ch":2,"n":11,"title":"RFA & Microwave Ablation","sec":"RFA & Microwave · p9","qs":["SURG-C2-072","SURG-C2-073","SURG-C2-074","SURG-C2-075","SURG-C2-076","SURG-C2-077","SURG-C2-078","SURG-C2-079"],"guide":"RFA burns liver tumours up to 3 cm with high-frequency alternating current, grounding pad and all. Microwaves, humming between infra-red and radiowaves, need no pad, finish faster and leave a smooth homogenous kill zone."},{"id":"SURG-U3-1","ch":3,"n":1,"title":"Drains: Open, Closed, Romovac & Minivac","sec":"Drains · p10","qs":["SURG-C3-001","SURG-C3-002","SURG-C3-003","SURG-C3-004","SURG-C3-005","SURG-C3-006","SURG-C3-007","SURG-C3-008","SURG-C3-009"],"guide":"Open drains are obsolete museum pieces that stain a soak dressing, while closed drains empty into a container or bag. Romovac - a closed negative-pressure system for mastectomy, thyroidectomy and neck dissection - must never enter the abdomen, where its rounded tip risks perforation; the tiny minivac instead follows sentinel node biopsy."},{"id":"SURG-U3-2","ch":3,"n":2,"title":"Drains: Jackson Pratt, Abdominal & Underwater Seal","sec":"Drains · p10","qs":["SURG-C3-010","SURG-C3-011","SURG-C3-012","SURG-C3-013","SURG-C3-014","SURG-C3-015","SURG-C3-016","SURG-C3-017","SURG-C3-018"],"guide":"The Jackson Pratt pairs a squeezable bulb with flat tubes that slide safely into the abdomen, unlike the rounded Romovac. A plain abdominal drain is closed but pressure-free, while chest tubes bubble through an underwater seal whose submerged tip bars air from being sucked in."},{"id":"SURG-U3-3","ch":3,"n":3,"title":"Knot Types: Reef, Granny & Surgeon's","sec":"Knots · p11","qs":["SURG-C3-019","SURG-C3-020","SURG-C3-021","SURG-C3-022","SURG-C3-023","SURG-C3-024","SURG-C3-025","SURG-C3-026"],"guide":"The reef (square) knot - one square throw on another with matching crossings - is the most basic knot in surgery. Cross the throws oppositely and you get a granny or slip knot that opens up, while the surgeon's knot doubles the first throw for extra grip before a single locking throw."},{"id":"SURG-U3-4","ch":3,"n":4,"title":"Skin Suturing & Principles","sec":"Skin Suturing · p11","qs":["SURG-C3-027","SURG-C3-028","SURG-C3-029","SURG-C3-030"],"guide":"Skin heals kindest when its edges are everted and the needle bites at a full 90 degrees. The geometry is simple arithmetic: take a bite of x on each side and space the sutures 2x apart."},{"id":"SURG-U3-5","ch":3,"n":5,"title":"Suture Types: Simple, Mattress & Subcuticular","sec":"Suture Types · p12","qs":["SURG-C3-031","SURG-C3-032","SURG-C3-033","SURG-C3-034","SURG-C3-035","SURG-C3-036","SURG-C3-037","SURG-C3-038"],"guide":"Simple sutures fail to evert, but mattress sutures evert and staunch bleeding - vertical at two depths, horizontal at one depth with the least cut-through. When scars must vanish, a 3-0 monocryl on a cutting needle runs hidden beneath the skin in a mark-free subcuticular line."},{"id":"SURG-U3-6","ch":3,"n":6,"title":"Other Sutures: Lock & Purse String","sec":"Other Sutures · p12","qs":["SURG-C3-039","SURG-C3-040","SURG-C3-041","SURG-C3-042","SURG-C3-043","SURG-C3-044"],"guide":"A continuous suture closes with an Aberdeen's or Cobbler's knot, and locking each loop spreads tension evenly along the wound. The purse string instead cinches like a drawstring - burying the appendicular stump or encircling the cervix."},{"id":"SURG-U3-7","ch":3,"n":7,"title":"Far-Near-Near-Far & Shoe String","sec":"Special Sutures · p13","qs":["SURG-C3-045","SURG-C3-046","SURG-C3-047","SURG-C3-048","SURG-C3-049"],"guide":"The far-near-near-far stitch collapses and obliterates a large dead cavity in one pass. Fasciotomy wounds instead close slowly with the shoe string technique - gradual tightening that heals by tertiary intention, a delayed primary closure."},{"id":"SURG-U3-8","ch":3,"n":8,"title":"Needles: Round Body vs Cutting","sec":"Needles · p13","qs":["SURG-C3-050","SURG-C3-051","SURG-C3-052","SURG-C3-053","SURG-C3-054","SURG-C3-055","SURG-C3-056","SURG-C3-057","SURG-C3-058","SURG-C3-059"],"guide":"Round-bodied needles split tissue atraumatically, gliding through the delicate B's - bowel, bladder, blood vessels and CBD. Cutting and reverse-cutting needles slice through the tough S's - sheath, skin and fascia - at the price of greater trauma."},{"id":"SURG-U3-9","ch":3,"n":9,"title":"Needle Parts, Color Codes & Numbering","sec":"Suture Coding · p13","qs":["SURG-C3-060","SURG-C3-061","SURG-C3-062","SURG-C3-063","SURG-C3-064","SURG-C3-065","SURG-C3-066","SURG-C3-067","SURG-C3-068","SURG-C3-069","SURG-C3-070","SURG-C3-071","SURG-C3-072"],"guide":"Every needle runs from point through a two-thirds shaft to a one-third swaged end that carries the suture, gripped by a needle holder. Colors speak instantly - brown catgut, violet vicryl, blue prolene, black silk - while numbers whisper finesse: No. 1 is thickest and 11-0 the finest."},{"id":"SURG-U3-10","ch":3,"n":10,"title":"Suture Classification","sec":"Classification · p14","qs":["SURG-C3-073","SURG-C3-074","SURG-C3-075","SURG-C3-076","SURG-C3-077","SURG-C3-078","SURG-C3-079","SURG-C3-080","SURG-C3-081","SURG-C3-082","SURG-C3-083","SURG-C3-084","SURG-C3-085","SURG-C3-086","SURG-C3-087"],"guide":"Natural sutures like silk and catgut are antigenic, provoke strong inflammation and dissolve by proteolysis. Synthetic sutures - prolene, PDS, vicryl - stay inert and dissolve by hydrolysis, with synthetic non-absorbables the most inert of all; monofilaments handle stiffly with strong memory while braids handle sweetly but invite infection."},{"id":"SURG-U3-11","ch":3,"n":11,"title":"Natural Absorbable: Catgut","sec":"Natural Absorbable · p15","qs":["SURG-C3-088","SURG-C3-089","SURG-C3-090","SURG-C3-091"],"guide":"Plain catgut - sheep gut submucosa - vanishes by phagocytosis within 7 to 10 days. Chromic tanning stretches its tensile strength to 21-28 days and full absorption to 90 days."},{"id":"SURG-U3-12","ch":3,"n":12,"title":"Synthetic Absorbable: Monocryl, Vicryl & PDS","sec":"Synthetic Absorbable · p15","qs":["SURG-C3-092","SURG-C3-093","SURG-C3-094","SURG-C3-095","SURG-C3-096","SURG-C3-097","SURG-C3-098","SURG-C3-099","SURG-C3-100","SURG-C3-101","SURG-C3-102","SURG-C3-103","SURG-C3-104","SURG-C3-105","SURG-C3-106","SURG-C3-107","SURG-C3-108","SURG-C3-109"],"guide":"Monofilament monocryl runs subcuticular lines on cutting needles, while braided vicryl holds CBD, bowel and bladder on round-bodied needles for 60-90 days - with triclosan-coated, barbed and rapide avatars. PDS outlasts them all at 180 days and even repairs the tracheobronchial tree."},{"id":"SURG-U3-13","ch":3,"n":13,"title":"Silk: Natural Non-absorbable","sec":"Silk · p16","qs":["SURG-C3-110","SURG-C3-111","SURG-C3-112","SURG-C3-113","SURG-C3-114"],"guide":"Silk - black, braided, spun by silkworms - closes skin with 2-0 or 3-0 on cutting needles, anchors drains with stout No. 1 to 2-0, and lays the second layer of bowel anastomosis with 3-0 on a round body."},{"id":"SURG-U3-14","ch":3,"n":14,"title":"Synthetic Non-absorbable: Prolene to Polybutester","sec":"Synthetic Non-absorbable · p16","qs":["SURG-C3-115","SURG-C3-116","SURG-C3-117","SURG-C3-118","SURG-C3-119","SURG-C3-120","SURG-C3-121","SURG-C3-122","SURG-C3-123","SURG-C3-124","SURG-C3-125","SURG-C3-126","SURG-C3-127","SURG-C3-128"],"guide":"Blue monofilament prolene weaves hernia mesh, closes sheaths by Jenkin's four-to-one rule, and steps down vessels from 2-0 aorta to 6-0 popliteal. Nylon serves skin, cataract and nerve-tendon repairs, steel wires post-CABG sternums, polyester holds rectus and tendon, and polybutester lingers rarely in plastic surgery."},{"id":"SURG-U3-15","ch":3,"n":15,"title":"Suture Removal Timings","sec":"Suture Removal · p17","qs":["SURG-C3-129","SURG-C3-130","SURG-C3-131","SURG-C3-132","SURG-C3-133","SURG-C3-134","SURG-C3-135","SURG-C3-136"],"guide":"Only non-absorbable sutures come out: face first at 3-5 days, scalp and neck at 5-7, thorax and perineum at 10-12, and abdomen last at 12-14 days."},{"id":"SURG-U3-16","ch":3,"n":16,"title":"Bowel Anastomosis & Staplers","sec":"Bowel Anastomosis · p17","qs":["SURG-C3-137","SURG-C3-138","SURG-C3-139","SURG-C3-140","SURG-C3-141","SURG-C3-142","SURG-C3-143","SURG-C3-144","SURG-C3-145","SURG-C3-146","SURG-C3-147","SURG-C3-148","SURG-C3-149","SURG-C3-150","SURG-C3-151"],"guide":"Bowel demands inverted edges, trusting the submucosa as its strongest layer - whether joined by single extramucosal, two-layer Albert-plus-Lembert, or stapler. Linear staplers fire side-to-side joins, sleeves and Zenker's pouches; circular staplers fix haemorrhoids and low anterior resections; Cheatle's slit widens narrow ends and the Connel loop guarantees inversion."}];
