ook p38)"},{"id":"SURG-C7-039","sec":"Pathophysiology & Response","page":38,"q":"Blood loss activates the sympathetic system releasing:","opts":["Noradrenaline, adrenaline","Insulin","Histamine","Acetylcholine"],"ans":0,"exp":"Blood loss -> Activation of sympathetic system -> Noradrenaline, Adrenaline. (Book p38)"},{"id":"SURG-C7-040","sec":"Pathophysiology & Response","page":38,"q":"The earliest sign of Class II (compensated) shock is:","opts":["Tachycardia (↑ HR)","Hypotension","Anuria","Coma"],"ans":0,"exp":"Tachycardia: ↑ HR (Earliest sign). (Book p38)"},{"id":"SURG-C7-041","sec":"Pathophysiology & Response","page":38,"q":"Peripheral vasoconstriction in compensated shock serves to:","opts":["Shunt blood to vital organs","Increase skin temperature","Cause bleeding","Lower peripheral vascular resistance"],"ans":0,"exp":"Peripheral vasoconstriction (Shunts blood to vital organs). (Book p38)"},{"id":"SURG-C7-042","sec":"Pathophysiology & Response","page":38,"q":"Clinical features of the compensated phase include cold extremities and:","opts":["↑ peripheral vascular resistance","↓ peripheral vascular resistance","Warm flushed skin","Bradycardia"],"ans":0,"exp":"Cold extremities; ↑ peripheral vascular resistance. (Book p38)"},{"id":"SURG-C7-043","sec":"Pathophysiology & Response","page":38,"q":"To check the response in shock, one gives:","opts":["500 mL-1 L crystalloid and checks response","2 L colloid bolus","Oral fluids only","Blood immediately always"],"ans":0,"exp":"Response and management of shock: 500 mL-1 L crystalloid given -> Response checked. (Book p38)"},{"id":"SURG-C7-044","sec":"Dynamic Fluid Response","page":39,"q":"In a responder, pulse rate, SBP and JVP show:","opts":["PR ↓↓, SBP ↑↑, JVP ↑↑ with persistent changes","PR ↑, SBP ↓, JVP ↓","No change at all","Changes that reverse within 5 minutes"],"ans":0,"exp":"Responder: PR ↓↓, SBP ↑↑, JVP ↑↑; the above changes are persistent. (Book p39)"},{"id":"SURG-C7-045","sec":"Dynamic Fluid Response","page":39,"q":"A transient responder shows improvement but after 15-20 minutes:","opts":["Parameters worsen (ongoing losses)","Parameters stay normal forever","PR falls to zero","JVP becomes non-recordable"],"ans":0,"exp":"Transient responder: After 15-20 mins parameters worsen (Ongoing losses). (Book p39)"},{"id":"SURG-C7-046","sec":"Dynamic Fluid Response","page":39,"q":"In a non responder, PR, SBP and JVP respectively:","opts":["↑, ↓, ↓","↓↓, ↑↑, ↑↑","Normal, normal, normal","↓, ↑, ↑"],"ans":0,"exp":"Non responder: PR ↑, SBP ↓, JVP ↓. (Book p39)"},{"id":"SURG-C7-047","sec":"Dynamic Fluid Response","page":39,"q":"A non responder implies:","opts":["Ongoing losses","Complete hemostasis","Over-transfusion","Compensated shock"],"ans":0,"exp":"Non responder: Implication = Ongoing losses. (Book p39)"},{"id":"SURG-C7-048","sec":"Management: Resuscitation","page":39,"q":"Active bleeding is recognised by:","opts":["Hypotension and transient/non-responder status","Normal BP and responder status","Fever","Bradycardia"],"ans":0,"exp":"Recognise active bleeding: Hypotension, transient/non-responder. (Book p39)"},{"id":"SURG-C7-049","sec":"Management: Resuscitation","page":39,"q":"Before hemostasis, resuscitation prioritises:","opts":["Coagulation","Perfusion","Diuresis","Sedation"],"ans":0,"exp":"Before hemostasis: Prioritise coagulation. (Book p39)"},{"id":"SURG-C7-050","sec":"Management: Resuscitation","page":39,"q":"After hemostasis, resuscitation prioritises:","opts":["Perfusion","Coagulation","Hypothermia","Hemoconcentration"],"ans":0,"exp":"After hemostasis: Prioritise perfusion. (Book p39)"},{"id":"SURG-C7-051","sec":"Management: Resuscitation","page":39,"q":"Damage control resuscitation is used in:","opts":["Active bleeding (hypotension, transient/non-responder)","Stable responders","Elective surgery","Anaemia only"],"ans":0,"exp":"Recognise active bleeding -> Damage control resuscitation. (Book p39)"},{"id":"SURG-C7-052","sec":"Management: Resuscitation","page":39,"q":"The goal of damage control resuscitation is:","opts":["Coagulation function and coronary perfusion","End-organ perfusion","Normalisation of Hb","Full blood pressure immediately"],"ans":0,"exp":"Damage control resuscitation goal: Coagulation function, coronary perfusion. (Book p39)"},{"id":"SURG-C7-053","sec":"Management: Resuscitation","page":39,"q":"Damage control resuscitation includes all of the following EXCEPT:","opts":["Permissive hypertension","Damage control surgery","Balanced transfusion (1:1 RBC and FFP)","Treating coagulopathy with tranexamic acid, platelets, fibrinogen"],"ans":0,"exp":"DCR: Damage control surgery; Permissive hypotension (keep BP at lower limit of normal); Balanced transfusion (1:1 RBC and FFP); Treat coagulopathy (Tranexamic acid, platelets, fibrinogen). (Book p39)"},{"id":"SURG-C7-054","sec":"Management: Resuscitation","page":39,"q":"Permissive hypotension means keeping the BP at:","opts":["The lower limit of normal","The upper limit of normal","Above 140 mmHg","Zero"],"ans":0,"exp":"Permissive hypotension (keep BP at lower limit of normal). (Book p39)"},{"id":"SURG-C7-055","sec":"Management: Resuscitation","page":39,"q":"Balanced transfusion in damage control resuscitation uses RBC and FFP in the ratio:","opts":["1:1","2:1","4:1","1:4"],"ans":0,"exp":"Balanced transfusion (1:1 RBC and FFP). (Book p39)"},{"id":"SURG-C7-056","sec":"Management: Resuscitation","page":39,"q":"Coagulopathy in damage control resuscitation is treated with:","opts":["Tranexamic acid, platelets, fibrinogen","Heparin","Warfarin","Vitamin K only"],"ans":0,"exp":"Treat coagulopathy (Tranexamic acid, platelets, fibrinogen). (Book p39)"},{"id":"SURG-C7-057","sec":"Management: Resuscitation","page":39,"q":"Monitoring in damage control resuscitation includes coagulation parameters:","opts":["PT, fibrinogen, ROTEM/TEG","Only Hb","Only platelet count","Bleeding time only"],"ans":0,"exp":"DCR monitor: Coagulation: PT, fibrinogen, ROTEM/TEG. (Book p39)"},{"id":"SURG-C7-058","sec":"Management: Resuscitation","page":39,"q":"Monitoring in damage control resuscitation includes electrolytes:","opts":["Ca2+, K+","Na+ only","Mg2+ only","Phosphate only"],"ans":0,"exp":"DCR monitor: Electrolytes: Ca2+, K+. (Book p39)"},{"id":"SURG-C7-059","sec":"Management: Resuscitation","page":39,"q":"Perfusion monitoring in damage control resuscitation uses:","opts":["pH, base excess, lactate, temperature","Urine culture","CXR","GCS only"],"ans":0,"exp":"DCR monitor: Perfusion: pH, base excess, lactate, temperature. (Book p39)"},{"id":"SURG-C7-060","sec":"Management: Resuscitation","page":39,"q":"A responder after hemostasis receives:","opts":["Perfusion-targeted resuscitation","Damage control resuscitation","No fluids ever","Only colloids"],"ans":0,"exp":"Responder -> Perfusion-targeted resuscitation. (Book p39)"},{"id":"SURG-C7-061","sec":"Management: Resuscitation","page":39,"q":"The goal of perfusion-targeted resuscitation is:","opts":["End-organ perfusion","Coagulation function","Hypothermia","Hemoconcentration"],"ans":0,"exp":"Perfusion-targeted resuscitation goal: End-organ perfusion. (Book p39)"},{"id":"SURG-C7-062","sec":"Management: Resuscitation","page":39,"q":"Perfusion-targeted resuscitation ensures adequate preload and afterload using:","opts":["Fluids and pressors","Diuretics","Beta blockers","Sedatives"],"ans":0,"exp":"Adequate preload and afterload (Fluids and pressors). (Book p39)"},{"id":"SURG-C7-063","sec":"Management: Resuscitation","page":39,"q":"Perfusion-targeted resuscitation also includes:","opts":["Thromboprophylaxis","Anticoagulation avoidance always","Routine FFP","Permissive hypotension"],"ans":0,"exp":"Perfusion-targeted resuscitation: Thromboprophylaxis. (Book p39)"},{"id":"SURG-C7-064","sec":"Management: Resuscitation","page":39,"q":"Cardiovascular monitoring in perfusion-targeted resuscitation includes:","opts":["BP, HR, CO, SVR","BP and HR only","JVP only","ECG only"],"ans":0,"exp":"PTR monitor: Cardiovascular: BP, HR, CO, SVR. (Book p39)"},{"id":"SURG-C7-065","sec":"Management: Resuscitation","page":39,"q":"Perfusion monitoring in perfusion-targeted resuscitation includes:","opts":["Base excess, lactate, SvO2","Only temperature","Only pH","Hb only"],"ans":0,"exp":"PTR monitor: Perfusion: Base excess, lactate, SvO2. (Book p39)"},{"id":"SURG-C7-066","sec":"Management: Resuscitation","page":39,"q":"Organ function monitoring in perfusion-targeted resuscitation includes:","opts":["PaO2/FiO2, UO, GCS","Only GCS","Only urine output","Liver biopsy"],"ans":0,"exp":"PTR monitor: Organ function: PaO2/FiO2, UO, GCS. (Book p39)"},{"id":"SURG-C7-067","sec":"Management: Resuscitation","page":39,"q":"The abdominal compartment is monitored in perfusion-targeted resuscitation by:","opts":["IAP (intra abdominal pressure)","UO","SvO2","CO"],"ans":0,"exp":"PTR monitor: Abdominal compartment: IAP. (Book p39)"},{"id":"SURG-C7-068","sec":"Management: Resuscitation","page":39,"q":"ROTEM and TEG stand for:","opts":["Rotational thromboelastometry and thromboelastography","Rotational thromboembolism test and tissue elastography","Routine thrombin estimation and tissue coagulography","Rotational temperature estimation and thrombin elasticity graph"],"ans":0,"exp":"ROTEM: Rotational thromboelastometry; TEG: Thromboelastography. (Book p39)"},{"id":"SURG-C7-069","sec":"Occult Hypoperfusion","page":40,"q":"Occult hypoperfusion shows CVS parameters (HR, SBP) that are:","opts":["Normal","Grossly deranged","Non-recordable","High"],"ans":0,"exp":"Occult hypoperfusion: Normal CVS parameters: HR, SBP normal. (Book p40)"},{"id":"SURG-C7-070","sec":"Occult Hypoperfusion","page":40,"q":"Urine output in occult hypoperfusion is:","opts":["Normal","Absent","Decreased","Increased"],"ans":0,"exp":"Occult hypoperfusion: Normal urine output. (Book p40)"},{"id":"SURG-C7-071","sec":"Occult Hypoperfusion","page":40,"q":"Occult hypoperfusion is revealed by:","opts":["Low MVOS (mixed venous oxygen saturation) and acidosis","High MVOS and alkalosis","Normal lactate","Normal base excess"],"ans":0,"exp":"Occult hypoperfusion: Low MVOS (mixed venous oxygen saturation); Acidosis. (Book p40)"},{"id":"SURG-C7-072","sec":"Monitoring Indicators","page":40,"q":"The best indicator of initial fluid requirement is:","opts":["PCWP > CVP","CVP > PCWP","Urine output","Shock index"],"ans":0,"exp":"Initial fluid requirement: Best indicator: PCWP > CVP. (Book p40)"},{"id":"SURG-C7-073","sec":"Monitoring Indicators","page":40,"q":"PCWP stands for and reflects:","opts":["Pulmonary capillary wedge pressure; left-sided heart pressure (more accurate)","Peripheral central wedge pressure; right heart","Pulmonary circulatory wedge pressure; RV pressure","Peak capillary wedge pressure; skin perfusion"],"ans":0,"exp":"PCWP: (Pulmonary capillary wedge pressure); Left-sided heart pressure (more accurate). (Book p40)"},{"id":"SURG-C7-074","sec":"Monitoring Indicators","page":40,"q":"PCWP is measured using a:","opts":["Swan-Ganz catheter","Foley catheter","PICC line","Arterial line only"],"ans":0,"exp":"PCWP: Swan-Ganz catheter used. (Book p40)"},{"id":"SURG-C7-075","sec":"Monitoring Indicators","page":40,"q":"The drawback of PCWP monitoring is that it is:","opts":["Difficult to monitor","Inaccurate for left heart","Non-invasive","Cheapest"],"ans":0,"exp":"PCWP: Difficult to monitor. (Book p40)"},{"id":"SURG-C7-076","sec":"Monitoring Indicators","page":40,"q":"CVP reflects:","opts":["Right-sided heart pressure and is m/c used","Left-sided heart pressure","Pulmonary artery pressure only","Portal pressure"],"ans":0,"exp":"CVP: (Central venous pressure); Right-sided heart pressure; m/c used. (Book p40)"},{"id":"SURG-C7-077","sec":"Monitoring Indicators","page":40,"q":"The best indicator of fluid resuscitation is:","opts":["Urine output","CVP","PCWP","Heart rate"],"ans":0,"exp":"Fluid resuscitation: Best indicator: Urine output. (Book p40)"},{"id":"SURG-C7-078","sec":"Monitoring Indicators","page":40,"q":"Urine output target in adults during resuscitation is:","opts":[">0.5 mL/kg/hour",">1 mL/kg/hour",">2 mL/kg/hour",">0.1 mL/kg/hour"],"ans":0,"exp":"Urine output: Adults: >0.5 mL/kg/hour. (Book p40)"},{"id":"SURG-C7-079","sec":"Monitoring Indicators","page":40,"q":"Urine output target in children during resuscitation is:","opts":[">1 mL/kg/hour",">0.5 mL/kg/hour",">0.25 mL/kg/hour",">3 mL/kg/hour"],"ans":0,"exp":"Urine output: Children: >1 mL/kg/hour. (Book p40)"},{"id":"SURG-C7-080","sec":"Indices","page":40,"q":"Shock index is calculated as:","opts":["Heart rate (HR) / Systolic BP (SBP)","SBP / HR","HR / DBP","MAP / HR"],"ans":0,"exp":"Shock Index: Heart rate (HR)/Systolic BP (SBP). (Book p40)"},{"id":"SURG-C7-081","sec":"Indices","page":40,"q":"A shock index >0.9 indicates:","opts":["Higher mortality rate","Stable patient","Compensated shock","Normal perfusion"],"ans":0,"exp":"Shock index >0.9: Higher mortality rate. (Book p40)"},{"id":"SURG-C7-082","sec":"Indices","page":40,"q":"Modified shock index is calculated as:","opts":["HR / MAP (mean arterial pressure)","HR / SBP","HR / PP","MAP / HR"],"ans":0,"exp":"Modified shock index: HR/MAP (mean arterial pressure). (Book p40)"},{"id":"SURG-C7-083","sec":"Indices","page":40,"q":"The most sensitive shock index is the:","opts":["Modified shock index","Shock index","ROPE","CVP"],"ans":0,"exp":"Modified shock index: most sensitive. (Book p40)"},{"id":"SURG-C7-084","sec":"Indices","page":41,"q":"Rate over pressure evaluation (ROPE) is calculated as:","opts":["HR / PP (pulse pressure)","HR / SBP","HR / MAP","PP / HR"],"ans":0,"exp":"ROPE: HR/PP (Pulse pressure). (Book p41)"},{"id":"SURG-C7-085","sec":"Indices","page":41,"q":"A ROPE value <3 indicates:","opts":["Stable patient","Decompensated shock","High mortality","Ongoing bleeding"],"ans":0,"exp":"ROPE <3: Stable patient. (Book p41)"},{"id":"SURG-C7-086","sec":"Indices","page":41,"q":"A ROPE value >3 indicates the patient:","opts":["May develop decompensated shock","Is stable","Needs no monitoring","Is a responder"],"ans":0,"exp":"ROPE >3: May develop decompensated shock. (Book p41)"},{"id":"SURG-C7-087","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Systemic perfusion is investigated by base deficit and lactate, which are:","opts":["Signs of acidosis","Signs of alkalosis","Signs of infection","Signs of anemia"],"ans":0,"exp":"Systemic perfusion investigations: Base deficit, Lactate = Signs of acidosis. (Book p41)"},{"id":"SURG-C7-088","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"The best end point of resuscitation is:","opts":["Mixed venous oxygen saturation (MVOS)","Urine output","Heart rate","CVP"],"ans":0,"exp":"Mixed venous oxygen saturation (MVOS): Best end point of resuscitation. (Book p41)"},{"id":"SURG-C7-089","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Muscle perfusion is monitored by:","opts":["Near-infrared spectroscopy and tissue oxygen electrode","Urine output","Consciousness level","Sublingual capnometry"],"ans":0,"exp":"Muscle: Near-infrared spectroscopy; Tissue oxygen electrode. (Book p41)"},{"id":"SURG-C7-090","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"The tissue most sensitive to hypovolemic insult is the:","opts":["Gut mucosa","Muscle","Brain","Kidney"],"ans":0,"exp":"Gut mucosa: Most sensitive to hypovolemic insult. (Book p41)"},{"id":"SURG-C7-091","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Hypovolemic insult to gut mucosa leads to formation of:","opts":["Stress ulcers","Polyps","Diverticula","Villous atrophy"],"ans":0,"exp":"Gut mucosa: Forms stress ulcers. (Book p41)"},{"id":"SURG-C7-092","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Gut perfusion is monitored by:","opts":["Sublingual capnometry, gut mucosal pH, laser doppler flowmetry","Urine output","NIRS only","Consciousness level"],"ans":0,"exp":"Gut: Sublingual capnometry; Gut mucosal pH; Laser doppler flowmetry. (Book p41)"},{"id":"SURG-C7-093","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Kidney perfusion is monitored clinically by:","opts":["Urine output","Consciousness level","Base deficit","Laser doppler"],"ans":0,"exp":"Kidney: Clinical = Urine output. (Book p41)"},{"id":"SURG-C7-094","sec":"Monitors for Organ/Systemic Perfusion","page":41,"q":"Brain perfusion is monitored clinically by and investigated with:","opts":["Consciousness level; tissue oxygen electrode and NIRS","Urine output; capnometry","HR; lactate","BP; MVOS"],"ans":0,"exp":"Brain: Clinical = Consciousness level; Investigations = Tissue oxygen electrode, Near-infrared spectroscopy (NIRS). (Book p41)"},{"id":"SURG-C7-095","sec":"Massive Blood Transfusion","page":41,"q":"Massive blood transfusion includes any of the following EXCEPT:","opts":[">4 units in 24 hours","Replace entire circulating volume in 24 hrs",">10 units of blood in 24 hrs",">4 units in one hour"],"ans":0,"exp":"Massive blood transfusion: Replace entire circulating volume in 24 hrs; >10 units of blood in 24 hrs; >4 units in one hour. (Book p41)"},{"id":"SURG-C7-096","sec":"Massive Blood Transfusion","page":41,"q":"The first listed complication of massive transfusion is:","opts":["Hypothermia","Hyperthermia","Hypoglycemia","Hypertension"],"ans":0,"exp":"Complications: 1. Hypothermia. (Book p41)"},{"id":"SURG-C7-097","sec":"Massive Blood Transfusion","page":41,"q":"Hypocalcemia/hypomagnesemia in massive transfusion occurs because:","opts":["Citrate (anticoagulant) chelates Ca2+ and Mg2+","Heparin binds calcium","Blood is acidic","Kidneys excrete calcium"],"ans":0,"exp":"Reason: Citrate (Anticoagulant) -> Chelates Ca2+ and Mg2+. (Book p41)"},{"id":"SURG-C7-098","sec":"Massive Blood Transfusion","page":41,"q":"Metabolic alkalosis in massive transfusion is due to:","opts":["Citrate toxicity","Lactic acidosis","Hypothermia","Hyperkalemia"],"ans":0,"exp":"Metabolic alkalosis: Reason: Citrate toxicity. (Book p41)"},{"id":"SURG-C7-099","sec":"Massive Blood Transfusion","page":41,"q":"The potassium disturbance seen in massive transfusion is:","opts":["Hyperkalemia >> hypokalemia","Hypokalemia >> hyperkalemia","Only hypokalemia","No change"],"ans":0,"exp":"Hyperkalemia >> hypokalemia. (Book p41)"},{"id":"SURG-C7-100","sec":"Massive Blood Transfusion","page":41,"q":"Hyperkalemia in massive transfusion occurs because:","opts":["Stored blood -> RBC lysed -> K+ released -> ↑ serum K+","Citrate releases potassium","Renal failure always","Platelet lysis"],"ans":0,"exp":"Reason: Stored blood -> RBC lysed -> K+ released -> ↑ serum K+. (Book p41)"},{"id":"SURG-C7-101","sec":"Massive Blood Transfusion","page":42,"q":"The m/c cause of death in massive transfusion is:","opts":["Coagulopathy","Hypothermia","Hyperkalemia","TRALI"],"ans":0,"exp":"5. Coagulopathy (m/c cause of death). (Book p42)"},{"id":"SURG-C7-102","sec":"Massive Blood Transfusion","page":42,"q":"Reasons for coagulopathy in massive transfusion include all of the following EXCEPT:","opts":["Hyperthermia","Dilutional coagulopathy","Acidosis","Hypothermia"],"ans":0,"exp":"Coagulopathy reasons: a. Dilutional coagulopathy; b. Acidosis; c. Hypothermia. (Book p42)"},{"id":"SURG-C7-103","sec":"Massive Blood Transfusion","page":42,"q":"Prevention of coagulopathy in massive transfusion includes limiting crystalloids and giving PRBC : Platelet : FFP in the ratio:","opts":["1:1:1","2:1:1","1:2:4","4:1:1"],"ans":0,"exp":"Prevention: Limit crystalloids; PRBC : Platelet : FFP -> 1:1:1 ratio. (Book p42)"},{"id":"SURG-C7-104","sec":"Massive Blood Transfusion","page":42,"q":"Haemolytic reaction during transfusion is due to:","opts":["Mismatched transfusion","Citrate toxicity","Leukocytes","Iron overload"],"ans":0,"exp":"Haemolytic reaction: Reason: Mismatched transfusion. (Book p42)"},{"id":"SURG-C7-105","sec":"Massive Blood Transfusion","page":42,"q":"The m/c transfusion reaction is:","opts":["Febrile reactions","Haemolytic reaction","TRALI","TACO"],"ans":0,"exp":"Febrile reactions (m/c reaction). (Book p42)"},{"id":"SURG-C7-106","sec":"Massive Blood Transfusion","page":42,"q":"Febrile transfusion reactions are prevented by using:","opts":["A leukoreduction filter","Warming blood","Citrate","Diuretics"],"ans":0,"exp":"Prevention: use of a leukoreduction filter. (Book p42)"},{"id":"SURG-C7-107","sec":"Massive Blood Transfusion","page":42,"q":"TRALI stands for:","opts":["Transfusion related acute lung injury","Transfusion related acute liver injury","Transfusion related acute limb ischemia","Total respiratory and lung insufficiency"],"ans":0,"exp":"Transfusion related acute lung injury (TRALI). (Book p42)"},{"id":"SURG-C7-108","sec":"Massive Blood Transfusion","page":42,"q":"TACO stands for:","opts":["Transfusion associated cardiac overload","Transfusion associated cerebral oedema","Total acute cardiac occlusion","Transfusion acidosis and cardiac output fall"],"ans":0,"exp":"Transfusion associated cardiac overload (TACO). (Book p42)"},{"id":"SURG-C7-109","sec":"TACO vs TRALI","page":42,"q":"The mechanism of TACO is:","opts":["Cardiac overload","Antibody against HLA antigen","Sepsis","Citrate toxicity"],"ans":0,"exp":"TACO mechanism: D/t cardiac overload. (Book p42)"},{"id":"SURG-C7-110","sec":"TACO vs TRALI","page":42,"q":"The mechanism of TRALI is:","opts":["Antibody against HLA antigen causing non-cardiogenic pulmonary edema within 6 hours","Cardiac overload","Fluid overload of kidneys","Bacterial contamination"],"ans":0,"exp":"TRALI mechanism: Antibody against HLA antigen -> Non-cardiogenic pulmonary edema (within 6 hours). (Book p42)"},{"id":"SURG-C7-111","sec":"TACO vs TRALI","page":42,"q":"TRALI pulmonary edema appears within:","opts":["6 hours","24 hours","48 hours","1 week"],"ans":0,"exp":"Non-cardiogenic pulmonary edema (within 6 hours). (Book p42)"},{"id":"SURG-C7-112","sec":"TACO vs TRALI","page":42,"q":"Implicated donors in TRALI include:","opts":["Multiparous women and patients receiving FFP","Young male donors","First-time donors only","O-negative donors"],"ans":0,"exp":"TRALI implicated donors: Multiparous women; Patient receiving FFP. (Book p42)"},{"id":"SURG-C7-113","sec":"TACO vs TRALI","page":42,"q":"Clinical features of TACO include all of the following EXCEPT:","opts":["Patchy infiltrates on X-ray","Facial puffiness","Pedal edema","Breathlessness"],"ans":0,"exp":"TACO clinical features: Facial puffiness, Pedal edema, Breathlessness, X-ray: Normal. (Book p42)"},{"id":"SURG-C7-114","sec":"TACO vs TRALI","page":42,"q":"The chest X-ray in TACO is:","opts":["Normal","ARDS with patchy infiltrates","Pneumothorax","Cardiomegaly always"],"ans":0,"exp":"TACO: X-ray: Normal. (Book p42)"},{"id":"SURG-C7-115","sec":"TACO vs TRALI","page":42,"q":"TRALI clinically shows breathlessness and on CXR:","opts":["ARDS with pulmonary edema and patchy infiltrates","Normal film","Pleural effusion only","Cardiomegaly"],"ans":0,"exp":"TRALI: CXR: ARDS (Acute respiratory distress syndrome); Pulmonary edema; Patchy infiltrates. (Book p42)"},{"id":"SURG-C7-116","sec":"TACO vs TRALI","page":42,"q":"Management of TACO is:","opts":["Lasix/diuretics","No specific management listed","Antibiotics","Intubation always"],"ans":0,"exp":"TACO management: Lasix/diuretics. (Book p42)"},{"id":"SURG-C7-117","sec":"TACO vs TRALI","page":42,"q":"Management of TRALI as per the book is:","opts":["- (none listed)","Lasix/diuretics","Steroids","FFP infusion"],"ans":0,"exp":"TRALI management: - (none listed in table). (Book p42)"},{"id":"SURG-C7-118","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin <6 g/dL:","opts":["Probably will benefit from transfusion","Benefits only if ongoing losses","Not indicated if risk factors absent","Needs no transfusion"],"ans":0,"exp":"Hb <6: Probably will benefit from transfusion. (Book p43)"},{"id":"SURG-C7-119","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin of 6-8 g/dL benefits from transfusion only if:","opts":["Ongoing losses (+)/impending surgery","Patient is young","Surgery is minor","Risk factors absent"],"ans":0,"exp":"Hb 6-8: Benefit only if ongoing losses (+)/impending surgery. (Book p43)"},{"id":"SURG-C7-120","sec":"Perioperative RBC Transfusion Criteria","page":43,"q":"A perioperative hemoglobin >8 g/dL:","opts":["Not indicated if risk factors absent","Always transfuse","Probably will benefit","Transfuse only before surgery"],"ans":0,"exp":"Hb >8: Not indicated if risk factors absent. (Book p43)"},{"id":"SURG-C7-121","sec":"Blood Substitutes","page":43,"q":"First generation blood substitute is:","opts":["Perfluorocarbon","Stroma free hemoglobin","Hemospan","PHP"],"ans":0,"exp":"First generation: Perfluorocarbon. (Book p43)"},{"id":"SURG-C7-122","sec":"Blood Substitutes","page":43,"q":"Second generation blood substitute is:","opts":["Stroma free hemoglobin","Perfluorocarbon","PEG hemoglobin","MP4OX"],"ans":0,"exp":"Second generation: Stroma free hemoglobin. (Book p43)"},{"id":"SURG-C7-123","sec":"Blood Substitutes","page":43,"q":"Next generation blood substitutes include all of the following EXCEPT:","opts":["Perfluorocarbon","Polyethylene glycol (PEG) hemoglobin","Hemospan (AKA MP4OX)","Pyridoxylated hemoglobin polyoxyethylene conjugate (PHP)"],"ans":0,"exp":"Next generation: PEG hemoglobin; Hemospan (AKA MP4OX); Pyridoxylated hemoglobin polyoxyethylene conjugate (PHP). (Book p43)"},{"id":"SURG-C7-124","sec":"Blood Substitutes","page":43,"q":"Hemospan is also known as:","opts":["MP4OX","PHP","PEG-Hb","TRALI"],"ans":0,"exp":"Hemospan (AKA MP4OX). (Book p43)"},{"id":"SURG-C7-125","sec":"Anti-shock Garment","page":43,"q":"The anti-shock garment is used for:","opts":["Hypovolemic shock in peripheral locations (Eg: Women with PPH in rural areas)","Cardiogenic shock in ICU","Septic shock in OT","Neurogenic shock only"],"ans":0,"exp":"Anti-shock garment: used for hypovolemic shock in peripheral locations (Eg: Women with PPH in rural areas). (Book p43)"},{"id":"SURG-C7-126","sec":"Anti-shock Garment","page":43,"q":"The anti-shock garment applies:","opts":["Maximum compression over the legs and least over the upper body","Equal compression everywhere","Maximum compression over the chest","Least compression over the legs"],"ans":0,"exp":"Anti-shock garment: Maximum compression (lower body), Least compression (upper body). (Book p43)"},{"id":"SURG-C8-001","sec":"MVOS","page":44,"q":"Mixed venous oxygen saturation (MVOS) represents:","opts":["The unutilised O2 returning back to the heart","The O2 consumed by tissues","Arterial O2 content","Alveolar O2"],"ans":0,"exp":"MVOS: Represents the unutilised O2 returning back to the heart. (Book p44)"},{"id":"SURG-C8-002","sec":"MVOS","page":44,"q":"The normal value of MVOS is:","opts":["50-70%","20-40%","70-90%","95-100%"],"ans":0,"exp":"MVOS: Normal value: 50 - 70%. (Book p44)"},{"id":"SURG-C8-003","sec":"MVOS","page":44,"q":"MVOS is measured via a catheter placed in the:","opts":["Right atrium","Left atrium","Aorta","Pulmonary vein"],"ans":0,"exp":"MVOS: Measured via a catheter in the Right Atrium. (Book p44)"},{"id":"SURG-C8-004","sec":"MVOS","page":44,"q":"Low MVOS is seen in:","opts":["Low cardiac output and reduced O2 pump (hypovolemic shock)","Distributive shock","Warm septic shock","Arteriovenous fistula"],"ans":0,"exp":"Low MVOS: Low cardiac output; Reduced O2 pump (Hypovolemic shock). (Book p44)"},{"id":"SURG-C8-005","sec":"MVOS","page":44,"q":"High MVOS is characteristic of:","opts":["Distributive shock","Hypovolemic shock","Cardiogenic shock","Haemorrhagic shock"],"ans":0,"exp":"High MVOS: Distributive shock. (Book p44)"},{"id":"SURG-C8-006","sec":"Cardiogenic Shock","page":44,"q":"Examples of cardiogenic shock include all of the following EXCEPT:","opts":["Massive pulmonary embolism","Myocardial infarction","Cardiac tamponade","Arrhythmias"],"ans":0,"exp":"Cardiogenic shock examples: Myocardial Infarction, Cardiac Tamponade, Arrhythmias (massive PE is obstructive). (Book p44)"},{"id":"SURG-C8-007","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock the primary defect is that the:","opts":["Heart does not function properly","Vessels dilate","Blood volume falls","Lungs fail"],"ans":0,"exp":"Pathophysiology: Heart does not function properly. (Book p44)"},{"id":"SURG-C8-008","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock, decreased cardiac output leads to:","opts":["O2 not pumped and ↓ MVOS","↑ MVOS","↑ SBP","↓ PVR"],"ans":0,"exp":"↓ CO -> O2 not pumped -> ↓ MVOS. (Book p44)"},{"id":"SURG-C8-009","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock the SBP and PVR changes are:","opts":["↓ SBP and ↑ PVR with cold extremities","↑ SBP and ↓ PVR with warm extremities","↓ SBP and ↓ PVR","Normal SBP and PVR"],"ans":0,"exp":"↓ SBP -> ↑ PVR (Cold extremities). (Book p44)"},{"id":"SURG-C8-010","sec":"Cardiogenic Shock","page":44,"q":"In cardiogenic shock, accumulating preload causes:","opts":["↑ JVP","↓ JVP","Normal JVP","↑ urine output"],"ans":0,"exp":"Preload accumulates -> ↑ JVP. (Book p44)"},{"id":"SURG-C8-011","sec":"Cardiogenic Shock","page":44,"q":"Extremities in cardiogenic shock are:","opts":["Cold","Warm","Flushed","Sweaty and warm"],"ans":0,"exp":"Cardiogenic shock: ↑ PVR (Cold extremities). (Book p44)"},{"id":"SURG-C8-012","sec":"Neurogenic Shock","page":44,"q":"The classic example of neurogenic shock is:","opts":["Spinal cord injury above T6 level","Spinal cord injury below L1","Isolated head injury","Femoral nerve injury"],"ans":0,"exp":"Neurogenic shock example: Spinal cord injury above T6 level. (Book p44)"},{"id":"SURG-C8-013","sec":"Neurogenic Shock","page":44,"q":"The pathophysiology of neurogenic shock begins with:","opts":["Loss of sympathetic drive","Histamine release","Cardiac pump failure","Hypovolemia"],"ans":0,"exp":"Pathophysiology: Loss of sympathetic drive. (Book p44)"},{"id":"SURG-C8-014","sec":"Neurogenic Shock","page":44,"q":"Loss of sympathetic drive causes vasodilation with:","opts":["PVR ↓↓ and warm extremities","PVR ↑↑ and cold extremities","PVR normal","↑ CO"],"ans":0,"exp":"Vasodilation -> PVR ↓↓ (Warm extremities). (Book p44)"},{"id":"SURG-C8-015","sec":"Neurogenic Shock","page":44,"q":"The heart rate change in neurogenic shock is:","opts":["Bradycardia (↓ HR)","Tachycardia","Normal","Variable ↑/↓"],"ans":0,"exp":"Loss of sympathetic drive -> Bradycardia (↓ HR). (Book p44)"},{"id":"SURG-C8-016","sec":"Neurogenic Shock","page":45,"q":"In neurogenic shock, peripheral pooling of blood causes:","opts":["↓ JVP, ↓ CO, ↓ SBP","↑ JVP, ↑ CO, ↑ SBP","↑ JVP with ↓ CO","Normal JVP and CO"],"ans":0,"exp":"D/t peripheral pooling of blood -> ↓ JVP, ↓ CO, ↓ SBP. (Book p45)"},{"id":"SURG-C8-017","sec":"Neurogenic Shock","page":45,"q":"The combination characteristic of neurogenic shock is:","opts":["Bradycardia + hypotension","Tachycardia + hypotension","Bradycardia + hypertension","Tachycardia + hypertension"],"ans":0,"exp":"Neurogenic shock: Bradycardia + Hypotension. (Book p45)"},{"id":"SURG-C8-018","sec":"Anaphylactic Shock","page":45,"q":"The example of anaphylactic shock given is:","opts":["Mismatched blood transfusion","Spinal anaesthesia","MI","Pulmonary embolism"],"ans":0,"exp":"Anaphylactic shock example: Mismatched blood transfusion. (Book p45)"},{"id":"SURG-C8-019","sec":"Anaphylactic Shock","page":45,"q":"In anaphylactic shock, the potent vasodilator released is:","opts":["Histamine","Noradrenaline","Angiotensin","Endothelin"],"ans":0,"exp":"Histamine release (Potent vasodilator). (Book p45)"},{"id":"SURG-C8-020","sec":"Anaphylactic Shock","page":45,"q":"Histamine release causes vasodilation and pooling of blood leading to:","opts":["↓ PVR with warm extremities","↑ PVR with cold extremities","↑ JVP","↑ SBP"],"ans":0,"exp":"Vasodilation -> Pooling of blood -> ↓ PVR (Warm extremities). (Book p45)"},{"id":"SURG-C8-021","sec":"Anaphylactic Shock","page":45,"q":"In anaphylactic shock, JVP, SBP and CO all:","opts":["Decrease","Increase","Stay normal","Become non-recordable only"],"ans":0,"exp":"Pooling of blood -> ↓ JVP, ↓ SBP, ↓ CO. (Book p45)"},{"id":"SURG-C8-022","sec":"Anaphylactic Shock","page":45,"q":"Because the sympathetic system is normal in anaphylactic shock, ↓ CO equals:","opts":["↑ HR x ↓ SV","↓ HR x ↑ SV","↑ HR x ↑ SV","↓ HR x ↓ SV"],"ans":0,"exp":"But, d/t normal sympathetic system: ↓ CO = ↑ HR x ↓ SV. (Book p45)"},{"id":"SURG-C8-023","sec":"Septic Shock: Warm & Cold","page":45,"q":"Warm septic shock shows a hyperdynamic circulation with:","opts":["↑ CO, ↑ HR, ↑ SBP","↓ CO, ↓ HR, ↓ SBP","↑ CO with ↓ SBP","↓ CO with ↑ SBP"],"ans":0,"exp":"Warm septic shock: Hyperdynamic circulation -> ↑ CO, ↑ HR, ↑ SBP. (Book p45)"},{"id":"SURG-C8-024","sec":"Septic Shock: Warm & Cold","page":45,"q":"MVOS is raised in warm septic shock because of:","opts":["Inability of tissues to utilize O2","Low cardiac output","Hypovolemia","Increased O2 pump"],"ans":0,"exp":"Raised MVOS d/t inability of tissues to utilize O2. (Book p45)"},{"id":"SURG-C8-025","sec":"Septic Shock: Warm & Cold","page":45,"q":"Cold septic shock occurs in the:","opts":["Late phase of sepsis","Early phase of sepsis","Recovery phase","Incubation phase"],"ans":0,"exp":"Cold septic shock: Late phase of sepsis. (Book p45)"},{"id":"SURG-C8-026","sec":"Septic Shock: Warm & Cold","page":45,"q":"In cold septic shock, toxins inhibit the myocardium making it similar to:","opts":["Cardiogenic shock","Hypovolemic shock","Neurogenic shock","Anaphylactic shock"],"ans":0,"exp":"Toxins inhibit myocardium -> similar to cardiogenic shock. (Book p45)"},{"id":"SURG-C8-027","sec":"Shock Comparison Table","page":45,"q":"In the shock comparison table, pulse rate is ↑↑ (maximum) in:","opts":["Anaphylactic shock","Hypovolemic (Class III)","Neurogenic shock","Warm septic shock"],"ans":0,"exp":"Table: PR: Anaphylactic = ↑↑. (Book p45)"},{"id":"SURG-C8-028","sec":"Shock Comparison Table","page":45,"q":"Pulse rate is ↓ in which shock?","opts":["Neurogenic shock","Hypovolemic (Class III)","Anaphylactic shock","Warm septic shock"],"ans":0,"exp":"Table: PR: Neurogenic = ↓. (Book p45)"},{"id":"SURG-C8-029","sec":"Shock Comparison Table","page":45,"q":"Pulse rate is ↑/↓ (variable) in:","opts":["Cardiogenic and cold septic shock","Hypovolemic and warm septic","Neurogenic and anaphylactic","Only anaphylactic"],"ans":0,"exp":"Table: PR: Cardiogenic = ↑/↓; Septic cold = ↑/↓. (Book p45)"},{"id":"SURG-C8-030","sec":"Shock Comparison Table","page":45,"q":"Cardiac output is ↑ only in:","opts":["Warm septic shock","Cold septic shock","Cardiogenic shock","Anaphylactic shock"],"ans":0,"exp":"Table: CO: Septic warm = ↑ (all others ↓). (Book p45)"},{"id":"SURG-C8-031","sec":"Shock Comparison Table","page":45,"q":"SBP is ↑ only in:","opts":["Warm septic shock","Hypovolemic shock","Cardiogenic shock","Neurogenic shock"],"ans":0,"exp":"Table: SBP: Septic warm = ↑ (others ↓). (Book p45)"},{"id":"SURG-C8-032","sec":"Shock Comparison Table","page":45,"q":"PVR is ↑↑ (maximum) in:","opts":["Hypovolemic (Class III)","Cardiogenic shock","Cold septic shock","Warm septic shock"],"ans":0,"exp":"Table: PVR: Hypovolemic (Class III) = ↑↑. (Book p45)"},{"id":"SURG-C8-033","sec":"Shock Comparison Table","page":45,"q":"PVR is ↑ (single up) in which shocks?","opts":["Cardiogenic and cold septic","Warm septic and anaphylactic","Neurogenic and warm septic","Hypovolemic and neurogenic"],"ans":0,"exp":"Table: PVR: Cardiogenic = ↑; Septic cold = ↑. (Book p45)"},{"id":"SURG-C8-034","sec":"Shock Comparison Table","page":45,"q":"JVP is ↑ in:","opts":["Cardiogenic and cold septic shock","Hypovolemic and anaphylactic","Neurogenic and warm septic","All shocks"],"ans":0,"exp":"Table: JVP: Cardiogenic = ↑; Septic cold = ↑; others ↓ or normal. (Book p45)"},{"id":"SURG-C8-035","sec":"Shock Comparison Table","page":45,"q":"JVP is normal in:","opts":["Warm septic shock","Cardiogenic shock","Cold septic shock","Hypovolemic shock"],"ans":0,"exp":"Table: JVP: Septic warm = Normal. (Book p45)"},{"id":"SURG-C8-036","sec":"Shock Comparison Table","page":45,"q":"MVOS is ↑ ADS","page":51,"q":"The initial investigation for a breast lump in a woman <40 years (glands > fat) is:","opts":["USG","Mammogram","MRI","PET"],"ans":0,"exp":"Initial investigation: <40 years (Glands > Fat) -> USG. (Book p51)"},{"id":"SURG-C9-030","sec":"Radiological: Initial & BIRADS","page":51,"q":"The initial investigation for a breast lump in a woman >40 years (fat > glands) is:","opts":["Mammogram","USG","MRI","FNAC"],"ans":0,"exp":"Initial investigation: >40 years (Fat > Glands) -> Mammogram. (Book p51)"},{"id":"SURG-C9-031","sec":"Radiological: Initial & BIRADS","page":51,"q":"Mammography is not sensitive in ages < 40 years because:","opts":["Both lesions and normal glandular tissue are hyperintense","Fat replaces glands","Radiation is too high","Breasts are too small"],"ans":0,"exp":"Mammography not sensitive in ages < 40 yrs: Both lesions and normal glandular tissue are hyperintense. (Book p51)"},{"id":"SURG-C9-032","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS stands for:","opts":["Breast Imaging Reporting and Data Systems","Breast Infection Risk and Data Scores","Biopsy Imaging Rating and Diagnosis System","Breast Index of Radiological Abnormality Degrees"],"ans":0,"exp":"BIRADS: Breast Imaging Reporting and Data Systems. (Book p51)"},{"id":"SURG-C9-033","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 0 category means:","opts":["Needs additional imaging - recall for additional imaging","Negative","Benign","Suspicious"],"ans":0,"exp":"BIRADS 0: Needs additional imaging; Recall for additional imaging; n/a. (Book p51)"},{"id":"SURG-C9-034","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 1 (negative) and 2 (benign) are managed by:","opts":["Routine screening in 1 year; likelihood essentially 0%","Biopsy","6 month follow up","Surgical excision"],"ans":0,"exp":"BIRADS 1 & 2: Routine screening in 1 year; Essentially 0%. (Book p51)"},{"id":"SURG-C9-035","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 3 (probably benign) is managed by:","opts":["Short term follow up (6 months); likelihood 0-3%","Routine screening in 5 years","Immediate biopsy","Surgical excision"],"ans":0,"exp":"BIRADS 3: Probably benign; Short term follow up (6 months); 0 - 3%. (Book p51)"},{"id":"SURG-C9-036","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 4 (suspicious) is managed by:","opts":["Tissue diagnosis (biopsy)","6 month follow up","Routine screening","Surgical excision"],"ans":0,"exp":"BIRADS 4: Suspicious; Tissue Diagnosis (Biopsy). (Book p51)"},{"id":"SURG-C9-037","sec":"Radiological: Initial & BIRADS","page":51,"q":"The likelihood of cancer for BIRADS 4a, 4b and 4c respectively is:","opts":["2-10%, 10-50%, 50-95%","0-3%, 3-10%, 10-50%","10-20%, 20-40%, 40-60%","5%, 15%, 25%"],"ans":0,"exp":"BIRADS 4: 4a 2-10%; 4b 10-50%; 4c 50-95%. (Book p51)"},{"id":"SURG-C9-038","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 5 (highly s/o malignancy) carries a likelihood of cancer of:","opts":["95%","50%","75%","100%"],"ans":0,"exp":"BIRADS 5: Highly s/o malignancy; Tissue Diagnosis (Biopsy); 95%. (Book p51)"},{"id":"SURG-C9-039","sec":"Radiological: Initial & BIRADS","page":51,"q":"BIRADS 6 (known biopsy proven) is managed by:","opts":["Surgical excision","Repeat biopsy","6 month follow up","Routine screening"],"ans":0,"exp":"BIRADS 6: Known biopsy proven; Surgical excision; n/a. (Book p51)"},{"id":"SURG-C9-040","sec":"ASBRS Screening Guidelines","page":51,"q":"As per ASBRS, formal risk assessment for breast cancer (Eg: Gail Index) begins at age:","opts":["≥25 yrs","≥20 yrs","≥30 yrs","≥40 yrs"],"ans":0,"exp":"ASBRS: 1. >25yrs -> Formal risk assessment for breast cancer (Eg: Gail Index). (Book p51)"},{"id":"SURG-C9-041","sec":"ASBRS Screening Guidelines","page":51,"q":"For average risk women, yearly screening mammography begins at:","opts":["40 yrs","30 yrs","45 yrs","50 yrs"],"ans":0,"exp":"ASBRS: 2. Average risk -> Begin yearly screening mammography at 40yrs. (Book p51)"},{" a: Involvement of chest wall -> Serratus anterior, ribs, intercostal muscles. (Book p59)"},{"id":"SURG-C10-080","sec":"8th AJCC: T","page":59,"q":"T4b breast cancer involves the skin with:","opts":["Ulceration, direct infiltration, peau d'orange, satellite nodules","Dimpling only","Nipple retraction only","Erythema only"],"ans":0,"exp":"T4b: Involvement of skin -> Ulceration, direct infiltration, peau d'orange, satellite nodules. (Book p59)"},{"id":"SURG-C10-081","sec":"8th AJCC: T","page":59,"q":"T4c and T4d respectively are:","opts":["T4a + T4b; inflammatory cancer","T4a only; Paget's","T4b only; DCIS","Tis + T1; lobular"],"ans":0,"exp":"T4c: T4a + T4b; T4d: Inflammatory cancer. (Book p59)"},{"id":"SURG-C10-082","sec":"8th AJCC: N","page":59,"q":"N1 breast cancer denotes:","opts":["Palpable mobile ipsilateral axillary nodes","Fixed ipsilateral axillary nodes","No regional node metastasis","Supraclavicular nodes"],"ans":0,"exp":"N1: Palpable mobile ipsilateral axillary nodes. (Book p59)"},{"id":"SURG-C10-083","sec":"8th AJCC: N","page":59,"q":"N2a and N2b respectively denote:","opts":["Fixed ipsilateral axillary nodes; internal mammary LN in absence of axillary LN","Mobile axillary nodes; supraclavicular nodes","Infraclavicular nodes; internal mammary nodes","No nodes; single node"],"ans":0,"exp":"N2a: Fixed ipsilateral axillary nodes; N2b: Presence of internal mammary lymph node in absence of axillary lymph node (LN). (Book p59)"},{"id":"SURG-C10-084","sec":"8th AJCC: N","page":59,"q":"N3a, N3b and N3c respectively denote:","opts":["Ipsilateral infraclavicular LN; internal mammary + axillary LN; ipsilateral supraclavicular LN","Axillary levels I-III","Fixed axillary; mobile axillary; internal mammary","Supraclavicular; infraclavicular; axillary"],"ans":0,"exp":"N3a: Ipsilateral infraclavicular LN; N3b: Internal mammary + Axillary LN; N3c: Ipsilateral supraclavicular LN. (Book p59)"},{"id":"SURG-C10-085","sec":"8th AJCC: M","page":59,"q":"M0 and M1 denote:","opts": xillary complex","Nipple axillary canal","Neuro areolar complex"],"ans":0,"exp":"NAC = Nipple areola complex (removed in radical, MRM and simple mastectomy). (Book p63)"},{"id":"SURG-C11-030","sec":"Mastectomy Types","page":63,"q":"The two conservation-type mastectomies illustrated are:","opts":["Nipple sparing and skin sparing mastectomy","Radical and simple","Patey and Scanlon","TRAM and DIEP"],"ans":0,"exp":"Images: Nipple sparing mastectomy; Skin sparing mastectomy. (Book p63)"},{"id":"SURG-C11-031","sec":"Axillary Clearance Boundaries","page":63,"q":"The medial boundary of axillary clearance is:","opts":["Halstead ligament","Axillary vein","Angular vein","Thoraco-dorsal pedicle"],"ans":0,"exp":"Medial boundary: Halstead ligament. (Book p63)"},{"id":"SURG-C11-032","sec":"Axillary Clearance Boundaries","page":63,"q":"The superior boundary of axillary clearance is:","opts":["Axillary vein","Halstead ligament","Angular vein","Long thoracic nerve"],"ans":0,"exp":"Superior boundary: Axillary vein. (Book p63)"},{"id":"SURG-C11-033","sec":"Axillary Clearance Boundaries","page":63,"q":"The lateral boundary of axillary clearance is:","opts":["Thoraco-dorsal pedicle","Axillary vein","Halstead ligament","Angular vein"],"ans":0,"exp":"Lateral boundary: Thoraco-dorsal pedicle. (Book p63)"},{"id":"SURG-C11-034","sec":"Axillary Clearance Boundaries","page":63,"q":"The inferior boundary of axillary clearance is:","opts":["Angular vein","Axillary vein","Halstead ligament","Thoraco-dorsal pedicle"],"ans":0,"exp":"Inferior boundary: Angular vein. (Book p63)"},{"id":"SURG-C11-035","sec":"Axillary Clearance Boundaries","page":63,"q":"During axillary clearance the long thoracic nerve is:","opts":["Saved and is not a boundary","A medial boundary","Removed with the nodes","The superior boundary"],"ans":0,"exp":"Long thoracic nerve: Saved; Not a boundary. (Book p63)"},{"id":"SURG-C11-036","sec":"Axillary Clearance Boundaries","page":63,"q":"Minimum number of lymph nodes removed in axillary clearance:","opts":["10","4","6","20"],"ans":0,"exp":"Minimum 10 lymph nodes removed in axillary clearance. (Book p63)"},{"id":"SURG-C11-037","sec":"Complications of Mastectomy","page":64,"q":"Bleeding after mastectomy is classified as:","opts":["Primary, reactionary and secondary","Early and late","Arterial and venous","Capillary only"],"ans":0,"exp":"Bleeding: Primary, Reactionary, Secondary. (Book p64)"},{"id":"SURG-C11-038","sec":"Complications of Mastectomy","page":64,"q":"The most commonly (m/c) injured nerve in mastectomy/axillary clearance is:","opts":["Intercostobrachial nerve","Long thoracic nerve","Thoracodorsal pedicle","Medial pectoral nerve"],"ans":0,"exp":"Injury to nerves: Intercostobrachial nerve (m/c). (Book p64)"},{"id":"SURG-C11-039","sec":"Complications of Mastectomy","page":64,"q":"Intercostobrachial nerve injury causes:","opts":["Numbness & ↓ sensation in axilla","Winging of scapula","Latissimus dorsi wasting","Pectoralis major paralysis"],"ans":0,"exp":"Intercostobrachial nerve (m/c) → Numbness & ↓ sensation in axilla. (Book p64)"},{"id":"SURG-C11-040","sec":"Complications of Mastectomy","page":64,"q":"Winging of scapula after axillary clearance is due to injury of:","opts":["Long thoracic nerve / Nerve to Santorini / Nerve of Bell","Intercostobrachial nerve","Thoracodorsal pedicle","Lateral pectoral nerve"],"ans":0,"exp":"Long thoracic nerve / Nerve to Santorini / Nerve of Bell → winging of scapula. (Book p64)"},{"id":"SURG-C11-041","sec":"Complications of Mastectomy","page":64,"q":"Injury to the thoracodorsal pedicle affects:","opts":["Latissimus dorsi","Serratus anterior","Pectoralis major","Teres major"],"ans":0,"exp":"Thoracodorsal pedicle → Affects Latissimus dorsi. (Book p64)"},{"id":"SURG-C11-042","sec":"Complications of Mastectomy","page":64,"q":"Injury to the lateral & medial pectoral nerves affects:","opts":["P. major / minor","Latissimus dorsi","Serratus anterior","Deltoid"],"ans":0,"exp":"Lateral & medial pectoral nerves → affects P. major/minor. (Book p64)"},{"id":"SURG-C11-043","sec":"Complications of Mastectomy","page":64,"q":"Flap necrosis after mastectomy occurs due to:","opts":["Compromised blood supply","Seroma","Nerve injury","Early drain removal"],"ans":0,"exp":"Flap necrosis (d/t compromised blood supply). (Book p64)"},{"id":"SURG-C11-044","sec":"Complications of Mastectomy","page":64,"q":"The m/c complication of mastectomy is:","opts":["Seroma formation","Winging of scapula","Flap necrosis","Lymphedema"],"ans":0,"exp":"Seroma formation: m/c complication. (Book p64)"},{"id":"SURG-C11-045","sec":"Complications of Mastectomy","page":64,"q":"A seroma is:","opts":["Fluid accumulation beneath the flap","Pus in the axilla","Blood in the pleural cavity","CSF leak"],"ans":0,"exp":"Seroma: Fluid accumulation beneath the flap. (Book p64)"},{"id":"SURG-C11-046","sec":"Complications of Mastectomy","page":64,"q":"Seroma after mastectomy is prevented by:","opts":["Romovac suction drain","Pressure dressing alone","Prophylactic antibiotics","Early arm exercise"],"ans":0,"exp":"Prevention: Romovac suction drain. (Book p64)"},{"id":"SURG-C11-047","sec":"Complications of Mastectomy","page":64,"q":"The Romovac suction drain is removed when output is:","opts":["< 40 cc/day for a consecutive days","< 100 cc/day once","< 500 cc/day","Immediately after surgery"],"ans":0,"exp":"Removed when output < 40 cc/day for a consecutive days. (Book p64)"},{"id":"SURG-C11-048","sec":"Complications of Mastectomy","page":64,"q":"Treatment of seroma includes all EXCEPT:","opts":["Do not put the drain again","Aspirate under aseptic conditions","Pressure dressing","Re-insert the Romovac drain"],"ans":0,"exp":"Rx of seroma: Aspirate under aseptic conditions; Pressure dressing; Do not put the drain again. (Book p64)"},{"id":"SURG-C11-049","sec":"Lymphedema & Stewart-Treves","page":64,"q":"Post mastectomy/axillary clearance lymphedema is the:","opts":["m/c cause of upper limb lymphedema","rarest cause of limb swelling","m/c cause of lower limb lymphedema","cause of breast swelling"],"ans":0,"exp":"m/c cause of upper limb lymphedema. (Book p64)"},{"id":"SURG-C11-050","sec":"Lymphedema & Stewart-Treves","page":64,"q":"Post mastectomy lymphedema typically develops:","opts":["Few weeks-months after Sx","On the operating table","After 10 years only","Only after RT"],"ans":0,"exp":"Develops few weeks-months after Sx. (Book p64)"},{"id":"SURG-C11-051","sec":"Lymphedema & Stewart-Treves","page":64,"q":"Incidence of lymphedema after lymph node clearance is:","opts":["5-15%","50%","1%","80%"],"ans":0,"exp":"Lymph node clearance (5-15%). (Book p64)"},{"id":"SURG-C11-052","sec":"Lymphedema & Stewart-Treves","page":64,"q":"Factors which ↑ incidence of lymphedema include removal of lymph nodes above the:","opts":["Axillary vein","Angular vein","Cephalic vein","Basilic vein"],"ans":0,"exp":"↑ incidence: Removal of lymph nodes above axillary vein; RT to axilla after lymph node clearance. (Book p64)"},{"id":"SURG-C11-053","sec":"Lymphedema & Stewart-Treves","page":64,"q":"Which factor ↓ the incidence of lymphedema?","opts":["Sentinel lymph node biopsy","Axillary clearance","RT to axilla","Removal of nodes above axillary vein"],"ans":0,"exp":"Factors which ↓ incidence: Sentinel lymph node biopsy. (Book p64)"},{"id":"SURG-C11-054","sec":"Lymphedema & Stewart-Treves","page":65,"q":"Management of lymphedema includes:","opts":["Skin care, lymphedema massages, stockings, exercise","Immediate amputation","Routine re-operation","High dose diuretics only"],"ans":0,"exp":"Mx: Skin care; Lymphedema massages; Stockings; Exercise. (Book p65)"},{"id":"SURG-C11-055","sec":"Lymphedema & Stewart-Treves","page":65,"q":"Long standing lymphedema for 8-10 years can lead to:","opts":["2° cancer / Angiosarcoma (Stewart-Treves syndrome)","Fibroadenoma","Duct ectasia","Fat necrosis"],"ans":0,"exp":"Long standing lymphedema for 8-10 years → 2° cancer/Angiosarcoma → Stewart-Treves syndrome. (Book p65)"},{"id":"SURG-C11-056","sec":"Lymphedema & Stewart-Treves","page":65,"q":"Stewart-Treves syndrome presents with:","opts":["Reddish/bluish skin nodules","Painless jaundice","White patches on arm","Bony swellings"],"ans":0,"exp":"Reddish/bluish skin nodules in long standing lymphedema = Stewart-Treves syndrome. (Book p65)"},{"id":"SURG-C11-057","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"First step in investigating a local recurrence is:","opts":["Repeat biopsy to confirm diagnosis","Start chemotherapy","Mastectomy","PET-CT"],"ans":0,"exp":"Ix: Repeat biopsy to confirm diagnosis. (Book p65)"},{"id":"SURG-C11-058","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"On repeat biopsy of a local recurrence, IHC markers can show change in expression in:","opts":["10-15%","50%","1%","90%"],"ans":0,"exp":"IHC markers (10-15% can show change in IHC expression). (Book p65)"},{"id":"SURG-C11-059","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"Extensive local recurrences covering the chest wall like armour are called:","opts":["Cancer en cuirasse","Cancer en plaque","Peau d'orange","Mastitis carcinomatosa"],"ans":0,"exp":"Extensive local recurrences → Covers chest wall like armour: Cancer en cuirasse. (Book p65)"},{"id":"SURG-C11-060","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"In phantom breast syndrome the patient:","opts":["Feels as if breast is still present","Develops fever","Loses sensation over the scar","Gets bilateral gynaecomastia"],"ans":0,"exp":"Phantom breast syndrome: Patient feels as if breast is still present. (Book p65)"},{"id":"SURG-C11-061","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"Phantom breast syndrome occurs due to:","opts":["ICBN entrapment","Seroma","Hypertrophic scar","Rib metastasis"],"ans":0,"exp":"D/t ICBN entrapment; Pain (+). (Book p65)"},{"id":"SURG-C11-062","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"Reconstructive surgery after mastectomy uses which flaps?","opts":["TRAM & DIEP (Latissimus dorsi also)","Groin flap only","Deltopectoral flap only","Free fibula flap"],"ans":0,"exp":"Reconstructive Sx: TRAM & DIEP; Latissimus dorsi flap can also be used. (Book p65)"},{"id":"SURG-C11-063","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"TRAM flap stands for:","opts":["Transverse rectus abdominus myocutaneous flap","Transverse rectus artery muscle flap","Total rectus abdominis muscle flap","Thoracic rectus anterior myocutaneous flap"],"ans":0,"exp":"TRAM = Transverse rectus abdominus myocutaneous flap. (Book p65)"},{"id":"SURG-C11-064","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"In TRAM flap which tissues are removed?","opts":["Skin, fat, muscle","Skin & fat only","Fat only","Muscle only"],"ans":0,"exp":"TRAM: Elliptical incision; Skin, fat, muscle removed. (Book p65)"},{"id":"SURG-C11-065","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"TRAM flap carries ↑ risk of incisional hernia because:","opts":["Muscle is removed","Skin is removed","Fat is removed","It uses a prosthesis"],"ans":0,"exp":"↑ Risk of incisional hernia (d/t removal of muscle). (Book p65)"},{"id":"SURG-C11-066","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"DIEP flap stands for:","opts":["Deep inferior epigastric artery perforator flap","Deep iliac epigastric perforator flap","Direct inferior epigastric pedicle flap","Deep internal epigastric artery flap"],"ans":0,"exp":"DIEP = Deep inferior epigastric artery perforator flap. (Book p65)"},{"id":"SURG-C11-067","sec":"Local Recurrence, Phantom Breast & Reconstruction","page":65,"q":"DIEP is the best flap because:","opts":["Less abdominal complications (muscle not removed)","It removes muscle","No incision is needed","It uses the latissimus dorsi"],"ans":0,"exp":"DIEP: Skin & fat removed; Best flap: Less abdominal complications (as muscle is not removed). (Book p65)"},{"id":"SURG-C11-068","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"In the surgical management flowchart, a patient with an enlarged lymph node first undergoes:","opts":["Biopsy LN for cancer","Direct axillary clearance","SLNB","Radiotherapy"],"ans":0,"exp":"Patient with enlarged lymph node → Biopsy LN for cancer. (Book p66)"},{"id":"SURG-C11-069","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"If the LN biopsy for cancer is positive (+ve), the next step is:","opts":["Axillary clearance","SLNB","Observation","Hormonal therapy"],"ans":0,"exp":"+ve → Axillary clearance. (Book p66)"},{"id":"SURG-C11-070","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"If the LN biopsy for cancer is negative (−ve), the next step is:","opts":["SLNB","Axillary clearance","Mastectomy","RT"],"ans":0,"exp":"−ve → SLNB. (Book p66)"},{"id":"SURG-C11-071","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"The concept of sentinel lymph node was described by:","opts":["Cabana in penile cancer","Halstead in breast cancer","Patey in penile cancer","Stewart in melanoma"],"ans":0,"exp":"Concept described by: Cabana in penile cancer. (Book p66)"},{"id":"SURG-C11-072","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"The sentinel LN is:","opts":["First draining lymph node from cancer","Largest axillary node","Any level III node","The internal mammary node"],"ans":0,"exp":"Sentinel LN: First draining lymph node from cancer. (Book p66)"},{"id":"SURG-C11-073","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"The sentinel lymph node is most commonly present in:","opts":["Level I of axilla","Level III of axilla","Supraclavicular fossa","Internal mammary chain"],"ans":0,"exp":"Most commonly present in level I of axilla. (Book p66)"},{"id":"SURG-C11-074","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"The m/c nerve injured during SLNB is:","opts":["ICBN","Long thoracic nerve","Thoracodorsal nerve","Vagus nerve"],"ans":0,"exp":"m/c nerve injured: ICBN. (Book p66)"},{"id":"SURG-C11-075","sec":"Lymph Node Mx & SLNB Basics","page":66,"q":"SLNB is used in all the following cancers EXCEPT:","opts":["Glioblastoma","Malignant melanoma","Penile cancer","Vulvar carcinoma"],"ans":0,"exp":"Cancers where SLNB is used: Malignant melanoma; Breast cancer; Penile cancer; Vulvar carcinoma; Head & neck cancer. (Book p66)"},{"id":"SURG-C11-076","sec":"Blue Dye Technique","page":66,"q":"In the blue dye technique, the dye is injected where and in what volume?","opts":["1-1.5 cc methylene blue/isosulfan blue, subcutaneous periareolar","10 cc methylene blue intravenous","5 cc isosulfan blue intramuscular","1-1.5 cc indigo carmine subdermal over the tumor"],"ans":0,"exp":"1-1.5 cc methylene blue/isosulfan blue injected in subcutaneous plane in periareolar region. (Book p66)"},{"id":"SURG-C11-077","sec":"Blue Dye Technique","page":66,"q":"After localising the blue lymph nodes, the next step is:","opts":["Frozen section in normal container","Direct mastectomy","Core biopsy of breast","Gamma camera scan"],"ans":0,"exp":"Localise blue lymph nodes → Frozen section in normal container. (Book p66)"},{"id":"SURG-C11-078","sec":"Blue Dye Technique","page":66,"q":"If frozen section of the sentinel node is cancer −ve:","opts":["Axillary clearance not needed (hence ↓ incidence of lymphedema)","Axillary clearance is mandatory","RT to axilla is mandatory","Repeat SLNB"],"ans":0,"exp":"Cancer −ve → Axillary clearance not needed (Hence ↓ incidence of lymphedema). (Book p66)"},{"id":"SURG-C11-079","sec":"Blue Dye Technique","page":66,"q":"If frozen section of the sentinel node is cancer +ve, the management is:","opts":["Axillary clearance","Observation","Pressure dressing","Repeat frozen section"],"ans":0,"exp":"Cancer +ve → Mx: Axillary clearance. (Book p66)"},{"id":"SURG-C11-080","sec":"Blue Dye Technique","page":66,"q":"The m/c complication of the blue dye technique is:","opts":["Skin tattooing","Anaphylaxis","Skin necrosis","Bluish discolouration of urine"],"ans":0,"exp":"Complications: Skin tattooing (m/c). (Book p66)"},{"id":"SURG-C11-081","sec":"Blue Dye Technique","page":66,"q":"Which of the following is a listed complication of the blue dye technique?","opts":["Anaphylaxis","Winging of scapula","Seroma","Phantom breast"],"ans":0,"exp":"Complications: Skin tattooing (m/c), Anaphylaxis, Bluish discolouration of urine, Skin necrosis. (Book p66)"},{"id":"SURG-C11-082","sec":"Blue Dye Technique","page":66,"q":"A harmless listed complication of methylene/isosulfan blue seen in the urine is:","opts":["Bluish discolouration of urine","Hematuria","Proteinuria","Chyluria"],"ans":0,"exp":"Bluish discolouration of urine is a listed complication. (Book p66)"},{"id":"SURG-C11-083","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the radionucleotide technique, what is injected in the periareolar region?","opts":["Tc99 tagged sulphur colloid","Methylene blue","Ferric oxide","Indocyanine green"],"ans":0,"exp":"Tc99 tagged sulphur colloid injected in periareolar region. (Book p67)"},{"id":"SURG-C11-084","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"Hot nodes (radioactive) in the radionucleotide technique are identified on:","opts":["Gamma camera","MRI","PET-CT","USG"],"ans":0,"exp":"Hot nodes (Radioactive) identified on gamma camera. (Book p67)"},{"id":"SURG-C11-085","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The best technique for SLNB is:","opts":["Combination of blue dye + radionucleotide","Blue dye alone","Palpation alone","ICG alone"],"ans":0,"exp":"Best technique: Combination of blue dye + radionucleotide. (Book p67)"},{"id":"SURG-C11-086","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the indocyanine green (ICG) technique, what is injected?","opts":["ICG + blue dye","ICG + ferric oxide","Tc99 + blue dye","Methylene blue + ferric oxide"],"ans":0,"exp":"ICG + Blue dye injected → Green lymph nodes under filter. (Book p67)"},{"id":"SURG-C11-087","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The advantage of the ICG technique is:","opts":["No radiation exposure","Zero cost","No injection needed","Nodes seen with naked eye without filter"],"ans":0,"exp":"Advantages: No radiation exposure. (Book p67)"},{"id":"SURG-C11-088","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The Sentimag technique uses which compound?","opts":["Ferric oxide compound","Tc99 colloid","Isosulfan blue","Gadolinium"],"ans":0,"exp":"Sentimag technique: Ferric oxide compound used. (Book p67)"},{"id":"SURG-C11-089","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"In the Sentimag technique the lymph node is detected on:","opts":["Magnetic scanner","Gamma camera","X-ray","Thermal camera"],"ans":0,"exp":"LN detected on magnetic scanner. (Book p67)"},{"id":"SURG-C11-090","sec":"Radionucleotide, ICG & Sentimag","page":67,"q":"The advantage of the Sentimag technique is:","opts":["Zero radiation exposure","No equipment needed","It stains nodes blue","It is painful"],"ans":0,"exp":"Advantages: Zero radiation exposure. (Book p67)"}];
const UNITS = [{"id":"SURG-U1-1","ch":1,"n":1,"title":"Consents: Components & Signatures","sec":"Consents · p1","qs":["SURG-C1-001","SURG-C1-002","SURG-C1-003","SURG-C1-004","SURG-C1-005"],"guide":"A valid consent covers identification, diagnosis, the planned procedure, the surgeon, description, patient-specific and procedure-specific complications (any complication >1% incidence), benefits and the alternate procedure — signed by patient, surgeon and witness."},{"id":"SURG-U1-2","ch":1,"n":2,"title":"IV Lines: Color-Coding of Cannulas","sec":"IV Lines · p1","qs":["SURG-C1-006","SURG-C1-007","SURG-C1-008","SURG-C1-009","SURG-C1-010","SURG-C1-011","SURG-C1-012","SURG-C1-013","SURG-C1-014","SURG-C1-015","SURG-C1-016","SURG-C1-017","SURG-C1-018"],"guide":"From narrow to wide: yellow 24G (13/10 ml/min), blue 22G (31/30), pink 20G (67/60), green 18G (96), gray 16G (236/240) and orange 14G (270) — the orange 14G is the shock cannula. The 24G/22G/20G trio is bracketed for paediatric patients."},{"id":"SURG-U1-3","ch":1,"n":3,"title":"IV Lines: Superficial Thrombophlebitis","sec":"IV Lines: Complications · p1","qs":["SURG-C1-019","SURG-C1-020","SURG-C1-021"],"guide":"The m/c IV complication is superficial thrombophlebitis — a tender, cord-like swelling at the cannulation site, managed with a topical heparinoid."},{"id":"SURG-U1-4","ch":1,"n":4,"title":"Safety Checklist: Phases & Sign In","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-022","SURG-C1-023","SURG-C1-024","SURG-C1-025","SURG-C1-026","SURG-C1-027","SURG-C1-028"],"guide":"The checklist runs sign in (before induction of anaesthesia, ward to OT complex) → time out (before skin incision) → sign out (before the patient leaves the OT). Sign in confirms identity, marked site, procedure, written consent, known allergies and risk of >500 ml blood loss."},{"id":"SURG-U1-5","ch":1,"n":5,"title":"Safety Checklist: Time Out & Sign Out","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-029","SURG-C1-030","SURG-C1-031","SURG-C1-032","SURG-C1-033","SURG-C1-034","SURG-C1-035"],"guide":"Time out confirms patient site, procedure name and time, checks antibiotic prophylaxis within the last 30 min and the surgeon's anticipated blood loss. Sign out verifies instruments/sponge/needle count, specimen labelling with patient name and the anaesthetist's actual blood loss — and the book's note: there is no time in phase."},{"id":"SURG-U1-6","ch":1,"n":6,"title":"Estimating Blood Loss","sec":"Estimating Blood Loss · p2","qs":["SURG-C1-036","SURG-C1-037","SURG-C1-038","SURG-C1-039","SURG-C1-040"],"guide":"Actual blood loss = blood in suction − irrigation fluid, or wet mop weight − dry mop weight. A soaked mop holds 100 cc, a fist full of clots 500 cc, and mops carry a radio-opaque line so they are picked up on X-ray."},{"id":"SURG-U1-7","ch":1,"n":7,"title":"OT Zoning: The Four Zones","sec":"OT Zoning · p2","qs":["SURG-C1-041","SURG-C1-042","SURG-C1-043","SURG-C1-044","SURG-C1-045"],"guide":"The OT complex flows through four zones: protective (change rooms, transfer bay, pre & post op rooms, ICU/PACU), clean (equipment store room, maintenance workshop — connecting protective to aseptic), aseptic (the OT itself) and disposal."},{"id":"SURG-U1-8","ch":1,"n":8,"title":"OT Positions: Supine, Trendelenberg & Reverse Trendelenberg","sec":"OT Positions · p3","qs":["SURG-C1-046","SURG-C1-047","SURG-C1-048","SURG-C1-049","SURG-C1-050"],"guide":"Supine/neutral is the m/c position for abdominal and breast surgeries. Trendelenberg (head low, feet up) serves pelvic surgery; reverse Trendelenberg with right side up is used in laparoscopic cholecystectomy, where CO2 pools under the right diaphragm dome and causes right shoulder tip pain — its m/c complication."},{"id":"SURG-U1-9","ch":1,"n":9,"title":"OT Positions: Lithotomy & Lateral (Kidney)","sec":"OT Positions · p3","qs":["SURG-C1-051","SURG-C1-052","SURG-C1-053","SURG-C1-054","SURG-C1-055","SURG-C1-056"],"guide":"Lithotomy serves obstetric, gynecologic, urologic (TURP) and hemorrhoid procedures — with the common peroneal nerve at risk if legs are poorly supported. Lateral/kidney position covers thoracotomy, pyelo/nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap), risking brachial plexus injury from a hyperextended arm."},{"id":"SURG-U1-10","ch":1,"n":10,"title":"OT Positions: Prone, Fowler's, Jackknife & Lloyd-Davis","sec":"OT Positions · p4","qs":["SURG-C1-057","SURG-C1-058","SURG-C1-059","SURG-C1-060","SURG-C1-061","SURG-C1-062","SURG-C1-063","SURG-C1-064"],"guide":"Prone is for spinal and pilonidal sinus surgery. Sitting/Fowler's exposes the posterior cranial fossa in a bloodless field but invites air embolism. Jackknife — once used for hemorrhoid/fissure surgery — is obsolete, killing by positional asphyxia. Lloyd-Davis = Trendelenberg + lithotomy, the rectal cancer position."},{"id":"SURG-U1-11","ch":1,"n":11,"title":"Air Embolism: Features, Prevention & Management","sec":"Air Embolism · p4","qs":["SURG-C1-065","SURG-C1-066","SURG-C1-067","SURG-C1-068","SURG-C1-069","SURG-C1-070","SURG-C1-071","SURG-C1-072","SURG-C1-073","SURG-C1-074"],"guide":"50-100 cc of air sucked into a vein dysregulates cardiac function; watch for it in thyroid/head & neck surgery and in Fowler's position. Sudden desaturation, dyspnea and hypotension are the clues — prevent by ligating the vein before cutting and irrigating the field, and treat with the Durant position (right side up/left lateral + legs up) followed by aspiration via direct puncture/central line."},{"id":"SURG-U1-12","ch":1,"n":12,"title":"Events in Patient Safety","sec":"Events in Patient Safety · p5","qs":["SURG-C1-075","SURG-C1-076","SURG-C1-077","SURG-C1-078","SURG-C1-079"],"guide":"An adverse event harms the patient; a near miss could have but didn't (stopped by chance or timely intervention); a no-harm event reaches the patient without injury, harm dodged by chance or mitigating circumstances."},{"id":"SURG-U2-1","ch":2,"n":1,"title":"Types of Surgical Blades","sec":"Blades · p6","qs":["SURG-C2-001","SURG-C2-002","SURG-C2-003","SURG-C2-004","SURG-C2-005","SURG-C2-006","SURG-C2-007","SURG-C2-008"],"guide":"Blades exist to make incisions, and the belly is the sharpest part. The pointed No. 11 stab blade opens abscesses and arteries, while the curved No. 12 slips under sutures to remove them - with No. 10, 15, 22 and 23 completing the tray."},{"id":"SURG-U2-2","ch":2,"n":2,"title":"Blade Handling & the BP Handle","sec":"Blade Handling · p6","qs":["SURG-C2-009","SURG-C2-010","SURG-C2-011"],"guide":"Sharps travel safely in a kidney tray with the pointed end facing the passer, never the surgeon. Every blade clicks onto the familiar BP (Bard Parker) handle before it touches skin."},{"id":"SURG-U2-3","ch":2,"n":3,"title":"Incisions & Langer's Lines","sec":"Incisions · p6","qs":["SURG-C2-012","SURG-C2-013","SURG-C2-014","SURG-C2-015","SURG-C2-016","SURG-C2-017","SURG-C2-018","SURG-C2-019","SURG-C2-020"],"guide":"Cut perpendicular to skin, travelling far to near. Respect Langer's relaxed tension lines - the grain of dermal collagen - because parallel incisions heal into fine scars, hide in creases, spare anatomical structures and still give adequate access."},{"id":"SURG-U2-4","ch":2,"n":4,"title":"Monopolar Cautery: Circuit & Cautery Pad","sec":"Monopolar Cautery · p7","qs":["SURG-C2-021","SURG-C2-022","SURG-C2-023","SURG-C2-024","SURG-C2-025","SURG-C2-026","SURG-C2-027","SURG-C2-028"],"guide":"Current sprints from machine to Bovie tip, through tissue, body and pad, then home to the machine. That pad must sit broad on well-vascularized skin - shrink it and you burn the patient, skip it and monopolar simply will not work."},{"id":"SURG-U2-5","ch":2,"n":5,"title":"Monopolar Cautery: Hazards, Uses & Avoidance","sec":"Monopolar Cautery · p7","qs":["SURG-C2-029","SURG-C2-030","SURG-C2-031","SURG-C2-032","SURG-C2-033","SURG-C2-034","SURG-C2-035","SURG-C2-036","SURG-C2-037","SURG-C2-038"],"guide":"Monopolar cuts and coagulates, but its current wanders - scorching neighbours, confusing pacemakers and channelling down pedicles to their base. Keep it away from end arteries, the CNS, parotid and thyroid, the ear lobule, the penis and any paced heart."},{"id":"SURG-U2-6","ch":2,"n":6,"title":"Bipolar Cautery","sec":"Bipolar Cautery · p7","qs":["SURG-C2-039","SURG-C2-040","SURG-C2-041","SURG-C2-042","SURG-C2-043"],"guide":"Bipolar current hops between two prongs and finishes its circuit right there in the forceps tips. With no pad and no stray current, it coagulates safely beside vital structures and end arteries - but it only coagulates, never cuts."},{"id":"SURG-U2-7","ch":2,"n":7,"title":"Currents & Waveforms","sec":"Currents · p8","qs":["SURG-C2-044","SURG-C2-045","SURG-C2-046","SURG-C2-047","SURG-C2-048","SURG-C2-049","SURG-C2-050","SURG-C2-051"],"guide":"Low-voltage continuous waves slice by exploding cell water; high-voltage interrupted waves desiccate and denature protein until the cell dies. Blend mixes the two, while fulguration spikes the voltage peaks higher still."},{"id":"SURG-U2-8","ch":2,"n":8,"title":"Ligasure","sec":"Ligasure · p8","qs":["SURG-C2-052","SURG-C2-053","SURG-C2-054","SURG-C2-055","SURG-C2-056","SURG-C2-057"],"guide":"Ligasure squeezes vessels with heat plus pressure, melting the body's own collagen and elastin into a seal, then stops itself the instant the seal closes. A live feedback loop meters every joule - good till 7 mm, but keep it away from vital structures."},{"id":"SURG-U2-9","ch":2,"n":9,"title":"Harmonic Scalpel","sec":"Harmonic Scalpel · p8","qs":["SURG-C2-058","SURG-C2-059","SURG-C2-060","SURG-C2-061","SURG-C2-062","SURG-C2-063","SURG-C2-064"],"guide":"The harmonic blade shivers 2,000 to 50,000 times a second, denaturing protein and coagulating without heat. It carves precisely, even through scar and beside vital structures - at the price of patience, because it is slow."},{"id":"SURG-U2-10","ch":2,"n":10,"title":"CUSA & Thunderbeat S","sec":"CUSA · p9","qs":["SURG-C2-065","SURG-C2-066","SURG-C2-067","SURG-C2-068","SURG-C2-069","SURG-C2-070","SURG-C2-071"],"guide":"CUSA is a harmonic scalpel that crumbles watery hepatocytes for liver resection - happiest in a soft, non-cirrhotic liver - while sucking debris and even gases away. Thunderbeat S then marries Ligasure's sealing to the harmonic's cut in one jaw."},{"id":"SURG-U2-11","ch":2,"n":11,"title":"RFA & Microwave Ablation","sec":"RFA & Microwave · p9","qs":["SURG-C2-072","SURG-C2-073","SURG-C2-074","SURG-C2-075","SURG-C2-076","SURG-C2-077","SURG-C2-078","SURG-C2-079"],"guide":"RFA burns liver tumours up to 3 cm with high-frequency alternating current, grounding pad and all. Microwaves, humming between infra-red and radiowaves, need no pad, finish faster and leave a smooth homogenous kill zone."},{"id":"SURG-U3-1","ch":3,"n":1,"title":"Drains: Open, Closed, Romovac & Minivac","sec":"Drains · p10","qs":["SURG-C3-001","SURG-C3-002","SURG-C3-003","SURG-C3-004","SURG-C3-005","SURG-C3-006","SURG-C3-007","SURG-C3-008","SURG-C3-009"],"guide":"Open drains are obsolete museum pieces that stain a soak dressing, while closed drains empty into a container or bag. Romovac - a closed negative-pressure system for mastectomy, thyroidectomy and neck dissection - must never enter the abdomen, where its rounded tip risks perforation; the tiny minivac instead follows sentinel node biopsy."},{"id":"SURG-U3-2","ch":3,"n":2,"title":"Drains: Jackson Pratt, Abdominal & Underwater Seal","sec":"Drains · p10","qs":["SURG-C3-010","SURG-C3-011","SURG-C3-012","SURG-C3-013","SURG-C3-014","SURG-C3-015","SURG-C3-016","SURG-C3-017","SURG-C3-018"],"guide":"The Jackson Pratt pairs a squeezable bulb with flat tubes that slide safely into the abdomen, unlike the rounded Romovac. A plain abdominal drain is closed but pressure-free, while chest tubes bubble through an underwater seal whose submerged tip bars air from being sucked in."},{"id":"SURG-U3-3","ch":3,"n":3,"title":"Knot Types: Reef, Granny & Surgeon's","sec":"Knots · p11","qs":["SURG-C3-019","SURG-C3-020","SURG-C3-021","SURG-C3-022","SURG-C3-023","SURG-C3-024","SURG-C3-025","SURG-C3-026"],"guide":"The reef (square) knot - one square throw on another with matching crossings - is the most basic knot in surgery. Cross the throws oppositely and you get a granny or slip knot that opens up, while the surgeon's knot doubles the first throw for extra grip before a single locking throw."},{"id":"SURG-U3-4","ch":3,"n":4,"title":"Skin Suturing & Principles","sec":"Skin Suturing · p11","qs":["SURG-C3-027","SURG-C3-028","SURG-C3-029","SURG-C3-030"],"guide":"Skin heals kindest when its edges are everted and the needle bites at a full 90 degrees. The geometry is simple arithmetic: take a bite of x on each side and space the sutures 2x apart."},{"id":"SURG-U3-5","ch":3,"n":5,"title":"Suture Types: Simple, Mattress & Subcuticular","sec":"Suture Types · p12","qs":["SURG-C3-031","SURG-C3-032","SURG-C3-033","SURG-C3-034","SURG-C3-035","SURG-C3-036","SURG-C3-037","SURG-C3-038"],"guide":"Simple sutures fail to evert, but mattress sutures evert and staunch bleeding - vertical at two depths, horizontal at one depth with the least cut-through. When scars must vanish, a 3-0 monocryl on a cutting needle runs hidden beneath the skin in a mark-free subcuticular line."},{"id":"SURG-U3-6","ch":3,"n":6,"title":"Other Sutures: Lock & Purse String","sec":"Other Sutures · p12","qs":["SURG-C3-039","SURG-C3-040","SURG-C3-041","SURG-C3-042","SURG-C3-043","SURG-C3-044"],"guide":"A continuous suture closes with an Aberdeen's or Cobbler's knot, and locking each loop spreads tension evenly along the wound. The purse string instead cinches like a drawstring - burying the appendicular stump or encircling the cervix."},{"id":"SURG-U3-7","ch":3,"n":7,"title":"Far-Near-Near-Far & Shoe String","sec":"Special Sutures · p13","qs":["SURG-C3-045","SURG-C3-046","SURG-C3-047","SURG-C3-048","SURG-C3-049"],"guide":"The far-near-near-far stitch collapses and obliterates a large dead cavity in one pass. Fasciotomy wounds instead close slowly with the shoe string technique - gradual tightening that heals by tertiary intention, a delayed primary closure."},{"id":"SURG-U3-8","ch":3,"n":8,"title":"Needles: Round Body vs Cutting","sec":"Needles · p13","qs":["SURG-C3-050","SURG-C3-051","SURG-C3-052","SURG-C3-053","SURG-C3-054","SURG-C3-055","SURG-C3-056","SURG-C3-057","SURG-C3-058","SURG-C3-059"],"guide":"Round-bodied needles split tissue atraumatically, gliding through the delicate B's - bowel, bladder, blood vessels and CBD. Cutting and reverse-cutting needles slice through the tough S's - sheath, skin and fascia - at the price of greater trauma."},{"id":"SURG-U3-9","ch":3,"n":9,"title":"Needle Parts, Color Codes & Numbering","sec":"Suture Coding · p13","qs":["SURG-C3-060","SURG-C3-061","SURG-C3-062","SURG-C3-063","SURG-C3-064","SURG-C3-065","SURG-C3-066","SURG-C3-067","SURG-C3-068","SURG-C3-069","SURG-C3-070","SURG-C3-071","SURG-C3-072"],"guide":"Every needle runs from point through a two-thirds shaft to a one-third swaged end that carries the suture, gripped by a needle holder. Colors speak instantly - brown catgut, violet vicryl, blue prolene, black silk - while numbers whisper finesse: No. 1 is thickest and 11-0 the finest."},{"id":"SURG-U3-10","ch":3,"n":10,"title":"Suture Classification","sec":"Classification · p14","qs":["SURG-C3-073","SURG-C3-074","SURG-C3-075","SURG-C3-076","SURG-C3-077","SURG-C3-078","SURG-C3-079","SURG-C3-080","SURG-C3-081","SURG-C3-082","SURG-C3-083","SURG-C3-084","SURG-C3-085","SURG-C3-086","SURG-C3-087"],"guide":"Natural sutures like silk and catgut are antigenic, provoke strong inflammation and dissolve by proteolysis. Synthetic sutures - prolene, PDS, vicryl - stay inert and dissolve by hydrolysis, with synthetic non-absorbables the most inert of all; monofilaments handle stiffly with strong memory while braids handle sweetly but invite infection."},{"id":"SURG-U3-11","ch":3,"n":11,"title":"Natural Absorbable: Catgut","sec":"Natural Absorbable · p15","qs":["SURG-C3-088","SURG-C3-089","SURG-C3-090","SURG-C3-091"],"guide":"Plain catgut - sheep gut submucosa - vanishes by phagocytosis within 7 to 10 days. Chromic tanning stretches its tensile strength to 21-28 days and full absorption to 90 days."},{"id":"SURG-U3-12","ch":3,"n":12,"title":"Synthetic Absorbable: Monocryl, Vicryl & PDS","sec":"Synthetic Absorbable · p15","qs":["SURG-C3-092","SURG-C3-093","SURG-C3-094","SURG-C3-095","SURG-C3-096","SURG-C3-097","SURG-C3-098","SURG-C3-099","SURG-C3-100","SURG-C3-101","SURG-C3-102","SURG-C3-103","SURG-C3-104","SURG-C3-105","SURG-C3-106","SURG-C3-107","SURG-C3-108","SURG-C3-109"],"guide":"Monofilament monocryl runs subcuticular lines on cutting needles, while braided vicryl holds CBD, bowel and bladder on round-bodied needles for 60-90 days - with triclosan-coated, barbed and rapide avatars. PDS outlasts them all at 180 days and even repairs the tracheobronchial tree."},{"id":"SURG-U3-13","ch":3,"n":13,"title":"Silk: Natural Non-absorbable","sec":"Silk · p16","qs":["SURG-C3-110","SURG-C3-111","SURG-C3-112","SURG-C3-113","SURG-C3-114"],"guide":"Silk - black, braided, spun by silkworms - closes skin with 2-0 or 3-0 on cutting needles, anchors drains with stout No. 1 to 2-0, and lays the second layer of bowel anastomosis with 3-0 on a round body."},{"id":"SURG-U3-14","ch":3,"n":14,"title":"Synthetic Non-absorbable: Prolene to Polybutester","sec":"Synthetic Non-absorbable · p16","qs":["SURG-C3-115","SURG-C3-116","SURG-C3-117","SURG-C3-118","SURG-C3-119","SURG-C3-120","SURG-C3-121","SURG-C3-122","SURG-C3-123","SURG-C3-124","SURG-C3-125","SURG-C3-126","SURG-C3-127","SURG-C3-128"],"guide":"Blue monofilament prolene weaves hernia mesh, closes sheaths by Jenkin's four-to-one rule, and steps down vessels from 2-0 aorta to 6-0 popliteal. Nylon serves skin, cataract and nerve-tendon repairs, steel wires post-CABG sternums, polyester holds rectus and tendon, a
