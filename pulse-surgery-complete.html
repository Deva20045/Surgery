nd polybutester lingers rarely in plastic surgery."},{"id":"SURG-U3-15","ch":3,"n":15,"title":"Suture Removal Timings","sec":"Suture Removal · p17","qs":["SURG-C3-129","SURG-C3-130","SURG-C3-131","SURG-C3-132","SURG-C3-133","SURG-C3-134","SURG-C3-135","SURG-C3-136"],"guide":"Only non-absorbable sutures come out: face first at 3-5 days, scalp and neck at 5-7, thorax and perineum at 10-12, and abdomen last at 12-14 days."},{"id":"SURG-U3-16","ch":3,"n":16,"title":"Bowel Anastomosis & Staplers","sec":"Bowel Anastomosis · p17","qs":["SURG-C3-137","SURG-C3-138","SURG-C3-139","SURG-C3-140","SURG-C3-141","SURG-C3-142","SURG-C3-143","SURG-C3-144","SURG-C3-145","SURG-C3-146","SURG-C3-147","SURG-C3-148","SURG-C3-149","SURG-C3-150","SURG-C3-151"],"guide":"Bowel demands inverted edges, trusting the submucosa as its strongest layer - whether joined by single extramucosal, two-layer Albert-plus-Lembert, or stapler. Linear staplers fire side-to-side joins, sleeves and Zenker's pouches; circular staplers fix haemorrhoids and low anterior resections; Cheatle's slit widens narrow ends and the Connel loop guarantees inversion."},{"id":"SURG-U4-1","ch":4,"n":1,"title":"Post-op Fever: Causes by Day","sec":"Fever Causes · p18","qs":["SURG-C4-001","SURG-C4-002","SURG-C4-003","SURG-C4-004","SURG-C4-005","SURG-C4-006","SURG-C4-007","SURG-C4-008"],"guide":"Fever tells time after surgery: atelectasis on day 1, pneumonia, thrombophlebitis and UTI on days 2-3, wound infection and DVT on days 4-5, burst abdomen on day 6, and deep intra-abdominal collections from day 7 onward."},{"id":"SURG-U4-2","ch":4,"n":2,"title":"Pneumonia, Thrombophlebitis & Atelectasis","sec":"Atelectasis · p18","qs":["SURG-C4-009","SURG-C4-010","SURG-C4-011","SURG-C4-012","SURG-C4-013","SURG-C4-014","SURG-C4-015","SURG-C4-016","SURG-C4-017","SURG-C4-018","SURG-C4-019"],"guide":"Post-operative pneumonia brings fever cured by antibiotics, while superficial thrombophlebitis adds pain soothed by topical heparinoids. Atelectasis - collapsed alveoli, the commonest day-1 fever - is prevented by incentive spirometry, pain control, treating CHF and COPD, steam, and quitting smoking 4-6 weeks ahead."},{"id":"SURG-U4-3","ch":4,"n":3,"title":"Deep Vein Thrombosis","sec":"DVT · p19","qs":["SURG-C4-020","SURG-C4-021","SURG-C4-022","SURG-C4-023","SURG-C4-024","SURG-C4-025","SURG-C4-026","SURG-C4-027","SURG-C4-028"],"guide":"DVT swells one leg - lower limbs far more than upper - and is confirmed on duplex scan. Early ambulation defeats stasis, pneumatic stockings squeeze the calves, and low molecular weight heparin is the drug of choice for prophylaxis."},{"id":"SURG-U4-4","ch":4,"n":4,"title":"Burst Abdomen","sec":"Burst Abdomen · p19","qs":["SURG-C4-029","SURG-C4-030","SURG-C4-031","SURG-C4-032","SURG-C4-033","SURG-C4-034","SURG-C4-035","SURG-C4-036","SURG-C4-037"],"guide":"On day 6 a cough can split the rectus sheath open, baring bowel beneath a dressing soaked in reddish salmon fluid. The emergency answer is repositing bowel under a Bogota bag, with definitive resuturing in theatre - while chronic cough, constipation, infection, obesity, immunosuppression and malnutrition set the stage."},{"id":"SURG-U4-5","ch":4,"n":5,"title":"Surgeon Factors & Rectus Closure","sec":"Sx Factors · p20","qs":["SURG-C4-038","SURG-C4-039","SURG-C4-040","SURG-C4-041","SURG-C4-042","SURG-C4-043","SURG-C4-044"],"guide":"Midline, emergency, continuous, long-bite, short-thread closures burst most - Jenkins demands thread four times the wound length. Non-absorbable suture closes adult rectus, while children get delayed-absorbable PDS."},{"id":"SURG-U4-6","ch":4,"n":6,"title":"Intra-abdominal Abscesses","sec":"Abscess · p20","qs":["SURG-C4-045","SURG-C4-046","SURG-C4-047","SURG-C4-048","SURG-C4-049","SURG-C4-050","SURG-C4-051","SURG-C4-052","SURG-C4-053","SURG-C4-054","SURG-C4-055"],"guide":"Pus seeks the pelvis in walkers and Morrison's pouch in the bedridden, announcing itself with fever, chills and rigor. Subdiaphragmatic pus triggers hiccups and referred shoulder pain; pelvic pus brings mucous diarrhoea and frequent micturition - diagnosed by CECT and drained by USG-guided pigtail."},{"id":"SURG-U4-7","ch":4,"n":7,"title":"SSI: Definition & Types","sec":"SSI · p21","qs":["SURG-C4-056","SURG-C4-057","SURG-C4-058","SURG-C4-059","SURG-C4-060"],"guide":"A surgical site infection strikes within 30 days - or within a year if an implant was placed. Superficial infection stays above fascia, deep goes below it, and organ-space infection pools inside an organ or cavity."},{"id":"SURG-U4-8","ch":4,"n":8,"title":"ASEPSIS Wound Score","sec":"ASEPSIS · p21","qs":["SURG-C4-061","SURG-C4-062","SURG-C4-063","SURG-C4-064","SURG-C4-065","SURG-C4-066","SURG-C4-067","SURG-C4-068"],"guide":"ASEPSIS grades wounds by Additional treatment, Serous discharge, Erythema, Purulent exudate, Separation of deep tissues, Isolation of bacteria, and inpatient Stay beyond 14 days - with pus drained under local but debridement under general anaesthesia."},{"id":"SURG-U4-9","ch":4,"n":9,"title":"Southampton Wound Score","sec":"Southampton · p21","qs":["SURG-C4-069","SURG-C4-070","SURG-C4-071","SURG-C4-072","SURG-C4-073","SURG-C4-074"],"guide":"Southampton climbs from 0 - normal healing - through bruising, erythema and clear discharge to frank pus at grade IV and deep severe infection with or without breakdown at grade V."},{"id":"SURG-U4-10","ch":4,"n":10,"title":"SSI Risk Factors","sec":"Risk Factors · p21","qs":["SURG-C4-075","SURG-C4-076","SURG-C4-077","SURG-C4-078","SURG-C4-079","SURG-C4-080","SURG-C4-081"],"guide":"Neonates and the elderly, recent chest or abdominal surgery, distant coexisting infection, diabetes, steroids, low cholesterol, obesity, malnutrition, chronic inflammation, prior irradiation, hypothermia and hypoxemia - twelve flags that mark a wound for infection."},{"id":"SURG-U4-11","ch":4,"n":11,"title":"Wound Classes I-IV","sec":"Wound Types · p22","qs":["SURG-C4-082","SURG-C4-083","SURG-C4-084","SURG-C4-085","SURG-C4-086","SURG-C4-087","SURG-C4-088","SURG-C4-089","SURG-C4-090","SURG-C4-091","SURG-C4-092","SURG-C4-093","SURG-C4-094","SURG-C4-095","SURG-C4-096","SURG-C4-097","SURG-C4-098","SURG-C4-099"],"guide":"Clean wounds infect at 1-2% with or without antibiotics; clean-contaminated at 3% versus 6-9%; contaminated at 6% versus 20% with antibiotics continued; and dirty pus-filled wounds at 7-8% versus 20-40% - from thyroid and hernia surgery at one end to abscesses and peritonitis at the other."},{"id":"SURG-U4-12","ch":4,"n":12,"title":"Golden & Decisive Periods","sec":"Periods · p22","qs":["SURG-C4-100","SURG-C4-101","SURG-C4-102","SURG-C4-103"],"guide":"The golden period gives traumatic wounds 6 hours - just 1 hour after major trauma - while the decisive 4 hours span skin incision to bacterial colonisation. On elective lists, clean cases always go first."},{"id":"SURG-U4-13","ch":4,"n":13,"title":"Hand Hygiene & Part Preparation","sec":"Hand Hygiene · p23","qs":["SURG-C4-104","SURG-C4-105","SURG-C4-106","SURG-C4-107","SURG-C4-108","SURG-C4-109","SURG-C4-110","SURG-C4-111"],"guide":"The surgeon's hands matter most: 3-minute scrubs with soap or alcohol rub - soap alone after toilets or visible soil - across the five WHO moments. Hair falls to clippers, never razors, whose microabrasions seed infection."},{"id":"SURG-U4-14","ch":4,"n":14,"title":"Cleaning the Operative Part","sec":"Cleaning · p23","qs":["SURG-C4-112","SURG-C4-113","SURG-C4-114","SURG-C4-115","SURG-C4-116","SURG-C4-117","SURG-C4-118","SURG-C4-119","SURG-C4-120","SURG-C4-121","SURG-C4-122"],"guide":"Chlorhexidine plus alcohol beats betadine for skin prep - inframammary crease to mid-thigh in women, nipple to mid-thigh in men, abdomen medial-to-lateral, thigh lateral-to-medial, limbs a joint beyond, always incision-first and outward, twice over, then left to dry."},{"id":"SURG-U4-15","ch":4,"n":15,"title":"Prophylactic Antibiotics & OT Parameters","sec":"OT Parameters · p24","qs":["SURG-C4-123","SURG-C4-124","SURG-C4-125","SURG-C4-126","SURG-C4-127","SURG-C4-128","SURG-C4-129","SURG-C4-130","SURG-C4-131"],"guide":"Antibiotics peak 30-60 minutes before incision and repeat at 4 hours in long cases. The theatre breathes HEPA-filtered laminar flow at 4 changes an hour under positive pressure, 18-22 degrees, 50-60% humidity - with the Bair hugger, euglycemia, hemostasis and post-operative oxygen completing the shield."},{"id":"SURG-U5-1","ch":5,"n":1,"title":"Definition & Day-Care Examples","sec":"Definition · p25","qs":["SURG-C5-001","SURG-C5-002","SURG-C5-003","SURG-C5-004","SURG-C5-005","SURG-C5-006","SURG-C5-007","SURG-C5-008","SURG-C5-009","SURG-C5-010"],"guide":"Day care means in and out within 12 hours - from haemorrhoids, hernias and lap cholecystectomy to breast biopsy, TURP, carpal tunnel release and varicose vein procedures."},{"id":"SURG-U5-2","ch":5,"n":2,"title":"Selection: Medical Criteria","sec":"Selection · p25","qs":["SURG-C5-011","SURG-C5-012","SURG-C5-013","SURG-C5-014","SURG-C5-015"],"guide":"Physiological age trumps chronological age: ASA I-II patients suit stand-alone centres while ASA III needs a hospital unit, with BMI capped at 38 for laparoscopic and 40 for surface procedures."},{"id":"SURG-U5-3","ch":5,"n":3,"title":"Selection: Diabetes, Social & Surgical","sec":"Selection · p26","qs":["SURG-C5-016","SURG-C5-017","SURG-C5-018","SURG-C5-019","SURG-C5-020","SURG-C5-021","SURG-C5-022"],"guide":"Diabetics under HbA1C 8.5 skip the morning OHA, blood pressure stays below 180/100, and epilepsy must be well controlled. Behind every day-care patient stands a responsible adult for 24 hours, a suitable home, operations under 2 hours, and a quick return to eating and drinking."},{"id":"SURG-U5-4","ch":5,"n":4,"title":"Scheduling & Anaesthesia","sec":"Scheduling · p26","qs":["SURG-C5-023","SURG-C5-024","SURG-C5-025","SURG-C5-026","SURG-C5-027"],"guide":"Comorbid patients get priority in stand-alone units, and day cases lead mixed lists. Propofol TIVA keeps nausea away while bupivacaine infiltration handles the pain."},{"id":"SURG-U5-5","ch":5,"n":5,"title":"Post-op Complications","sec":"Complications · p26","qs":["SURG-C5-028","SURG-C5-029","SURG-C5-030","SURG-C5-031","SURG-C5-032","SURG-C5-033","SURG-C5-034"],"guide":"Haemorrhage - primary during surgery, reactionary within 4-24 hours, secondary days later from infection - is the commonest cause of re-admission. PONV, predicted by the Apfel score, is the commonest complication overall, followed by pain."},{"id":"SURG-U5-6","ch":5,"n":6,"title":"Discharge Criteria","sec":"Discharge · p27","qs":["SURG-C5-035","SURG-C5-036","SURG-C5-037","SURG-C5-038","SURG-C5-039","SURG-C5-040","SURG-C5-041","SURG-C5-042","SURG-C5-043","SURG-C5-044","SURG-C5-045","SURG-C5-046","SURG-C5-047"],"guide":"Discharge demands an hour of stable vitals, full orientation, controlled pain with oral analgesia in hand, the ability to dress and walk, minimal nausea or bleeding, sips of fluid, passed urine, a responsible escort, clear written and verbal instructions, a follow-up plan and an emergency number."},{"id":"SURG-U5-7","ch":5,"n":7,"title":"ERAS Protocol","sec":"ERAS · p27","qs":["SURG-C5-048","SURG-C5-049","SURG-C5-050","SURG-C5-051","SURG-C5-052","SURG-C5-053","SURG-C5-054","SURG-C5-055","SURG-C5-056","SURG-C5-057","SURG-C5-058","SURG-C5-059","SURG-C5-060","SURG-C5-061","SURG-C5-062","SURG-C5-063","SURG-C5-064"],"guide":"ERAS fast-tracks recovery: counselled patients skip bowel prep, take solids till 6 hours and carb drinks till 2-3 hours, glide through minimally invasive surgery kept warm with multimodal antiemetics, then eat, walk and leave IV fluids behind - all within 24 hours on non-opioid analgesia."},{"id":"SURG-U6-1","ch":6,"n":1,"title":"Nutritional Assessment: Indicators","sec":"Nutritional Assessment · p28","qs":["SURG-C6-001","SURG-C6-002","SURG-C6-003","SURG-C6-004","SURG-C6-005","SURG-C6-006","SURG-C6-007","SURG-C6-008"],"guide":"No single biochemical marker identifies malnutrition: low albumin foretells poor outcome while pre albumin tracks better, >10% unintentional weight loss in 6 months and BMI <15 signal poor prognosis, and skin fold thickness reads body fat while mid arm circumference reads muscle mass."},{"id":"SURG-U6-2","ch":6,"n":2,"title":"MUST Tool & Energy Requirement","sec":"Malnutrition Universal Screening Tool · p28","qs":["SURG-C6-009","SURG-C6-010","SURG-C6-011","SURG-C6-012","SURG-C6-013","SURG-C6-014","SURG-C6-015"],"guide":"The MUST tool adds BMI score, unintentional weight loss and acute disease affect score into an overall malnutrition risk, while the REE table climbs from 1 (20 Kcal/kg/day sedentary) through 1.4 and 1.8 sepsis to 2 with 40 Kcal/kg/day in severe burns."},{"id":"SURG-U6-3","ch":6,"n":3,"title":"Enteral vs Parenteral & Route Algorithm","sec":"Enteral and Parenteral Nutrition · p28","qs":["SURG-C6-016","SURG-C6-017","SURG-C6-018","SURG-C6-019","SURG-C6-020","SURG-C6-021","SURG-C6-022","SURG-C6-023","SURG-C6-024","SURG-C6-025"],"guide":"Enteral beats parenteral because it is physiological, cheap, maintains enterohepatic circulation and blocks bacterial translocation. When oral fails, duration and gastric emptying decide: under 3 weeks a nasogastric or nasojejunal tube, beyond 3 weeks a gastrostomy or jejunostomy."},{"id":"SURG-U6-4","ch":6,"n":4,"title":"Ryles & Nasojejunal Tubes","sec":"Ryles Tube · p29","qs":["SURG-C6-026","SURG-C6-027","SURG-C6-028","SURG-C6-029","SURG-C6-030","SURG-C6-031"],"guide":"Insert the Ryles tube sitting with the neck slightly flexed, measure nose-ear-xiphisternum, and confirm by aspirating gastric contents or auscultating pushed air over the epigastrium; the nasojejunal tube goes in under fluoroscopy and bypasses the stomach."},{"id":"SURG-U6-5","ch":6,"n":5,"title":"Invasive Feeding Tubes: Stamm, Witzel, Gastrostomy vs Jejunostomy","sec":"Invasive Feeding Tubes · p30","qs":["SURG-C6-032","SURG-C6-033","SURG-C6-034","SURG-C6-035","SURG-C6-036","SURG-C6-037","SURG-C6-038","SURG-C6-039","SURG-C6-040"],"guide":"Gastrostomy (Stamm, Witzel, PEG/RIG) is more physiological than jejunostomy (Stamm, Witzel) but risks aspiration. Stamm uses a Red Robinson tube through a stab incision and purse string with peridrain leakage; Witzel tunnels the distal jejunum and leaks less."},{"id":"SURG-U6-6","ch":6,"n":6,"title":"Technique of PEG & RIG","sec":"Technique of PEG · p31","qs":["SURG-C6-041","SURG-C6-042","SURG-C6-043","SURG-C6-044","SURG-C6-045","SURG-C6-046","SURG-C6-047"],"guide":"PEG runs from transoral endoscope insufflation through transillumination and finger indentation, transgastric suture fixation and a Seldinger gastrostomy; RIG steps in when endoscopy is impossible or respiratory or oropharyngeal function is compromised."},{"id":"SURG-U6-7","ch":6,"n":7,"title":"Enteral Principle & Complications","sec":"Enteral Nutrition: Principle · p31","qs":["SURG-C6-048","SURG-C6-049","SURG-C6-050","SURG-C6-051","SURG-C6-052","SURG-C6-053","SURG-C6-054","SURG-C6-055","SURG-C6-056"],"guide":"Start feeds at 10-20 mL/hr and climb to 75 mL/hr if tolerated, withholding the next feed when aspirates exceed 75-100 cc. Tube problems (blockage, migration, leakage) are the m/c complication, while osmotic diarrhoea from hyperosmolar feeds leads feeding-regime trouble."},{"id":"SURG-U6-8","ch":6,"n":8,"title":"Parenteral Nutrition: Indications & Routes","sec":"Parenteral Nutrition · p32","qs":["SURG-C6-057","SURG-C6-058","SURG-C6-059","SURG-C6-060","SURG-C6-061","SURG-C6-062","SURG-C6-063","SURG-C6-064","SURG-C6-065","SURG-C6-066"],"guide":"TPN serves paralytic ileus beyond 72 hours, non-contracting bowel, short bowel syndrome, >500 cc faecal fistulas, acute IBD needing bowel rest and early severe pancreatitis. The central line is the best route, PICC sits in between, and peripheral lines are least preferred for thrombophlebitis."},{"id":"SURG-U6-9","ch":6,"n":9,"title":"Central Line: Vein Comparison & Assessment","sec":"Central Line · p32","qs":["SURG-C6-067","SURG-C6-068","SURG-C6-069","SURG-C6-070","SURG-C6-071","SURG-C6-072","SURG-C6-073","SURG-C6-074","SURG-C6-075","SURG-C6-076"],"guide":"Subclavian lines thrombose and infect least but pneumothorax most and dominate TPN; the internal jugular is easiest to place and the commonest vein overall; femoral lines infect most. The tip must sit in the SVC just above the right atrium, and the X-ray also rules out pneumothorax."},{"id":"SURG-U6-10","ch":6,"n":10,"title":"PICC Line","sec":"PICC Line · p33","qs":["SURG-C6-077","SURG-C6-078","SURG-C6-079","SURG-C6-080","SURG-C6-081"],"guide":"Ultrasound-guided into a peripheral vessel with the tip just above the right atrium, a PICC lasts 2-3 months for chemotherapy, TPN or prolonged antibiotics - but demands regular dressing and care."},{"id":"SURG-U6-11","ch":6,"n":11,"title":"TPN Solution & Types","sec":"TPN Solution · p33","qs":["SURG-C6-082","SURG-C6-083","SURG-C6-084","SURG-C6-085","SURG-C6-086","SURG-C6-087","SURG-C6-088","SURG-C6-089","SURG-C6-090","SURG-C6-091"],"guide":"1-2 litres over 24 hours in a 20:30:50 protein:fat:carbohydrate mix, as 3-in-1 or 2-in-1 bags with trace elements and vitamins but no fibre. High osmolar bags raise CO2 and thrombosis risk, low osmolar bags suit pulmonary failure, and low volume low protein bags suit renal failure."},{"id":"SURG-U6-12","ch":6,"n":12,"title":"Monitoring on Nutritional Support","sec":"Monitoring · p34","qs":["SURG-C6-092","SURG-C6-093","SURG-C6-094","SURG-C6-095","SURG-C6-096","SURG-C6-097","SURG-C6-098"],"guide":"Daily: pulse, BP, temperature, weight and abdominal gain (>1 Kg/day is the earliest sign of overfeeding), input-output charts and food consumed. Plasma: Na, K, urea, creatinine, glucose, magnesium, phosphate and LFTs, weekly once the regime is stable."},{"id":"SURG-U6-13","ch":6,"n":13,"title":"Complications of TPN","sec":"Complications of TPN · p34","qs":["SURG-C6-099","SURG-C6-100","SURG-C6-101","SURG-C6-102","SURG-C6-103","SURG-C6-104","SURG-C6-105","SURG-C6-106","SURG-C6-107","SURG-C6-108","SURG-C6-109","SURG-C6-110","SURG-C6-111","SURG-C6-112","SURG-C6-113"],"guide":"Catheter related sepsis is the m/c line complication, confirmed by matching peripheral and central cultures, endoluminal brush or tip culture; lines also bring pneumothorax, arrhythmias, thrombosis, air embolism and migration. The regime brings hyperglycemia, cholestasis (withhold TPN), zinc deficiency, refeeding and electrolyte imbalance, and 25% of long-term users derange liver enzymes - managed with lipid free solutions."},{"id":"SURG-U6-14","ch":6,"n":14,"title":"Refeeding Syndrome","sec":"Refeeding Syndrome · p35","qs":["SURG-C6-114","SURG-C6-115","SURG-C6-116","SURG-C6-117","SURG-C6-118","SURG-C6-119","SURG-C6-120","SURG-C6-121","SURG-C6-122","SURG-C6-123","SURG-C6-124","SURG-C6-125","SURG-C6-126","SURG-C6-127"],"guide":"Feeding a chronically starved patient flips catabolism into an insulin-driven anabolic state that drags phosphate, magnesium, potassium and calcium into cells; hypophosphatemia drives the derangement and CHF/arrhythmia kill. Risk: BMI <16, >15% weight loss in 3-6 months, >10 days without intake, low pre-feeding electrolytes - prevent with slow feeds (max 10 Kcal/kg/day to full needs over 4-7 days), electrolyte monitoring and thiamine."},{"id":"SURG-U6-15","ch":6,"n":15,"title":"Post Operative Fluid Requirement","sec":"Post Operative Fluid Requirement · p35","qs":["SURG-C6-128","SURG-C6-129","SURG-C6-130","SURG-C6-131","SURG-C6-132"],"guide":"Goal directed replacement: insensible losses 30-40 mL/kg/day, Ryles aspirate with NS + KCl, drains with RL and urine with NS/DNS."},{"id":"SURG-U6-16","ch":6,"n":16,"title":"K+, Daily Electrolytes, Fluids & Calories","sec":"K+ Replacement · p36","qs":["SURG-C6-133","SURG-C6-134","SURG-C6-135","SURG-C6-136","SURG-C6-137","SURG-C6-138","SURG-C6-139","SURG-C6-140","SURG-C6-141","SURG-C6-142","SURG-C6-143","SURG-C6-144","SURG-C6-145","SURG-C6-146","SURG-C6-147"],"guide":"Potassium waits until day 2 because surgical cell injury dumps K+ out of cells; daily needs run Na 50-90, K 50, Ca 5, Mg 1 mmol. Hartmann's (Na 131, K 5, Ca 2, Cl 111, lactate 29) contrasts with normal saline (154/154), colloids expand blood volume, and calories come 4-4-9 from carbohydrate, amino acid and fat."},{"id":"SURG-U7-1","ch":7,"n":1,"title":"Hypovolemic Shock: Types & Head-Injury Notes","sec":"Hypovolemic Shock: Types · p37","qs":["SURG-C7-001","SURG-C7-002","SURG-C7-003","SURG-C7-004","SURG-C7-005","SURG-C7-006","SURG-C7-007"],"guide":"Hypovolemic/hemorrhagic shock is the m/c shock: overt bleeding is easy to catch while concealed bleeding hides in neck, thorax, abdomen, pelvis and long bones. An isolated head injury never causes it, so a hypotensive head-injury patient makes you suspect brain herniation, neurogenic shock above T6 or polytrauma."},{"id":"SURG-U7-2","ch":7,"n":2,"title":"Arterial vs Venous Bleed","sec":"Arterial vs Venous Bleed · p37","qs":["SURG-C7-008","SURG-C7-009","SURG-C7-010","SURG-C7-011","SURG-C7-012","SURG-C7-013","SURG-C7-014"],"guide":"Arterial bleeds spurt, drop the pressure early and are prevented early; lacerated arteries bleed more because vasoconstriction widens the tear, while a clean transection bleeds less. Venous bleeds ooze gradually and hide hypotension late behind compensation."},{"id":"SURG-U7-3","ch":7,"n":3,"title":"Hemorrhage in Surgery","sec":"Hemorrhage in Surgery · p38","qs":["SURG-C7-015","SURG-C7-016","SURG-C7-017","SURG-C7-018","SURG-C7-019"],"guide":"Primary hemorrhage bleeds during surgery, reactionary hemorrhage within 24 hours from a dislodged clot or slipped granny's knot, and secondary hemorrhage after 7-14 days when infection sloughs the vessel wall."},{"id":"SURG-U7-4","ch":7,"n":4,"title":"Classification of Hypovolemic Shock","sec":"Classification of Hypovolemic Shock · p38","qs":["SURG-C7-020","SURG-C7-021","SURG-C7-022","SURG-C7-023","SURG-C7-024","SURG-C7-025","SURG-C7-026","SURG-C7-027","SURG-C7-028","SURG-C7-029","SURG-C7-030","SURG-C7-031","SURG-C7-032","SURG-C7-033","SURG-C7-034","SURG-C7-035","SURG-C7-036","SURG-C7-037"],"guide":"Four classes climb from 0-15% (0.5 L, all normal, oral liquids) through 15-30% (1 L, tachycardia, anxious and thirsty) and 30-40% (1.5 L, falling SBP, confused, decompensated) to >40% (>2 L, non-recordable pulse and BP, anuria, coma, massive transfusion)."},{"id":"SURG-U7-5","ch":7,"n":5,"title":"Compensated Shock & Fluid Response Check","sec":"Pathophysiology & Response · p38","qs":["SURG-C7-038","SURG-C7-039","SURG-C7-040","SURG-C7-041","SURG-C7-042","SURG-C7-043"],"guide":"Class II is compensated shock: sympathetic noradrenaline and adrenaline drive tachycardia - the earliest sign - with peripheral vasoconstriction shunting blood to vital organs, cold extremities and raised peripheral resistance. Give 500 mL-1 L crystalloid and check the response."},{"id":"SURG-U7-6","ch":7,"n":6,"title":"Dynamic Fluid Response & Resuscitation Strategies","sec":"Dynamic Fluid Response · p39","qs":["SURG-C7-044","SURG-C7-045","SURG-C7-046","SURG-C7-047","SURG-C7-048","SURG-C7-049","SURG-C7-050","SURG-C7-051","SURG-C7-052","SURG-C7-053","SURG-C7-054","SURG-C7-055","SURG-C7-056","SURG-C7-057","SURG-C7-058","SURG-C7-059","SURG-C7-060","SURG-C7-061","SURG-C7-062","SURG-C7-063","SURG-C7-064","SURG-C7-065","SURG-C7-066","SURG-C7-067","SURG-C7-068"],"guide":"Responders keep their improved PR, SBP and JVP; transient responders worsen after 15-20 minutes and non responders never improve - both mean ongoing losses. Before hemostasis use damage control resuscitation (damage control surgery, permissive hypotension, 1:1 RBC:FFP, tranexamic acid/platelets/fibrinogen); after hemostasis switch to perfusion-targeted resuscitation with pressors, thromboprophylaxis and end-organ monitoring."},{"id":"SURG-U7-7","ch":7,"n":7,"title":"Occult Hypoperfusion & Monitoring Indicators","sec":"Occult Hypoperfusion · p40","qs":["SURG-C7-069","SURG-C7-070","SURG-C7-071","SURG-C7-072","SURG-C7-073","SURG-C7-074","SURG-C7-075","SURG-C7-076","SURG-C7-077","SURG-C7-078","SURG-C7-079"],"guide":"Occult hypoperfusion hides behind normal HR, SBP and urine output but betrays itself with low MVOS and acidosis. PCWP (Swan-Ganz, left heart, more accurate but difficult) outranks CVP (right heart, m/c used) for initial fluid requirement, while urine output (>0.5 mL/kg/hr adult, >1 mL/kg/hr child) is the best resuscitation indicator."},{"id":"SURG-U7-8","ch":7,"n":8,"title":"Shock Indices","sec":"Indices · p40","qs":["SURG-C7-080","SURG-C7-081","SURG-C7-082","SURG-C7-083","SURG-C7-084","SURG-C7-085","SURG-C7-086"],"guide":"Shock index = HR/SBP with >0.9 meaning higher mortality; the modified shock index = HR/MAP is the most sensitive; ROPE = HR/pulse pressure with <3 stable and >3 warning of decompensated shock."},{"id":"SURG-U7-9","ch":7,"n":9,"title":"Monitors for Organ/Systemic Perfusion","sec":"Monitors for Organ/Systemic Perfusion · p41","qs":["SURG-C7-087","SURG-C7-088","SURG-C7-089","SURG-C7-090","SURG-C7-091","SURG-C7-092","SURG-C7-093","SURG-C7-094"],"guide":"Base deficit and lactate flag acidosis for systemic perfusion while MVOS is the best end point of resuscitation. Muscle reads NIRS and tissue oxygen electrodes, gut mucosa - the most sensitive, forming stress ulcers - reads sublingual capnometry, mucosal pH and laser doppler, kidney reads urine output and brain reads consciousness with tissue oxygen electrode/NIRS."},{"id":"SURG-U7-10","ch":7,"n":10,"title":"Massive Blood Transfusion & Complications","sec":"Massive Blood Transfusion · p41","qs":["SURG-C7-095","SURG-C7-096","SURG-C7-097","SURG-C7-098","SURG-C7-099","SURG-C7-100","SURG-C7-101","SURG-C7-102","SURG-C7-103","SURG-C7-104","SURG-C7-105","SURG-C7-106","SURG-C7-107","SURG-C7-108"],"guide":"Massive transfusion = whole circulating volume or >10 units in 24 hrs or >4 units in one hour. It brings hypothermia, citrate-driven hypocalcemia/hypomagnesemia and metabolic alkalosis, hyperkalemia from lysed stored RBCs, and coagulopathy - the m/c cause of death - prevented by limiting crystalloids and giving 1:1:1 PRBC:platelet:FFP; febrile reactions are m/c overall and leukoreduction filters prevent them."},{"id":"SURG-U7-11","ch":7,"n":11,"title":"TACO vs TRALI","sec":"TACO vs TRALI · p42","qs":["SURG-C7-109","SURG-C7-110","SURG-C7-111","SURG-C7-112","SURG-C7-113","SURG-C7-114","SURG-C7-115","SURG-C7-116","SURG-C7-117"],"guide":"TACO is cardiac overload with facial puffiness, pedal edema, breathlessness but a normal X-ray, treated with Lasix. TRALI is anti-HLA antibody driven non-cardiogenic pulmonary edema within 6 hours from multiparous donors or FFP, showing ARDS and patchy infiltrates."},{"id":"SURG-U7-12","ch":7,"n":12,"title":"Transfusion Criteria, Blood Substitutes & Anti-shock Garment","sec":"Perioperative RBC Transfusion Criteria · p43","qs":["SURG-C7-118","SURG-C7-119","SURG-C7-120","SURG-C7-121","SURG-C7-122","SURG-C7-123","SURG-C7-124","SURG-C7-125","SURG-C7-126"],"guide":"Transfuse below Hb 6, individualise 6-8 with ongoing losses or impending surgery, and withhold above 8 without risk factors. Perfluorocarbon and stroma free hemoglobin were first and second generation; PEG hemoglobin, Hemospan (MP4OX) and PHP are next generation, and the anti-shock garment squeezes the legs hardest to hold up rural PPH patients."},{"id":"SURG-U8-1","ch":8,"n":1,"title":"MVOS: Meaning, Value & Types","sec":"MVOS · p44","qs":["SURG-C8-001","SURG-C8-002","SURG-C8-003","SURG-C8-004","SURG-C8-005"],"guide":"MVOS is the unutilised oxygen returning to the heart - normally 50-70%, read from a right atrial catheter. Low values mean a low cardiac output or a reduced O2 pump (hypovolemic shock); a high value points to distributive shock."},{"id":"SURG-U8-2","ch":8,"n":2,"title":"Cardiogenic Shock","sec":"Cardiogenic Shock · p44","qs":["SURG-C8-006","SURG-C8-007","SURG-C8-008","SURG-C8-009","SURG-C8-010","SURG-C8-011"],"guide":"MI, tamponade and arrhythmias stop the heart functioning properly: CO and MVOS fall, SBP falls with PVR rising into cold extremities, while accumulating preload raises the JVP."},{"id":"SURG-U8-3","ch":8,"n":3,"title":"Neurogenic Shock","sec":"Neurogenic Shock · p44","qs":["SURG-C8-012","SURG-C8-013","SURG-C8-014","SURG-C8-015","SURG-C8-016","SURG-C8-017"],"guide":"Spinal cord injury above T6 switches off sympathetic drive: vasodilation drops PVR into warm extremities while bradycardia and peripheral pooling pull JVP, CO and SBP down - bradycardia with hypotension is the giveaway."},{"id":"SURG-U8-4","ch":8,"n":4,"title":"Anaphylactic Shock","sec":"Anaphylactic Shock · p45","qs":["SURG-C8-018","SURG-C8-019","SURG-C8-020","SURG-C8-021","SURG-C8-022"],"guide":"Histamine - a potent vasodilator - pools blood in anaphylaxis (classically a mismatched transfusion), dropping PVR, JVP, SBP and CO with warm extremities; an intact sympathetic system compensates with ↓CO = ↑HR x ↓SV."},{"id":"SURG-U8-5","ch":8,"n":5,"title":"Septic Shock: Warm & Cold","sec":"Septic Shock: Warm & Cold · p45","qs":["SURG-C8-023","SURG-C8-024","SURG-C8-025","SURG-C8-026"],"guide":"Warm septic shock is hyperdynamic (↑CO, ↑HR, ↑SBP) with a raised MVOS because tissues cannot use O2; cold septic shock is the late phase where toxins inhibit the myocardium, mimicking cardiogenic shock."},{"id":"SURG-U8-6","ch":8,"n":6,"title":"Shock Comparison Table","sec":"Shock Comparison Table · p45","qs":["SURG-C8-027","SURG-C8-028","SURG-C8-029","SURG-C8-030","SURG-C8-031","SURG-C8-032","SURG-C8-033","SURG-C8-034","SURG-C8-035","SURG-C8-036","SURG-C8-037","SURG-C8-038"],"guide":"Across the table: PR peaks (↑↑) in anaphylaxis and falls in neurogenic; CO and SBP rise only in warm sepsis; PVR is ↑↑ in hypovolemia and ↑ in cardiogenic/cold sepsis; JVP rises in cardiogenic/cold sepsis but stays normal in warm sepsis; MVOS is ↑↑ in warm sepsis, ↓ in hypovolemic/cardiogenic/cold sepsis; acidosis is positive everywhere."},{"id":"SURG-U8-7","ch":8,"n":7,"title":"Obstructive, Distributive & Endocrine Shock","sec":"Obstructive, Distributive & Endocrine · p46","qs":["SURG-C8-039","SURG-C8-040","SURG-C8-041","SURG-C8-042","SURG-C8-043","SURG-C8-044","SURG-C8-045"],"guide":"Obstructive shock is a cardiogenic variant where tamponade or massive PE blocks filling and preload falls. Distributive shock redistributes blood peripherally (neurogenic, anaphylactic, warm septic - all warm), while endocrine shock mixes cardiac and distributive patterns in thyroid disease or adrenal insufficiency."},{"id":"SURG-U8-8","ch":8,"n":8,"title":"SIRS: Terminologies & Parameters","sec":"SIRS & Terminologies · p46","qs":["SURG-C8-046","SURG-C8-047","SURG-C8-048","SURG-C8-049","SURG-C8-050","SURG-C8-051","SURG-C8-052","SURG-C8-053"],"guide":"SIRS is the body's response to infective or non-infective inflammation through IL-1, IL-6 and TNF-alpha. Any two of: temperature >38/<36°C, HR >90, RR >20 or PaCO2 <32 torr, WBC >12000/<4000 or >10% bands - and SIRS is declared."},{"id":"SURG-U8-9","ch":8,"n":9,"title":"Sepsis: Definitions, Scores & Sepsis 3.0","sec":"Sepsis Definitions & Scores · p47","qs":["SURG-C8-054","SURG-C8-055","SURG-C8-056","SURG-C8-057","SURG-C8-058","SURG-C8-059","SURG-C8-060","SURG-C8-061","SURG-C8-062","SURG-C8-063","SURG-C8-064","SURG-C8-065","SURG-C8-066","SURG-C8-067","SURG-C8-068"],"guide":"Old sepsis was SIRS plus a known focus; new sepsis is SOFA ≥2 with documented infection, and qSOFA (SBP <100, RR >22, altered mentation) ≥2 forecasts poor outcome. Sepsis 3.0 calls it life-threatening organ dysfunction from a dysregulated host response, septic shock adds vasopressors plus lactate >2 mmol/L - severe sepsis and SIRS are out."},{"id":"SURG-U8-10","ch":8,"n":10,"title":"Sepsis Six","sec":"Sepsis Six · p48","qs":["SURG-C8-069","SURG-C8-070","SURG-C8-071","SURG-C8-072","SURG-C8-073"],"guide":"Six things in sixty minutes - give I/V antibiotics, I/V fluids and O2; take cultures, urine output and serum lactate - remembered as Think FABULOS."},{"id":"SURG-U8-11","ch":8,"n":11,"title":"Surviving Sepsis Guidelines / Sepsis Bundle","sec":"Sepsis Bundle · p48","qs":["SURG-C8-074","SURG-C8-075","SURG-C8-076","SURG-C8-077","SURG-C8-078","SURG-C8-079","SURG-C8-080","SURG-C8-081"],"guide":"Within 3 hours: measure lactate, culture before antibiotics, broad spectrum antibiotics and 30 mL/kg crystalloid for hypotension or lactate ≥4. Within 6 hours: vasopressors to MAP ≥65, measure CVP and ScvO2 for persistent hypotension/lactate ≥4, remeasure lactate - targeting CVP ≥8 mm Hg and ScvO2 ≥70%."},{"id":"SURG-U9-1","ch":9,"n":1,"title":"Surgical Anatomy of the Breast","sec":"Surgical Anatomy · p49","qs":["SURG-C9-001","SURG-C9-002","SURG-C9-003","SURG-C9-004","SURG-C9-005","SURG-C9-006","SURG-C9-007","SURG-C9-008"],"guide":"The breast is a modified sweat gland spanning the 2nd-6th ribs from midline to the anterior/mid-axillary line, with an axillary tail of Spence that mimics a lump. 9-12 lactiferous ducts open at the nipple, and Cooper's ligaments from pectoralis fascia to skin hold its shape."},{"id":"SURG-U9-2","ch":9,"n":2,"title":"Clinical Signs: Dimpling, Nipple Retraction & Peau d'Orange","sec":"Clinical Signs · p49","qs":["SURG-C9-009","SURG-C9-010","SURG-C9-011","SURG-C9-012","SURG-C9-013","SURG-C9-014","SURG-C9-015","SURG-C9-016"],"guide":"Dimpling means Cooper's ligament involvement and nipple retraction is slit-like in duct ectasia but circumferential in cancer - neither is a sign of skin involvement. Peau d'orange is subdermal lymphatic block giving an orange peel look; beyond a third of the breast it declares inflammatory breast cancer."},{"id":"SURG-U9-3","ch":9,"n":3,"title":"Lymphatic Drainage & Axillary Levels","sec":"Lymphatic Drainage · p50","qs":["SURG-C9-017","SURG-C9-018","SURG-C9-019","SURG-C9-020","SURG-C9-021","SURG-C9-022","SURG-C9-023","SURG-C9-024"],"guide":"85-90% of lymph flows to axillary nodes (clinically anterior, central, apical, lateral, posterior; surgically levels I-III around pectoralis minor) and 10-15% to internal mammary nodes. Rotter's nodes sit between the pectoralis muscles, and the sentinel node is the first draining node of any cancer."},{"id":"SURG-U9-4","ch":9,"n":4,"title":"Functional Unit & Triple Assessment","sec":"Functional Unit & Assessment · p50","qs":["SURG-C9-025","SURG-C9-026","SURG-C9-027","SURG-C9-028"],"guide":"Most cancers arise in the terminal duct lobular unit while the stroma between TDLUs breeds fibroadenoma and phyllodes. Every lump passes through triple assessment - clinical (dial clock method), radiological then histopathological."},{"id":"SURG-U9-5","ch":9,"n":5,"title":"Initial Radiological Investigation & BIRADS","sec":"Radiological: Initial & BIRADS · p51","qs":["SURG-C9-029","SURG-C9-030","SURG-C9-031","SURG-C9-032","SURG-C9-033","SURG-C9-034","SURG-C9-035","SURG-C9-036","SURG-C9-037","SURG-C9-038","SURG-C9-039"],"guide":"Under 40 (glands > fat) start with USG; over 40 (fat > glands) with mammography, which fails below 40 because lesions and glandular tissue are both hyperintense. BIRADS runs from 0 (recall) through 1-2 (routine yearly, ~0%), 3 (6-month follow-up, 0-3%), 4a-c (biopsy, 2-95%) and 5 (biopsy, 95%) to 6 (surgical excision)."},{"id":"SURG-U9-6","ch":9,"n":6,"title":"ASBRS Breast Cancer Screening Guidelines","sec":"ASBRS Screening Guidelines · p51","qs":["SURG-C9-040","SURG-C9-041","SURG-C9-042","SURG-C9-043","SURG-C9-044","SURG-C9-045"],"guide":"Formal risk assessment (Gail Index) from 25, yearly mammography from 40 for average risk, cease when life expectancy is under 10 years. High-risk women add supplemental imaging: BRCA or chest radiation get annual MRI from 25 and 3D mammography from 30; lifetime risk >20% or strong family history get 3D mammogram from 35 with MRI if mammography is silent."},{"id":"SURG-U9-7","ch":9,"n":7,"title":"Mammography: Views, Dose & Findings","sec":"Mammography · p52","qs":["SURG-C9-046","SURG-C9-047","SURG-C9-048","SURG-C9-049","SURG-C9-050","SURG-C9-051","SURG-C9-052","SURG-C9-053","SURG-C9-054","SURG-C9-055"],"guide":"A 0.1-0.2 cGy X-ray in CC and MLO views - MLO catches the axilla and most tissue - now upgraded to 3D full field digital tomosynthesis for dense breasts. Benign lesions show popcorn macrocalcifications (fibroadenoma BIRADS-2), malignancy shows spiculated margins, and nodes turn from kidney-shaped with fatty hilum to rounded without it."},{"id":"SURG-U9-8","ch":9,"n":8,"title":"Breast Ultrasound","sec":"Breast Ultrasound · p53","qs":["SURG-C9-056","SURG-C9-057","SURG-C9-058","SURG-C9-059","SURG-C9-060","SURG-C9-061","SURG-C9-062","SURG-C9-063","SURG-C9-064"],"guide":"Radiation-free, best for solid vs cystic, preferred in pregnancy and under-40s, and able to catch ductal papillomas. Benign lesions lie wider than taller with macrocalcifications and preserved hilum; malignant ones stand taller than wider with microcalcifications and rounded nodes. Implant rupture: stepladder inside the capsule, snowstorm outside."},{"id":"SURG-U9-9","ch":9,"n":9,"title":"MRI Breast","sec":"MRI · p53","qs":["SURG-C9-065","SURG-C9-066","SURG-C9-067","SURG-C9-068","SURG-C9-069","SURG-C9-070","SURG-C9-071","SURG-C9-072","SURG-C9-073"],"guide":"MRI is IOC for implants (linguini's sign marks intracapsular rupture) and for mapping multicentric/multifocal disease - multifocal in one quadrant allows conservation, multicentric across quadrants or >5 cm apart forbids it. It screens high-risk patients, resolves inconclusive ductal USG, catches DCIS and detects local/scar recurrence."},{"id":"SURG-U9-10","ch":9,"n":10,"title":"Histopathological Investigation: FNAC to Excision","sec":"Histopathological Investigation · p54","qs":["SURG-C9-074","SURG-C9-075","SURG-C9-076","SURG-C9-077","SURG-C9-078","SURG-C9-079","SURG-C9-080","SURG-C9-081","SURG-C9-082","SURG-C9-083","SURG-C9-084","SURG-C9-085"],"guide":"FNAC (23-30 G) is retired for breast: high false negatives, no in-situ vs invasive call, no IHC (ER, PR, HER2 Neu, Ki-67). Tru-cut/core (14 G) is IOC and takes a tissue piece, punch biopsy samples skin/Paget's, VABB (8-11 G vacuum probe) removes fibroadenomas scarlessly, and excisional biopsy remains the 100% gold standard."},{"id":"SURG-U10-1","ch":10,"n":1,"title":"Risk Factors for Breast Cancer","sec":"Risk Factors · p55","qs":["SURG-C10-001","SURG-C10-002","SURG-C10-003","SURG-C10-004","SURG-C10-005","SURG-C10-006","SURG-C10-007"],"guide":"Estrogen exposure drives risk: rising age, early menarche, late menopause, nulliparity and first birth after 30, plus obesity (aromatase converts peripheral fat to estrogen), alcohol, smoking, maternal and paternal family history and HRT."},{"id":"SURG-U10-2","ch":10,"n":2,"title":"Dupont & Page Classification","sec":"Dupont & Page Classification · p55","qs":["SURG-C10-008","SURG-C10-009","SURG-C10-010","SURG-C10-011","SURG-C10-012","SURG-C10-013"],"guide":"Pre-existing lesions stratify risk: nonproliferative lesions, cysts, mild hyperplasia and columnar cell change carry no risk (1); proliferative without atypia (sclerosing adenosis, radial scar, intraductal papilloma, complex fibroadenoma) 1.3-1.9; atypical hyperplasias 4-5; carcinoma in-situ 9."},{"id":"SURG-U10-3","ch":10,"n":3,"title":"Smokers, Protective Factors & OCPs","sec":"Notes: Smokers & Protective · p56","qs":["SURG-C10-014","SURG-C10-015","SURG-C10-016","SURG-C10-017"],"guide":"Smokers face more breast cancer, duct ectasia and Mondor's disease, while first birth by 20 and breastfeeding beyond a year protect. Low dose OCPs do not raise risk."},{"id":"SURG-U10-4","ch":10,"n":4,"title":"Genes Associated with Breast Cancer","sec":"Genes Associated · p56","qs":["SURG-C10-018","SURG-C10-019","SURG-C10-020","SURG-C10-021","SURG-C10-022"],"guide":"Only 10% of breast cancer is familial. p53 is the commonest mutation overall and in TNBC/HER2-positive disease, BRCA1 rules familial cases, and PIK3CA marks ER/PR-positive tumors."},{"id":"SURG-U10-5","ch":10,"n":5,"title":"BRCA Genes & Testing Indications","sec":"BRCA Genes & Testing · p56","qs":["SURG-C10-023","SURG-C10-024","SURG-C10-025","SURG-C10-026","SURG-C10-027","SURG-C10-028","SURG-C10-029","SURG-C10-030","SURG-C10-031","SURG-C10-032","SURG-C10-033","SURG-C10-034","SURG-C10-035","SURG-C10-036","SURG-C10-037"],"guide":"BRCA1 (17q, aggressive, basal/medullary) and BRCA2 (13q, luminal) cause HBOC syndrome: breast-ovarian risk favours BRCA1, pancreatic/prostate/male breast favours BRCA2, colorectal/peritoneal equal. Test everyone with a deleterious family mutation or ovarian/fallopian/peritoneal history, and every breast cancer patient with a relative ≤45, bilateral disease ≤50, TNBC ≤60 or male breast cancer; carriers lose weight, exercise, quit smoking/alcohol and start MRI at 25."},{"id":"SURG-U10-6","ch":10,"n":6,"title":"Risk Reduction Strategies","sec":"Risk Reduction Strategies · p57","qs":["SURG-C10-038","SURG-C10-039","SURG-C10-040","SURG-C10-041","SURG-C10-042","SURG-C10-043"],"guide":"Bilateral prophylactic mastectomy cuts risk 95% sparing skin and nipple; salpingo-oophorectomy after family completion (by 40) cuts ovarian risk 90% (leaving 10% fallopian/peritoneal) and breast risk 50%; tamoxifen (SERM) trims 47%."},{"id":"SURG-U10-7","ch":10,"n":7,"title":"Biopsy & Histological Types","sec":"Biopsy & Histological Types · p57","qs":["SURG-C10-044","SURG-C10-045","SURG-C10-046","SURG-C10-047","SURG-C10-048","SURG-C10-049","SURG-C10-050","SURG-C10-051"],"guide":"Core needle biopsy is IOC, typing ductal (invasive m/c) vs lobular disease and feeding IHC for biology. Invasive ductal carcinoma (NOS) dominates; tubular, mucinous and medullary (BRCA1-linked) are the special types."},{"id":"SURG-U10-8","ch":10,"n":8,"title":"IHC: ER/PR, HER2 & Ki67","sec":"IHC · p58","qs":["SURG-C10-052","SURG-C10-053","SURG-C10-054","SURG-C10-055","SURG-C10-056","SURG-C10-057","SURG-C10-058","SURG-C10-059","SURG-C10-060"],"guide":"ER/PR are nuclear receptors scored by Allred 0-8; HER2 is membranous with 0/1+ negative, 3+ positive and 2+ equivocal sent to FISH (amplified = positive), the brown stain coming from DAB. Ki67 marks the proliferation index."},{"id":"SURG-U10-9","ch":10,"n":9,"title":"Molecular Classification & TNBC","sec":"Molecular Classification · p58","qs":["SURG-C10-061","SURG-C10-062","SURG-C10-063","SURG-C10-064","SURG-C10-065","SURG-C10-066","SURG-C10-067","SURG-C10-068","SURG-C10-069","SURG-C10-070","SURG-C10-071"],"guide":"Gene expression profiling splits breast cancer into luminal A (m/c, best prognosis, ER+PR+HER2-, low Ki67), luminal B, HER2-enriched, claudin-low and basal-like - triple negative, CK5/6 positive, young patients, most aggressive with the worst prognosis yet the TNBC paradox: it responds best to chemotherapy."},{"id":"SURG-U10-10","ch":10,"n":10,"title":"TNM & 8th AJCC Staging","sec":"TNM Staging · p59","qs":["SURG-C10-072","SURG-C10-073","SURG-C10-074","SURG-C10-075","SURG-C10-076","SURG-C10-077","SURG-C10-078","SURG-C10-079","SURG-C10-080","SURG-C10-081","SURG-C10-082","SURG-C10-083","SURG-C10-084","SURG-C10-085"],"guide":"T sizes run ≤2/2-5/>5 cm after Tis (DCIS, Paget's); T4a is chest wall (serratus, ribs, intercostals - not pectoralis), T4b skin (ulceration, infiltration, peau d'orange, satellites - not dimpling), T4c both, T4d inflammatory. N1 mobile axillary, N2a fixed axillary, N2b internal mammary without axillary, N3a infraclavicular, N3b internal mammary + axillary, N3c supraclavicular; UOQ is the commonest site and LIQ the rarest."},{"id":"SURG-U10-11","ch":10,"n":11,"title":"Metastases, Important Points & PET-CT","sec":"Metastases Notes · p59","qs":["SURG-C10-086","SURG-C10-087","SURG-C10-088","SURG-C10-089","SURG-C10-090","SURG-C10-091","SURG-C10-092","SURG-C10-093","SURG-C10-094","SURG-C10-095","SURG-C10-096"],"guide":"Breast spreads to lumbar vertebrae through Batson's valveless plexus with osteolytic > osteoblastic lesions (prostate reverses this). LCIS is now a benign risk lesion, and PET-CT with 18 FDG (T½ 110 min) is IOC for staging except in brain (MRI) and prostate (PSMA PET)."},{"id":"SURG-U11-1","ch":11,"n":1,"title":"Treatment Modalities & BCS vs Mastectomy","sec":"Treatment Modalities & BCS vs Mastectomy · p61","qs":["SURG-C11-001","SURG-C11-002","SURG-C11-003","SURG-C11-004","SURG-C11-005","SURG-C11-006","SURG-C11-007"],"guide":"Four weapons against breast cancer: surgery, chemotherapy, RT and HT. Surgery tackles breast and lymph nodes; for the breast, BCS and mastectomy give the SAME overall survival, but BCS recurs locally 3-4% (hence RT mandatory) versus 1% after mastectomy."},{"id":"SURG-U11-2","ch":11,"n":2,"title":"Oncoplasty: Volume Displacement & Replacement","sec":"Oncoplasty · p61","qs":["SURG-C11-008","SURG-C11-009","SURG-C11-010","SURG-C11-011","SURG-C11-012"],"guide":"Oncoplasty fuses cancer surgery with plastic surgery: 10-15% breast volume resections are closed by volume displacement (round block, periareolar incisions), while ≥15% resections need volume replacement with imported tissue."},{"id":"SURG-U11-3","ch":11,"n":3,"title":"Contraindications for BCS","sec":"Contraindications for BCS · p62","qs":["SURG-C11-013","SURG-C11-014","SURG-C11-015","SURG-C11-016","SURG-C11-017","SURG-C11-018","SURG-C11-019","SURG-C11-020"],"guide":"Absolute bars: pregnancy (RT) and multicentric tumors (technical, different quadrants). Relative: prior chest wall RT and collagen vascular disease (SLE, RA) for RT; multifocal (same quadrant) tumors, diffuse microcalcifications/DCIS, LABC and large tumor:breast ratio technically - the last two become BCS-eligible after neo adjuvant chemo. BCS = lumpectomy with a 1 mm margin."},{"id":"SURG-U11-4","ch":11,"n":4,"title":"Mastectomy Types","sec":"Mastectomy Types · p63","qs":["SURG-C11-021","SURG-C11-022","SURG-C11-023","SURG-C11-024","SURG-C11-025","SURG-C11-026","SURG-C11-027","SURG-C11-028","SURG-C11-029","SURG-C11-030"],"guide":"Radical (Halstead) takes breast, NAC, pectoralis major & minor and level 1-3 nodes; MRM (elliptical Stewart) spares the muscles taking pectoral fascia, ± pectoralis minor retracted (Auchincloss) or cut (Patey, Scanlon); simple mastectomy removes no nodes. Nipple and skin sparing versions conserve the envelope."},{"id":"SURG-U11-5","ch":11,"n":5,"title":"Boundaries of Axillary Clearance","sec":"Axillary Clearance Boundaries · p63","qs":["SURG-C11-031","SURG-C11-032","SURG-C11-033","SURG-C11-034","SURG-C11-035","SURG-C11-036"],"guide":"Halstead ligament medially, axillary vein above, thoraco-dorsal pedicle laterally and angular vein below; the long thoracic nerve is saved, not a boundary, and at least 10 nodes must come out."},{"id":"SURG-U11-6","ch":11,"n":6,"title":"Complications: Nerves, Seroma & Flap","sec":"Complications of Mastectomy · p64","qs":["SURG-C11-037","SURG-C11-038","SURG-C11-039","SURG-C11-040","SURG-C11-041","SURG-C11-042","SURG-C11-043","SURG-C11-044","SURG-C11-045","SURG-C11-046","SURG-C11-047","SURG-C11-048"],"guide":"Bleeding runs primary, reactionary, secondary. The intercostobrachial nerve (m/c) loses axillary sensation; long thoracic (Santorini/Bell) wings the scapula; thoracodorsal hits latissimus dorsi; pectoral nerves hit p. major/minor. Seroma, the m/c complication, is prevented by a Romovac drain pulled at <40 cc/day and treated by aseptic aspiration + pressure dressing, never re-inserting the drain."},{"id":"SURG-U11-7","ch":11,"n":7,"title":"Lymphedema & Stewart-Treves","sec":"Lymphedema & Stewart-Treves · p64","qs":["SURG-C11-049","SURG-C11-050","SURG-C11-051","SURG-C11-052","SURG-C11-053","SURG-C11-054","SURG-C11-055","SURG-C11-056"],"guide":"Post-mastectomy lymphedema is the m/c cause of upper limb lymphedema, appearing weeks-months later in 5-15% after clearance - worse if nodes above the axillary vein go or axillary RT follows, less with SLNB. Manage with skin care, massage, stockings, exercise; 8-10 years of swelling can breed angiosarcoma (reddish/bluish nodules) = Stewart-Treves syndrome."},{"id":"SURG-U11-8","ch":11,"n":8,"title":"Local Recurrence, Phantom Breast & Reconstruction","sec":"Local Recurrence, Phantom Breast & Reconstruction · p65","qs":["SURG-C11-057","SURG-C11-058","SURG-C11-059","SURG-C11-060","SURG-C11-061","SURG-C11-062","SURG-C11-063","SURG-C11-064","SURG-C11-065","SURG-C11-066","SURG-C11-067"],"guide":"Recurrences need repeat biopsy (10-15% change IHC expression) and armour-like spread is cancer en cuirasse; ICBN entrapment causes painful phantom breast. Reconstruction: TRAM takes skin-fat-muscle (incisional hernia risk) while DIEP, the best flap, takes skin-fat only; latissimus dorsi also serves."},{"id":"SURG-U11-9","ch":11,"n":9,"title":"Surgical Mx of Lymph Nodes & SLNB Basics","sec":"Lymph Node Mx & SLNB Basics · p66","qs":["SURG-C11-068","SURG-C11-069","SURG-C11-070","SURG-C11-071","SURG-C11-072","SURG-C11-073","SURG-C11-074","SURG-C11-075"],"guide":"Enlarged nodes get biopsy: positive → axillary clearance, negative → SLNB. Cabana described the sentinel node in penile cancer; it is the first draining node, usually level I, and SLNB (m/c nerve injured ICBN) serves melanoma, breast, penile, vulvar and head & neck cancers."},{"id":"SURG-U11-10","ch":11,"n":10,"title":"Blue Dye Technique","sec":"Blue Dye Technique · p66","qs":["SURG-C11-076","SURG-C11-077","SURG-C11-078","SURG-C11-079","SURG-C11-080","SURG-C11-081","SURG-C11-082"],"guide":"1-1.5 cc methylene/isosulfan blue injected subcutaneously periareolarly stains the sentinel node for frozen section: negative spares axillary clearance (less lymphedema), positive mandates it. Watch for skin tattooing (m/c), anaphylaxis, bluish urine and skin necrosis."},{"id":"SURG-U11-11","ch":11,"n":11,"title":"Radionucleotide, ICG & Sentimag Techniques","sec":"Radionucleotide, ICG & Sentimag · p67","qs":["SURG-C11-083","SURG-C11-084","SURG-C11-085","SURG-C11-086","SURG-C11-087","SURG-C11-088","SURG-C11-089","SURG-C11-090"],"guide":"Tc99 sulphur colloid marks hot nodes on gamma camera and combined blue dye + radionucleotide is the best technique; ICG + blue dye shows green nodes under a filter with no radiation, and Sentimag's ferric oxide is read by a magnetic scanner with zero radiation."}];

const QBYID = {}; QUESTIONS.forEach(q=>QBYID[q.id]=q);
const $=id=>document.getElementById(id);
function store(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r==null?null:JSON.parse(r);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return v===undefined?null:undefined;}}
const S = {
  get xp(){return store('pulse_surgery_xp')||0;}, set xp(v){store('pulse_surgery_xp',v);},
  get done(){return store('pulse_surgery_done')||[];}, set done(v){store('pulse_surgery_done',v);},
  get unlock(){return !!store('pulse_surgery_unlock');}, set unlock(v){store('pulse_surgery_unlock',v);},
  streak(){const t=store('pulse_surgery_streak')||{n:0,day:''};return t;},
  bumpStreak(){const today=new Date().toISOString().slice(0,10);let s=this.streak();
    if(s.day===today)return s.n;
    const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
    s={n:(s.day===y?s.n+1:1),day:today};store('pulse_surgery_streak',s);return s.n;}
};
const nav={stack:['home']};
function show(id){nav.stack.push(id);render();}
function goBack(){if(nav.stack.length>1)nav.stack.pop();render();}
function render(){
  const cur=nav.stack[nav.stack.length-1];
  ['home','chapters','path','guide','quiz','unitdone'].forEach(s=>$(s).classList.toggle('hidden',s!==cur));
  $('backBtn').classList.toggle('hidden',cur==='home');
  $('brand').textContent = cur==='home'?'PULSE':'PULSE';
  refreshStats();
  if(cur==='home')renderHome();
  if(cur==='chapters')renderChapters();
  if(cur==='path')renderPath();
}
function refreshStats(){
  $('hXP').textContent=S.xp; $('hStreak').textContent=S.streak().n;
  $('sXP').textContent=S.xp; $('sStreak').textContent=S.streak().n; $('sUnits').textContent=S.done.length;
}
function renderHome(){
  const live=CHAPTERS.filter(c=>c.live).length;
  $('heroSub').textContent=live+' of '+CHAPTERS.length+' chapters built so far — original questions, guides, and unit-by-unit mastery for each.';
}
function unitsOf(ch){return UNITS.filter(u=>u.ch===ch).sort((a,b)=>a.n-b.n);}
function renderChapters(){
  $('chSub').textContent=CHAPTERS.length+' chapters · Full chapter-by-chapter exam pass';
  const box=$('chList'); box.innerHTML='';
  CHAPTERS.forEach(c=>{
    const us=c.live?unitsOf(c.n):[];
    const dn=us.filter(u=>S.done.includes(u.id)).length;
    const d=document.createElement('div');
    d.className='chrow'+(c.live?'':' locked');
    d.innerHTML='<div class="chnum">'+c.n+'</div><div class="t">'+escapeHtml(c.t)+'</div><div class="u">'+(c.live?dn+'/'+us.length+' units':'Soon')+'</div>';
    if(c.live)d.onclick=()=>{curCh=c.n;show('path');};
    box.appendChild(d);
  });
}
let curCh=1, curUnit=null;
function unitState(u,us){
  if(S.done.includes(u.id))return 'done';
  if(S.unlock)return 'current';
  const i=us.findIndex(x=>x.id===u.id);
  if(i===0)return 'current';
  return S.done.includes(us[i-1].id)?'current':'locked';
}
function renderPath(){
  const c=CHAPTERS.find(x=>x.n===curCh), us=unitsOf(curCh);
  $('pathKick').textContent='CHAPTER '+c.n;
  $('pathTitle').textContent=c.t;
  $('pathSub').textContent=us.filter(u=>S.done.includes(u.id)).length+' of '+us.length+' units done · in book order';
  const box=$('nodes'); box.innerHTML='';
  let lastSec='';
  us.forEach(u=>{
    if(u.sec!==lastSec){lastSec=u.sec;
      const s=document.createElement('div');s.className='pathsec';s.textContent=u.sec;box.appendChild(s);}
    const st=unitState(u,us);
    const d=document.createElement('div');d.className='node';
    d.innerHTML='<div class="ball '+st+'">'+(st==='done'?'✓':st==='locked'?'🔒':u.n)+'</div><div class="ntitle">'+escapeHtml(u.title)+'</div><div class="ncount">'+u.qs.length+' questions</div>';
    if(st!=='locked')d.querySelector('.ball').onclick=()=>openGuide(u);
    box.appendChild(d);
  });
}
function openGuide(u){curUnit=u;
  $('gKick').textContent='CHAPTER '+u.ch+' · UNIT '+u.n+' · '+u.sec.toUpperCase();
  $('gTitle').textContent=u.title;
  $('gText').textContent=u.guide;
  $('gCount').textContent=u.qs.length+' questions · follows the book line-by-line';
  show('guide');
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderQ(){
  locked=false;
  const cur=order[idx],q=cur.q;
  $('qbar').style.width=(idx/order.length*100)+'%';
  $('qcount').textContent='QUESTION '+(idx+1)+' OF '+order.length;
  $('qtag').textContent=q.sec+' · Book p'+q.page;
  $('qtext').textContent=q.q;
  const box=$('opts');box.innerHTML='';
  cur.opts.forEach(o=>{
    const b=document.createElement('button');b.className='opt';b.textContent=o.t;
    b.onclick=()=>answer(o,b);box.appendChild(b);
  });
  $('fb').className='fb';$('fb').innerHTML='';
  $('nextBtn').classList.add('hidden');
  $('nextBtn').textContent=idx===order.length-1?'Finish ✓':'Continue →';
}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function answer(o,btn){
  if(locked)return;locked=true;
  const cur=order[idx],q=cur.q,btns=$('opts').children;
  const rightIdx=cur.opts.findIndex(x=>x.ok);
  [...btns].forEach(b=>b.disabled=true);
  btns[rightIdx].classList.add('correct');
  const fb=$('fb');
  if(o.ok){correct++;streak++;
    const gain=10+Math.min(streak*2,10);xpGain+=gain;S.xp=S.xp+gain;
    floatText(btn,'+'+gain+' XP','#e0607e');
    fb.className='fb show good';
    fb.innerHTML='✅ Correct! '+escapeHtml(q.exp);
  }else{btn.classList.add('wrong');streak=0;
    wrongList.push(q);
    fb.className='fb show bad';
    fb.innerHTML='❌ Answer: <b>'+escapeHtml(cur.opts[rightIdx].t)+'</b><br>'+escapeHtml(q.exp);
  }
  refreshStats();
  $('nextBtn').classList.remove('hidden');
}
function floatText(el,txt,color){
  const r=el.getBoundingClientRect(),s=document.createElement('div');
  s.className='float';s.textContent=txt;s.style.color=color;
  s.style.left=(r.left+r.width/2-24)+'px';s.style.top=(r.top-6+window.scrollY)+'px';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
}
function nextQ(){idx++;if(idx>=order.length)finishUnit();else renderQ();}
function finishUnit(){
  const d=S.done;if(!d.includes(curUnit.id)){d.push(curUnit.id);S.done=d;}
  S.bumpStreak();
  const pct=Math.round(correct/order.length*100);
  $('dSub').textContent=curUnit.title+' · '+correct+'/'+order.length+' correct';
  $('dScore').textContent=correct+'/'+order.length;
  $('dXP').textContent='+'+xpGain;$('dAcc').textContent=pct+'%';
  const box=$('dRev');box.innerHTML='';
  if(wrongList.length){const h=document.createElement('p');h.className='sub';h.textContent='Review:';box.appendChild(h);}
  wrongList.forEach(q=>{
    const r=document.createElement('div');r.className='rev';
    r.innerHTML='❓ '+escapeHtml(q.q)+'<br>✅ <b>'+escapeHtml(q.opts[q.ans])+'</b> — '+escapeHtml(q.exp);
    box.appendChild(r);
  });
  show('unitdone');
}
function afterUnit(){nav.stack=['home','chapters','path'];render();}
function continueLearning(){
  const c=CHAPTERS.find(x=>x.live);
  if(!c)return;curCh=c.n;
  const us=unitsOf(c.n);
  const nxt=us.find(u=>unitState(u,us)==='current')||us[0];
  curUnit=nxt;nav.stack=['home'];openGuide(nxt);
}
function unlockAll(){S.unlock=true;render();}
document.addEventListener('keydown',e=>{
  if($('quiz').classList.contains('hidden'))return;
  const k=parseInt(e.key);
  if(k>=1&&k<=4&&!locked){const b=$('opts').children[k-1];if(b)b.click();}
  else if(e.key==='Enter'&&locked)nextQ();
});
render();
</script>
</body>
</html>
