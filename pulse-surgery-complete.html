<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE · Surgery — Marrow Edition 8 Companion</title>
<style>
  :root{
    --bg:#120d1a; --card:#221a30; --card2:#2b2139; --line:#3a2d52;
    --txt:#f4eefb; --mut:#a89bbd; --pink:#e0607e; --gold:#c99a4b;
    --teal:#5fd0b5; --good:#3ddc84; --bad:#ff5d6c; --serif:Georgia,'Times New Roman',serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--txt); min-height:100vh;}
  .wrap{max-width:560px; margin:0 auto; padding:0 16px 60px;}
  header.top{position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:#120d1af2; border-bottom:1px solid var(--line); max-width:560px; margin:0 auto;}
  header.top .brand{font-weight:800; font-size:20px; letter-spacing:.3px; flex:1;}
  header.top .back{font-size:22px; cursor:pointer; color:var(--mut); padding:2px 8px 2px 0;}
  .hstat{font-weight:800; font-size:15px; white-space:nowrap;}
  .hidden{display:none !important;}
  .hero{background:linear-gradient(160deg,#3a2547,#221a30 70%); border:1px solid var(--line);
    border-radius:22px; padding:26px 22px; margin:16px 0;}
  .hero .kick{font-size:12px; letter-spacing:2.5px; color:var(--mut);}
  .hero h1{font-family:var(--serif); font-size:42px; margin:8px 0 10px; line-height:1.05;}
  .hero p{color:#cbbfe0; font-size:15px; line-height:1.55; margin:0 0 12px;}
  .hero a{color:var(--pink); font-weight:700; text-decoration:none; font-size:15px; cursor:pointer;}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:0 0 12px;}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 6px; text-align:center;}
  .stat b{font-size:22px; display:block;} .stat span{font-size:12px; color:var(--mut);}
  .btn{display:block; width:100%; margin-top:12px; padding:15px; font-size:16px; font-weight:700;
    color:#1a0f14; background:linear-gradient(135deg,#f0788f,var(--pink)); border:0; border-radius:14px; cursor:pointer;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent; color:var(--txt); border:1.5px solid var(--line);}
  .btn.gold{background:linear-gradient(135deg,#e0b45f,var(--gold)); color:#1d1405;}
  h2.page{font-family:var(--serif); font-size:30px; margin:18px 0 2px;}
  p.sub{color:var(--mut); margin:0 0 14px; font-size:14px;}
  .chrow{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:16px; padding:14px; margin:10px 0; cursor:pointer;}
  .chrow.locked{opacity:.45; cursor:default;}
  .chnum{min-width:44px; height:44px; border-radius:13px; display:grid; place-items:center;
    font-weight:800; font-size:17px; background:linear-gradient(135deg,#d96a84,#b34a62); color:#fff;}
  .chrow.locked .chnum{background:#3a2f4d; color:var(--mut);}
  .chrow .t{flex:1; font-weight:700; font-size:15.5px; line-height:1.35;}
  .chrow .u{font-size:12.5px; color:var(--teal); white-space:nowrap; font-weight:700;}
  .chrow.locked .u{color:var(--mut);}
  .pathsec{text-align:center; color:var(--mut); font-size:12px; letter-spacing:2.5px; margin:26px 0 6px;
    display:flex; align-items:center; gap:10px;}
  .pathsec::before,.pathsec::after{content:""; flex:1; height:1px; background:var(--line);}
  .node{display:flex; flex-direction:column; align-items:center; position:relative; padding:10px 0 4px;}
  .node:not(:last-child)::after{content:""; width:3px; height:26px; margin-top:10px; border-radius:2px;
    background:repeating-linear-gradient(180deg,var(--line) 0 5px,transparent 5px 10px);}
  .ball{width:86px; height:86px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; font-weight:800; cursor:pointer; border:4px solid transparent;}
  .ball.done{background:#1d3a2a; border-color:var(--good); color:var(--good); font-size:32px;}
  .ball.current{background:radial-gradient(circle at 35% 30%,#e0b45f,var(--gold) 70%);
    color:#fff; box-shadow:0 0 0 6px #c99a4b33, 0 8px 24px #c99a4b55; animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 6px #c99a4b33;}50%{box-shadow:0 0 0 11px #c99a4b22;}}
  .ball.locked{background:#241c33; border-color:#171224; color:#6f6386; cursor:default; font-size:30px;}
  .ntitle{margin-top:8px; font-weight:700; font-size:14.5px; text-align:center; max-width:230px; line-height:1.35;}
  .ncount{font-size:12px; color:var(--mut); margin-top:2px;}
  .guide{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:22px; margin-top:16px;}
  .guide .kick{font-size:12px; letter-spacing:2px; color:var(--gold); font-weight:800;}
  .guide h2{font-family:var(--serif); font-size:26px; margin:8px 0 10px; line-height:1.25;}
  .guide p{color:#d8cde9; line-height:1.65; font-size:15.5px;}
  .qbar{height:10px; background:var(--card2); border:1px solid var(--line); border-radius:999px; overflow:hidden; margin:16px 0 14px;}
  .qbar i{display:block; height:100%; width:0; background:var(--pink); transition:width .3s;}
  .qcount{font-size:12px; letter-spacing:2px; color:var(--mut); font-weight:700;}
  .qtag{display:inline-block; font-size:11.5px; color:var(--teal); border:1px solid #5fd0b555;
    border-radius:999px; padding:3px 10px; margin-top:8px;}
  .qtext{font-family:var(--serif); font-size:25px; line-height:1.35; margin:10px 0 16px;}
  .opt{display:block; width:100%; text-align:left; margin:10px 0; padding:16px; font-size:16px;
    color:var(--txt); background:var(--card); border:1.5px solid var(--line); border-radius:16px; cursor:pointer; line-height:1.4;}
  .opt:not(:disabled):active{border-color:var(--pink);}
  .opt:disabled{cursor:default;}
  .opt.correct{border-color:var(--good); background:#3ddc841c;}
  .opt.wrong{border-color:var(--bad); background:#ff5d6c1c;}
  .fb{margin-top:12px; padding:14px 15px; border-radius:14px; font-size:14.5px; line-height:1.6; display:none;}
  .fb.show{display:block;}
  .fb.good{background:#3ddc8412; border:1px solid #3ddc8466;}
  .fb.bad{background:#ff5d6c12; border:1px solid #ff5d6c66;}
  .donebox{text-align:center; padding:30px 10px;}
  .donebox .big{font-size:64px;}
  .donebox h2{font-family:var(--serif); font-size:30px; margin:10px 0 4px;}
  .rev{margin:8px 0; padding:11px 13px; border:1px solid var(--line); border-radius:12px;
    font-size:13.5px; background:var(--card); line-height:1.5; text-align:left;}
  .rev b{color:var(--good);}
  footer{text-align:center; color:var(--mut); font-size:12px; margin-top:22px; line-height:1.7;}
  .float{position:fixed; font-weight:800; pointer-events:none; animation:rise 1s ease-out forwards; z-index:50;}
  @keyframes rise{from{opacity:1; transform:translateY(0);} to{opacity:0; transform:translateY(-46px);}}
</style>
</head>
<body>
<header class="top">
  <span class="back hidden" id="backBtn" onclick="goBack()">‹</span>
  <span class="brand" id="brand">PULSE</span>
  <span class="hstat">🔥 <span id="hStreak">0</span></span>
  <span class="hstat">✦ <span id="hXP">0</span></span>
</header>
<div class="wrap">

  <!-- HOME -->
  <div id="home">
    <div class="hero">
      <div class="kick">MARROW EDITION 8 · COMPANION</div>
      <h1>Surgery</h1>
      <p id="heroSub"></p>
      <a onclick="show('chapters')">Browse chapters →</a>
    </div>
    <div class="stats">
      <div class="stat"><b id="sXP">0</b><span>Total XP</span></div>
      <div class="stat"><b id="sStreak">0</b><span>Day streak</span></div>
      <div class="stat"><b id="sUnits">0</b><span>Units done</span></div>
    </div>
    <button class="btn ghost" onclick="unlockAll()">🔓 Unlock all units (testing)</button>
    <button class="btn" onclick="continueLearning()">▶ Continue learning</button>
  </div>

  <!-- CHAPTERS -->
  <div id="chapters" class="hidden">
    <h2 class="page">Chapters</h2>
    <p class="sub" id="chSub"></p>
    <div id="chList"></div>
  </div>

  <!-- PATH -->
  <div id="path" class="hidden">
    <p class="sub" id="pathKick" style="margin-top:16px;"></p>
    <h2 class="page" id="pathTitle" style="margin-top:0;"></h2>
    <p class="sub" id="pathSub"></p>
    <div id="nodes"></div>
  </div>

  <!-- GUIDE -->
  <div id="guide" class="hidden">
    <div class="guide">
      <div class="kick" id="gKick"></div>
      <h2 id="gTitle"></h2>
      <p id="gText"></p>
      <p class="sub" id="gCount"></p>
      <button class="btn gold" onclick="beginUnit()">Start unit →</button>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden">
    <div class="qbar"><i id="qbar"></i></div>
    <div class="qcount" id="qcount"></div>
    <div><span class="qtag" id="qtag"></span></div>
    <div class="qtext" id="qtext"></div>
    <div id="opts"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hidden" id="nextBtn" onclick="nextQ()">Continue →</button>
  </div>

  <!-- UNIT DONE -->
  <div id="unitdone" class="hidden">
    <div class="donebox">
      <div class="big">🎉</div>
      <h2>Unit complete!</h2>
      <p class="sub" id="dSub"></p>
      <div class="stats">
        <div class="stat"><b id="dScore">–</b><span>Score</span></div>
        <div class="stat"><b id="dXP">–</b><span>XP earned</span></div>
        <div class="stat"><b id="dAcc">–</b><span>Accuracy</span></div>
      </div>
      <div id="dRev"></div>
      <button class="btn" onclick="afterUnit()">Continue →</button>
      <button class="btn ghost" onclick="openGuide(curUnit)">↻ Redo unit</button>
    </div>
  </div>

  <footer>PULSE · Surgery · question order follows the book line-by-line<br>options shuffled every run · progress saved on this device</footer>
</div>

<script>
const QUESTIONS = [{"id":"SURG-C1-001","sec":"Consents","page":1,"q":"As per the book, consent before a procedure must contain all of the following components EXCEPT:","opts":["Identification and diagnosis","Description of the procedure","Patient-specific and procedure-specific complications","Blood group and routine labs"],"ans":3,"exp":"Components of consent = identification, diagnosis, planned procedure, surgeon, description, patient-specific complications, procedure-specific complications, benefits, alternate procedure and sign of patient, surgeon and witness. (Book p1)"},{"id":"SURG-C1-002","sec":"Consents","page":1,"q":"Which of the following is an explicit component of consent?","opts":["The surgeon performing the procedure","Hospital bed number","Anaesthetic equipment list","Insurance details"],"ans":0,"exp":"The planned procedure and the surgeon are explicit components of consent. (Book p1)"},{"id":"SURG-C1-003","sec":"Consents","page":1,"q":"A procedure-specific complication must be explained to the patient when its incidence is:","opts":["Greater than 1%","Greater than 5%","Greater than 10%","Greater than 20%"],"ans":0,"exp":"Procedure specific complications = any complication > 1% incidence. (Book p1)"},{"id":"SURG-C1-004","sec":"Consents","page":1,"q":"In addition to the planned procedure, consent must also discuss:","opts":["Benefits and alternate procedure","Hospital charges only","Ward amenities","Visiting timings"],"ans":0,"exp":"Consent includes benefits and the alternate procedure. (Book p1)"},{"id":"SURG-C1-005","sec":"Consents","page":1,"q":"The consent form is signed by:","opts":["Patient, surgeon and witness","Only the patient","Only the surgeon","Nurse and anaesthetist"],"ans":0,"exp":"Consent requires the sign of patient, surgeon and witness. (Book p1)"},{"id":"SURG-C1-006","sec":"IV Lines","page":1,"q":"In the color-coding of IV cannulas, the YELLOW cannula corresponds to gauge:","opts":["24G","22G","20G","18G"],"ans":0,"exp":"Yellow = 24G (max flow 13 (10) ml/min), the narrowest cannula in the chart. (Book p1)"},{"id":"SURG-C1-007","sec":"IV Lines","page":1,"q":"The BLUE IV cannula corresponds to gauge:","opts":["24G","22G","20G","14G"],"ans":1,"exp":"Blue = 22G with a maximal flow of 31 (30) ml/min. (Book p1)"},{"id":"SURG-C1-008","sec":"IV Lines","page":1,"q":"The PINK IV cannula corresponds to gauge:","opts":["20G","24G","16G","14G"],"ans":0,"exp":"Pink = 20G with a maximal flow of 67 (60) ml/min. (Book p1)"},{"id":"SURG-C1-009","sec":"IV Lines","page":1,"q":"The GREEN IV cannula corresponds to gauge:","opts":["18G","16G","14G","20G"],"ans":0,"exp":"Green = 18G with a maximal flow of 96 ml/min. (Book p1)"},{"id":"SURG-C1-010","sec":"IV Lines","page":1,"q":"The GRAY IV cannula corresponds to gauge:","opts":["16G","18G","14G","24G"],"ans":0,"exp":"Gray = 16G with a maximal flow of 236 (240 ml/min). (Book p1)"},{"id":"SURG-C1-011","sec":"IV Lines","page":1,"q":"The ORANGE IV cannula, which is used in shock, corresponds to gauge:","opts":["14G","16G","18G","22G"],"ans":0,"exp":"Orange (used in shock) = 14G, the widest cannula, with a maximal flow of 270 ml/min. (Book p1)"},{"id":"SURG-C1-012","sec":"IV Lines","page":1,"q":"The narrowest cannula in the color chart is:","opts":["24G yellow","16G gray","18G green","14G orange"],"ans":0,"exp":"The chart runs from narrow 24G (yellow) to wide 14G (orange). (Book p1)"},{"id":"SURG-C1-013","sec":"IV Lines","page":1,"q":"The widest cannula in the color chart is:","opts":["14G orange","16G gray","20G pink","22G blue"],"ans":0,"exp":"14G orange is the widest cannula and is the one used in shock. (Book p1)"},{"id":"SURG-C1-014","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 16G gray cannula is:","opts":["236 (240 ml/min)","96 ml/min","67 (60) ml/min","270 ml/min"],"ans":0,"exp":"Gray 16G maximal flow = 236 (240 ml/min). (Book p1)"},{"id":"SURG-C1-015","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 20G pink cannula is:","opts":["67 (60) ml/min","31 (30) ml/min","13 (10) ml/min","236 (240) ml/min"],"ans":0,"exp":"Pink 20G maximal flow = 67 (60) ml/min. (Book p1)"},{"id":"SURG-C1-016","sec":"IV Lines","page":1,"q":"The maximal flow rate of the 14G orange cannula is:","opts":["270 ml/min","236 (240) ml/min","96 ml/min","67 (60) ml/min"],"ans":0,"exp":"Orange 14G (used in shock) has the highest maximal flow of 270 ml/min. (Book p1)"},{"id":"SURG-C1-017","sec":"IV Lines","page":1,"q":"In the color chart, which group of cannulas is bracketed for paediatric patients?","opts":["Yellow, blue and pink (24G, 22G, 20G)","Green, gray and orange","16G and 14G only","All gauges"],"ans":0,"exp":"Yellow (24G), blue (22G) and pink (20G) are grouped together for paediatric patients. (Book p1)"},{"id":"SURG-C1-018","sec":"IV Lines","page":1,"q":"A cannula with a maximal flow of 96 ml/min is color-coded:","opts":["Green (18G)","Blue (22G)","Yellow (24G)","Gray (16G)"],"ans":0,"exp":"Green = 18G with maximal flow 96 ml/min. (Book p1)"},{"id":"SURG-C1-019","sec":"IV Lines: Complications","page":1,"q":"The most common complication of an IV line is:","opts":["Superficial thrombophlebitis","Infiltration","Nerve injury","Arterial puncture"],"ans":0,"exp":"Superficial thrombophlebitis is the m/c complication of IV lines. (Book p1)"},{"id":"SURG-C1-020","sec":"IV Lines: Complications","page":1,"q":"Superficial thrombophlebitis at a cannulation site presents with:","opts":["Tender, cord-like swelling","Painless soft swelling","Bruising only","Systemic fever only"],"ans":0,"exp":"Features of superficial thrombophlebitis: tender, cord-like swelling. (Book p1)"},{"id":"SURG-C1-021","sec":"IV Lines: Complications","page":1,"q":"The management of superficial thrombophlebitis at a cannula site is:","opts":["Topical heparinoid","Systemic antibiotics","Emergent thrombectomy","Compression bandage only"],"ans":0,"exp":"Management of superficial thrombophlebitis = topical heparinoid. (Book p1)"},{"id":"SURG-C1-022","sec":"Surgical Safety Checklist","page":2,"q":"The three phases of the surgical safety checklist, in order, are:","opts":["Sign in → Time out → Sign out","Time out → Sign in → Sign out","Sign out → Sign in → Time out","Sign in → Sign out → Time out"],"ans":0,"exp":"The checklist flows Before induction of anaesthesia (sign in) → Before skin incision (time out) → Before patient leaves the operating room (sign out). (Book p2)"},{"id":"SURG-C1-023","sec":"Surgical Safety Checklist","page":2,"q":"'Before induction of anaesthesia' (ward to OT complex) corresponds to which phase?","opts":["Sign in","Time out","Sign out","Handover"],"ans":0,"exp":"Sign in happens before induction of anaesthesia, in the ward to OT complex. (Book p2)"},{"id":"SURG-C1-024","sec":"Surgical Safety Checklist","page":2,"q":"'Before skin incision' corresponds to which phase?","opts":["Time out","Sign in","Sign out","Check back"],"ans":0,"exp":"Time out is performed before skin incision. (Book p2)"},{"id":"SURG-C1-025","sec":"Surgical Safety Checklist","page":2,"q":"'Before patient leaves the operating room' corresponds to which phase?","opts":["Sign out","Sign in","Time out","Handover"],"ans":0,"exp":"Sign out is completed before the patient leaves the operating room. (Book p2)"},{"id":"SURG-C1-026","sec":"Surgical Safety Checklist","page":2,"q":"During sign in, the patient has confirmed all of the following EXCEPT:","opts":["Identity","Marked site","Procedure and written consent","Fasting status"],"ans":3,"exp":"At sign in the patient has confirmed identity, site (marked), procedure and written consent. (Book p2)"},{"id":"SURG-C1-027","sec":"Surgical Safety Checklist","page":2,"q":"Which of the following is checked during sign in?","opts":["Known allergies","Specimen labelling","Actual blood loss","Antibiotic prophylaxis"],"ans":0,"exp":"Sign in includes known allergies and the risk of >500 ml blood loss. (Book p2)"},{"id":"SURG-C1-028","sec":"Surgical Safety Checklist","page":2,"q":"During sign in, the risk of blood loss greater than how much is assessed?","opts":[">500 ml",">200 ml",">1000 ml",">100 ml"],"ans":0,"exp":"Sign in assesses the risk of >500 ml blood loss. (Book p2)"},{"id":"SURG-C1-029","sec":"Surgical Safety Checklist","page":2,"q":"During time out, the team confirms:","opts":["Patient site, procedure name and time","Allergies and consent","Specimen label","Sponge count"],"ans":0,"exp":"Time out confirms patient site, procedure name and time. (Book p2)"},{"id":"SURG-C1-030","sec":"Surgical Safety Checklist","page":2,"q":"At time out, antibiotic prophylaxis must have been given within the last:","opts":["30 minutes","10 minutes","60 minutes","2 hours"],"ans":0,"exp":"Time out checks that antibiotic prophylaxis was given within the last 30 min. (Book p2)"},{"id":"SURG-C1-031","sec":"Surgical Safety Checklist","page":2,"q":"During time out, the anticipated blood loss is estimated by the:","opts":["Surgeon","Anaesthetist","Nurse","Scrub technician"],"ans":0,"exp":"Anticipated blood loss at time out is given by the surgeon (actual loss at sign out is by the anaesthetist). (Book p2)"},{"id":"SURG-C1-032","sec":"Surgical Safety Checklist","page":2,"q":"During sign out, which of the following is verified?","opts":["Instruments, sponge and needle count","Written consent","Patient identity","Fasting status"],"ans":0,"exp":"Sign out verifies instruments, sponge and needle count. (Book p2)"},{"id":"SURG-C1-033","sec":"Surgical Safety Checklist","page":2,"q":"Specimen labelling during sign out must include:","opts":["Patient name","Only the specimen number","Hospital code","Ward number"],"ans":0,"exp":"Sign out includes specimen labelling (including patient name). (Book p2)"},{"id":"SURG-C1-034","sec":"Surgical Safety Checklist","page":2,"q":"During sign out, the actual blood loss is documented by the:","opts":["Anaesthetist","Surgeon","Nurse","Lab technician"],"ans":0,"exp":"Actual blood loss at sign out is recorded by the anaesthetist. (Book p2)"},{"id":"SURG-C1-035","sec":"Surgical Safety Checklist","page":2,"q":"The note on the surgical safety checklist states that:","opts":["There is no time in phase","Time out lasts exactly 5 minutes","Sign in takes 30 minutes","Sign out is optional"],"ans":0,"exp":"The book's note: 'There is no time in phase' — time out is a pause in workflow, not a timed interval. (Book p2)"},{"id":"SURG-C1-036","sec":"Estimating Blood Loss","page":2,"q":"The actual amount of blood loss is estimated as:","opts":["Blood in suction − irrigation fluid","Blood in suction + irrigation fluid","Dry mop weight − wet mop weight","Sponge count × 50 cc"],"ans":0,"exp":"Actual amount = blood in suction − irrigation fluid. (Book p2)"},{"id":"SURG-C1-037","sec":"Estimating Blood Loss","page":2,"q":"Alternatively, blood loss is estimated as:","opts":["Wet mop weight − dry mop weight","Wet mop weight + dry mop weight","Dry mop weight − wet mop weight","Irrigation fluid − suction"],"ans":0,"exp":"Blood loss can also be estimated as wet mop weight − dry mop weight. (Book p2)"},{"id":"SURG-C1-038","sec":"Estimating Blood Loss","page":2,"q":"A soaked mop represents a blood loss of:","opts":["100 cc","500 cc","200 cc","1000 cc"],"ans":0,"exp":"Soaked mop = 100 cc of blood. (Book p2)"},{"id":"SURG-C1-039","sec":"Estimating Blood Loss","page":2,"q":"A fist full of clots represents a blood loss of:","opts":["500 cc","100 cc","250 cc","1000 cc"],"ans":0,"exp":"Fist full of clots = 500 cc of blood. (Book p2)"},{"id":"SURG-C1-040","sec":"Estimating Blood Loss","page":2,"q":"Surgical mops carry a radio-opaque line so that they can be:","opts":["Picked up on X-ray","Weighed more easily","Sterilized faster","Identified by color"],"ans":0,"exp":"Mops have a radio-opaque line that is picked up on X-ray. (Book p2)"},{"id":"SURG-C1-041","sec":"OT Zoning","page":2,"q":"The four OT zones are:","opts":["Protective, clean, aseptic and disposal","Sterile, semi-sterile, dirty and waste","Core, buffer, outer and exit","OT, ICU, wards and entry"],"ans":0,"exp":"OT zoning = 1. Protective zone, 2. Clean zone, 3. Aseptic zone, 4. Disposal zone. (Book p2)"},{"id":"SURG-C1-042","sec":"OT Zoning","page":2,"q":"Which of the following belongs to the protective zone?","opts":["Change rooms, transfer bay, pre & post op rooms, ICU/PACU","Equipment store room","The operating theatre itself","Maintenance workshop"],"ans":0,"exp":"Protective zone = change rooms, transfer bay, pre & post op rooms and ICU/PACU. (Book p2)"},{"id":"SURG-C1-043","sec":"OT Zoning","page":2,"q":"The clean zone connects the protective zone to the:","opts":["Aseptic zone","Protective zone","Disposal zone","Ward"],"ans":0,"exp":"The clean zone connects the protective zone to the aseptic zone. (Book p2)"},{"id":"SURG-C1-044","sec":"OT Zoning","page":2,"q":"The equipment store room and maintenance workshop are in the:","opts":["Clean zone","Protective zone","Aseptic zone","Disposal zone"],"ans":0,"exp":"Clean zone = equipment store room and maintenance workshop. (Book p2)"},{"id":"SURG-C1-045","sec":"OT Zoning","page":2,"q":"The aseptic zone of the OT complex is the:","opts":["Operating theatre (OT)","Change room","ICU","Entry lobby"],"ans":0,"exp":"Aseptic zone = OT itself. (Book p2)"},{"id":"SURG-C1-046","sec":"OT Positions","page":3,"q":"The m/c position used for abdominal and breast surgeries is the:","opts":["Supine (neutral) position","Lithotomy position","Prone position","Fowler's position"],"ans":0,"exp":"Supine/neutral position is the m/c position used for abdominal and breast surgeries. (Book p3)"},{"id":"SURG-C1-047","sec":"OT Positions","page":3,"q":"The Trendelenberg position (head end low, foot end up) is used in:","opts":["Pelvic surgeries","Upper abdominal surgeries","Posterior cranial fossa surgery","Rectal cancer surgery"],"ans":0,"exp":"Trendelenberg position is used in pelvic surgeries. (Book p3)"},{"id":"SURG-C1-048","sec":"OT Positions","page":3,"q":"The reverse Trendelenberg position is used in:","opts":["Upper abdominal surgeries","Pelvic surgeries","Spinal surgery","Posterior cranial fossa surgery"],"ans":0,"exp":"Reverse Trendelenberg is used in upper abdominal surgeries and in laparoscopic cholecystometry with right side up. (Book p3)"},{"id":"SURG-C1-049","sec":"OT Positions","page":3,"q":"In laparoscopic cholecystectomy, reverse Trendelenberg is taken with the:","opts":["Right side up","Left side up","Head end down","Table level"],"ans":0,"exp":"Laparoscopic cholecystectomy uses reverse Trendelenberg with right side up. (Book p3)"},{"id":"SURG-C1-050","sec":"OT Positions","page":3,"q":"In laparoscopic cholecystectomy, CO2 collects below the right dome of the diaphragm, producing the m/c complication of:","opts":["Right shoulder tip pain","Left shoulder tip pain","Right leg pain","Neck pain"],"ans":0,"exp":"CO2 collects below the right dome of diaphragm → right shoulder tip pain, the m/c complication. (Book p3)"},{"id":"SURG-C1-051","sec":"OT Positions","page":3,"q":"Lithotomy position is used in all of the following EXCEPT:","opts":["Posterior cranial fossa surgery","Obstetric procedures","Gynecologic procedures","Hemorrhoid surgeries"],"ans":0,"exp":"Lithotomy is used for obstetric, gynecologic, urologic (TURP) and hemorrhoid surgeries — not posterior cranial fossa surgery. (Book p3)"},{"id":"SURG-C1-052","sec":"OT Positions","page":3,"q":"The urologic procedure performed in lithotomy position mentioned in the book is:","opts":["TURP","Nephrectomy","Pyelolithotomy","Laparoscopic cholecystectomy"],"ans":0,"exp":"Urologic procedures (TURP) are listed under the uses of lithotomy position. (Book p3)"},{"id":"SURG-C1-053","sec":"OT Positions","page":3,"q":"In lithotomy position, if the legs are not supported properly, the nerve commonly injured is the:","opts":["Common peroneal nerve","Femoral nerve","Obturator nerve","Sciatic nerve"],"ans":0,"exp":"Nerve injured if legs are not supported properly: common peroneal nerve. (Book p3)"},{"id":"SURG-C1-054","sec":"OT Positions","page":3,"q":"The lateral (kidney) position is NOT used for:","opts":["Hemorrhoid surgery","Nephrectomy","Thoracotomy","Pyelolithotomy"],"ans":0,"exp":"Lateral/kidney position uses: thoracotomy, pyelolithotomy, nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap). (Book p3)"},{"id":"SURG-C1-055","sec":"OT Positions","page":3,"q":"A breast reconstruction operation performed in the lateral (kidney) position uses the:","opts":["Latissimus dorsi flap","Rectus abdominis flap","DIEP flap","Omentum only"],"ans":0,"exp":"Breast reconstruction in the lateral position uses the latissimus dorsi flap. (Book p3)"},{"id":"SURG-C1-056","sec":"OT Positions","page":3,"q":"In the lateral (kidney) position, the increased risk of brachial plexus injury is due to:","opts":["Hyperextended arm","Compressed neck","Tight waist belt","Unsupported legs"],"ans":0,"exp":"Lateral position carries increased risk for brachial plexus injury d/t hyperextended arm. (Book p3)"},{"id":"SURG-C1-057","sec":"OT Positions","page":4,"q":"The prone position is used for:","opts":["Spinal surgery and pilonidal sinus surgery","Pelvic surgeries","Laparoscopic cholecystectomy","Rectal cancer surgery"],"ans":0,"exp":"Prone position uses: spinal surgery and pilonidal sinus surgery. (Book p4)"},{"id":"SURG-C1-058","sec":"OT Positions","page":4,"q":"The sitting / Fowler's position is used for:","opts":["Posterior cranial fossa surgery","Upper abdominal surgery","Spinal surgery","Hemorrhoid surgery"],"ans":0,"exp":"Sitting/Fowler's position is used for posterior cranial fossa surgery. (Book p4)"},{"id":"SURG-C1-059","sec":"OT Positions","page":4,"q":"An advantage of the sitting / Fowler's position is:","opts":["Bloodless field with reduced blood loss","No risk of air embolism","Better venous return","Easier ventilation"],"ans":0,"exp":"Advantages of Fowler's: ↓ blood loss (blood less field) and ↑ exposure. (Book p4)"},{"id":"SURG-C1-060","sec":"OT Positions","page":4,"q":"A disadvantage of the sitting / Fowler's position is:","opts":["Increased risk of air embolism","Increased blood loss","Worsened exposure","Loss of muscle relaxation"],"ans":0,"exp":"Disadvantage of sitting/Fowler's position: ↑ risk of air embolism. (Book p4)"},{"id":"SURG-C1-061","sec":"OT Positions","page":4,"q":"The jackknife position is:","opts":["Obsolete, previously used for hemorrhoid/fissure surgeries","The m/c position for abdominal surgery","Used for posterior cranial fossa surgery","Synonymous with lithotomy"],"ans":0,"exp":"Jackknife position = obsolete position, previously used for hemorrhoid fissure surgeries. (Book p4)"},{"id":"SURG-C1-062","sec":"OT Positions","page":4,"q":"A complication of the jackknife position is:","opts":["Positional asphyxia","Air embolism","Brachial plexus injury","Common peroneal nerve injury"],"ans":0,"exp":"Complication of the jackknife position = positional asphyxia. (Book p4)"},{"id":"SURG-C1-063","sec":"OT Positions","page":4,"q":"The Lloyd-Davis position is a combination of:","opts":["Trendelenberg + lithotomy","Prone + lithotomy","Fowler's + Trendelenberg","Lateral + prone"],"ans":0,"exp":"Lloyd-Davis position = Trendelenberg + lithotomy position. (Book p4)"},{"id":"SURG-C1-064","sec":"OT Positions","page":4,"q":"The Lloyd-Davis position is used in:","opts":["Rectal cancer surgery","Nephrectomy","Posterior cranial fossa surgery","Breast surgery"],"ans":0,"exp":"Lloyd-Davis position is used in rectal cancer surgery. (Book p4)"},{"id":"SURG-C1-065","sec":"Air Embolism","page":4,"q":"As per the book, how much air sucked into a vein enters circulation and dysregulates cardiac functioning?","opts":["50–100 cc","5–10 cc","500 cc","5000 cc"],"ans":0,"exp":"Air (50-100cc) sucked into vein → enters circulation → dysregulates cardiac functioning. (Book p4)"},{"id":"SURG-C1-066","sec":"Air Embolism","page":4,"q":"Air embolism is a risk in which of the following?","opts":["Thyroid/head and neck surgeries","Appendicectomies","Hernia repairs","Hemorrhoidectomies"],"ans":0,"exp":"Risk factors for air embolism: thyroid/head & neck surgeries and sitting/Fowler's position. (Book p4)"},{"id":"SURG-C1-067","sec":"Air Embolism","page":4,"q":"The m/c presenting feature of an air embolism is:","opts":["Sudden desaturation","Gradual cyanosis","High-grade fever","Bradycardia"],"ans":0,"exp":"Clinical features: sudden desaturation, dyspnea and hypotension. (Book p4)"},{"id":"SURG-C1-068","sec":"Air Embolism","page":4,"q":"Clinical features of air embolism include all of the following EXCEPT:","opts":["High-grade fever","Sudden desaturation","Dyspnea","Hypotension"],"ans":0,"exp":"Features = sudden desaturation, dyspnea, hypotension — fever is not listed. (Book p4)"},{"id":"SURG-C1-069","sec":"Air Embolism","page":5,"q":"To prevent air embolism in the Fowler's position, the vein should be:","opts":["Ligated before cutting","Cut first, then ligated","Dilated","Infiltrated with adrenaline"],"ans":0,"exp":"Prevention: 1. Ligate vein before cutting. (Book p5)"},{"id":"SURG-C1-070","sec":"Air Embolism","page":5,"q":"Air entry into the field is further prevented by:","opts":["Irrigating the field","Drying the field","Elevating the head","Covering the field"],"ans":0,"exp":"Prevention of air embolism in Fowler's position: ligate vein before cutting and irrigate field. (Book p5)"},{"id":"SURG-C1-071","sec":"Air Embolism","page":5,"q":"Management of an air embolism begins with placing the patient in the:","opts":["Durant position","Trendelenberg position","Fowler's position","Lithotomy position"],"ans":0,"exp":"Management starts with the Durant position, followed by aspiration of air. (Book p5)"},{"id":"SURG-C1-072","sec":"Air Embolism","page":5,"q":"The Durant position consists of:","opts":["Right side up (left lateral) + legs up","Left side up + legs down","Prone + Trendelenberg","Supine + Trendelenberg"],"ans":0,"exp":"Durant position = right side up (left lateral) + legs up. (Book p5)"},{"id":"SURG-C1-073","sec":"Air Embolism","page":5,"q":"After the Durant position, air is removed by:","opts":["Aspiration using direct puncture / central line","Pericardiocentesis","Emergent thoracotomy","Chest tube alone"],"ans":0,"exp":"Durant position is followed by aspirating air using direct puncture/central line. (Book p5)"},{"id":"SURG-C1-074","sec":"Air Embolism","page":5,"q":"The Durant position is used when:","opts":["Suspicion of air embolism is positive","The patient is bleeding into shock","The patient has a pneumothorax","The patient is post-extubation"],"ans":0,"exp":"The Durant position is used if suspicion of air embolism is (+). (Book p5)"},{"id":"SURG-C1-075","sec":"Events in Patient Safety","page":5,"q":"An adverse event is defined as:","opts":["An incident that results in harm to the patient","An incident that could have harmed the patient","An incident that never reaches the patient","A medication error only"],"ans":0,"exp":"Adverse event = an incident that results in harm to the patient. (Book p5)"},{"id":"SURG-C1-076","sec":"Events in Patient Safety","page":5,"q":"A near miss is an incident that:","opts":["Could have caused unwanted consequences but did not","Always causes harm","Reaches the patient and causes injury","Is intentional"],"ans":0,"exp":"Near miss = an incident that could have resulted in unwanted consequences but did not. (Book p5)"},{"id":"SURG-C1-077","sec":"Events in Patient Safety","page":5,"q":"A near miss is prevented from reaching the patient by:","opts":["Chance or timely intervention","Patient refusal","Hospital policy only","Depth of anaesthesia"],"ans":0,"exp":"A near miss does not reach the patient either by chance or through timely intervention. (Book p5)"},{"id":"SURG-C1-078","sec":"Events in Patient Safety","page":5,"q":"A no-harm event:","opts":["Reaches the patient but results in no injury","Never reaches the patient","Always causes permanent harm","Is by definition an adverse event"],"ans":0,"exp":"No-harm event = an incident that occurs and reaches the patient but results in no injury. (Book p5)"},{"id":"SURG-C1-079","sec":"Events in Patient Safety","page":5,"q":"In a no-harm event, harm is avoided by:","opts":["Chance or mitigating circumstances","Early surgery","Blood transfusion","Interventional radiology"],"ans":0,"exp":"In a no-harm event, harm is avoided by chance or due to mitigating circumstances. (Book p5)"},{"id":"SURG-C2-001","sec":"Blades","page":6,"q":"The use of surgical blades, as stated in the book, is to:","opts":["Make incisions","Control bleeding","Close wounds","Retract tissues"],"ans":0,"exp":"Uses: make Incisions. (Book p6)"},{"id":"SURG-C2-002","sec":"Blades","page":6,"q":"The sharpest part of a surgical blade is its:","opts":["Back edge","Slot","Belly","Shank"],"ans":2,"exp":"Belly of the blade: Sharpest. (Book p6)"},{"id":"SURG-C2-003","sec":"Blades","page":6,"q":"The No. 11 blade is described as a:","opts":["Curved blade","Pointed / stab blade","Broad spade blade","Hooked blade"],"ans":1,"exp":"No 11 Blade: Pointed/Stab blade. (Book p6)"},{"id":"SURG-C2-004","sec":"Blades","page":6,"q":"Incision and drainage (I & D) of an abscess is a listed use of the:","opts":["No. 12 blade","No. 10 blade","No. 11 blade","No. 22 blade"],"ans":2,"exp":"No 11 Blade uses: Incision & drainage (I & D) of abscess. (Book p6)"},{"id":"SURG-C2-005","sec":"Blades","page":6,"q":"Arteriotomy is a listed use of the:","opts":["No. 12 blade","No. 11 blade","No. 15 blade","No. 23 blade"],"ans":1,"exp":"No 11 Blade uses: I & D of abscess and Arteriotomy. (Book p6)"},{"id":"SURG-C2-006","sec":"Blades","page":6,"q":"The No. 12 blade is:","opts":["Straight","Pointed","Serrated","Curved"],"ans":3,"exp":"No 12 Blade: Curved. (Book p6)"},{"id":"SURG-C2-007","sec":"Blades","page":6,"q":"Suture removal is the listed use of the:","opts":["No. 12 blade","No. 11 blade","No. 10 blade","No. 15 blade"],"ans":0,"exp":"No 12 Blade uses: Suture removal. (Book p6)"},{"id":"SURG-C2-008","sec":"Blades","page":6,"q":"The book's Types of Blades diagram includes all of the following EXCEPT:","opts":["No. 10","No. 15","No. 20","No. 22"],"ans":2,"exp":"The diagram shows No. 10, 11, 15, 22, 23 and the curved No. 12 - there is no No. 20. (Book p6)"},{"id":"SURG-C2-009","sec":"Blade Handling","page":6,"q":"While passing, a blade is passed:","opts":["Hand to hand","On a sponge","In a kidney tray","In a gallipot"],"ans":2,"exp":"Passed in kidney tray / pointed end facing towards self. (Book p6)"},{"id":"SURG-C2-010","sec":"Blade Handling","page":6,"q":"While passing a blade, its pointed end faces:","opts":["Towards the surgeon","Upwards","Downwards","Towards self (the passer)"],"ans":3,"exp":"Passed in kidney tray / pointed end facing towards self. (Book p6)"},{"id":"SURG-C2-011","sec":"Blade Handling","page":6,"q":"Blades are mounted on the:","opts":["Mayo handle","BP (Bard Parker) handle","Kocher handle","Allis handle"],"ans":1,"exp":"Mounted on BP (Bard Parker) handle. (Book p6)"},{"id":"SURG-C2-012","sec":"Incisions","page":6,"q":"Skin incisions are made:","opts":["Parallel to skin","Perpendicular to skin","At 45 degrees to skin","Tangential to skin"],"ans":1,"exp":"Incisions: Perpendicular to skin. (Book p6)"},{"id":"SURG-C2-013","sec":"Incisions","page":6,"q":"An incision proceeds:","opts":["Far to near","Near to far","Left to right","Deep to superficial"],"ans":0,"exp":"Go far to Near. (Book p6)"},{"id":"SURG-C2-014","sec":"Incisions","page":6,"q":"Langer's lines are also called:","opts":["Relaxed pressure lines","Dermal grid lines","Relaxed tension lines","Collagen cleft lines"],"ans":2,"exp":"Langer's lines (Relaxed tension lines). (Book p6)"},{"id":"SURG-C2-015","sec":"Incisions","page":6,"q":"Langer's lines represent the orientation of:","opts":["Muscle fibres","Dermal collagen fibres","Cutaneous nerves","Subdermal vessels"],"ans":1,"exp":"Langer's lines: orientation of dermal collagen fibers. (Book p6)"},{"id":"SURG-C2-016","sec":"Incisions","page":6,"q":"An incision placed parallel to Langer's lines gives a:","opts":["Wide scar","Good scar","Hypertrophic scar","Contracted scar"],"ans":1,"exp":"Incision placed parallel: Good scar. (Book p6)"},{"id":"SURG-C2-017","sec":"Incisions","page":6,"q":"Muscle fibre action runs _____ to Langer's lines:","opts":["Parallel","Perpendicular","Oblique","Spiral"],"ans":1,"exp":"Muscle fibre action is perpendicular. (Book p6)"},{"id":"SURG-C2-018","sec":"Incisions","page":6,"q":"While planning an incision, one must avoid injury to:","opts":["Skin creases","Langer's lines","Anatomical structures","Scar tissue"],"ans":2,"exp":"Avoid injury to anatomical structures. (Book p6)"},{"id":"SURG-C2-019","sec":"Incisions","page":6,"q":"For a good cosmetic result, incisions are placed parallel to Langer's lines or:","opts":["Across skin creases","Over bony points","Through hair-bearing skin","Hidden in skin creases"],"ans":3,"exp":"Cosmetic factor: Parallel to Langer's lines / hidden in skin creases. (Book p6)"},{"id":"SURG-C2-020","sec":"Incisions","page":6,"q":"Which of the following is a factor while planning an incision?","opts":["Adequate access","Maximum length","Maximum depth","Avoiding Langer's lines"],"ans":0,"exp":"Factors while planning an incision include adequate access. (Book p6)"},{"id":"SURG-C2-021","sec":"Monopolar Cautery","page":7,"q":"In monopolar cautery, current flows from the machine to the:","opts":["Pad","Tip (Bovie tip)","Earth wire","Patient skin directly"],"ans":1,"exp":"Machine Current -> Tip (Bovie tip). (Book p7)"},{"id":"SURG-C2-022","sec":"Monopolar Cautery","page":7,"q":"The tip used in monopolar cautery is called the:","opts":["Bovie tip","Mayo tip","Ligasure tip","CUSA tip"],"ans":0,"exp":"Tip (Bovie tip). (Book p7)"},{"id":"SURG-C2-023","sec":"Monopolar Cautery","page":7,"q":"The correct order of the monopolar circuit is:","opts":["Machine -> Tip -> Cut/Coagulate -> Body -> Pad -> Machine","Machine -> Pad -> Body -> Tip -> Cut/Coagulate -> Machine","Tip -> Machine -> Pad -> Body -> Cut/Coagulate -> Tip","Machine -> Body -> Tip -> Pad -> Cut/Coagulate -> Machine"],"ans":0,"exp":"Circuit: machine -> Tip -> Cut/Coagulate -> to body -> Pad -> machine. (Book p7)"},{"id":"SURG-C2-024","sec":"Monopolar Cautery","page":7,"q":"The cautery handpiece carries buttons for:","opts":["Irrigation and suction","Cutting and coagulation","Cutting only","Coagulation only"],"ans":1,"exp":"The handpiece is labelled Coagulation and Cutting. (Book p7)"},{"id":"SURG-C2-025","sec":"Cautery Pad","page":7,"q":"The cautery pad is placed over a:","opts":["Bony prominence","Scarred area","Poorly perfused area","Well-vascularized area"],"ans":3,"exp":"Cautery pad: Placed over well-vascularized area. (Book p7)"},{"id":"SURG-C2-026","sec":"Cautery Pad","page":7,"q":"The cautery pad must have:","opts":["Point contact","Wide area of contact","Minimal contact","No direct skin contact"],"ans":1,"exp":"Have wide area of contact. (Book p7)"},{"id":"SURG-C2-027","sec":"Cautery Pad","page":7,"q":"A small cautery pad causes:","opts":["Faster cutting","Better coagulation","Burns at site","No effect"],"ans":2,"exp":"Small cautery pad: Burns at site. (Book p7)"},{"id":"SURG-C2-028","sec":"Cautery Pad","page":7,"q":"With no cautery pad, the circuit is incomplete and:","opts":["Only cutting works","Only coagulation works","Bipolar takes over","Monopolar will not work"],"ans":3,"exp":"No cautery pad: Circuit incomplete -> monopolar will not work. (Book p7)"},{"id":"SURG-C2-029","sec":"Monopolar Cautery","page":7,"q":"Lateral spread of current in monopolar cautery causes:","opts":["Thermal damage to nearby structures","Faster healing","Reduced bleeding elsewhere","Cooling of the field"],"ans":0,"exp":"Disadvantage: Lateral spread of current -> Thermal damage to nearby structures. (Book p7)"},{"id":"SURG-C2-030","sec":"Monopolar Cautery","page":7,"q":"Monopolar current interferes with:","opts":["Renal function","Hepatic blood flow","Cardiac conduction","Gut motility"],"ans":2,"exp":"Current interferes with cardiac conduction. (Book p7)"},{"id":"SURG-C2-031","sec":"Monopolar Cautery","page":7,"q":"Because it interferes with cardiac conduction, monopolar cautery is avoided in patients with:","opts":["Diabetes","Hypertension","Cardiac pacemakers","Asthma"],"ans":2,"exp":"Avoid in patients with cardiac pacemakers. (Book p7)"},{"id":"SURG-C2-032","sec":"Monopolar Cautery","page":7,"q":"Current applied over a pedicle undergoes:","opts":["Dissipation","Channelisation of current","Reflection","Absorption"],"ans":1,"exp":"Pedicle -> Channelisation of current. (Book p7)"},{"id":"SURG-C2-033","sec":"Monopolar Cautery","page":7,"q":"In a pedicle, the channelled current:","opts":["Stays at the tip","Returns directly to the machine","Spreads to the skin","Runs to base"],"ans":3,"exp":"Current runs to base. (Book p7)"},{"id":"SURG-C2-034","sec":"Monopolar Cautery","page":7,"q":"Monopolar cautery is avoided close to:","opts":["Large veins","End arteries","Skin surface","Fat planes"],"ans":1,"exp":"Avoid close to end arteries. (Book p7)"},{"id":"SURG-C2-035","sec":"Monopolar Cautery","page":7,"q":"The uses of monopolar cautery are:","opts":["Cutting and coagulation","Coagulation only","Cutting only","Vessel sealing only"],"ans":0,"exp":"Uses: Cutting and Coagulation. (Book p7)"},{"id":"SURG-C2-036","sec":"Monopolar Cautery","page":7,"q":"Monopolar cautery is avoided in all of the following EXCEPT:","opts":["CNS surgery","Parotid / Thyroid surgery","Ear lobule","Subcutaneous lipoma excision"],"ans":3,"exp":"Avoided in: CNS Sx, Parotid/Thyroid Sx, Ear lobule, Penile region, Patient with Pacemakers. (Book p7)"},{"id":"SURG-C2-037","sec":"Monopolar Cautery","page":7,"q":"Which of the following regions is listed for avoidance of monopolar cautery?","opts":["Abdominal wall","Thigh","Back","Penile region"],"ans":3,"exp":"Avoided in: CNS Sx, Parotid/Thyroid Sx, Ear lobule, Penile region, Patient with Pacemakers. (Book p7)"},{"id":"SURG-C2-038","sec":"Monopolar Cautery","page":7,"q":"Parotid / Thyroid surgery appears i y"],"ans":2,"exp":"Blend mode: Combination of cutting & coagulation mode. (Book p8)"},{"id":"SURG-C2-046","sec":"Currents","page":8,"q":"The coagulation mode is a:","opts":["Low voltage, continuous current","High voltage, alternating current","Low voltage, direct current","High voltage, direct current"],"ans":1,"exp":"Coagulation mode: High voltage, alternating current. (Book p8)"},{"id":"SURG-C2-047","sec":"Currents","page":8,"q":"Fulguration mode is:","opts":["A cutting mode","A type of coagulation with higher voltage peaks","A blend of two cutting modes","An ultrasonic mode"],"ans":1,"exp":"Fulguration mode: Type of coagulation with higher voltage peaks. (Book p8)"},{"id":"SURG-C2-048","sec":"Currents","page":8,"q":"The fulguration waveform is labelled with:","opts":["Peak voltage and average voltage","Current and resistance","Frequency and wavelength","Power and energy"],"ans":0,"exp":"Fulguration waveform labels Peak voltage and Average voltage. (Book p8)"},{"id":"SURG-C2-049","sec":"Currents","page":8,"q":"Cutting current acts by heat causing:","opts":["Dehydration + protein denaturation","Slow desiccation","Cell water explosion","Protein cross-linking only"],"ans":2,"exp":"Cutting current: Heat -> Cell water explosion. (Book p8)"},{"id":"SURG-C2-050","sec":"Currents","page":8,"q":"Coagulation current causes:","opts":["Cell water explosion","Dehydration + protein denaturation","Slow vaporization","Tissue freezing"],"ans":1,"exp":"Coagulation current: Dehydration + Protein Denaturation. (Book p8)"},{"id":"SURG-C2-051","sec":"Currents","page":8,"q":"Dehydration + protein denaturation by coagulation current leads to:","opts":["Cell swelling","Cell division","Cell repair","Cell death"],"ans":3,"exp":"Dehydration + Protein Denaturation -> Cell death. (Book p8)"},{"id":"SURG-C2-052","sec":"Ligasure","page":8,"q":"Ligasure works by:","opts":["Ultrasound alone","Cold + pressure","Heat + pressure","Microwaves"],"ans":2,"exp":"Ligasure: Heat + pressure. (Book p8)"},{"id ok p20)"},{"id":"SURG-C4-045","sec":"Abscess","page":20,"q":"Overall, the most common site of intra-abdominal abscess is the:","opts":["Morrison's pouch","Pelvis/pouch of Douglas","Subdiaphragmatic space","Lesser sac"],"ans":1,"exp":"Intra-abdominal abscess Site: m/c Overall: Pelvis/pouch of Douglas. (Book p20)"},{"id":"SURG-C4-046","sec":"Abscess","page":20,"q":"In a supine patient, the most common site of collection is:","opts":["Pelvis","Morrison's pouch / right hepatorenal pouch","Left paracolic gutter","Spleen"],"ans":1,"exp":"Supine patient: Morrison's pouch/right hepatorenal pouch. (Book p20)"},{"id":"SURG-C4-047","sec":"Abscess","page":20,"q":"In an ambulatory patient, the most common site of collection is the:","opts":["Morrison's pouch","Pelvis/pouch of Douglas","Subdiaphragmatic space","Liver"],"ans":1,"exp":"Ambulatory patient: Pelvis/pouch of Douglas. (Book p20)"},{"id":"SURG-C4-048","sec":"Abscess","page":20,"q":"Intra-abdominal abscess presents with:","opts":["Fever with chills & rigor","Painless swelling","Jaundice only","Constipation only"],"ans":0,"exp":"Abscess Clinical features: Fever with chills & rigor. (Book p20)"},{"id":"SURG-C4-049","sec":"Abscess","page":20,"q":"Hiccups suggest a collection in the:","opts":["Pelvis","Subdiaphragmatic space","Morrison's pouch","Paracolic gutter"],"ans":1,"exp":"Subdiaphragmatic space collection: Hiccups; Shoulder pain (Referred pain). (Book p20)"},{"id":"SURG-C4-050","sec":"Abscess","page":20,"q":"Shoulder pain in a subdiaphragmatic collection is a:","opts":["Direct pain","Referred pain","Psychogenic pain","Cardiac pain"],"ans":1,"exp":"Subdiaphragmatic space: Shoulder pain (Referred pain). (Book p20)"},{"id":"SURG-C4-051","sec":"Abscess","page":20,"q":"Pelvic diarrhoea, mainly mucous, suggests a collection in the:","opts":["Subdiaphragmatic space","Pelvis","Liver","Spleen"],"ans":1,"exp":"Pelvis collection: Pelvic diarrhoea (mainly mucous); increased frequency of micturition. (Book p20)"},{"id":"SURG-C4-052","sec":"Abscess","page":20,"q":"Increased frequency of micturition suggests a collection in the:","opts":["Subdiaphragmatic space","Pelvis","Morrison's pouch","Kidney"],"ans":1,"exp":"Pelvis collection: increased frequency of micturition. (Book p20)"},{"id":"SURG-C4-053","sec":"Abscess","page":20,"q":"The investigation of choice for intra-abdominal abscess is:","opts":["USG abdomen","CECT Abdomen","Plain X-ray","PET scan"],"ans":1,"exp":"Ix: CECT Abdomen (IOC). (Book p20)"},{"id":"SURG-C4-054","sec":"Abscess","page":20,"q":"Management of intra-abdominal abscess is:","opts":["Open surgery always","Drainage with pigtail catheter under USG guidance","Antibiotics alone","Observation only"],"ans":1,"exp":"Mx: Drainage with pigtail catheter under USG guidance. (Book p20)"},{"id":"SURG-C4-055","sec":"Abscess","page":20,"q":"On CECT, a pelvic abscess appears as a:","opts":["Homogeneous enhancement","Heterogeneous collection","Calcified mass","Air-fluid cyst"],"ans":1,"exp":"CECT Pelvic abscess: Heterogeneous collection. (Book p20)"},{"id":"SURG-C4-056","sec":"SSI","page":21,"q":"Surgical site infection is a wound infection occurring within:","opts":["7 days of Sx","30 days of Sx","6 months of Sx","5 years of Sx"],"ans":1,"exp":"SSI: wound infection within 30 days of Sx. (Book p21)"},{"id":"SURG-C4-057","sec":"SSI","page":21,"q":"If an implant is placed, SSI is defined within:","opts":["30 days of Sx","One year of Sx","5 years of Sx","10 years of Sx"],"ans":1,"exp":"SSI: within 30 days of Sx or if an implant is placed within one year of Sx. (Book p21)"},{"id":"SURG-C4-058","sec":"SSI","page":21,"q":"Superficial SSI is:","opts":["Below fascia","Above fascia","Collection in organ/cavity","Bloodstream infection"],"ans":1,"exp":"SSI Types: Superficial: Above fascia; Deep: Below fascia; Organ space: Collection in organ/cavity. (Book p21)"},{"id":"SURG-C4-059","sec":"SSI","page":21,"q":"Deep SSI is:","opts":["Above fascia","Below fascia","Skin redness only","Bloodstream infection"],"ans":1,"exp":"SSI Types: Deep: Below fascia. (Book p21)"},{"id":"SURG-C4-060","sec":"SSI","page":21,"q":"Organ space SSI is:","opts":["Above fascia","Below skin only","Collection in organ/cavity","Fever without focus"],"ans":2,"exp":"SSI Types: Organ space: Collection in organ/cavity. (Book p21)"},{"id":"SURG-C4-061","sec":"ASEPSIS","page":21,"q":"'Additional treatment' in the ASEPSIS score includes:","opts":["Only antibiotics","Antibiotics, drainage of pus under LA, debridement under GA","Only dressings","Only physiotherapy"],"ans":1,"exp":"ASEPSIS Additional treatment: Antibiotics; Drainage of pus under LA; Debridement under GA. (Book p21)"},{"id":"SURG-C4-062","sec":"ASEPSIS","page":21,"q":"In the ASEPSIS score, drainage of pus is done under __ and debridement under __:","opts":["GA, LA","LA, GA","LA, LA","GA, GA"],"ans":1,"exp":"Drainage of pus under local anesthesia; Wound debridement under general anesthesia. (Book p21)"},{"id":"SURG-C4-063","sec":"ASEPSIS","page":21,"q":"In ASEPSIS, the first 'S' stands for:","opts":["Surgery","Serous discharge","Sepsis","Stitch abscess"],"ans":1,"exp":"ASEPSIS: Serous discharge; Erythema; Purulent exudate; Separation of deep tissues; Isolation of bacteria; Stay prolonged. (Book p21)"},{"id":"SURG-C4-064","sec":"ASEPSIS","page":21,"q":"'Erythema' in ASEPSIS stands for the letter:","opts":["A","S","E","P"],"ans":2,"exp":"ASEPSIS: ... Erythema ... (Book p21)"},{"id":"SURG-C4-065","sec":"ASEPSIS","page":21,"q":"'Purulent exudate' in ASEPSIS stands for the letter:","opts":["A","S","E","P"],"ans":3,"exp":"ASEPSIS: ... Purulent exudate ... (Book p21)"},{"id":"SURG-C4-066","sec":"ASEPSIS","page":21,"q":"Separation of deep tissues in ASEPSIS stands for the second:","opts":["A","P","S","I"],"ans":2,"exp":"ASEPSIS: ... Separation of deep tissues ... (Book p21)"},{"id":"SURG-C4-067","sec":"ASEPSIS","page":21,"q":"'Isolation of bacteria from the wound' stands for the letter:","opts":["A","P","I","S"],"ans":2,"exp":"ASEPSIS: ... Isolation of bacteria from the wound ... (Book p21)"},{"id":"SURG-C4-068","sec":"ASEPSIS","page":21,"q":"In ASEPSIS, prolonged inpatient stay means over:","opts":["7 days","14 days due to wound infection","30 days","1 year"],"ans":1,"exp":"ASEPSIS: Stay as inpatient prolonged over 14 days due to wound infection. (Book p21)"},{"id":"SURG-C4-069","sec":"Southampton","page":21,"q":"Southampton grade 0 means:","opts":["Mild bruising","Normal healing","Erythema","Pus discharge"],"ans":1,"exp":"Southampton: 0: Normal healing. (Book p21)"},{"id":"SURG-C4-070","sec":"Southampton","page":21,"q":"Southampton grade I means:","opts":["Normal healing","Normal healing with mild bruising or erythema","Erythema plus inflammation","Pus discharge"],"ans":1,"exp":"Southampton: I: Normal healing with mild bruising or erythema. (Book p21)"},{"id":"SURG-C4-071","sec":"Southampton","page":21,"q":"Southampton grade II means:","opts":["Normal healing","Mild bruising","Erythema plus other signs of inflammation","Pus discharge"],"ans":2,"exp":"Southampton: II: Erythema plus other signs of inflammation. (Book p21)"},{"id":"SURG-C4-072","sec":"Southampton","page":21,"q":"Southampton grade III means:","opts":["Normal healing","Erythema","Clear or haemoserous discharge","Pus/purulent discharge"],"ans":2,"exp":"Southampton: III: Clear or haemoserous discharge. (Book p21)"},{"id":"SURG-C4-073","sec":"Southampton","page":21,"q":"Southampton grade IV means:","opts":["Clear discharge","Haemoserous discharge","Erythema only","Pus/purulent discharge"],"ans":3,"exp":"Southampton: IV: Pus/purulent discharge. (Book p21)"},{"id":"SURG-C4-074","sec":"Southampton","page":21,"q":"Southampton grade V means:","opts":["Normal healing","Mild bruising","Clear discharge","Deep or severe wound infection with or without tissue breakdown"],"ans":3,"exp":"Southampton: V: Deep or severe wound infection with or without tissue breakdown. (Book p21)"},{"id":"SURG-C4-075","sec":"Risk Factors","page":21,"q":"Extremes of age at risk for SSI are:","opts":["Neonates and older adults","Teenagers only","Middle-aged only","None"],"ans":0,"exp":"Risk factors: Extremities of age: Neonates, older adults. (Book p21)"},{"id":"SURG-C4-076","sec":"Risk Factors","page":21,"q":"Which pair is listed as SSI risk factors?","opts":["Recent Sx of chest/abdomen and coexisting remote infection","Tall height and fair skin","Male sex and blood group O","None of these"],"ans":0,"exp":"Risk factors: Recent Sx especially of chest/abdomen; Coexisting infection remote to surgical site. (Book p21)"},{"id":"SURG-C4-077","sec":"Risk Factors","page":21,"q":"Which pair is listed as SSI risk factors?","opts":["Diabetes mellitus and corticosteroid therapy","Hypertension and asthma","Migraine and epilepsy","None of these"],"ans":0,"exp":"Risk factors: Diabetes mellitus; Corticosteroid therapy. (Book p21)"},{"id":"SURG-C4-078","sec":"Risk Factors","page":21,"q":"Which metabolic factor increases SSI risk?","opts":["Hypercholesterolemia","Hypocholesterolemia","Hypernatremia","Hypokalemia"],"ans":1,"exp":"Risk factors: Hypocholesterolemia. (Book p21)"},{"id":"SURG-C4-079","sec":"Risk Factors","page":21,"q":"Which pair is listed as SSI risk factors?","opts":["Obesity and malnutrition","Fitness and protein diet","Youth and exercise","None of these"],"ans":0,"exp":"Risk factors: Obesity; Malnutrition. (Book p21)"},{"id":"SURG-C4-080","sec":"Risk Factors","page":21,"q":"Which pair is listed as SSI risk factors?","opts":["Chronic inflammation and prior site irradiation","Acute pain and fever","Single surgery and youth","None of these"],"ans":0,"exp":"Risk factors: Chronic inflammation; Prior site irradiation. (Book p21)"},{"id":"SURG-C4-081","sec":"Risk Factors","page":21,"q":"Which pair is listed as SSI risk factors?","opts":["Hypothermia and hypoxemia","Hyperthermia and hyperoxia","Fever and tachycardia","None of these"],"ans":0,"exp":"Risk factors: Hypothermia; Hypoxemia. (Book p21)"},{"id":"SURG-C4-082","sec":"Wound Types","page":22 : Bowel surgery, if the bowel is prepared (Enema or Peglec). (Book p22)"},{"id":"SURG-C4-089","sec":"Wound Types","page":22,"q":"Urinary stone removal without UTI is a:","opts":["Clean wound","Clean contaminated wound","Contaminated wound","Dirty wound"],"ans":1,"exp":"Class II: Urinary stone removal when no UTI. (Book p22)"},{"id":"SURG-C4-090","sec":"Wound Types","page":22,"q":"SSI rate in Class II wounds with vs without prophylaxis is:","opts":["1-2% both","3% vs 6-9%","6% vs 20%","7-8% vs 20-40%"],"ans":1,"exp":"Class II SSI: 3% with, 6-9% without prophylaxis. (Book p22)"},{"id":"SURG-C4-091","sec":"Wound Types","page":22,"q":"Contaminated (Class III) wounds involve the GI/GU system with:","opts":["No inflammation","Non-purulent inflammation","Pus","Fecal contamination"],"ans":1,"exp":"Class III: GI/GU system when non-purulent inflammation is present. (Book p22)"},{"id":"SURG-C4-092","sec":"Wound Types","page":22,"q":"Class III wounds include all of the following EXCEPT:","opts":["Emergency cholecystectomy","Emergency appendectomy","Elective cholecystectomy","Bowel opened in intestinal obstruction"],"ans":2,"exp":"Class III: Emergency cholecystectomy, Emergency appendectomy, bowel opened in obstruction, open cardiac massage. (Book p22)"},{"id":"SURG-C4-093","sec":"Wound Types","page":22,"q":"Open cardiac massage is a Class III wound because of:","opts":["Pus","Major break in sterile technique","Fecal contamination","Delayed closure"],"ans":1,"exp":"Class III: Open cardiac massage (Major break in sterile technique). (Book p22)"},{"id":"SURG-C4-094","sec":"Wound Types","page":22,"q":"SSI rate in Class III wounds with vs without prophylaxis is:","opts":["1-2% both","3% vs 6-9%","6% vs 20%","7-8% vs 20-40%"],"ans":2,"exp":"Class III SSI: 6% with, 20% without prophylaxis. (Book p22)"},{"id":"SURG-C4-095","sec":"Wound Types","page":22,"q":"In contaminated (Class III) wounds:","opts":["No antibiotics needed","Antibiotics should be continued","Single dose only","Antibiotics stopped"],"ans":1,"exp":"Class III: Antibiotics should be continued. (Book p22)"},{"id":"SURG-C4-096","sec":"Wound Types","page":22,"q":"Dirty (Class IV) wounds are defined by:","opts":["No inflammation","Non-purulent inflammation","Pus present","Clean incision"],"ans":2,"exp":"Class IV Dirty wound: Pus present. (Book p22)"},{"id":"SURG-C4-097","sec":"Wound Types","page":22,"q":"Class IV wounds include all of the following EXCEPT:","opts":["All abscesses","Peritonitis/fecal contamination","Neglected traumatic wound >6 hours","Elective hernia repair"],"ans":3,"exp":"Class IV: All abscesses; Peritonitis/fecal contamination; Neglected traumatic wound >6 hours. (Book p22)"},{"id":"SURG-C4-098","sec":"Wound Types","page":22,"q":"A neglected traumatic wound becomes a dirty wound after:","opts":["1 hour","4 hours","6 hours","24 hours"],"ans":2,"exp":"Class IV: Any neglected traumatic wound >6 hours. (Book p22)"},{"id":"SURG-C4-099","sec":"Wound Types","page":22,"q":"SSI rate in Class IV wounds with vs without prophylaxis is:","opts":["1-2% both","3% vs 6-9%","6% vs 20%","7-8% vs 20-40%"],"ans":3,"exp":"Class IV SSI: 7-8% with, 20-40% without prophylaxis. (Book p22)"},{"id":"SURG-C4-100","sec":"Periods","page":22,"q":"The golden period for a traumatic wound is:","opts":["1 hour","4 hours","6 hours","24 hours"],"ans":2,"exp":"Golden period: Traumatic wound: 6 hours. (Book p22)"},{"id":"SURG-C4-101","sec":"Periods","page":22,"q":"For trauma, the golden period is:","opts":["1 hour following trauma","4 hours following trauma","6 hours following trauma","24 hours following trauma"],"ans":0,"exp":"Golden period: Trauma: 1 hour following trauma. (Book p22)"},{"id":"SURG-C4-102","sec":"Periods","page":22,"q":"The decisive period is 4 hours - the time between:","opts":["Trauma and admission","Skin incision & bacterial colonisation","Fever and antibiotics","Surgery and discharge"],"ans":1,"exp":"Decisive period: 4 hours - time b/w skin incision & bacterial colonisation. (Book p22)"},{"id":"SURG-C4-103","sec":"Periods","page":22,"q":"In an elective OT list:","opts":["Dirty cases are posted first","Clean cases are posted first","Emergency cases first","Order does not matter"],"ans":1,"exp":"In an elective OT list, clean cases are posted first. (Book p22)"},{"id":"SURG-C4-104","sec":"Hand Hygiene","page":23,"q":"The most important factor in prevention of wound infection is:","opts":["Antibiotics","Hand hygiene by surgeon","OT temperature","Suture type"],"ans":1,"exp":"Hand hygiene by surgeon: most important factor. (Book p23)"},{"id":"SURG-C4-105","sec":"Hand Hygiene","page":23,"q":"Minimum duration of surgical handwash is:","opts":["1 min","3 mins","10 mins","30 secs"],"ans":1,"exp":"Min duration of handwash: 3 mins. (Book p23)"},{"id":"SURG-C4-106","sec":"Hand Hygiene","page":23,"q":"For routine hand hygiene, one may use:","opts":["Only soap & water","Soap & water / alcohol hand rub","Only alcohol","Only betadine"],"ans":1,"exp":"Soap & water/alcohol hand rub should be used. (Book p23)"},{"id":"SURG-C4-107","sec":"Hand Hygiene","page":23,"q":"After toilet visit or if hands are visibly soiled:","opts":["Only alcohol rub is used","Only soap & water used","No wash needed","Gloves suffice"],"ans":1,"exp":"After toilet visit / visibly soiled: Only soap & water used. (Book p23)"},{"id":"SURG-C4-108","sec":"Hand Hygiene","page":23,"q":"The 'before' moments of hand hygiene are:","opts":["Before touching a patient; Before clean/aseptic procedure","After touching a patient only","After toilet only","None"],"ans":0,"exp":"5 moments: Before touching a patient; Before clean/aseptic procedure; After body fluid risk; After touching patient; After surroundings. (Book p23)"},{"id":"SURG-C4-109","sec":"Hand Hygiene","page":23,"q":"The 'after' moments of hand hygiene include all of the following EXCEPT:","opts":["After body fluid exposure risk","After touching a patient","After touching patient's surroundings","After entering the hospital gate"],"ans":3,"exp" ","Never","Only after 24 hours"],"ans":0,"exp":"Arterial vs venous bleed: Hypotension: Arterial = Occurs early. (Book p37)"},{"id":"SURG-C7-011","sec":"Arterial vs Venous Bleed","page":37,"q":"Hypotension in venous bleed occurs late because of:","opts":["Compensation","Vasoconstriction failure","Early blood loss","Cardiac failure"],"ans":0,"exp":"Venous bleed: Hypotension occurs late (d/t compensation). (Book p37)"},{"id":"SURG-C7-012","sec":"Arterial vs Venous Bleed","page":37,"q":"Types of arterial bleed are:","opts":["Laceration and transection","Ooze and spurt","Capillary and venous","Primary and secondary"],"ans":0,"exp":"Types of arterial bleed: Laceration, Transection. (Book p37)"},{"id":"SURG-C7-013","sec":"Arterial vs Venous Bleed","page":37,"q":"In a lacerated artery, vasoconstriction leads to:","opts":["Increase in tear size and more bleeding","Decreased bleeding","Complete hemostasis","Spasm that seals the artery"],"ans":0,"exp":"Laceration: Vasoconstriction leads to ↑ in tear size -> Bleeds more. (Book p37)"},{"id":"SURG-C7-014","sec":"Arterial vs Venous Bleed","page":37,"q":"Which arterial bleed bleeds less?","opts":["Transection","Laceration","Both equally","Neither bleeds"],"ans":0,"exp":"Transection: Bleeds less. (Book p37)"},{"id":"SURG-C7-015","sec":"Hemorrhage in Surgery","page":38,"q":"Primary hemorrhage occurs:","opts":["During Sx","Within 24 hours","After 7-14 days","After 1 month"],"ans":0,"exp":"1° hemorrhage: Occurs during Sx. (Book p38)"},{"id":"SURG-C7-016","sec":"Hemorrhage in Surgery","page":38,"q":"Reactionary hemorrhage occurs:","opts":["Within 24 hours","During Sx","After 7-14 days","After 48 hours"],"ans":0,"exp":"Reactionary hemorrhage: Within 24 hours. (Book p38)"},{"id":"SURG-C7-017","sec":"Hemorrhage in Surgery","page":38,"q":"The reasons for reactionary hemorrhage are:","opts":["Dislodgement of clot and slippage of knot (Granny's knot)","Infection of the wound","Sloughing of the vessel wall","Hypertension"],"ans":0,"exp":"Reactionary hemorrhage reason: Dislodgement of clot; Slippage of knot (Granny's knot). (Book p38)"},{"id":"SURG-C7-018","sec":"Hemorrhage in Surgery","page":38,"q":"Secondary hemorrhage occurs:","opts":["After 7-14 days","Within 24 hours","During Sx","On day 2"],"ans":0,"exp":"2° hemorrhage: After 7-14 days. (Book p38)"},{"id":"SURG-C7-019","sec":"Hemorrhage in Surgery","page":38,"q":"The reason for secondary hemorrhage is:","opts":["Sloughing of wall due to infection","Slippage of knot","Dislodgement of clot","Trauma"],"ans":0,"exp":"2° hemorrhage: Sloughing of wall d/t infection. (Book p38)"},{"id":"SURG-C7-020","sec":"Classification of Hypovolemic Shock","page":38,"q":"Class I hypovolemic shock corresponds to blood loss of:","opts":["0-15% (0.5 litre)","15-30% (1 litre)","30-40% (1.5 litre)",">40% (>2 litres)"],"ans":0,"exp":"Class I: 0-15%, 0.5 litre. (Book p38)"},{"id":"SURG-C7-021","sec":"Classification of Hypovolemic Shock","page":38,"q":"Class II (mild) hypovolemic shock corresponds to blood loss of:","opts":["15-30% (1 litre)","0-15% (0.5 litre)","30-40% (1.5 litre)",">40% (>2 litres)"],"ans":0,"exp":"Class II (Mild): 15-30%, 1 litre. (Book p38)"},{"id":"SURG-C7-022","sec":"Classification of Hypovolemic Shock","page":38,"q":"Class III (moderate) hypovolemic shock corresponds to blood loss of:","opts":["30-40% (1.5 litre)","15-30% (1 litre)",">40% (>2 litres)","0-15% (0.5 litre)"],"ans":0,"exp":"Class III (Moderate): 30-40%, 1.5 litre. (Book p38)"},{"id":"SURG-C7-023","sec":"Classification of Hypovolemic Shock","page":38,"q":"Class IV (severe) hypovolemic shock corresponds to blood loss of:","opts":[">40% (>2 litres)","30-40% (1.5 litre)","15-30% (1 litre)","20-25% (1 litre)"],"ans":0,"exp":"Class IV (Severe): >40%, >2 litres. (Book p38)"},{"id":"SURG-C7-024","sec":"Classification of Hypovolemic Shock","page":38,"q":"Heart rate in Class IV shock is:","opts":["Non-recordable","Normal","Mildly raised","Raised"],"ans":0,"exp":"Class IV: Heart rate non-recordable. (Book p38)"},{"id":"SURG-C7-025","sec":"Classification of Hypovolemic Shock","page":38,"q":"Blood pressure begins to fall (SBP ↓↓) from which class?","opts":["Class III","Class I","Class II","Only Class IV"],"ans":0,"exp":"BP: Class I & II normal; Class III SBP ↓↓; Class IV non-recordable. (Book p38)"},{"id":"SURG-C7-026","sec":"Classification of Hypovolemic Shock","page":38,"q":"Pulse pressure (SBP-DBP) becomes narrow in Class II and narrower in Class III; in Class IV it is:","opts":["Decreased (↓)","Normal","Wide","Unchanged"],"ans":0,"exp":"Pulse pressure: Normal, Narrow, Narrower, ↓ (Class IV). (Book p38)"},{"id":"SURG-C7-027","sec":"Classification of Hypovolemic Shock","page":38,"q":"Respiratory rate is ↑↑ (double up arrow) in which class?","opts":["Class IV","Class II","Class I","Class III"],"ans":0,"exp":"Respiratory rate: Class III ↑; Class IV ↑↑. (Book p38)"},{"id":"SURG-C7-028","sec":"Classification of Hypovolemic Shock","page":38,"q":"Urine output in Class III and Class IV shock respectively is:","opts":["↓↓ and anuria","Normal and ↓","Anuria and ↓↓","Normal and normal"],"ans":0,"exp":"Urine output: Class III ↓↓; Class IV anuria. (Book p38)"},{"id":"SURG-C7-029","sec":"Classification of Hypovolemic Shock","page":38,"q":"Mental status in Class II shock is:","opts":["Anxious, thirsty","Confused","Coma","Normal"],"ans":0,"exp":"Mental status: Class II anxious, thirsty. (Book p38)"},{"id":"SURG-C7-030","sec":"Classification of Hypovolemic Shock","page":38,"q":"Mental status in Class III and Class IV shock respectively is:","opts":["Confused and coma","Anxious and confused","Coma and confused","Normal and confused"],"ans":0,"exp":"Mental status: Class III confused; Class IV coma. (Book p38)"},{"id":"SURG-C7-031","sec":"Classification of Hypovolemic Shock","page":38,"q":"Base deficit in Class II shock is:","opts":["-2 to -6 mEq/L","Normal","-6 to -10 mEq/L",">-10 mEq/L"],"ans":0,"exp":"Base deficit: Class II -2 to -6 mEq/L. (Book p38)"},{"id":"SURG-C7-032","sec":
