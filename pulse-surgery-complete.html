,"page":116,"q":"DiGeorge syndrome (mnemonic CATCH 22) is caused by:","opts":["Deletion of 22q11","Trisomy 21","Deletion of 11p","RET mutation"],"ans":0,"exp":"Deletion of 22q11. (Book p116)"},{"id":"SURG-C17-077","sec":"Hypoparathyroidism & DiGeorge Syndrome","page":116,"q":"The 'H' in the CATCH 22 mnemonic of DiGeorge syndrome stands for:","opts":["Hypocalcemia","Hypercalcemia","Hypokalemia","Hyperkalemia"],"ans":0,"exp":"CATCH 22: Cardiac anomalies, Atypical facies, Thymic hypoplasia, Cleft lip & palate, Hypocalcemia; 22 = deletion 22q11. (Book p116)"}];
const UNITS = [{"id":"SURG-U1-1","ch":1,"n":1,"title":"Consents: Components & Signatures","sec":"Consents · p1","qs":["SURG-C1-001","SURG-C1-002","SURG-C1-003","SURG-C1-004","SURG-C1-005"],"guide":"A valid consent covers identification, diagnosis, the planned procedure, the surgeon, description, patient-specific and procedure-specific complications (any complication >1% incidence), benefits and the alternate procedure — signed by patient, surgeon and witness."},{"id":"SURG-U1-2","ch":1,"n":2,"title":"IV Lines: Color-Coding of Cannulas","sec":"IV Lines · p1","qs":["SURG-C1-006","SURG-C1-007","SURG-C1-008","SURG-C1-009","SURG-C1-010","SURG-C1-011","SURG-C1-012","SURG-C1-013","SURG-C1-014","SURG-C1-015","SURG-C1-016","SURG-C1-017","SURG-C1-018"],"guide":"From narrow to wide: yellow 24G (13/10 ml/min), blue 22G (31/30), pink 20G (67/60), green 18G (96), gray 16G (236/240) and orange 14G (270) — the orange 14G is the shock cannula. The 24G/22G/20G trio is bracketed for paediatric patients."},{"id":"SURG-U1-3","ch":1,"n":3,"title":"IV Lines: Superficial Thrombophlebitis","sec":"IV Lines: Complications · p1","qs":["SURG-C1-019","SURG-C1-020","SURG-C1-021"],"guide":"The m/c IV complication is superficial thrombophlebitis — a tender, cord-like swelling at the cannulation site, managed with a topical heparinoid."},{"id":"SURG-U1-4","ch":1,"n":4,"title":"Safety Checklist: Phases & Sign In","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-022","SURG-C1-023","SURG-C1-024","SURG-C1-025","SURG-C1-026","SURG-C1-027","SURG-C1-028"],"guide":"The checklist runs sign in (before induction of anaesthesia, ward to OT complex) → time out (before skin incision) → sign out (before the patient leaves the OT). Sign in confirms identity, marked site, procedure, written consent, known allergies and risk of >500 ml blood loss."},{"id":"SURG-U1-5","ch":1,"n":5,"title":"Safety Checklist: Time Out & Sign Out","sec":"Surgical Safety Checklist · p2","qs":["SURG-C1-029","SURG-C1-030","SURG-C1-031","SURG-C1-032","SURG-C1-033","SURG-C1-034","SURG-C1-035"],"guide":"Time out confirms patient site, procedure name and time, checks antibiotic prophylaxis within the last 30 min and the surgeon's anticipated blood loss. Sign out verifies instruments/sponge/needle count, specimen labelling with patient name and the anaesthetist's actual blood loss — and the book's note: there is no time in phase."},{"id":"SURG-U1-6","ch":1,"n":6,"title":"Estimating Blood Loss","sec":"Estimating Blood Loss · p2","qs":["SURG-C1-036","SURG-C1-037","SURG-C1-038","SURG-C1-039","SURG-C1-040"],"guide":"Actual blood loss = blood in suction − irrigation fluid, or wet mop weight − dry mop weight. A soaked mop holds 100 cc, a fist full of clots 500 cc, and mops carry a radio-opaque line so they are picked up on X-ray."},{"id":"SURG-U1-7","ch":1,"n":7,"title":"OT Zoning: The Four Zones","sec":"OT Zoning · p2","qs":["SURG-C1-041","SURG-C1-042","SURG-C1-043","SURG-C1-044","SURG-C1-045"],"guide":"The OT complex flows through four zones: protective (change rooms, transfer bay, pre & post op rooms, ICU/PACU), clean (equipment store room, maintenance workshop — connecting protective to aseptic), aseptic (the OT itself) and disposal."},{"id":"SURG-U1-8","ch":1,"n":8,"title":"OT Positions: Supine, Trendelenberg & Reverse Trendelenberg","sec":"OT Positions · p3","qs":["SURG-C1-046","SURG-C1-047","SURG-C1-048","SURG-C1-049","SURG-C1-050"],"guide":"Supine/neutral is the m/c position for abdominal and breast surgeries. Trendelenberg (head low, feet up) serves pelvic surgery; reverse Trendelenberg with right side up is used in laparoscopic cholecystectomy, where CO2 pools under the right diaphragm dome and causes right shoulder tip pain — its m/c complication."},{"id":"SURG-U1-9","ch":1,"n":9,"title":"OT Positions: Lithotomy & Lateral (Kidney)","sec":"OT Positions · p3","qs":["SURG-C1-051","SURG-C1-052","SURG-C1-053","SURG-C1-054","SURG-C1-055","SURG-C1-056"],"guide":"Lithotomy serves obstetric, gynecologic, urologic (TURP) and hemorrhoid procedures — with the common peroneal nerve at risk if legs are poorly supported. Lateral/kidney position covers thoracotomy, pyelo/nephrolithotomy, nephrectomy and breast reconstruction (latissimus dorsi flap), risking brachial plexus injury from a hyperextended arm."},{"id":"SURG-U1-10","ch":1,"n":10,"title":"OT Positions: Prone, Fowler's, Jackknife & Lloyd-Davis","sec":"OT Positions · p4","qs":["SURG-C1-057","SURG-C1-058","SURG-C1-059","SURG-C1-060","SURG-C1-061","SURG-C1-062","SURG-C1-063","SURG-C1-064"],"guide":"Prone is for spinal and pilonidal sinus surgery. Sitting/Fowler's exposes the posterior cranial fossa in a bloodless field but invites air embolism. Jackknife — once used for hemorrhoid/fissure surgery — is obsolete, killing by positional asphyxia. Lloyd-Davis = Trendelenberg + lithotomy, the rectal cancer position."},{"id":"SURG-U1-11","ch":1,"n":11,"title":"Air Embolism: Features, Prevention & Management","sec":"Air Embolism · p4","qs":["SURG-C1-065","SURG-C1-066","SURG-C1-067","SURG-C1-068","SURG-C1-069","SURG-C1-070","SURG-C1-071","SURG-C1-072","SURG-C1-073","SURG-C1-074"],"guide":"50-100 cc of air sucked into a vein dysregulates cardiac function; watch for it in thyroid/head & neck surgery and in Fowler's position. Sudden desaturation, dyspnea and hypotension are the clues — prevent by ligating the vein before cutting and irrigating the field, and treat with the Durant position (right side up/left lateral + legs up) followed by aspiration via direct puncture/central line."},{"id":"SURG-U1-12","ch":1,"n":12,"title":"Events in Patient Safety","sec":"Events in Patient Safety · p5","qs":["SURG-C1-075","SURG-C1-076","SURG-C1-077","SURG-C1-078","SURG-C1-079"],"guide":"An adverse event harms the patient; a near miss could have but didn't (stopped by chance or timely intervention); a no-harm event reaches the patient without injury, harm dodged by chance or mitigating circumstances."},{"id":"SURG-U2-1","ch":2,"n":1,"title":"Types of Surgical Blades","sec":"Blades · p6","qs":["SURG-C2-001","SURG-C2-002","SURG-C2-003","SURG-C2-004","SURG-C2-005","SURG-C2-006","SURG-C2-007","SURG-C2-008"],"guide":"Blades exist to make incisions, and the belly is the sharpest part. The pointed No. 11 stab blade opens abscesses and arteries, while the curved No. 12 slips under sutures to remove them - with No. 10, 15, 22 and 23 completing the tray."},{"id":"SURG-U2-2","ch":2,"n":2,"title":"Blade Handling & the BP Handle","sec":"Blade Handling · p6","qs":["SURG-C2-009","SURG-C2-010","SURG-C2-011"],"guide":"Sharps travel safely in a kidney tray with the pointed end facing the passer, never the surgeon. Every blade clicks onto the familiar BP (Bard Parker) handle before it touches skin."},{"id":"SURG-U2-3","ch":2,"n":3,"title":"Incisions & Langer's Lines","sec":"Incisions · p6","qs":["SURG-C2-012","SURG-C2-013","SURG-C2-014","SURG-C2-015","SURG-C2-016","SURG-C2-017","SURG-C2-018","SURG-C2-019","SURG-C2-020"],"guide":"Cut perpendicular to skin, travelling far to near. Respect Langer's relaxed tension lines - the grain of dermal collagen - because parallel incisions heal into fine scars, hide in creases, spare anatomical structures and still give adequate access."},{"id":"SURG-U2-4","ch":2,"n":4,"title":"Monopolar Cautery: Circuit & Cautery Pad","sec":"Monopolar Cautery · p7","qs":["SURG-C2-021","SURG-C2-022","SURG-C2-023","SURG-C2-024","SURG-C2-025","SURG-C2-026","SURG-C2-027","SURG-C2-028"],"guide":"Current sprints from machine to Bovie tip, through tissue, body and pad, then home to the machine. That pad must sit broad on well-vascularized skin - shrink it and you burn the patient, skip it and monopolar simply will not work."},{"id":"SURG-U2-5","ch":2,"n":5,"title":"Monopolar Cautery: Hazards, Uses & Avoidance","sec":"Monopolar Cautery · p7","qs":["SURG-C2-029","SURG-C2-030","SURG-C2-031","SURG-C2-032","SURG-C2-033","SURG-C2-034","SURG-C2-035","SURG-C2-036","SURG-C2-037","SURG-C2-038"],"guide":"Monopolar cuts and coagulates, but its current wanders - scorching neighbours, confusing pacemakers and channelling down pedicles to their base. Keep it away from end arteries, the CNS, parotid and thyroid, the ear lobule, the penis and any paced heart."},{"id":"SURG-U2-6","ch":2,"n":6,"title":"Bipolar Cautery","sec":"Bipolar Cautery · p7","qs":["SURG-C2-039","SURG-C2-040","SURG-C2-041","SURG-C2-042","SURG-C2-043"],"guide":"Bipolar current hops between two prongs and finishes its circuit right there in the forceps tips. With no pad and no stray current, it coagulates safely beside vital structures and end arteries - but it only coagulates, never cuts."},{"id":"SURG-U2-7","ch":2,"n":7,"title":"Currents & Waveforms","sec":"Currents · p8","qs":["SURG-C2-044","SURG-C2-045","SURG-C2-046","SURG-C2-047","SURG-C2-048","SURG-C2-049","SURG-C2-050","SURG-C2-051"],"guide":"Low-voltage continuous waves slice by exploding cell water; high-voltage interrupted waves desiccate and denature protein until the cell dies. Blend mixes the two, while fulguration spikes the voltage peaks higher still."},{"id":"SURG-U2-8","ch":2,"n":8,"title":"Ligasure","sec":"Ligasure · p8","qs":["SURG-C2-052","SURG-C2-053","SURG-C2-054","SURG-C2-055","SURG-C2-056","SURG-C2-057"],"guide":"Ligasure squeezes vessels with heat plus pressure, melting the body's own collagen and elastin into a seal, then stops itself the instant the seal closes. A live feedback loop meters every joule - good till 7 mm, but keep it away from vital structures."},{"id":"SURG-U2-9","ch":2,"n":9,"title":"Harmonic Scalpel","sec":"Harmonic Scalpel · p8","qs":["SURG-C2-058","SURG-C2-059","SURG-C2-060","SURG-C2-061","SURG-C2-062","SURG-C2-063","SURG-C2-064"],"guide":"The harmonic blade shivers 2,000 to 50,000 times a second, denaturing protein and coagulating without heat. It carves precisely, even through scar and beside vital structures - at the price of patience, because it is slow."},{"id":"SURG-U2-10","ch":2,"n":10,"title":"CUSA & Thunderbeat S","sec":"CUSA · p9","qs":["SURG-C2-065","SURG-C2-066","SURG-C2-067","SURG-C2-068","SURG-C2-069","SURG-C2-070","SURG-C2-071"],"guide":"CUSA is a harmonic scalpel that crumbles watery hepatocytes for liver resection - happiest in a soft, non-cirrhotic liver - while sucking debris and even gases away. Thunderbeat S then marries Ligasure's sealing to the harmonic's cut in one jaw."},{"id":"SURG-U2-11","ch":2,"n":11,"title":"RFA & Microwave Ablation","sec":"RFA & Microwave · p9","qs":["SURG-C2-072","SURG-C2-073","SURG-C2-074","SURG-C2-075","SURG-C2-076","SURG-C2-077","SURG-C2-078","SURG-C2-079"],"guide":"RFA burns liver tumours up to 3 cm with high-frequency alternating current, grounding pad and all. Microwaves, humming between infra-red and radiowaves, need no pad, finish faster and leave a smooth homogenous kill zone."},{"id":"SURG-U3-1","ch":3,"n":1,"title":"Drains: Open, Closed, Romovac & Minivac","sec":"Drains · p10","qs":["SURG-C3-001","SURG-C3-002","SURG-C3-003","SURG-C3-004","SURG-C3-005","SURG-C3-006","SURG-C3-007","SURG-C3-008","SURG-C3-009"],"guide":"Open drains are obsolete museum pieces that stain a soak dressing, while closed drains empty into a container or bag. Romovac - a closed negative-pressure system for mastectomy, thyroidectomy and neck dissection - must never enter the abdomen, where its rounded tip risks perforation; the tiny minivac instead follows sentinel node biopsy."},{"id":"SURG-U3-2","ch":3,"n":2,"title":"Drains: Jackson Pratt, Abdominal & Underwater Seal","sec":"Drains · p10","qs":["SURG-C3-010","SURG-C3-011","SURG-C3-012","SURG-C3-013","SURG-C3-014","SURG-C3-015","SURG-C3-016","SURG-C3-017","SURG-C3-018"],"guide":"The Jackson Pratt pairs a squeezable bulb with flat tubes that slide safely into the abdomen, unlike the rounded Romovac. A plain abdominal drain is closed but pressure-free, while chest tubes bubble through an underwater seal whose submerged tip bars air from being sucked in."},{"id":"SURG-U3-3","ch":3,"n":3,"title":"Knot Types: Reef, Granny & Surgeon's","sec":"Knots · p11","qs":["SURG-C3-019","SURG-C3-020","SURG-C3-021","SURG-C3-022","SURG-C3-023","SURG-C3-024","SURG-C3-025","SURG-C3-026"],"guide":"The reef (square) knot - one square throw on another with matching crossings - is the most basic knot in surgery. Cross the throws oppositely and you get a granny or slip knot that opens up, while the surgeon's knot doubles the first throw for extra grip before a single locking throw."},{"id":"SURG-U3-4","ch":3,"n":4,"title":"Skin Suturing & Principles","sec":"Skin Suturing · p11","qs":["SURG-C3-027","SURG-C3-028","SURG-C3-029","SURG-C3-030"],"guide":"Skin heals kindest when its edges are everted and the needle bites at a full 90 degrees. The geometry is simple arithmetic: take a bite of x on each side and space the sutures 2x apart."},{"id":"SURG-U3-5","ch":3,"n":5,"title":"Suture Types: Simple, Mattress & Subcuticular","sec":"Suture Types · p12","qs":["SURG-C3-031","SURG-C3-032","SURG-C3-033","SURG-C3-034","SURG-C3-035","SURG-C3-036","SURG-C3-037","SURG-C3-038"],"guide":"Simple sutures fail to evert, but mattress sutures evert and staunch bleeding - vertical at two depths, horizontal at one depth with the least cut-through. When scars must vanish, a 3-0 monocryl on a cutting needle runs hidden beneath the skin in a mark-free subcuticular line."},{"id":"SURG-U3-6","ch":3,"n":6,"title":"Other Sutures: Lock & Purse String","sec":"Other Sutures · p12","qs":["SURG-C3-039","SURG-C3-040","SURG-C3-041","SURG-C3-042","SURG-C3-043","SURG-C3-044"],"guide":"A continuous suture closes with an Aberdeen's or Cobbler's knot, and locking each loop spreads tension evenly along the wound. The purse string instead cinches like a drawstring - burying the appendicular stump or encircling the cervix."},{"id":"SURG-U3-7","ch":3,"n":7,"title":"Far-Near-Near-Far & Shoe String","sec":"Special Sutures · p13","qs":["SURG-C3-045","SURG-C3-046","SURG-C3-047","SURG-C3-048","SURG-C3-049"],"guide":"The far-near-near-far stitch collapses and obliterates a large dead cavity in one pass. Fasciotomy wounds instead close slowly with the shoe string technique - gradual tightening that heals by tertiary intention, a delayed primary closure."},{"id":"SURG-U3-8","ch":3,"n":8,"title":"Needles: Round Body vs Cutting","sec":"Needles · p13","qs":["SURG-C3-050","SURG-C3-051","SURG-C3-052","SURG-C3-053","SURG-C3-054","SURG-C3-055","SURG-C3-056","SURG-C3-057","SURG-C3-058","SURG-C3-059"],"guide":"Round-bodied needles split tissue atraumatically, gliding through the delicate B's - bowel, bladder, blood vessels and CBD. Cutting and reverse-cutting needles slice through the tough S's - sheath, skin and fascia - at the price of greater trauma."},{"id":"SURG-U3-9","ch":3,"n":9,"title":"Needle Parts, Color Codes & Numbering","sec":"Suture Coding · p13","qs":["SURG-C3-060","SURG-C3-061","SURG-C3-062","SURG-C3-063","SURG-C3-064","SURG-C3-065","SURG-C3-066","SURG-C3-067","SURG-C3-068","SURG-C3-069","SURG-C3-070","SURG-C3-071","SURG-C3-072"],"guide":"Every needle runs from point through a two-thirds shaft to a one-third swaged end that carries the suture, gripped by a needle holder. Colors speak instantly - brown catgut, violet vicryl, blue prolene, black silk - while numbers whisper finesse: No. 1 is thickest and 11-0 the finest."},{"id":"SURG-U3-10","ch":3,"n":10,"title":"Suture Classification","sec":"Classification · p14","qs":["SURG-C3-073","SURG-C3-074","SURG-C3-075","SURG-C3-076","SURG-C3-077","SURG-C3-078","SURG-C3-079","SURG-C3-080","SURG-C3-081","SURG-C3-082","SURG-C3-083","SURG-C3-084","SURG-C3-085","SURG-C3-086","SURG-C3-087"],"guide":"Natural sutures like silk and catgut are antigenic, provoke strong inflammation and dissolve by proteolysis. Synthetic sutures - prolene, PDS, vicryl - stay inert and dissolve by hydrolysis, with synthetic non-absorbables the most inert of all; monofilaments handle stiffly with strong memory while braids handle sweetly but invite infection."},{"id":"SURG-U3-11","ch":3,"n":11,"title":"Natural Absorbable: Catgut","sec":"Natural Absorbable · p15","qs":["SURG-C3-088","SURG-C3-089","SURG-C3-090","SURG-C3-091"],"guide":"Plain catgut - sheep gut submucosa - vanishes by phagocytosis within 7 to 10 days. Chromic tanning stretches its tensile strength to 21-28 days and full absorption to 90 days."},{"id":"SURG-U3-12","ch":3,"n":12,"title":"Synthetic Absorbable: Monocryl, Vicryl & PDS","sec":"Synthetic Absorbable · p15","qs":["SURG-C3-092","SURG-C3-093","SURG-C3-094","SURG-C3-095","SURG-C3-096","SURG-C3-097","SURG-C3-098","SURG-C3-099","SURG-C3-100","SURG-C3-101","SURG-C3-102","SURG-C3-103","SURG-C3-104","SURG-C3-105","SURG-C3-106","SURG-C3-107","SURG-C3-108","SURG-C3-109"],"guide":"Monofilament monocryl runs subcuticular lines on cutting needles, while braided vicryl holds CBD, bowel and bladder on round-bodied needles for 60-90 days - with triclosan-coated, barbed and rapide avatars. PDS outlasts them all at 180 days and even repairs the tracheobronchial tree."},{"id":"SURG-U3-13","ch":3,"n":13,"title":"Silk: Natural Non-absorbable","sec":"Silk · p16","qs":["SURG-C3-110","SURG-C3-111","SURG-C3-112","SURG-C3-113","SURG-C3-114"],"guide":"Silk - black, braided, spun by silkworms - closes skin with 2-0 or 3-0 on cutting needles, anchors drains with stout No. 1 to 2-0, and lays the second layer of bowel anastomosis with 3-0 on a round body."},{"id":"SURG-U3-14","ch":3,"n":14,"title":"Synthetic Non-absorbable: Prolene to Polybutester","sec":"Synthetic Non-absorbable · p16","qs":["SURG-C3-115","SURG-C3-116","SURG-C3-117","SURG-C3-118","SURG-C3-119","SURG-C3-120","SURG-C3-121","SURG-C3-122","SURG-C3-123","SURG-C3-124","SURG-C3-125","SURG-C3-126","SURG-C3-127","SURG-C3-128"],"guide":"Blue monofilament prolene weaves hernia mesh, closes sheaths by Jenkin's four-to-one rule, and steps down vessels from 2-0 aorta to 6-0 popliteal. Nylon serves skin, cataract and nerve-tendon repairs, steel wires post-CABG sternums, polyester holds rectus and tendon, and polybutester lingers rarely in plastic surgery."},{"id":"SURG-U3-15","ch":3,"n":15,"title":"Suture Removal Timings","sec":"Suture Removal · p17","qs":["SURG-C3-129","SURG-C3-130","SURG-C3-131","SURG-C3-132","SURG-C3-133","SURG-C3-134","SURG-C3-135","SURG-C3-136"],"guide":"Only non-absorbable sutures come out: face first at 3-5 days, scalp and neck at 5-7, thorax and perineum at 10-12, and abdomen last at 12-14 days."},{"id":"SURG-U3-16","ch":3,"n":16,"title":"Bowel Anastomosis & Staplers","sec":"Bowel Anastomosis · p17","qs":["SURG-C3-137","SURG-C3-138","SURG-C3-139","SURG-C3-140","SURG-C3-141","SURG-C3-142","SURG-C3-143","SURG-C3-144","SURG-C3-145","SURG-C3-146","SURG-C3-147","SURG-C3-148","SURG-C3-149","SURG-C3-150","SURG-C3-151"],"guide":"Bowel demands inverted edges, trusting the submucosa as its strongest layer - whether joined by single extramucosal, two-layer Albert-plus-Lembert, or stapler. Linear staplers fire side-to-side joins, sleeves and Zenker's pouches; circular staplers fix haemorrhoids and low anterior resections; Cheatle's slit widens narrow ends and the Connel loop guarantees inversion."},{"id":"SURG-U4-1","ch":4,"n":1,"title":"Post-op Fever: Causes by Day","sec":"Fever Causes · p18","qs":["SURG-C4-001","SURG-C4-002","SURG-C4-003","SURG-C4-004","SURG-C4-005","SURG-C4-006","SURG-C4-007","SURG-C4-008"],"guide":"Fever tells time after surgery: atelectasis on day 1, pneumonia, thrombophlebitis and UTI on days 2-3, wound infection and DVT on days 4-5, burst abdomen on day 6, and deep intra-abdominal collections from day 7 onward."},{"id":"SURG-U4-2","ch":4,"n":2,"title":"Pneumonia, Thrombophlebitis & Atelectasis","sec":"Atelectasis · p18","qs":["SURG-C4-009","SURG-C4-010","SURG-C4-011","SURG-C4-012","SURG-C4-013","SURG-C4-014","SURG-C4-015","SURG-C4-016","SURG-C4-017","SURG-C4-018","SURG-C4-019"],"guide":"Post-operative pneumonia brings fever cured by antibiotics, while superficial thrombophlebitis adds pain soothed by topical heparinoids. Atelectasis - collapsed alveoli, the commonest day-1 fever - is prevented by incentive spirometry, pain control, treating CHF and COPD, steam, and quitting smoking 4-6 weeks ahead."},{"id":"SURG-U4-3","ch":4,"n":3,"title":"Deep Vein Thrombosis","sec":"DVT · p19","qs":["SURG-C4-020","SURG-C4-021","SURG-C4-022","SURG-C4-023","SURG-C4-024","SURG-C4-025","SURG-C4-026","SURG-C4-027","SURG-C4-028"],"guide":"DVT swells one leg - lower limbs far more than upper - and is confirmed on duplex scan. Early ambulation defeats stasis, pneumatic stockings squeeze the calves, and low molecular weight heparin is the drug of choice for prophylaxis."},{"id":"SURG-U4-4","ch":4,"n":4,"title":"Burst Abdomen","sec":"Burst Abdomen · p19","qs":["SURG-C4-029","SURG-C4-030","SURG-C4-031","SURG-C4-032","SURG-C4-033","SURG-C4-034","SURG-C4-035","SURG-C4-036","SURG-C4-037"],"guide":"On day 6 a cough can split the rectus sheath open, baring bowel beneath a dressing soaked in reddish salmon fluid. The emergency answer is repositing bowel under a Bogota bag, with definitive resuturing in theatre - while chronic cough, constipation, infection, obesity, immunosuppression and malnutrition set the stage."},{"id":"SURG-U4-5","ch":4,"n":5,"title":"Surgeon Factors & Rectus Closure","sec":"Sx Factors · p20","qs":["SURG-C4-038","SURG-C4-039","SURG-C4-040","SURG-C4-041","SURG-C4-042","SURG-C4-043","SURG-C4-044"],"guide":"Midline, emergency, continuous, long-bite, short-thread closures burst most - Jenkins demands thread four times the wound length. Non-absorbable suture closes adult rectus, while children get delayed-absorbable PDS."},{"id":"SURG-U4-6","ch":4,"n":6,"title":"Intra-abdominal Abscesses","sec":"Abscess · p20","qs":["SURG-C4-045","SURG-C4-046","SURG-C4-047","SURG-C4-048","SURG-C4-049","SURG-C4-050","SURG-C4-051","SURG-C4-052","SURG-C4-053","SURG-C4-054","SURG-C4-055"],"guide":"Pus seeks the pelvis in walkers and Morrison's pouch in the bedridden, announcing itself with fever, chills and rigor. Subdiaphragmatic pus triggers hiccups and referred shoulder pain; pelvic pus brings mucous diarrhoea and frequent micturition - diagnosed by CECT and drained by USG-guided pigtail."},{"id":"SURG-U4-7","ch":4,"n":7,"title":"SSI: Definition & Types","sec":"SSI · p21","qs":["SURG-C4-056","SURG-C4-057","SURG-C4-058","SURG-C4-059","SURG-C4-060"],"guide":"A surgical site infection strikes within 30 days - or within a year if an implant was placed. Superficial infection stays above fascia, deep goes below it, and organ-space infection pools inside an organ or cavity."},{"id":"SURG-U4-8","ch":4,"n":8,"title":"ASEPSIS Wound Score","sec":"ASEPSIS · p21","qs":["SURG-C4-061","SURG-C4-062","SURG-C4-063","SURG-C4-064","SURG-C4-065","SURG-C4-066","SURG-C4-067","SURG-C4-068"],"guide":"ASEPSIS grades wounds by Additional treatment, Serous discharge, Erythema, Purulent exudate, Separation of deep tissues, Isolation of bacteria, and inpatient Stay beyond 14 days - with pus drained under local but debridement under general anaesthesia."},{"id":"SURG-U4-9","ch":4,"n":9,"title":"Southampton Wound Score","sec":"Southampton · p21","qs":["SURG-C4-069","SURG-C4-070","SURG-C4-071","SURG-C4-072","SURG-C4-073","SURG-C4-074"],"guide":"Southampton climbs from 0 - normal healing - through bruising, erythema and clear discharge to frank pus at grade IV and deep severe infection with or without breakdown at grade V."},{"id":"SURG-U4-10","ch":4,"n":10,"title":"SSI Risk Factors","sec":"Risk Factors · p21","qs":["SURG-C4-075","SURG-C4-076","SURG-C4-077","SURG-C4-078","SURG-C4-079","SURG-C4-080","SURG-C4-081"],"guide":"Neonates and the elderly, recent chest or abdominal surgery, distant coexisting infection, diabetes, steroids, low cholesterol, obesity, malnutrition, chronic inflammation, prior irradiation, hypothermia and hypoxemia - twelve flags that mark a wound for infection."},{"id":"SURG-U4-11","ch":4,"n":11,"title":"Wound Classes I-IV","sec":"Wound Types · p22","qs":["SURG-C4-082","SURG-C4-083","SURG-C4-084","SURG-C4-085","SURG-C4-086","SURG-C4-087","SURG-C4-088","SURG-C4-089","SURG-C4-090","SURG-C4-091","SURG-C4-092","SURG-C4-093","SURG-C4-094","SURG-C4-095","SURG-C4-096","SURG-C4-097","SURG-C4-098","SURG-C4-099"],"guide":"Clean wounds infect at 1-2% with or without antibiotics; clean-contaminated at 3% versus 6-9%; contaminated at 6% versus 20% with antibiotics continued; and dirty pus-filled wounds at 7-8% versus 20-40% - from thyroid and hernia surgery at one end to abscesses and peritonitis at the other."},{"id":"SURG-U4-12","ch":4,"n":12,"title":"Golden & Decisive Periods","sec":"Periods · p22","qs":["SURG-C4-100","SURG-C4-101","SURG-C4-102","SURG-C4-103"],"guide":"The golden period gives traumatic wounds 6 hours - just 1 hour after major trauma - while the decisive 4 hours span skin incision to bacterial colonisation. On elective lists, clean cases always go first."},{"id":"SURG-U4-13","ch":4,"n":13,"title":"Hand Hygiene & Part Preparation","sec":"Hand Hygiene · p23","qs":["SURG-C4-104","SURG-C4-105","SURG-C4-106","SURG-C4-107","SURG-C4-108","SURG-C4-109","SURG-C4-110","SURG-C4-111"],"guide":"The surgeon's hands matter most: 3-minute scrubs with soap or alcohol rub - soap alone after toilets or visible soil - across the five WHO moments. Hair falls to clippers, never razors, whose microabrasions seed infection."},{"id":"SURG-U4-14","ch":4,"n":14,"title":"Cleaning the Operative Part","sec":"Cleaning · p23","qs":["SURG-C4-112","SURG-C4-113","SURG-C4-114","SURG-C4-115","SURG-C4-116","SURG-C4-117","SURG-C4-118","SURG-C4-119","SURG-C4-120","SURG-C4-121","SURG-C4-122"],"guide":"Chlorhexidine plus alcohol beats betadine for skin prep - inframammary crease to mid-thigh in women, nipple to mid-thigh in men, abdomen medial-to-lateral, thigh lateral-to-medial, limbs a joint beyond, always incision-first and outward, twice over, then left to dry."},{"id":"SURG-U4-15","ch":4,"n":15,"title":"Prophylactic Antibiotics & OT Parameters","sec":"OT Parameters · p24","qs":["SURG-C4-123","SURG-C4-124","SURG-C4-125","SURG-C4-126","SURG-C4-127","SURG-C4-128","SURG-C4-129","SURG-C4-130","SURG-C4-131"],"guide":"Antibiotics peak 30-60 minutes before incision and repeat at 4 hours in long cases. The theatre breathes HEPA-filtered laminar flow at 4 changes an hour under positive pressure, 18-22 degrees, 50-60% humidity - with the Bair hugger, euglycemia, hemostasis and post-operative oxygen completing the shield."},{"id":"SURG-U5-1","ch":5,"n":1,"title":"Definition & Day-Care Examples","sec":"Definition · p25","qs":["SURG-C5-001","SURG-C5-002","SURG-C5-003","SURG-C5-004","SURG-C5-005","SURG-C5-006","SURG-C5-007","SURG-C5-008","SURG-C5-009","SURG-C5-010"],"guide":"Day care means in and out within 12 hours - from haemorrhoids, hernias and lap cholecystectomy to breast biopsy, TURP, carpal tunnel release and varicose vein procedures."},{"id":"SURG-U5-2","ch":5,"n":2,"title":"Selection: Medical Criteria","sec":"Selection · p25","qs":["SURG-C5-011","SURG-C5-012","SURG-C5-013","SURG-C5-014","SURG-C5-015"],"guide":"Physiological age trumps chronological age: ASA I-II patients suit stand-alone centres while ASA III needs a hospital unit, with BMI capped at 38 for laparoscopic and 40 for surface procedures."},{"id":"SURG-U5-3","ch":5,"n":3,"title":"Selection: Diabetes, Social & Surgical","sec":"Selection · p26","qs":["SURG-C5-016","SURG-C5-017","SURG-C5-018","SURG-C5-019","SURG-C5-020","SURG-C5-021","SURG-C5-022"],"guide":"Diabetics under HbA1C 8.5 skip the morning OHA, blood pressure stays below 180/100, and epilepsy must be well controlled. Behind every day-care patient stands a responsible adult for 24 hours, a suitable home, operations under 2 hours, and a quick return to eating and drinking."},{"id":"SURG-U5-4","ch":5,"n":4,"title":"Scheduling & Anaesthesia","sec":"Scheduling · p26","qs":["SURG-C5-023","SURG-C5-024","SURG-C5-025","SURG-C5-026","SURG-C5-027"],"guide":"Comorbid patients get priority in stand-alone units, and day cases lead mixed lists. Propofol TIVA keeps nausea away while bupivacaine infiltration handles the pain."},{"id":"SURG-U5-5","ch":5,"n":5,"title":"Post-op Complications","sec":"Complications · p26","qs":["SURG-C5-028","SURG-C5-029","SURG-C5-030","SURG-C5-031","SURG-C5-032","SURG-C5-033","SURG-C5-034"],"guide":"Haemorrhage - primary during surgery, reactionary within 4-24 hours, secondary days later from infection - is the commonest cause of re-admission. PONV, predicted by the Apfel score, is the commonest complication overall, followed by pain."},{"id":"SURG-U5-6","ch":5,"n":6,"title":"Discharge Criteria","sec":"Discharge · p27","qs":["SURG-C5-035","SURG-C5-036","SURG-C5-037","SURG-C5-038","SURG-C5-039","SURG-C5-040","SURG-C5-041","SURG-C5-042","SURG-C5-043","SURG-C5-044","SURG-C5-045","SURG-C5-046","SURG-C5-047"],"guide":"Discharge demands an hour of stable vitals, full orientation, controlled pain with oral analgesia in hand, the ability to dress and walk, minimal nausea or bleeding, sips of fluid, passed urine, a responsible escort, clear written and verbal instructions, a follow-up plan and an emergency number."},{"id":"SURG-U5-7","ch":5,"n":7,"title":"ERAS Protocol","sec":"ERAS · p27","qs":["SURG-C5-048","SURG-C5-049","SURG-C5-050","SURG-C5-051","SURG-C5-052","SURG-C5-053","SURG-C5-054","SURG-C5-055","SURG-C5-056","SURG-C5-057","SURG-C5-058","SURG-C5-059","SURG-C5-060","SURG-C5-061","SURG-C5-062","SURG-C5-063","SURG-C5-064"],"guide":"ERAS fast-tracks recovery: counselled patients skip bowel prep, take solids till 6 hours and carb drinks till 2-3 hours, glide through minimally invasive surgery kept warm with multimodal antiemetics, then eat, walk and leave IV fluids behind - all within 24 hours on non-opioid analgesia."},{"id":"SURG-U6-1","ch":6,"n":1,"title":"Nutritional Assessment: Indicators","sec":"Nutritional Assessment · p28","qs":["SURG-C6-001","SURG-C6-002","SURG-C6-003","SURG-C6-004","SURG-C6-005","SURG-C6-006","SURG-C6-007","SURG-C6-008"],"guide":"No single biochemical marker identifies malnutrition: low albumin foretells poor outcome while pre albumin tracks better, >10% unintentional weight loss in 6 months and BMI <15 signal poor prognosis, and skin fold thickness reads body fat while mid arm circumference reads muscle mass."},{"id":"SURG-U6-2","ch":6,"n":2,"title":"MUST Tool & Energy Requirement","sec":"Malnutrition Universal Screening Tool · p28","qs":["SURG-C6-009","SURG-C6-010","SURG-C6-011","SURG-C6-012","SURG-C6-013","SURG-C6-014","SURG-C6-015"],"guide":"The MUST tool adds BMI score, unintentional weight loss and acute disease affect score into an overall malnutrition risk, while the REE table climbs from 1 (20 Kcal/kg/day sedentary) through 1.4 and 1.8 sepsis to 2 with 40 Kcal/kg/day in severe burns."},{"id":"SURG-U6-3","ch":6,"n":3,"title":"Enteral vs Parenteral & Route Algorithm","sec":"Enteral and Parenteral Nutrition · p28","qs":["SURG-C6-016","SURG-C6-017","SURG-C6-018","SURG-C6-019","SURG-C6-020","SURG-C6-021","SURG-C6-022","SURG-C6-023","SURG-C6-024","SURG-C6-025"],"guide":"Enteral beats parenteral because it is physiological, cheap, maintains enterohepatic circulation and blocks bacterial translocation. When oral fails, duration and gastric emptying decide: under 3 weeks a nasogastric or nasojejunal tube, beyond 3 weeks a gastrostomy or jejunostomy."},{"id":"SURG-U6-4","ch":6,"n":4,"title":"Ryles & Nasojejunal Tubes","sec":"Ryles Tube · p29","qs":["SURG-C6-026","SURG-C6-027","SURG-C6-028","SURG-C6-029","SURG-C6-030","SURG-C6-031"],"guide":"Insert the Ryles tube sitting with the neck slightly flexed, measure nose-ear-xiphisternum, and confirm by aspirating gastric contents or auscultating pushed air over the epigastrium; the nasojejunal tube goes in under fluoroscopy and bypasses the stomach."},{"id":"SURG-U6-5","ch":6,"n":5,"title":"Invasive Feeding Tubes: Stamm, Witzel, Gastrostomy vs Jejunostomy","sec":"Invasive Feeding Tubes · p30","qs":["SURG-C6-032","SURG-C6-033","SURG-C6-034","SURG-C6-035","SURG-C6-036","SURG-C6-037","SURG-C6-038","SURG-C6-039","SURG-C6-040"],"guide":"Gastrostomy (Stamm, Witzel, PEG/RIG) is more physiological than jejunostomy (Stamm, Witzel) but risks aspiration. Stamm uses a Red Robinson tube through a stab incision and purse string with peridrain leakage; Witzel tunnels the distal jejunum and leaks less."},{"id":"SURG-U6-6","ch":6,"n":6,"title":"Technique of PEG & RIG","sec":"Technique of PEG · p31","qs":["SURG-C6-041","SURG-C6-042","SURG-C6-043","SURG-C6-044","SURG-C6-045","SURG-C6-046","SURG-C6-047"],"guide":"PEG runs from transoral endoscope insufflation through transillumination and finger indentation, transgastric suture fixation and a Seldinger gastrostomy; RIG steps in when endoscopy is impossible or respiratory or oropharyngeal function is compromised."},{"id":"SURG-U6-7","ch":6,"n":7,"title":"Enteral Principle & Complications","sec":"Enteral Nutrition: Principle · p31","qs":["SURG-C6-048","SURG-C6-049","SURG-C6-050","SURG-C6-051","SURG-C6-052","SURG-C6-053","SURG-C6-054","SURG-C6-055","SURG-C6-056"],"guide":"Start feeds at 10-20 mL/hr and climb to 75 mL/hr if tolerated, withholding the next feed when aspirates exceed 75-100 cc. Tube problems (blockage, migration, leakage) are the m/c complication, while osmotic diarrhoea from hyperosmolar feeds leads feeding-regime trouble."},{"id":"SURG-U6-8","ch":6,"n":8,"title":"Parenteral Nutrition: Indications & Routes","sec":"Parenteral Nutrition · p32","qs":["SURG-C6-057","SURG-C6-058","SURG-C6-059","SURG-C6-060","SURG-C6-061","SURG-C6-062","SURG-C6-063","SURG-C6-064","SURG-C6-065","SURG-C6-066"],"guide":"TPN serves paralytic ileus beyond 72 hours, non-contracting bowel, short bowel syndrome, >500 cc faecal fistulas, acute IBD needing bowel rest and early severe pancreatitis. The central line is the best route, PICC sits in between, and peripheral lines are least preferred for thrombophlebitis."},{"id":"SURG-U6-9","ch":6,"n":9,"title":"Central Line: Vein Comparison & Assessment","sec":"Central Line · p32","qs":["SURG-C6-067","SURG-C6-068","SURG-C6-069","SURG-C6-070","SURG-C6-071","SURG-C6-072","SURG-C6-073","SURG-C6-074","SURG-C6-075","SURG-C6-076"],"guide":"Subclavian lines thrombose and infect least but pneumothorax most and dominate TPN; the internal jugular is easiest to place and the commonest vein overall; femoral lines infect most. The tip must sit in the SVC just above the right atrium, and the X-ray also rules out pneumothorax."},{"id":"SURG-U6-10","ch":6,"n":10,"title":"PICC Line","sec":"PICC Line · p33","qs":["SURG-C6-077","SURG-C6-078","SURG-C6-079","SURG-C6-080","SURG-C6-081"],"guide":"Ultrasound-guided into a peripheral vessel with the tip just above the right atrium, a PICC lasts 2-3 months for chemotherapy, TPN or prolonged antibiotics - but demands regular dressing and care."},{"id":"SURG-U6-11","ch":6,"n":11,"title":"TPN Solution & Types","sec":"TPN Solution · p33","qs":["SURG-C6-082","SURG-C6-083","SURG-C6-084","SURG-C6-085","SURG-C6-086","SURG-C6-087","SURG-C6-088","SURG-C6-089","SURG-C6-090","SURG-C6-091"],"guide":"1-2 litres over 24 hours in a 20:30:50 protein:fat:carbohydrate mix, as 3-in-1 or 2-in-1 bags with trace elements and vitamins but no fibre. High osmolar bags raise CO2 and thrombosis risk, low osmolar bags suit pulmonary failure, and low volume low protein bags suit renal failure."},{"id":"SURG-U6-12","ch":6,"n":12,"title":"Monitoring on Nutritional Support","sec":"Monitoring · p34","qs":["SURG-C6-092","SURG-C6-093","SURG-C6-094","SURG-C6-095","SURG-C6-096","SURG-C6-097","SURG-C6-098"],"guide":"Daily: pulse, BP, temperature, weight and abdominal gain (>1 Kg/day is the earliest sign of overfeeding), input-output charts and food consumed. Plasma: Na, K, urea, creatinine, glucose, magnesium, phosphate and LFTs, weekly once the regime is stable."},{"id":"SURG-U6-13","ch":6,"n":13,"title":"Complications of TPN","sec":"Complications of TPN · p34","qs":["SURG-C6-099","SURG-C6-100","SURG-C6-101","SURG-C6-102","SURG-C6-103","SURG-C6-104","SURG-C6-105","SURG-C6-106","SURG-C6-107","SURG-C6-108","SURG-C6-109","SURG-C6-110","SURG-C6-111","SURG-C6-112","SURG-C6-113"],"guide":"Catheter related sepsis is the m/c line complication, confirmed by matching peripheral and central cultures, endoluminal brush or tip culture; lines also bring pneumothorax, arrhythmias, thrombosis, air embolism and migration. The regime brings hyperglycemia, cholestasis (withhold TPN), zinc deficiency, refeeding and electrolyte imbalance, and 25% of long-term users derange liver enzymes - managed with lipid free solutions."},{"id":"SURG-U6-14","ch":6,"n":14,"title":"Refeeding Syndrome","sec":"Refeeding Syndrome · p35","qs":["SURG-C6-114","SURG-C6-115","SURG-C6-116","SURG-C6-117","SURG-C6-118","SURG-C6-119","SURG-C6-120","SURG-C6-121","SURG-C6-122","SURG-C6-123","SURG-C6-124","SURG-C6-125","SURG-C6-126","SURG-C6-127"],"guide":"Feeding a chronically starved patient flips catabolism into an insulin-driven anabolic state that drags phosphate, magnesium, potassium and calcium into cells; hypophosphatemia drives the derangement and CHF/arrhythmia kill. Risk: BMI <16, >15% weight loss in 3-6 months, >10 days without intake, low pre-feeding electrolytes - prevent with slow feeds (max 10 Kcal/kg/day to full needs over 4-7 days), electrolyte monitoring and thiamine."},{"id":"SURG-U6-15","ch":6,"n":15,"title":"Post Operative Fluid Requirement","sec":"Post Operative Fluid Requirement · p35","qs":["SURG-C6-128","SURG-C6-129","SURG-C6-130","SURG-C6-131","SURG-C6-132"],"guide":"Goal directed replacement: insensible losses 30-40 mL/kg/day, Ryles aspirate with NS + KCl, drains with RL and urine with NS/DNS."},{"id":"SURG-U6-16","ch":6,"n":16,"title":"K+, Daily Electrolytes, Fluids & Calories","sec":"K+ Replacement · p36","qs":["SURG-C6-133","SURG-C6-134","SURG-C6-135","SURG-C6-136","SURG-C6-137","SURG-C6-138","SURG-C6-139","SURG-C6-140","SURG-C6-141","SURG-C6-142","SURG-C6-143","SURG-C6-144","SURG-C6-145","SURG-C6-146","SURG-C6-147"],"guide":"Potassium waits until day 2 because surgical cell injury dumps K+ out of cells; daily needs run Na 50-90, K 50, Ca 5, Mg 1 mmol. Hartmann's (Na 131, K 5, Ca 2, Cl 111, lactate 29) contrasts with normal saline (154/154), colloids expand blood volume, and calories come 4-4-9 from carbohydrate, amino acid and fat."},{"id":"SURG-U7-1","ch":7,"n":1,"title":"Hypovolemic Shock: Types & Head-Injury Notes","sec":"Hypovolemic Shock: Types · p37","qs":["SURG-C7-001","SURG-C7-002","SURG-C7-003","SURG-C7-004","SURG-C7-005","SURG-C7-006","SURG-C7-007"],"guide":"Hypovolemic/hemorrhagic shock is the m/c shock: overt bleeding is easy to catch while concealed bleeding hides in neck, thorax, abdomen, pelvis and long bones. An isolated head injury never causes it, so a hypotensive head-injury patient makes you suspect brain herniation, neurogenic shock above T6 or polytrauma."},{"id":"SURG-U7-2","ch":7,"n":2,"title":"Arterial vs Venous Bleed","sec":"Arterial vs Venous Bleed · p37","qs":["SURG-C7-008","SURG-C7-009","SURG-C7-010","SURG-C7-011","SURG-C7-012","SURG-C7-013","SURG-C7-014"],"guide":"Arterial bleeds spurt, drop the pressure early and are prevented early; lacerated arteries bleed more because vasoconstriction widens the tear, while a clean transection bleeds less. Venous bleeds ooze gradually and hide hypotension late behind compensation."},{"id":"SURG-U7-3","ch":7,"n":3,"title":"Hemorrhage in Surgery","sec":"Hemorrhage in Surgery · p38","qs":["SURG-C7-015","SURG-C7-016","SURG-C7-017","SURG-C7-018","SURG-C7-019"],"guide":"Primary hemorrhage bleeds during surgery, reactionary hemorrhage within 24 hours from a dislodged clot or slipped granny's knot, and secondary hemorrhage after 7-14 days when infection sloughs the vessel wall."},{"id":"SURG-U7-4","ch":7,"n":4,"title":"Classification of Hypovolemic Shock","sec":"Classification of Hypovolemic Shock · p38","qs":["SURG-C7-020","SURG-C7-021","SURG-C7-022","SURG-C7-023","SURG-C7-024","SURG-C7-025","SURG-C7-026","SURG-C7-027","SURG-C7-028","SURG-C7-029","SURG-C7-030","SURG-C7-031","SURG-C7-032","SURG-C7-033","SURG-C7-034","SURG-C7-035","SURG-C7-036","SURG-C7-037"],"guide":"Four classes climb from 0-15% (0.5 L, all normal, oral liquids) through 15-30% (1 L, tachycardia, anxious and thirsty) and 30-40% (1.5 L, falling SBP, confused, decompensated) to >40% (>2 L, non-recordable pulse and BP, anuria, coma, massive transfusion)."},{"id":"SURG-U7-5","ch":7,"n":5,"title":"Compensated Shock & Fluid Response Check","sec":"Pathophysiology & Response · p38","qs":["SURG-C7-038","SURG-C7-039","SURG-C7-040","SURG-C7-041","SURG-C7-042","SURG-C7-043"],"guide":"Class II is compensated shock: sympathetic noradrenaline and adrenaline drive tachycardia - the earliest sign - with peripheral vasoconstriction shunting blood to vital organs, cold extremities and raised peripheral resistance. Give 500 mL-1 L crystalloid and check the response."},{"id":"SURG-U7-6","ch":7,"n":6,"title":"Dynamic Fluid Response & Resuscitation Strategies","sec":"Dynamic Fluid Response · p39","qs":["SURG-C7-044","SURG-C7-045","SURG-C7-046","SURG-C7-047","SURG-C7-048","SURG-C7-049","SURG-C7-050","SURG-C7-051","SURG-C7-052","SURG-C7-053","SURG-C7-054","SURG-C7-055","SURG-C7-056","SURG-C7-057","SURG-C7-058","SURG-C7-059","SURG-C7-060","SURG-C7-061","SURG-C7-062","SURG-C7-063","SURG-C7-064","SURG-C7-065","SURG-C7-066","SURG-C7-067","SURG-C7-068"],"guide":"Responders keep their improved PR, SBP and JVP; transient responders worsen after 15-20 minutes and non responders never improve - both mean ongoing losses. Before hemostasis use damage control resuscitation (damage control surgery, permissive hypotension, 1:1 RBC:FFP, tranexamic acid/platelets/fibrinogen); after hemostasis switch to perfusion-targeted resuscitation with pressors, thromboprophylaxis and end-organ monitoring."},{"id":"SURG-U7-7","ch":7,"n":7,"title":"Occult Hypoperfusion & Monitoring Indicators","sec":"Occult Hypoperfusion · p40","qs":["SURG-C7-069","SURG-C7-070","SURG-C7-071","SURG-C7-072","SURG-C7-073","SURG-C7-074","SURG-C7-075","SURG-C7-076","SURG-C7-077","SURG-C7-078","SURG-C7-079"],"guide":"Occult hypoperfusion hides behind normal HR, SBP and urine output but betrays itself with low MVOS and acidosis. PCWP (Swan-Ganz, left heart, more accurate but difficult) outranks CVP (right heart, m/c used) for initial fluid requirement, while urine output (>0.5 mL/kg/hr adult, >1 mL/kg/hr child) is the best resuscitation indicator."},{"id":"SURG-U7-8","ch":7,"n":8,"title":"Shock Indices","sec":"Indices · p40","qs":["SURG-C7-080","SURG-C7-081","SURG-C7-082","SURG-C7-083","SURG-C7-084","SURG-C7-085","SURG-C7-086"],"guide":"Shock index = HR/SBP with >0.9 meaning higher mortality; the modified shock index = HR/MAP is the most sensitive; ROPE = HR/pulse pressure with <3 stable and >3 warning of decompensated shock."},{"id":"SURG-U7-9","ch":7,"n":9,"title":"Monitors for Organ/Systemic Perfusion","sec":"Monitors for Organ/Systemic Perfusion · p41","qs":["SURG-C7-087","SURG-C7-088","SURG-C7-089","SURG-C7-090","SURG-C7-091","SURG-C7-092","SURG-C7-093","SURG-C7-094"],"guide":"Base deficit and lactate flag acidosis for systemic perfusion while MVOS is the best end point of resuscitation. Muscle reads NIRS and tissue oxygen electrodes, gut mucosa - the most sensitive, forming stress ulcers - reads sublingual capnometry, mucosal pH and laser doppler, kidney reads urine output and brain reads consciousness with tissue oxygen electrode/NIRS."},{"id":"SURG-U7-10","ch":7,"n":10,"title":"Massive Blood Transfusion & Complications","sec":"Massive Blood Transfusion · p41","qs":["SURG-C7-095","SURG-C7-096","SURG-C7-097","SURG-C7-098","SURG-C7-099","SURG-C7-100","SURG-C7-101","SURG-C7-102","SURG-C7-103","SURG-C7-104","SURG-C7-105","SURG-C7-106","SURG-C7-107","SURG-C7-108"],"guide":"Massive transfusion = whole circulating volume or >10 units in 24 hrs or >4 units in one hour. It brings hypothermia, citrate-driven hypocalcemia/hypomagnesemia and metabolic alkalosis, hyperkalemia from lysed stored RBCs, and coagulopathy - the m/c cause of death - prevented by limiting crystalloids and giving 1:1:1 PRBC:platelet:FFP; febrile reactions are m/c overall and leukoreduction filters prevent them."},{"id":"SURG-U7-11","ch":7,"n":11,"title":"TACO vs TRALI","sec":"TACO vs TRALI · p42","qs":["SURG-C7-109","SURG-C7-110","SURG-C7-111","SURG-C7-112","SURG-C7-113","SURG-C7-114","SURG-C7-115","SURG-C7-116","SURG-C7-117"],"guide":"TACO is cardiac overload with facial puffiness, pedal edema, breathlessness but a normal X-ray, treated with Lasix. TRALI is anti-HLA antibody driven non-cardiogenic pulmonary edema within 6 hours from multiparous donors or FFP, showing ARDS and patchy infiltrates."},{"id":"SURG-U7-12","ch":7,"n":12,"title":"Transfusion Criteria, Blood Substitutes & Anti-shock Garment","sec":"Perioperative RBC Transfusion Criteria · p43","qs":["SURG-C7-118","SURG-C7-119","SURG-C7-120","SURG-C7-121","SURG-C7-122","SURG-C7-123","SURG-C7-124","SURG-C7-125","SURG-C7-126"],"guide":"Transfuse below Hb 6, individualise 6-8 with ongoing losses or impending surgery, and withhold above 8 without risk factors. Perfluorocarbon and stroma free hemoglobin were first and second generation; PEG hemoglobin, Hemospan (MP4OX) and PHP are next generation, and the anti-shock garment squeezes the legs hardest to hold up rural PPH patients."},{"id":"SURG-U8-1","ch":8,"n":1,"title":"MVOS: Meaning, Value & Types","sec":"MVOS · p44","qs":["SURG-C8-001","SURG-C8-002","SURG-C8-003","SURG-C8-004","SURG-C8-005"],"guide":"MVOS is the unutilised oxygen returning to the heart - normally 50-70%, read from a right atrial catheter. Low values mean a low cardiac output or a reduced O2 pump (hypovolemic shock); a high value points to distributive shock."},{"id":"SURG-U8-2","ch":8,"n":2,"title":"Cardiogenic Shock","sec":"Cardiogenic Shock · p44","qs":["SURG-C8-006","SURG-C8-007","SURG-C8-008","SURG-C8-009","SURG-C8-010","SURG-C8-011"],"guide":"MI, tamponade and arrhythmias stop the heart functioning properly: CO and MVOS fall, SBP falls with PVR rising into cold extremities, while accumulating preload raises the JVP."},{"id":"SURG-U8-3","ch":8,"n":3,"title":"Neurogenic Shock","sec":"Neurogenic Shock · p44","qs":["SURG-C8-012","SURG-C8-013","SURG-C8-014","SURG-C8-015","SURG-C8-016","SURG-C8-017"],"guide":"Spinal cord injury above T6 switches off sympathetic drive: vasodilation drops PVR into warm extremities while bradycardia and peripheral pooling pull JVP, CO and SBP down - bradycardia with hypotension is the giveaway."},{"id":"SURG-U8-4","ch":8,"n":4,"title":"Anaphylactic Shock","sec":"Anaphylactic Shock · p45","qs":["SURG-C8-018","SURG-C8-019","SURG-C8-020","SURG-C8-021","SURG-C8-022"],"guide":"Histamine - a potent vasodilator - pools blood in anaphylaxis (classically a mismatched transfusion), dropping PVR, JVP, SBP and CO with warm extremities; an intact sympathetic system compensates with ↓CO = ↑HR x ↓SV."},{"id":"SURG-U8-5","ch":8,"n":5,"title":"Septic Shock: Warm & Cold","sec":"Septic Shock: Warm & Cold · p45","qs":["SURG-C8-023","SURG-C8-024","SURG-C8-025","SURG-C8-026"],"guide":"Warm septic shock is hyperdynamic (↑CO, ↑HR, ↑SBP) with a raised MVOS because tissues cannot use O2; cold septic shock is the late phase where toxins inhibit the myocardium, mimicking cardiogenic shock."},{"id":"SURG-U8-6","ch":8,"n":6,"title":"Shock Comparison Table","sec":"Shock Comparison Table · p45","qs":["SURG-C8-027","SURG-C8-028","SURG-C8-029","SURG-C8-030","SURG-C8-031","SURG-C8-032","SURG-C8-033","SURG-C8-034","SURG-C8-035","SURG-C8-036","SURG-C8-037","SURG-C8-038"],"guide":"Across the table: PR peaks (↑↑) in anaphylaxis and falls in neurogenic; CO and SBP rise only in warm sepsis; PVR is ↑↑ in hypovolemia and ↑ in cardiogenic/cold sepsis; JVP rises in cardiogenic/cold sepsis but stays normal in warm sepsis; MVOS is ↑↑ in warm sepsis, ↓ in hypovolemic/cardiogenic/cold sepsis; acidosis is positive everywhere."},{"id":"SURG-U8-7","ch":8,"n":7,"title":"Obstructive, Distributive & Endocrine Shock","sec":"Obstructive, Distributive & Endocrine · p46","qs":["SURG-C8-039","SURG-C8-040","SURG-C8-041","SURG-C8-042","SURG-C8-043","SURG-C8-044","SURG-C8-045"],"guide":"Obstructive shock is a cardiogenic variant where tamponade or massive PE blocks filling and preload falls. Distributive shock redistributes blood peripherally (neurogenic, anaphylactic, warm septic - all warm), while endocrine shock mixes cardiac and distributive patterns in thyroid disease or adrenal insufficiency."},{"id":"SURG-U8-8","ch":8,"n":8,"title":"SIRS: Terminologies & Parameters","sec":"SIRS & Terminologies · p46","qs":["SURG-C8-046","SURG-C8-047","SURG-C8-048","SURG-C8-049","SURG-C8-050","SURG-C8-051","SURG-C8-052","SURG-C8-053"],"guide":"SIRS is the body's response to infective or non-infective inflammation through IL-1, IL-6 and TNF-alpha. Any two of: temperature >38/<36°C, HR >90, RR >20 or PaCO2 <32 torr, WBC >12000/<4000 or >10% bands - and SIRS is declared."},{"id":"SURG-U8-9","ch":8,"n":9,"title":"Sepsis: Definitions, Scores & Sepsis 3.0","sec":"Sepsis Definitions & Scores · p47","qs":["SURG-C8-054","SURG-C8-055","SURG-C8-056","SURG-C8-057","SURG-C8-058","SURG-C8-059","SURG-C8-060","SURG-C8-061","SURG-C8-062","SURG-C8-063","SURG-C8-064","SURG-C8-065","SURG-C8-066","SURG-C8-067","SURG-C8-068"],"guide":"Old sepsis was SIRS plus a known focus; new sepsis is SOFA ≥2 with documented infection, and qSOFA (SBP <100, RR >22, altered mentation) ≥2 forecasts poor outcome. Sepsis 3.0 calls it life-threatening organ dysfunction from a dysregulated host response, septic shock adds vasopressors plus lactate >2 mmol/L - severe sepsis and SIRS are out."},{"id":"SURG-U8-10","ch":8,"n":10,"title":"Sepsis Six","sec":"Sepsis Six · p48","qs":["SURG-C8-069","SURG-C8-070","SURG-C8-071","SURG-C8-072","SURG-C8-073"],"guide":"Six things in sixty minutes - give I/V antibiotics, I/V fluids and O2; take cultures, urine output and serum lactate - remembered as Think FABULOS."},{"id":"SURG-U8-11","ch":8,"n":11,"title":"Surviving Sepsis Guidelines / Sepsis Bundle","sec":"Sepsis Bundle · p48","qs":["SURG-C8-074","SURG-C8-075","SURG-C8-076","SURG-C8-077","SURG-C8-078","SURG-C8-079","SURG-C8-080","SURG-C8-081"],"guide":"Within 3 hours: measure lactate, culture before antibiotics, broad spectrum antibiotics and 30 mL/kg crystalloid for hypotension or lactate ≥4. Within 6 hours: vasopressors to MAP ≥65, measure CVP and ScvO2 for persistent hypotension/lactate ≥4, remeasure lactate - targeting CVP ≥8 mm Hg and ScvO2 ≥70%."},{"id":"SURG-U9-1","ch":9,"n":1,"title":"Surgical Anatomy of the Breast","sec":"Surgical Anatomy · p49","qs":["SURG-C9-001","SURG-C9-002","SURG-C9-003","SURG-C9-004","SURG-C9-005","SURG-C9-006","SURG-C9-007","SURG-C9-008"],"guide":"The breast is a modified sweat gland spanning the 2nd-6th ribs from midline to the anterior/mid-axillary line, with an axillary tail of Spence that mimics a lump. 9-12 lactiferous ducts open at the nipple, and Cooper's ligaments from pectoralis fascia to skin hold its shape."},{"id":"SURG-U9-2","ch":9,"n":2,"title":"Clinical Signs: Dimpling, Nipple Retraction & Peau d'Orange","sec":"Clinical Signs · p49","qs":["SURG-C9-009","SURG-C9-010","SURG-C9-011","SURG-C9-012","SURG-C9-013","SURG-C9-014","SURG-C9-015","SURG-C9-016"],"guide":"Dimpling means Cooper's ligament involvement and nipple retraction is slit-like in duct ectasia but circumferential in cancer - neither is a sign of skin involvement. Peau d'orange is subdermal lymphatic block giving an orange peel look; beyond a third of the breast it declares inflammatory breast cancer."},{"id":"SURG-U9-3","ch":9,"n":3,"title":"Lymphatic Drainage & Axillary Levels","sec":"Lymphatic Drainage · p50","qs":["SURG-C9-017","SURG-C9-018","SURG-C9-019","SURG-C9-020","SURG-C9-021","SURG-C9-022","SURG-C9-023","SURG-C9-024"],"guide":"85-90% of lymph flows to axillary nodes (clinically anterior, central, apical, lateral, posterior; surgically levels I-III around pectoralis minor) and 10-15% to internal mammary nodes. Rotter's nodes sit between the pectoralis muscles, and the sentinel node is the first draining node of any cancer."},{"id":"SURG-U9-4","ch":9,"n":4,"title":"Functional Unit & Triple Assessment","sec":"Functional Unit & Assessment · p50","qs":["SURG-C9-025","SURG-C9-026","SURG-C9-027","SURG-C9-028"],"guide":"Most cancers arise in the terminal duct lobular unit while the stroma between TDLUs breeds fibroadenoma and phyllodes. Every lump passes through triple assessment - clinical (dial clock method), radiological then histopathological."},{"id":"SURG-U9-5","ch":9,"n":5,"title":"Initial Radiological Investigation & BIRADS","sec":"Radiological: Initial & BIRADS · p51","qs":["SURG-C9-029","SURG-C9-030","SURG-C9-031","SURG-C9-032","SURG-C9-033","SURG-C9-034","SURG-C9-035","SURG-C9-036","SURG-C9-037","SURG-C9-038","SURG-C9-039"],"guide":"Under 40 (glands > fat) start with USG; over 40 (fat > glands) with mammography, which fails below 40 because lesions and glandular tissue are both hyperintense. BIRADS runs from 0 (recall) through 1-2 (routine yearly, ~0%), 3 (6-month follow-up, 0-3%), 4a-c (biopsy, 2-95%) and 5 (biopsy, 95%) to 6 (surgical excision)."},{"id":"SURG-U9-6","ch":9,"n":6,"title":"ASBRS Breast Cancer Screening Guidelines","sec":"ASBRS Screening Guidelines · p51","qs":["SURG-C9-040","SURG-C9-041","SURG-C9-042","SURG-C9-043","SURG-C9-044","SURG-C9-045"],"guide":"Formal risk assessment (Gail Index) from 25, yearly mammography from 40 for average risk, cease when life expectancy is under 10 years. High-risk women add supplemental imaging: BRCA or chest radiation get annual MRI from 25 and 3D mammography from 30; lifetime risk >20% or strong family history get 3D mammogram from 35 with MRI if mammography is silent."},{"id":"SURG-U9-7","ch":9,"n":7,"title":"Mammography: Views, Dose & Findings","sec":"Mammography · p52","qs":["SURG-C9-046","SURG-C9-047","SURG-C9-048","SURG-C9-049","SURG-C9-050","SURG-C9-051","SURG-C9-052","SURG-C9-053","SURG-C9-054","SURG-C9-055"],"guide":"A 0.1-0.2 cGy X-ray in CC and MLO views - MLO catches the axilla and most tissue - now upgraded to 3D full field digital tomosynthesis for dense breasts. Benign lesions show popcorn macrocalcifications (fibroadenoma BIRADS-2), malignancy shows spiculated margins, and nodes turn from kidney-shaped with fatty hilum to rounded without it."},{"id":"SURG-U9-8","ch":9,"n":8,"title":"Breast Ultrasound","sec":"Breast Ultrasound · p53","qs":["SURG-C9-056","SURG-C9-057","SURG-C9-058","SURG-C9-059","SURG-C9-060","SURG-C9-061","SURG-C9-062","SURG-C9-063","SURG-C9-064"],"guide":"Radiation-free, best for solid vs cystic, preferred in pregnancy and under-40s, and able to catch ductal papillomas. Benign lesions lie wider than taller with macrocalcifications and preserved hilum; malignant ones stand taller than wider with microcalcifications and rounded nodes. Implant rupture: stepladder inside the capsule, snowstorm outside."},{"id":"SURG-U9-9","ch":9,"n":9,"title":"MRI Breast","sec":"MRI · p53","qs":["SURG-C9-065","SURG-C9-066","SURG-C9-067","SURG-C9-068","SURG-C9-069","SURG-C9-070","SURG-C9-071","SURG-C9-072","SURG-C9-073"],"guide":"MRI is IOC for implants (linguini's sign marks intracapsular rupture) and for mapping multicentric/multifocal disease - multifocal in one quadrant allows conservation, multicentric across quadrants or >5 cm apart forbids it. It screens high-risk patients, resolves inconclusive ductal USG, catches DCIS and detects local/scar recurrence."},{"id":"SURG-U9-10","ch":9,"n":10,"title":"Histopathological Investigation: FNAC to Excision","sec":"Histopathological Investigation · p54","qs":["SURG-C9-074","SURG-C9-075","SURG-C9-076","SURG-C9-077","SURG-C9-078","SURG-C9-079","SURG-C9-080","SURG-C9-081","SURG-C9-082","SURG-C9-083","SURG-C9-084","SURG-C9-085"],"guide":"FNAC (23-30 G) is retired for breast: high false negatives, no in-situ vs invasive call, no IHC (ER, PR, HER2 Neu, Ki-67). Tru-cut/core (14 G) is IOC and takes a tissue piece, punch biopsy samples skin/Paget's, VABB (8-11 G vacuum probe) removes fibroadenomas scarlessly, and excisional biopsy remains the 100% gold standard."},{"id":"SURG-U10-1","ch":10,"n":1,"title":"Risk Factors for Breast Cancer","sec":"Risk Factors · p55","qs":["SURG-C10-001","SURG-C10-002","SURG-C10-003","SURG-C10-004","SURG-C10-005","SURG-C10-006","SURG-C10-007"],"guide":"Estrogen exposure drives risk: rising age, early menarche, late menopause, nulliparity and first birth after 30, plus obesity (aromatase converts peripheral fat to estrogen), alcohol, smoking, maternal and paternal family history and HRT."},{"id":"SURG-U10-2","ch":10,"n":2,"title":"Dupont & Page Classification","sec":"Dupont & Page Classification · p55","qs":["SURG-C10-008","SURG-C10-009","SURG-C10-010","SURG-C10-011","SURG-C10-012","SURG-C10-013"],"guide":"Pre-existing lesions stratify risk: nonproliferative lesions, cysts, mild hyperplasia and columnar cell change carry no risk (1); proliferative without atypia (sclerosing adenosis, radial scar, intraductal papilloma, complex fibroadenoma) 1.3-1.9; atypical hyperplasias 4-5; carcinoma in-situ 9."},{"id":"SURG-U10-3","ch":10,"n":3,"title":"Smokers, Protective Factors & OCPs","sec":"Notes: Smokers & Protective · p56","qs":["SURG-C10-014","SURG-C10-015","SURG-C10-016","SURG-C10-017"],"guide":"Smokers face more breast cancer, duct ectasia and Mondor's disease, while first birth by 20 and breastfeeding beyond a year protect. Low dose OCPs do not raise risk."},{"id":"SURG-U10-4","ch":10,"n":4,"title":"Genes Associated with Breast Cancer","sec":"Genes Associated · p56","qs":["SURG-C10-018","SURG-C10-019","SURG-C10-020","SURG-C10-021","SURG-C10-022"],"guide":"Only 10% of breast cancer is familial. p53 is the commonest mutation overall and in TNBC/HER2-positive disease, BRCA1 rules familial cases, and PIK3CA marks ER/PR-positive tumors."},{"id":"SURG-U10-5","ch":10,"n":5,"title":"BRCA Genes & Testing Indications","sec":"BRCA Genes & Testing · p56","qs":["SURG-C10-023","SURG-C10-024","SURG-C10-025","SURG-C10-026","SURG-C10-027","SURG-C10-028","SURG-C10-029","SURG-C10-030","SURG-C10-031","SURG-C10-032","SURG-C10-033","SURG-C10-034","SURG-C10-035","SURG-C10-036","SURG-C10-037"],"guide":"BRCA1 (17q, aggressive, basal/medullary) and BRCA2 (13q, luminal) cause HBOC syndrome: breast-ovarian risk favours BRCA1, pancreatic/prostate/male breast favours BRCA2, colorectal/peritoneal equal. Test everyone with a deleterious family mutation or ovarian/fallopian/peritoneal history, and every breast cancer patient with a relative ≤45, bilateral disease ≤50, TNBC ≤60 or male breast cancer; carriers lose weight, exercise, quit smoking/alcohol and start MRI at 25."},{"id":"SURG-U10-6","ch":10,"n":6,"title":"Risk Reduction Strategies","sec":"Risk Reduction Strategies · p57","qs":["SURG-C10-038","SURG-C10-039","SURG-C10-040","SURG-C10-041","SURG-C10-042","SURG-C10-043"],"guide":"Bilateral prophylactic mastectomy cuts risk 95% sparing skin and nipple; salpingo-oophorectomy after family completion (by 40) cuts ovarian risk 90% (leaving 10% fallopian/peritoneal) and breast risk 50%; tamoxifen (SERM) trims 47%."},{"id":"SURG-U10-7","ch":10,"n":7,"title":"Biopsy & Histological Types","sec":"Biopsy & Histological Types · p57","qs":["SURG-C10-044","SURG-C10-045","SURG-C10-046","SURG-C10-047","SURG-C10-048","SURG-C10-049","SURG-C10-050","SURG-C10-051"],"guide":"Core needle biopsy is IOC, typing ductal (invasive m/c) vs lobular disease and feeding IHC for biology. Invasive ductal carcinoma (NOS) dominates; tubular, mucinous and medullary (BRCA1-linked) are the special types."},{"id":"SURG-U10-8","ch":10,"n":8,"title":"IHC: ER/PR, HER2 & Ki67","sec":"IHC · p58","qs":["SURG-C10-052","SURG-C10-053","SURG-C10-054","SURG-C10-055","SURG-C10-056","SURG-C10-057","SURG-C10-058","SURG-C10-059","SURG-C10-060"],"guide":"ER/PR are nuclear receptors scored by Allred 0-8; HER2 is membranous with 0/1+ negative, 3+ positive and 2+ equivocal sent to FISH (amplified = positive), the brown stain coming from DAB. Ki67 marks the proliferation index."},{"id":"SURG-U10-9","ch":10,"n":9,"title":"Molecular Classification & TNBC","sec":"Molecular Classification · p58","qs":["SURG-C10-061","SURG-C10-062","SURG-C10-063","SURG-C10-064","SURG-C10-065","SURG-C10-066","SURG-C10-067","SURG-C10-068","SURG-C10-069","SURG-C10-070","SURG-C10-071"],"guide":"Gene expression profiling splits breast cancer into luminal A (m/c, best prognosis, ER+PR+HER2-, low Ki67), luminal B, HER2-enriched, claudin-low and basal-like - triple negative, CK5/6 positive, young patients, most aggressive with the worst prognosis yet the TNBC paradox: it responds best to chemotherapy."},{"id":"SURG-U10-10","ch":10,"n":10,"title":"TNM & 8th AJCC Staging","sec":"TNM Staging · p59","qs":["SURG-C10-072","SURG-C10-073","SURG-C10-074","SURG-C10-075","SURG-C10-076","SURG-C10-077","SURG-C10-078","SURG-C10-079","SURG-C10-080","SURG-C10-081","SURG-C10-082","SURG-C10-083","SURG-C10-084","SURG-C10-085"],"guide":"T sizes run ≤2/2-5/>5 cm after Tis (DCIS, Paget's); T4a is chest wall (serratus, ribs, intercostals - not pectoralis), T4b skin (ulceration, infiltration, peau d'orange, satellites - not dimpling), T4c both, T4d inflammatory. N1 mobile axillary, N2a fixed axillary, N2b internal mammary without axillary, N3a infraclavicular, N3b internal mammary + axillary, N3c supraclavicular; UOQ is the commonest site and LIQ the rarest."},{"id":"SURG-U10-11","ch":10,"n":11,"title":"Metastases, Important Points & PET-CT","sec":"Metastases Notes · p59","qs":["SURG-C10-086","SURG-C10-087","SURG-C10-088","SURG-C10-089","SURG-C10-090","SURG-C10-091","SURG-C10-092","SURG-C10-093","SURG-C10-094","SURG-C10-095","SURG-C10-096"],"guide":"Breast spreads to lumbar vertebrae through Batson's valveless plexus with osteolytic > osteoblastic lesions (prostate reverses this). LCIS is now a benign risk lesion, and PET-CT with 18 FDG (T½ 110 min) is IOC for staging except in brain (MRI) and prostate (PSMA PET)."},{"id":"SURG-U11-1","ch":11,"n":1,"title":"Treatment Modalities & BCS vs Mastectomy","sec":"Treatment Modalities & BCS vs Mastectomy · p61","qs":["SURG-C11-001","SURG-C11-002","SURG-C11-003","SURG-C11-004","SURG-C11-005","SURG-C11-006","SURG-C11-007"],"guide":"Four weapons against breast cancer: surgery, chemotherapy, RT and HT. Surgery tackles breast and lymph nodes; for the breast, BCS and mastectomy give the SAME overall survival, but BCS recurs locally 3-4% (hence RT mandatory) versus 1% after mastectomy."},{"id":"SURG-U11-2","ch":11,"n":2,"title":"Oncoplasty: Volume Displacement & Replacement","sec":"Oncoplasty · p61","qs":["SURG-C11-008","SURG-C11-009","SURG-C11-010","SURG-C11-011","SURG-C11-012"],"guide":"Oncoplasty fuses cancer surgery with plastic surgery: 10-15% breast volume resections are closed by volume displacement (round block, periareolar incisions), while ≥15% resections need volume replacement with imported tissue."},{"id":"SURG-U11-3","ch":11,"n":3,"title":"Contraindications for BCS","sec":"Contraindications for BCS · p62","qs":["SURG-C11-013","SURG-C11-014","SURG-C11-015","SURG-C11-016","SURG-C11-017","SURG-C11-018","SURG-C11-019","SURG-C11-020"],"guide":"Absolute bars: pregnancy (RT) and multicentric tumors (technical, different quadrants). Relative: prior chest wall RT and collagen vascular disease (SLE, RA) for RT; multifocal (same quadrant) tumors, diffuse microcalcifications/DCIS, LABC and large tumor:breast ratio technically - the last two become BCS-eligible after neo adjuvant chemo. BCS = lumpectomy with a 1 mm margin."},{"id":"SURG-U11-4","ch":11,"n":4,"title":"Mastectomy Types","sec":"Mastectomy Types · p63","qs":["SURG-C11-021","SURG-C11-022","SURG-C11-023","SURG-C11-024","SURG-C11-025","SURG-C11-026","SURG-C11-027","SURG-C11-028","SURG-C11-029","SURG-C11-030"],"guide":"Radical (Halstead) takes breast, NAC, pectoralis major & minor and level 1-3 nodes; MRM (elliptical Stewart) spares the muscles taking pectoral fascia, ± pectoralis minor retracted (Auchincloss) or cut (Patey, Scanlon); simple mastectomy removes no nodes. Nipple and skin sparing versions conserve the envelope."},{"id":"SURG-U11-5","ch":11,"n":5,"title":"Boundaries of Axillary Clearance","sec":"Axillary Clearance Boundaries · p63","qs":["SURG-C11-031","SURG-C11-032","SURG-C11-033","SURG-C11-034","SURG-C11-035","SURG-C11-036"],"guide":"Halstead ligament medially, axillary vein above, thoraco-dorsal pedicle laterally and angular vein below; the long thoracic nerve is saved, not a boundary, and at least 10 nodes must come out."},{"id":"SURG-U11-6","ch":11,"n":6,"title":"Complications: Nerves, Seroma & Flap","sec":"Complications of Mastectomy · p64","qs":["SURG-C11-037","SURG-C11-038","SURG-C11-039","SURG-C11-040","SURG-C11-041","SURG-C11-042","SURG-C11-043","SURG-C11-044","SURG-C11-045","SURG-C11-046","SURG-C11-047","SURG-C11-048"],"guide":"Bleeding runs primary, reactionary, secondary. The intercostobrachial nerve (m/c) loses axillary sensation; long thoracic (Santorini/Bell) wings the scapula; thoracodorsal hits latissimus dorsi; pectoral nerves hit p. major/minor. Seroma, the m/c complication, is prevented by a Romovac drain pulled at <40 cc/day and treated by aseptic aspiration + pressure dressing, never re-inserting the drain."},{"id":"SURG-U11-7","ch":11,"n":7,"title":"Lymphedema & Stewart-Treves","sec":"Lymphedema & Stewart-Treves · p64","qs":["SURG-C11-049","SURG-C11-050","SURG-C11-051","SURG-C11-052","SURG-C11-053","SURG-C11-054","SURG-C11-055","SURG-C11-056"],"guide":"Post-mastectomy lymphedema is the m/c cause of upper limb lymphedema, appearing weeks-months later in 5-15% after clearance - worse if nodes above the axillary vein go or axillary RT follows, less with SLNB. Manage with skin care, massage, stockings, exercise; 8-10 years of swelling can breed angiosarcoma (reddish/bluish nodules) = Stewart-Treves syndrome."},{"id":"SURG-U11-8","ch":11,"n":8,"title":"Local Recurrence, Phantom Breast & Reconstruction","sec":"Local Recurrence, Phantom Breast & Reconstruction · p65","qs":["SURG-C11-057","SURG-C11-058","SURG-C11-059","SURG-C11-060","SURG-C11-061","SURG-C11-062","SURG-C11-063","SURG-C11-064","SURG-C11-065","SURG-C11-066","SURG-C11-067"],"guide":"Recurrences need repeat biopsy (10-15% change IHC expression) and armour-like spread is cancer en cuirasse; ICBN entrapment causes painful phantom breast. Reconstruction: TRAM takes skin-fat-muscle (incisional hernia risk) while DIEP, the best flap, takes skin-fat only; latissimus dorsi also serves."},{"id":"SURG-U11-9","ch":11,"n":9,"title":"Surgical Mx of Lymph Nodes & SLNB Basics","sec":"Lymph Node Mx & SLNB Basics · p66","qs":["SURG-C11-068","SURG-C11-069","SURG-C11-070","SURG-C11-071","SURG-C11-072","SURG-C11-073","SURG-C11-074","SURG-C11-075"],"guide":"Enlarged nodes get biopsy: positive → axillary clearance, negative → SLNB. Cabana described the sentinel node in penile cancer; it is the first draining node, usually level I, and SLNB (m/c nerve injured ICBN) serves melanoma, breast, penile, vulvar and head & neck cancers."},{"id":"SURG-U11-10","ch":11,"n":10,"title":"Blue Dye Technique","sec":"Blue Dye Technique · p66","qs":["SURG-C11-076","SURG-C11-077","SURG-C11-078","SURG-C11-079","SURG-C11-080","SURG-C11-081","SURG-C11-082"],"guide":"1-1.5 cc methylene/isosulfan blue injected subcutaneously periareolarly stains the sentinel node for frozen section: negative spares axillary clearance (less lymphedema), positive mandates it. Watch for skin tattooing (m/c), anaphylaxis, bluish urine and skin necrosis."},{"id":"SURG-U11-11","ch":11,"n":11,"title":"Radionucleotide, ICG & Sentimag Techniques","sec":"Radionucleotide, ICG & Sentimag · p67","qs":["SURG-C11-083","SURG-C11-084","SURG-C11-085","SURG-C11-086","SURG-C11-087","SURG-C11-088","SURG-C11-089","SURG-C11-090"],"guide":"Tc99 sulphur colloid marks hot nodes on gamma camera and combined blue dye + radionucleotide is the best technique; ICG + blue dye shows green nodes under a filter with no radiation, and Sentimag's ferric oxide is read by a magnetic scanner with zero radiation."},{"id":"SURG-U12-1","ch":12,"n":1,"title":"Chemotherapy Indications & NACT","sec":"Chemotherapy Indications & NACT · p68","qs":["SURG-C12-001","SURG-C12-002","SURG-C12-003","SURG-C12-004","SURG-C12-005","SURG-C12-006","SURG-C12-007"],"guide":"Chemo is for +ve nodes, locally advanced disease, ER/PR -ve, Her2 +ve and metastasis; NACT is for LABC, TNBC, HER2 +ve and large tumors wanting BCS - it downstages, cuts micrometastasis and gives an in vivo chemosensitivity readout."},{"id":"SURG-U12-2","ch":12,"n":2,"title":"RECIST Criteria","sec":"RECIST Criteria · p68","qs":["SURG-C12-008","SURG-C12-009","SURG-C12-010","SURG-C12-011","SURG-C12-012","SURG-C12-013","SURG-C12-014"],"guide":"RECIST grades response in solid tumors: CR wipes out all lesions and pathological nodes, pCR is highest in TNBC, PR needs ≥30% fall in single largest diameter with no new/progressing lesions, SD is neither PR nor PD, and PD is ≥20% rise, progression or new lesions."},{"id":"SURG-U12-3","ch":12,"n":3,"title":"Chemoport & Regimens","sec":"Chemoport & Regimens · p69","qs":["SURG-C12-015","SURG-C12-016","SURG-C12-017","SURG-C12-018","SURG-C12-019","SURG-C12-020","SURG-C12-021","SURG-C12-022","SURG-C12-023","SURG-C12-024","SURG-C12-025","SURG-C12-026","SURG-C12-027"],"guide":"The chemoport sits below the clavicle with its tip in the SVC just above the right atrium, sparing veins from thrombophlebitis. Old CAF/CMF is retired; Her2 -ve gets 4 cycles AC/EC then 4 cycles T (paclitaxel causes peripheral neuropathy), Her2 +ve gets 6 cycles TCH + P with Herceptin and Pertuzumab as the anti-Her2 duo."},{"id":"SURG-U12-4","ch":12,"n":4,"title":"Avoiding Chemo & Molecular Tests","sec":"Avoiding Chemo & Molecular Tests · p69","qs":["SURG-C12-028","SURG-C12-029","SURG-C12-030","SURG-C12-031","SURG-C12-032","SURG-C12-033","SURG-C12-034","SURG-C12-035"],"guide":"Skip chemo in poor performance status and low-risk molecular profiles (T1/T2, N0/N1, M0, ER±, Her2 -ve). The assays: Oncotype Dx 21 genes, Mammaprint 70, Endopredict 12, PAM 50 fifty, and CAN assist is the Indian test; low risk avoids chemo, high risk gets it."},{"id":"SURG-U12-5","ch":12,"n":5,"title":"Radiotherapy: WBI vs APBI","sec":"Radiotherapy: WBI vs APBI · p70","qs":["SURG-C12-036","SURG-C12-037","SURG-C12-038","SURG-C12-039","SURG-C12-040","SURG-C12-041","SURG-C12-042"],"guide":"RT follows BCS always and covers +ve nodes, >5 cm tumors and LABC. WBI bathes breast plus axillary, infra/supraclavicular and internal mammary nodes over 25 days (50-54 Gy); APBI shrinks this to partial breast, 5 days (30-34 Gy) with cavity electrodes, for T1, ER/PR +, no LVI, unifocal, -ve margins, ≥50 years."},{"id":"SURG-U12-6","ch":12,"n":6,"title":"Hormonal Therapy","sec":"Hormonal Therapy · p70","qs":["SURG-C12-043","SURG-C12-044","SURG-C12-045","SURG-C12-046","SURG-C12-047","SURG-C12-048","SURG-C12-049","SURG-C12-050","SURG-C12-051","SURG-C12-052","SURG-C12-053","SURG-C12-054","SURG-C12-055"],"guide":"Either ER or PR +ve qualifies. Pre-menopausal women take tamoxifen (SERM) 5 years (up to 10) with hot flashes, endometrial hyperplasia and DVT; post-menopausal get letrozole/anastrozole 5-10 years with osteoporosis - baseline DEXA first, vit D3/Ca/bisphosphonate if low. Pause for pregnancy only after 2 full years, stopping 3 months before conception."},{"id":"SURG-U12-7","ch":12,"n":7,"title":"Prognostic Factors","sec":"Prognostic Factors · p71","qs":["SURG-C12-056","SURG-C12-057","SURG-C12-058","SURG-C12-059","SURG-C12-060","SURG-C12-061","SURG-C12-062"],"guide":"Axillary LN status is the single most important prognosticator, replaced by ER/PR status in metastatic disease. Poor disease factors: bigger, higher stage/grade, nodal spread, metaplastic variant, LVI, extensive DCIS, high Ki-67; poor patient factors: young, premenopausal, BRCA, family/prior history, obesity and unfinished treatment."},{"id":"SURG-U12-8","ch":12,"n":8,"title":"Follow up & Treatment Summary","sec":"Follow up & Treatment Summary · p71","qs":["SURG-C12-063","SURG-C12-064","SURG-C12-065","SURG-C12-066","SURG-C12-067","SURG-C12-068","SURG-C12-069","SURG-C12-070","SURG-C12-071","SURG-C12-072","SURG-C12-073","SURG-C12-074"],"guide":"Review 3-monthly for 2 years, 6-monthly to 5 years, yearly after; physical exam every visit, mammogram/USG yearly, pelvic USG for tamoxifen endometrium, and S. Ca 15-3 as marker. Early cancer: BCS with SLNB if N0 (mastectomy if BCS C/I), RT after BCS or with +ve nodes, HT if ER/PR +ve, chemo only for high-risk molecular or TNBC/Her2 +ve."},{"id":"SURG-U12-9","ch":12,"n":9,"title":"LABC & Metastatic Disease","sec":"LABC & Metastatic Disease · p72","qs":["SURG-C12-075","SURG-C12-076","SURG-C12-077","SURG-C12-078","SURG-C12-079","SURG-C12-080","SURG-C12-081","SURG-C12-082"],"guide":"LABC = T3N1M0 or any T4/N2/N3 (peau d' orange is T4b), treated NACT → surgery → RT, plus HT if ER/PR +ve and a year of trastuzumab if Her2 +ve. Metastatic (M1) disease is palliative; BRCA +ve tumors get Olaparib."},{"id":"SURG-U12-10","ch":12,"n":10,"title":"Metastatic Subtype-directed Therapy","sec":"Metastatic Subtype-directed Therapy · p72","qs":["SURG-C12-083","SURG-C12-084","SURG-C12-085","SURG-C12-086","SURG-C12-087","SURG-C12-088","SURG-C12-089"],"guide":"ER/PR +ve Her2- metastases: hormonal therapy plus CDK4/6 inhibitors (palbociclib, ribociclib, abemaciclib), switching to chemo, Zoladex or fulvestrant on resistance. TNBC adds pembrolizumab/atezolizumab (PD-L1); Her2 +ve adds trastuzumab, then lapatinib orally for brain mets or IV TDM1 when resistance appears."},{"id":"SURG-U12-11","ch":12,"n":11,"title":"Pregnancy Associated Breast Cancer","sec":"Pregnancy Associated Breast Cancer · p72","qs":["SURG-C12-090","SURG-C12-091","SURG-C12-092","SURG-C12-093","SURG-C12-094","SURG-C12-095","SURG-C12-096","SURG-C12-097"],"guide":"Cancer during pregnancy or within a year of delivery - ER/PR -ve, aggressive, diagnosed by core biopsy with USG as IOC. Mastectomy in 1st trimester, BCS in 2nd/3rd with RT after delivery; chemo C/I in 1st but safe later; HT and RT C/I in all trimesters."},{"id":"SURG-U12-12","ch":12,"n":12,"title":"Bilateral & Male Breast Carcinoma","sec":"Bilateral & Male Breast Carcinoma · p73","qs":["SURG-C12-098","SURG-C12-099","SURG-C12-100","SURG-C12-101","SURG-C12-102","SURG-C12-103","SURG-C12-104","SURG-C12-105","SURG-C12-106"],"guide":"Bilateral disease is usually BRCA (+) lobular, staged separately when synchronous and treated per the more aggressive side. Male cancer rides on BRCA2 > BRCA1, obesity, Klinefelter, alcohol and cirrhosis, presents as a hard lump, is biopsied and managed exactly like female breast cancer."},{"id":"SURG-U12-13","ch":12,"n":13,"title":"DCIS & Van Nuys","sec":"DCIS & Van Nuys · p73","qs":["SURG-C12-107","SURG-C12-108","SURG-C12-109","SURG-C12-110","SURG-C12-111","SURG-C12-112","SURG-C12-113","SURG-C12-114","SURG-C12-115","SURG-C12-116","SURG-C12-117","SURG-C12-118","SURG-C12-119","SURG-C12-120","SURG-C12-121","SURG-C12-122"],"guide":"DCIS is non invasive: papillary (m/c), cribriform and solid are ER/PR + with clustered microcalcifications, while comedo with necrosis is the aggressive ER/PR -ve lump-former. Image-guided core biopsy diagnoses; simple mastectomy or BCS + RT treats (BCS C/I if extensive calcification), chemo has no role, HT if ER/PR +ve. Van Nuys scores size, margins, grade & necrosis, age (not ER/PR): low avoids RT, intermediate gets RT, high gets mastectomy."},{"id":"SURG-U12-14","ch":12,"n":14,"title":"LCIS","sec":"LCIS · p74","qs":["SURG-C12-123","SURG-C12-124","SURG-C12-125","SURG-C12-126","SURG-C12-127","SURG-C12-128","SURG-C12-129","SURG-C12-130","SURG-C12-131","SURG-C12-132"],"guide":"LCIS is now a risk marker (1%/year conversion), B/L multicentric, ER/PR +ve, found incidentally and kept under surveillance. It progresses to invasive ductal or lobular cancer; invasive lobular is B/L multicentric (BCS C/D) with E-cadherin loss, Indian/single-file cells, and CDH mutation also drives diffuse gastric cancer."},{"id":"SURG-U13-1","ch":13,"n":1,"title":"Breast Abscess: Lactational","sec":"Breast Abscess: Lactational · p75","qs":["SURG-C13-001","SURG-C13-002","SURG-C13-003","SURG-C13-004","SURG-C13-005","SURG-C13-006","SURG-C13-007","SURG-C13-008","SURG-C13-009","SURG-C13-010","SURG-C13-011"],"guide":"Lactational beats non-lactational: S. aureus from the child's oropharynx enters through a cracked nipple giving pain, swelling, fever; fluctuation is a LATE sign (as in parotid, ischiorectal, palmar/plantar abscesses). USG is IOC; amoxicillin-clavulanate or cloxacillin, express milk, two USG-guided aspirations, then I&D with a no. 11 blade if it recurs."},{"id":"SURG-U13-2","ch":13,"n":2,"title":"Recurrent Non-lactational Abscesses","sec":"Recurrent Non-lactational Abscesses · p75","qs":["SURG-C13-012","SURG-C13-013","SURG-C13-014","SURG-C13-015","SURG-C13-016"],"guide":"Three culprits: TB (caseating granulomas, AFB/GeneXpert +ve → ATT), idiopathic granulomatous mastitis (non-caseating, both negative, diagnosis of exclusion → steroids) and inflammatory cancer (carcinoma on HPE → treat the cancer)."},{"id":"SURG-U13-3","ch":13,"n":3,"title":"ANDI & Fibroadenoma","sec":"ANDI & Fibroadenoma · p76","qs":["SURG-C13-017","SURG-C13-018","SURG-C13-019","SURG-C13-020","SURG-C13-021","SURG-C13-022","SURG-C13-023","SURG-C13-024","SURG-C13-025","SURG-C13-026","SURG-C13-027","SURG-C13-028","SURG-C13-029"],"guide":"ANDI = Aberrations of Normal Development & Involution: 15-25 fibroadenoma, 25-40 fibrocystic disease, >40 fibrocystic > duct ectasia. The fibroadenoma is the m/c breast lump, a firm painless lobulated mobile 'breast mouse' of 15-25 with popcorn calcification, USG smooth wider-than-taller avascular, BIRADS II (complex III/IVa, IVa needs biopsy)."},{"id":"SURG-U13-4","ch":13,"n":4,"title":"Fibroadenoma: Staging & Rx","sec":"Fibroadenoma: Staging
